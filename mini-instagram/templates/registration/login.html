{% extends "base.html" %}
{% block content %}
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:12px">
    No account? <a href="{% url 'signup' %}">Sign up</a>.
    After seeding, try <b>maya</b> / <b>password123</b>.
  </p>
{% endblock %}
