  <script>
    (function () {
      const V = 1.2;                                   // 1.2 s of poster and music before the voice; "नया लॉन्च" is on screen, not spoken
      const W = [-1.0, -0.9, 0.0, 0.26, 1.55, 2.2, 2.48, 2.64, 3.27, 4.07, 5.07, 6.23, 6.41, 7.57, 7.71,
                 8.92, 9.12, 9.34, 9.64, 10.82, 11.08, 11.22, 12.52, 12.76, 13.0, 13.87, 14.12, 14.3, 14.62, 14.82,
                 15.08, 15.63, 15.81, 15.96, 16.11, 16.25, 16.47, 17.48, 17.71, 18.05];
      const VO_END = 18.61;
      const GROUPS = [6, 3, 4, 7, 3, 6, 6, 3];          // captions start at word 2 (words 0-1 are the unspoken poster)
      const t = (i) => W[i] + V;
      const tl = gsap.timeline({ paused: true });

      // camera move: cover point (fx, fy) to the focal point at zoom s, with a 3D turn (ry, rx)
      const cam = (at, d, c, ease = "power3.inOut") => {
        tl.to("#e-cam", { x: -c.s * c.fx, y: -c.s * c.fy, scale: c.s, duration: d, ease }, at);
        tl.to("#e-tilt", { rotationY: c.ry || 0, rotationX: c.rx || 0, duration: d, ease }, at);
      };
      gsap.set("#e-cam", { transformOrigin: "0 0", x: -0.62 * 600, y: -0.62 * 560, scale: 0.62 });
      gsap.set("#e-tilt", { transformPerspective: 1700, rotationY: -26, rotationX: 10 });
      gsap.set(["#e-b2", "#e-b3", "#e-b4", "#e-live", "#e-url", "#e-ticket", "#e-note", ".e-cap", ".e-chip", "#e-box1", "#e-box2", "#e-box3"], { opacity: 0 });

      const beat = (from, to, at) => {
        if (from) tl.to(from, { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, at - 0.2);
        tl.fromTo(to, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.32, ease: "expo.out" }, at);
      };

      // 1 — the poster: NEW / नया लॉन्च over the cover turned in space; on the title it swings flat and fills the frame
      tl.to("#e-tilt", { rotationY: -18, duration: t(2) - 0.2, ease: "none" }, 0);
      cam(t(2) - 0.2, 1.0, { fx: 530, fy: 300, s: 1.0 });
      // 2 — the five topics, one chip per word; the skew on the cover is traced again on "वॉल सरफ़ेसेज़"
      beat("#e-b1", "#e-b2", t(8) - 0.05);
      cam(t(8) - 0.3, 1.0, { fx: 600, fy: 600, s: 0.95, ry: 6, rx: 4 });   // title fully below the card, chart in the middle
      [8, 9, 10, 11, 14].forEach((i, k) => tl.fromTo("#e-k" + (k + 1), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t(i)));
      [8, 9, 10, 11, 14].forEach((i, k) => tl.to("#e-k" + (k + 1), { backgroundColor: "#ffd23f", duration: 0.15 }, t(i)));
      tl.to("#e-curve", { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, t(11));
      // 3 — 201 pages: dive to the 201 box while the count runs
      beat("#e-b2", "#e-b3", t(15) - 0.05);
      cam(t(15) - 0.3, 0.8, { fx: 240, fy: 1037, s: 1.55 });
      tl.fromTo("#e-box1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(15));
      const N = { v: 0 }, num = document.getElementById("e-num");
      tl.fromTo(N, { v: 0 }, { v: 201, duration: 1.0, ease: "power2.out", immediateRender: false, onUpdate: () => { num.textContent = Math.round(N.v); } }, t(15));
      // 4 — "साथ में कोड": across to the modules + code box, then the Q&A box; the card turns into code
      beat("#e-b3", "#e-b4", t(19));
      tl.to("#e-box1", { opacity: 0, duration: 0.15 }, t(19) - 0.1);
      cam(t(19) - 0.2, 0.7, { fx: 600, fy: 1037, s: 1.55 });
      tl.fromTo("#e-box2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(19) + 0.3);
      tl.to("#e-box2", { opacity: 0, duration: 0.15 }, t(21) + 0.4);
      cam(t(21) + 0.3, 0.6, { fx: 960, fy: 1037, s: 1.55 });
      tl.fromTo("#e-box3", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(21) + 0.7);
      // 5 — live now: pull back to the whole cover, high in the frame; LIVE and the address below
      tl.to(["#e-top", "#e-box3"], { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, t(23) - 0.3);
      cam(t(23) - 0.3, 0.9, { fx: 600, fy: 600, s: 0.45, ry: -8, rx: 6 });
      tl.to("#e-tilt", { y: -340, duration: 0.9, ease: "power3.inOut" }, t(23) - 0.3);
      tl.fromTo("#e-live", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t(23) + 0.35);
      tl.fromTo("#e-live i", { scale: 1 }, { scale: 1.5, duration: 0.4, yoyo: true, repeat: 7, ease: "sine.inOut" }, t(23) + 0.65);
      tl.fromTo("#e-url", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, t(25));
      // 6 — the launch offer: a ticket slides in; its letters light as they are spelled; 20% OFF lands on "बीस"
      tl.fromTo("#e-ticket", { opacity: 0, x: 900, rotation: 6 }, { opacity: 1, x: 0, rotation: -2, duration: 0.5, ease: "back.out(1.4)" }, t(31) - 0.2);
      [32, 33, 34, 35].forEach((i, k) => tl.fromTo("#e-q" + (k + 1), { color: "#12221f", scale: 1 }, { color: "#0b7f79", scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, t(i)));
      tl.fromTo("#e-ticket .off", { scale: 1 }, { scale: 1.18, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, t(37));
      tl.fromTo("#e-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, t(39) + 0.4);
      tl.to("#e-tilt", { rotationY: 8, duration: 3.5, ease: "sine.inOut" }, t(31));

      // captions (they leave room for the ticket at the end)
      let i0 = 2;
      GROUPS.forEach((n, g) => {
        const id = "#e-c" + (g + 2), spans = document.querySelectorAll(id + " span");
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t(i0) - 0.1);
        tl.to(id, { opacity: 0, duration: 0.07 }, g < GROUPS.length - 1 ? t(i0 + n) - 0.19 : VO_END + V + 0.3);
        for (let k = 0; k < n; k++) {
          tl.set(spans[k], { opacity: 1, backgroundColor: "rgba(255,210,63,1)" }, t(i0 + k));
          if (k > 0) tl.set(spans[k - 1], { backgroundColor: "rgba(255,210,63,0)" }, t(i0 + k));
        }
        i0 += n;
      });

      window.__timelines["eqd"] = tl;
    })();
  </script>
