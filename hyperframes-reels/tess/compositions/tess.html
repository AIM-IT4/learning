<template>
  <style>
    @font-face { font-family: "Yatra One"; src: url("assets/fonts/YatraOne.ttf"); }
    @font-face { font-family: "Noto Sans Devanagari"; font-weight: 700; src: url("assets/fonts/NotoSansDevanagari_700Bold.ttf"); }
    @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/Poppins_700Bold.ttf"); }
    #root { position: absolute; inset: 0; background: #f7f7f3; overflow: hidden; }
    #d-art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .d-lab { position: absolute; left: 0; top: 236px; width: 1080px; display: flex; align-items: baseline; justify-content: center; gap: 30px; white-space: nowrap; }
    .d-lab .n { font-family: "Poppins"; font-weight: 700; font-size: 190px; line-height: 1; color: #0b7f79; }
    .d-lab .h { font-family: "Yatra One"; font-size: 120px; line-height: 1; color: #12221f; }
    .d-cap { position: absolute; left: 60px; top: 1330px; width: 960px; text-align: center; font-family: "Noto Sans Devanagari"; font-weight: 700; font-size: 46px;
             line-height: 1.3; color: #12221f; text-wrap: balance; }
    .d-cap span { display: inline-block; padding: 0 8px; margin: 0 1px; border-radius: 8px; opacity: 0.4; }
    #d-q { position: absolute; left: 0; top: 1150px; width: 1080px; text-align: center; font-family: "Noto Sans Devanagari"; font-weight: 700; font-size: 52px; color: #c4553a; }
    #d-chips { position: absolute; left: 0; top: 1205px; width: 1080px; display: flex; justify-content: center; gap: 16px; }
    #d-chips span { padding: 6px 22px; border: 4px solid #12221f; border-radius: 40px; font-family: "Poppins"; font-weight: 700; font-size: 44px; color: #12221f; background: #ffffff; }
  </style>
  <div id="root" data-composition-id="tess" data-width="1080" data-height="1920">
    <svg id="d-art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <g id="d-shadow" opacity="0"><path id="d-sh" fill="none" stroke="#12221f" stroke-opacity="0.13" stroke-width="10" stroke-linecap="round" /></g>
      <path id="d-ex" fill="none" stroke="#12221f" stroke-width="8" stroke-linecap="round" />
      <path id="d-ey" fill="none" stroke="#0b7f79" stroke-width="8" stroke-linecap="round" />
      <path id="d-ez" fill="none" stroke="#a07812" stroke-width="8" stroke-linecap="round" />
      <path id="d-ew" fill="none" stroke="#c4553a" stroke-width="8" stroke-linecap="round" />
      <g id="d-verts"></g>
      <!-- the axis gizmo: x, y, z, and w — the direction we cannot see -->
      <g id="d-giz" transform="translate(150 1175)">
        <g id="d-gx"><line x1="0" y1="0" x2="90" y2="0" stroke="#12221f" stroke-width="6" stroke-linecap="round" /><text x="102" y="12" font-family="Poppins" font-weight="700" font-size="34" fill="#12221f">x</text></g>
        <g id="d-gy"><line x1="0" y1="0" x2="0" y2="-90" stroke="#0b7f79" stroke-width="6" stroke-linecap="round" /><text x="-10" y="-102" font-family="Poppins" font-weight="700" font-size="34" fill="#0b7f79">y</text></g>
        <g id="d-gz"><line x1="0" y1="0" x2="-55" y2="55" stroke="#a07812" stroke-width="6" stroke-linecap="round" /><text x="-82" y="88" font-family="Poppins" font-weight="700" font-size="34" fill="#a07812">z</text></g>
        <g id="d-gw"><line x1="0" y1="0" x2="70" y2="62" stroke="#c4553a" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10" /><text x="78" y="98" font-family="Poppins" font-weight="700" font-size="34" fill="#c4553a">w ?</text></g>
      </g>
    </svg>
    <div id="d-l0" class="d-lab"><span class="n">0D</span><span class="h">बिंदु</span></div>
    <div id="d-l1" class="d-lab"><span class="n">1D</span><span class="h">रेखा</span></div>
    <div id="d-l2" class="d-lab"><span class="n">2D</span><span class="h">वर्ग</span></div>
    <div id="d-l3" class="d-lab"><span class="n">3D</span><span class="h">घन</span></div>
    <div id="d-l4" class="d-lab"><span class="n">4D</span><span class="h">?</span></div>
    <div id="d-l5" class="d-lab"><span class="n">4D</span><span class="h">टेसरेक्ट</span></div>
    <div id="d-q">जो हम देख नहीं सकते</div>
    <div id="d-chips"><span>0D</span><span>1D</span><span>2D</span><span>3D</span><span>4D</span></div>

    <div id="d-c1" class="d-cap"><span>एक</span><span>बिंदु।</span></div>
    <div id="d-c2" class="d-cap"><span>इसे</span><span>खींचिए,</span><span>बन</span><span>गई</span><span>एक</span><span>रेखा।</span></div>
    <div id="d-c3" class="d-cap"><span>रेखा</span><span>को</span><span>खींचिए,</span><span>बन</span><span>गया</span><span>वर्ग।</span></div>
    <div id="d-c4" class="d-cap"><span>वर्ग</span><span>को</span><span>खींचिए,</span><span>बन</span><span>गया</span><span>घन।</span></div>
    <div id="d-c5" class="d-cap"><span>अब</span><span>घन</span><span>को,</span><span>एक</span><span>ऐसी</span><span>दिशा</span><span>में</span><span>खींचिए,</span></div>
    <div id="d-c6" class="d-cap"><span>जो</span><span>हम</span><span>देख</span><span>नहीं</span><span>सकते…</span></div>
    <div id="d-c7" class="d-cap"><span>चौथा</span><span>आयाम।</span></div>
    <div id="d-c8" class="d-cap"><span>जो</span><span>बनता</span><span>है,</span><span>उसे</span><span>कहते</span><span>हैं</span><span>टेसरेक्ट।</span></div>
    <div id="d-c9" class="d-cap"><span>हम</span><span>जो</span><span>देख</span><span>रहे</span><span>हैं,</span></div>
    <div id="d-c10" class="d-cap"><span>वो</span><span>बस</span><span>उसका</span><span>साया</span><span>है।</span></div>
  </div>
  <script>
    (function () {
      const V = 0.3;
      const W = [0.0, 0.18, 1.85, 2.1, 2.85, 3.06, 3.2, 3.36, 4.7, 5.04, 5.16, 6.0, 6.2,
                 6.38, 7.1, 7.34, 7.42, 8.25, 8.42, 8.62, 9.37, 9.49, 9.69, 10.67, 10.85, 11.05,
                 11.31, 11.43, 12.67, 12.81, 12.95, 13.15, 13.31, 15.07, 15.37, 16.47, 16.53, 16.85, 17.67,
                 17.89, 18.17, 18.25, 19.2, 19.32, 19.44, 19.62, 19.8, 20.4, 20.52, 20.72, 21.12, 21.44];
      const VO_END = 21.71;
      const GROUPS = [2, 6, 6, 6, 8, 5, 2, 7, 5, 5];
      const t = (i) => W[i] + V;
      const END = VO_END + V + 2.9;
      const NS = "http://www.w3.org/2000/svg";

      // ---- one 4D vertex set: bit d of a vertex says which copy along axis d. Extents grow as each axis is "dragged out".
      const verts = document.getElementById("d-verts"), dots = [];
      for (let b = 0; b < 16; b++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("fill", "#12221f"); verts.appendChild(c); dots.push(c); }
      const smooth = (x, a, b) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
      const pathEl = ["d-ex", "d-ey", "d-ez", "d-ew"].map((id) => document.getElementById(id)), sh = document.getElementById("d-sh");
      const L = 1.0, SC = 390, CX = 540, CY = 810, D4 = 3.2, D3 = 4.2;
      const P = { time: 0 };
      const render = () => {
        const tt = P.time;
        const e = [smooth(tt, t(3), t(3) + 0.8), smooth(tt, t(10), t(10) + 0.8), smooth(tt, t(16), t(16) + 0.9), smooth(tt, t(27), t(27) + 1.1)];
        // 3D view: straight on until the cube appears, then a tilt and a slow turn; 4D: turn in the x-w plane after "टेसरेक्ट"
        const tilt = 0.42 * e[2], yaw = 0.62 * e[2] + 0.45 * Math.max(0, tt - t(19)), a4 = 0.85 * Math.max(0, tt - t(41)) + 0.25 * e[3];
        const pts = [];
        for (let b = 0; b < 16; b++) {
          let x = ((b & 1) - 0.5) * e[0] * L, y = (((b >> 1) & 1) - 0.5) * e[1] * L, z = (((b >> 2) & 1) - 0.5) * e[2] * L, w = (((b >> 3) & 1) - 0.5) * e[3] * L;
          [x, w] = [x * Math.cos(a4) - w * Math.sin(a4), x * Math.sin(a4) + w * Math.cos(a4)];            // rotate in the x-w plane
          const k4 = D4 / (D4 - w); x *= k4; y *= k4; z *= k4;                                            // 4D -> 3D
          [x, z] = [x * Math.cos(yaw) + z * Math.sin(yaw), -x * Math.sin(yaw) + z * Math.cos(yaw)];       // turn about y
          [y, z] = [y * Math.cos(tilt) - z * Math.sin(tilt), y * Math.sin(tilt) + z * Math.cos(tilt)];    // tilt about x
          const k3 = D3 / (D3 - z);                                                                       // 3D -> 2D
          pts.push([CX + x * k3 * SC, CY + y * k3 * SC]);
        }
        const d = ["", "", "", ""];
        for (let b = 0; b < 16; b++) for (let ax = 0; ax < 4; ax++) {
          if (b & (1 << ax)) continue;
          const c = b | (1 << ax), [x1, y1] = pts[b], [x2, y2] = pts[c];
          d[ax] += `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
        }
        d.forEach((s, ax) => pathEl[ax].setAttribute("d", s || "M0 0"));
        sh.setAttribute("d", d.join("").replace(/([ML])(-?[\d.]+) (-?[\d.]+)/g, (m, c, x, y) => `${c}${(+x + 34).toFixed(1)} ${(+y + 44).toFixed(1)}`));
        const r = 26 - 14 * e[0];
        pts.forEach(([x, y], b) => { dots[b].setAttribute("cx", x.toFixed(1)); dots[b].setAttribute("cy", y.toFixed(1)); dots[b].setAttribute("r", r); });
      };
      render();

      const tl = gsap.timeline({ paused: true });
      tl.to(P, { time: END, duration: END, ease: "none", onUpdate: render }, 0);
      gsap.set(["#d-l1", "#d-l2", "#d-l3", "#d-l4", "#d-l5", "#d-q", "#d-chips", ".d-cap", "#d-gx", "#d-gy", "#d-gz", "#d-gw"], { opacity: 0 });

      // the label at the top names each dimension as it is born
      const swap = (from, to, at) => {
        tl.to(from, { opacity: 0, y: -40, duration: 0.18, ease: "power2.in" }, at - 0.18);
        tl.fromTo(to, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, at);
      };
      swap("#d-l0", "#d-l1", t(7)); swap("#d-l1", "#d-l2", t(13)); swap("#d-l2", "#d-l3", t(19)); swap("#d-l3", "#d-l4", t(33)); swap("#d-l4", "#d-l5", t(41));
      // each axis arrow appears as that direction is used
      tl.fromTo("#d-gx", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(3));
      tl.fromTo("#d-gy", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(10));
      tl.fromTo("#d-gz", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(16));
      tl.fromTo("#d-gw", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(27));
      tl.fromTo("#d-q", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, t(28));
      tl.to("#d-q", { opacity: 0, duration: 0.2 }, t(35) - 0.2);
      // "साया": what we see is only its shadow
      tl.to("#d-shadow", { opacity: 1, duration: 0.6 }, t(49));
      tl.to(["#d-giz"], { opacity: 0, duration: 0.25 }, VO_END + V - 0.35);   // gone before the end chips arrive
      tl.fromTo("#d-chips span", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "back.out(2)" }, VO_END + V + 0.1);
      tl.set("#d-chips", { opacity: 1 }, VO_END + V + 0.1);
      tl.to("#d-chips span:last-child", { backgroundColor: "#c4553a", color: "#ffffff", borderColor: "#c4553a", duration: 0.2 }, VO_END + V + 1.0);

      // captions
      let i0 = 0;
      GROUPS.forEach((n, g) => {
        const id = "#d-c" + (g + 1), spans = document.querySelectorAll(id + " span");
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t(i0) - 0.1);
        tl.to(id, { opacity: 0, duration: 0.07 }, g < GROUPS.length - 1 ? t(i0 + n) - 0.19 : VO_END + V + 0.25);
        for (let k = 0; k < n; k++) {
          tl.set(spans[k], { opacity: 1, backgroundColor: "rgba(255,210,63,1)" }, t(i0 + k));
          if (k > 0) tl.set(spans[k - 1], { backgroundColor: "rgba(255,210,63,0)" }, t(i0 + k));
        }
        i0 += n;
      });

      window.__timelines["tess"] = tl;
    })();
  </script>
</template>
