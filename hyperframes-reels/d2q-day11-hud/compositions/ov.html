      // HUD subtitles in the caption band (y 150-540): a dark plate with corner brackets and voiceprint bars that move with
      // the voice; each word types in on its spoken onset; numbers roll for three frames and lock in the accent colour the
      // moment they are said (a locked value); the line's hero word gets a target box that snaps onto it and flashes white.
      const { HUD } = HOLOHUD, T = HUD.theme(218, 22), W = 1080, H = 1920, FPS = 24;
      const g = document.getElementById("ov-cv").getContext("2d");
      const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const isNum = (w) => /%|\d\.\d|sigma/.test(w);   // values only: 20.47%, 1.26%, 16-sigma, 15.6%, 29.7 (not Desk2Quant, 1987, 500, Day 12)
      const BAND0 = 160, BAND1 = 530, MAXW = 820;
      const sizeFor = (n) => (n <= 30 ? 70 : n <= 44 ? 64 : n <= 58 ? 58 : n <= 74 ? 54 : 50);
      const lipAt = (t) => { const i = Math.floor((t - LIPS_T0) * LIPS_HZ); if (i < 0 || 3 * i + 2 >= LIPS.length) return 0;
        return parseInt(LIPS[3 * i], 36) / 35; };
      function layout(L) {
        const fs = sizeFor(L.tok.join(" ").length);
        g.font = "500 " + fs + "px " + HUD.FONT.ui;
        const sp = g.measureText(" ").width, rows = [[]]; let x = 0;
        L.tok.forEach((w, i) => {
          const ww = g.measureText(w).width;
          if (x > 0 && x + ww > MAXW) { rows.push([]); x = 0; }
          rows[rows.length - 1].push({ i, w, ww, x }); x += ww + sp;
        });
        const lh = Math.round(fs * 1.16), widths = rows.map((r) => { const l = r[r.length - 1]; return l.x + l.ww; });
        return { fs, rows, lh, widths, tw: Math.max(...widths), th: rows.length * lh };
      }
      const st = { t: 0 };
      function draw() {
        const t = st.t, f = Math.floor(t * FPS);
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
        let li = -1;
        for (let i = 0; i < LINES.length; i++) if (t >= LINES[i].on[0] - 0.14) li = i;
        if (li < 0) return;

        if (t > next) return;
