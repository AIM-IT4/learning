          v2: clamp((t - w(9)) / 0.3), frame: f });
        g.restore();
        QC.scanLine(g, T, xOut);
        if (glitch) HUD.glitch(g, 1080, 1920, 1, 17 + f);   // the film's one glitch: three frames on "did."
        QC.tex.end();
      }
      if (typeof init === "function") init();     // before the tween: fromTo renders (and draws) at once
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s6"] = tl;
    })();
