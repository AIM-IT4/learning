  // ---- text: o = { size, wt, c, a, align, mono, ls, roll (0-1), frame, seed, base ('alphabetic'|'middle') } ----
  function text(g, T, s, x, y, o = {}) {
    const a = o.a ?? 1; if (a <= 0 || !s) return 0;
    g.save(); g.globalAlpha = 1; g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic';
    g.letterSpacing = (o.ls ?? 0) + 'px';
    g.font = `${o.wt ?? 500} ${o.size ?? 28}px ${o.mono ? FONT.mono : FONT.ui}`;
    if (o.maxW) HUD.fitFont(g, s, o.wt ?? 500, o.size ?? 28, o.mono ? FONT.mono : FONT.ui, o.maxW, 12);
    g.fillStyle = C(T, o.c || 'hi', a);
    const str = o.roll !== undefined ? HUD.rollText(s, o.roll, o.frame ?? 0, o.seed ?? 0) : s;
    g.fillText(str, x, y);
    const w = g.measureText(s).width;
    g.restore();
    return w;
  }

  // ---- a value that rolls in and locks in the accent: o = { size, a, roll, frame, unit, flash, c (before lock) } ----
  function value(g, T, s, x, y, o = {}) {
    const a = o.a ?? 1, roll = o.roll ?? 1; if (a <= 0 || roll <= 0) return { w: 0 };
    const size = o.size ?? 72, locked = roll >= 1;
    g.save(); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.font = `${o.wt ?? 400} ${size}px ${FONT.ui}`;
    const adv = g.measureText('0').width * 1.02;
    const total = (() => { let w = 0; for (const ch of s) w += (ch === '.' || ch === ',' || ch === ' ') ? g.measureText(ch).width * 1.1 : adv; return w; })();
    let x0 = o.align === 'right' ? x - total : o.align === 'center' ? x - total / 2 : x;
    g.fillStyle = locked ? (o.flash ? T.hi(a) : C(T, o.lc || 'acc', a)) : C(T, o.c || 'line', 0.85 * a);
    const vw = HUD.monoText(g, HUD.rollText(s, roll, o.frame ?? 0, o.seed ?? 11), x0, y, adv);
    if (o.unit) {
      g.font = `500 ${Math.round(size * 0.36)}px ${FONT.ui}`; g.fillStyle = locked ? C(T, o.lc || 'acc', 0.9 * a) : T.line(0.6 * a);
      g.fillText(o.unit, x0 + vw + 8, y);
    }
    g.restore();
    return { w: vw, x0, bb: [x0, y - size * 0.78, x0 + vw, y + size * 0.06] };
  }

  // ---- a small filled tag: o = { c ('line'|'acc'|'hi'), a, align, size } ----
  function tag(g, T, s, x, y, o = {}) {
    const a = o.a ?? 1; if (a <= 0) return;
    g.save(); g.letterSpacing = '1px'; g.font = `600 ${o.size ?? 19}px ${FONT.ui}`; g.textBaseline = 'alphabetic';
    const w = g.measureText(s).width + 18, h = (o.size ?? 19) + 11;
    const x0 = o.align === 'right' ? x - w : o.align === 'center' ? x - w / 2 : x;
    g.fillStyle = C(T, o.c || 'line', 0.95 * a); g.fillRect(x0, y - h, w, h);
    g.fillStyle = `rgba(255,255,255,${a})`; g.textAlign = 'left'; g.fillText(s, x0 + 9, y - 8);
    g.restore();
    return [x0, y - h, x0 + w, y];
  }

  // ---- target lock (HUD.targetBox) and leader, re-exported ----
  const lock = (g, T, bb, k, o = {}) => HUD.targetBox(g, T, bb, k, o);
  const leader = (g, T, a, b, c, k, o = {}) => HUD.leader(g, T, a, b, c, k, o);

  // ---- scene life: the scan-in (a vertical scan line reveals the stage left to right) and the scan-erase at the
  //      end. Use: const sx = QC.scanIn(t) ... QC.clipStage(g, sx) ... draw ... g.restore(); QC.scanLine(g, T, sx). ----
  const STAGE = { x0: 30, x1: 1050, y0: 552, y1: 1478 };
  const scanIn = (t, t0 = 0, dur = 0.6) => lerp(STAGE.x0, STAGE.x1, eio((t - t0) / dur));
  const scanOut = (t, t1, dur = 0.4) => lerp(STAGE.x0, STAGE.x1, eio((t - (t1 - dur)) / dur));
  function clipStage(g, xIn = STAGE.x1, xOut = STAGE.x0) {   // keep [xOut, xIn] of the stage; call g.restore() after
    g.save(); g.beginPath(); g.rect(xOut, 0, Math.max(0, xIn - xOut), 1920); g.clip();
  }
  function scanLine(g, T, x, a = 1) {
    if (x <= STAGE.x0 + 1 || x >= STAGE.x1 - 1 || a <= 0) return;
    g.save();
    const gr = g.createLinearGradient(x - 60, 0, x + 6, 0);
    gr.addColorStop(0, T.line(0)); gr.addColorStop(1, T.line(0.16 * a));
    g.fillStyle = gr; g.fillRect(x - 60, STAGE.y0, 66, STAGE.y1 - STAGE.y0);
    g.strokeStyle = T.line(0.9 * a); g.lineWidth = 2; g.beginPath(); g.moveTo(x, STAGE.y0); g.lineTo(x, STAGE.y1); g.stroke();
    g.restore();
  }

  // ---- LaTeX formulas: inline SVG (typeset by MathJax at build time) in a DOM layer over the canvas ----
  // init once with the scene's TEX map; each frame: tex.begin(); tex.show(id, {...}); ... tex.end();
  const tex = (function () {
    let layer = null, nodes = {}, shown = {}, MAP = {}, ACC = '', LINE = '';
    function init(root, map, T) {
      MAP = map; ACC = T.acc(1); LINE = T.line(1); layer = document.createElement('div');
      layer.style.cssText = 'position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;';
      const st = document.createElement('style');
      st.textContent = `.qtex{position:absolute;left:0;top:0;transform-origin:0 0;color:${T.hi(1)};will-change:clip-path,opacity}
        .qtex svg{display:block;width:100%;height:100%;overflow:visible}
        .qtex .acc{color:var(--acc)} .qtex .blu{color:${T.line(1)}}`;
      layer.appendChild(st);
      for (const id in map) {
        const d = document.createElement('div'); d.className = 'qtex'; d.innerHTML = map[id].svg; d.style.display = 'none';
        layer.appendChild(d); nodes[id] = d;
      }
      root.appendChild(layer);
    }
    function begin() { shown = {}; }
    // o = { x, y, size (em px), align ('left'|'center'|'right'), valign ('base'|'middle'|'top'), k (reveal 0-1, left to
    //       right), cut (0-1 erased from the left), a, lock (true: the \class{acc} parts turn orange), clip [x0, x1] px }
    function show(id, o = {}) {
      const f = MAP[id], d = nodes[id]; if (!f || !d) throw new Error('no formula ' + id);
      const em = o.size ?? 56, w = f.w * em, h = f.h * em;
      let x = o.x ?? 540, y = o.y ?? 0;
      if (o.align === 'center') x -= w / 2; else if (o.align === 'right') x -= w;
      const top = o.valign === 'top' ? y : o.valign === 'middle' ? y - h / 2 : y - (f.h - f.a) * em;
      const k = clamp(o.k ?? 1), cut = clamp(o.cut ?? 0);
      let L = cut * w, R = (1 - k) * w;
      if (o.clip) { L = Math.max(L, o.clip[0] - x); R = Math.max(R, x + w - o.clip[1]); }
      const a = o.a ?? 1;
      if (a <= 0 || L + R >= w) return { bb: [x, top, x + w, top + h], w, h };
      d.style.display = 'block'; d.style.width = w + 'px'; d.style.height = h + 'px';
      d.style.transform = `translate(${x}px, ${top}px)`; d.style.opacity = a;
      d.style.clipPath = `inset(-20px ${R}px -20px ${L}px)`;
      d.style.setProperty('--acc', o.lock ? ACC : LINE);
      shown[id] = 1;
      return { bb: [x, top, x + w, top + h], w, h };
    }
    function end() { for (const id in nodes) if (!shown[id]) nodes[id].style.display = 'none'; }
    return { init, begin, show, end };
  })();

  return { frame, panel, axes, line, area, bars, candles, hline, vline, dot, text, value, tag, lock, leader,
    STAGE, scanIn, scanOut, clipStage, scanLine, tex, fmt, pow10, MINUS, clamp, lerp, eo, eio };
})();
// QCHART END


      // ---- s10: "Price one-month options at strikes from 80 to 120, on a million simulated paths." ----
      // The Monte Carlo price types in on "Price one-month options". The panel is where a million simulated months end:
      // the histogram of the 1-month price S_T on a log count axis, the paths that had a crash in the accent, so the
      // crash bump near 80 shows; the nine strikes drop in from 80 to 120 as they are said; on "a million simulated
      // paths" the readout counts up and locks: 1,000,000 paths, 8,171 with a crash (and the bump is locked).
      // words: 0 Price 1 one-month 2 options 3 at 4 strikes 5 from 6 80 7 to 8 120, 9 on 10 a 11 million 12 simulated
      //        13 paths.
      const { HUD } = HOLOHUD;
      const T = HUD.theme(218, 22), FPS = 24;
      const { clamp, lerp, eo, eio, fmt } = QC;
      const g = document.getElementById("s10-cv").getContext("2d");
      const w = (i) => W[i];
      const M = NUM.model, E = NUM.ends;
      const XC = E.edges.slice(0, -1).map((e, i) => (e + E.edges[i + 1]) / 2), BW = (E.edges[1] - E.edges[0]) * 0.86;
      const bins = (cs) => { const x = [], y = []; cs.forEach((c, i) => { if (c > 1) { x.push(XC[i]); y.push(Math.log10(c)); } }); return { x, y }; };
      const BA = bins(E.all), BC = bins(E.crash);   // every path; the paths that had a crash (bins with a height on the log axis)
      const YT = [0, 1, 2, 3, 4, 5, 6];
      const KS = M.strikes, NK = KS.length;
      const PX = { x: 40, y: 742, w: 1000, h: 724 };
      const F = QC.frame(160, 890, 830, 372, [E.edges[0], E.edges[E.edges.length - 1]], [0, 6]);
      const nf = (v) => Math.round(v).toLocaleString("en-US");
      const tTex = w(0) - 0.04, tBars = 0.45, tK0 = w(6) - 0.12, tK1 = w(8), tN = w(10) - 0.2, tNL = w(11) + 0.04;
      const tC = w(12) - 0.1, tCL = w(13) - 0.12;
      const hit = (t, t0) => t - t0 > 0 && t - t0 < 3 / FPS;
      const st = { t: 0 };
      function init() { QC.tex.init(document.querySelector('[data-composition-id="s10"]'), TEX, T); }
      function vw(s, size) {   // the width QC.value gives a string, so a label can sit after its final value
        g.save(); g.font = `400 ${size}px ${HUD.FONT.ui}`;
        const adv = g.measureText("0").width * 1.02; let x = 0;
        for (const ch of s) x += ".,: ".includes(ch) ? g.measureText(ch).width * 1.1 : adv;
        g.restore(); return x;
      }
      function draw() {
        const t = st.t, f = Math.floor(t * FPS);
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 1080, 1920);
        QC.tex.begin();
        const xIn = QC.scanIn(t, 0, 0.6), xOut = t > DUR - 0.4 ? QC.scanOut(t, DUR, 0.4) : QC.STAGE.x0;
        QC.clipStage(g, xIn, xOut);
        const clip = [xOut, xIn];
        // ---- the strip: the Monte Carlo price of a put ----
        QC.panel(g, T, 40, 566, 1000, 160, { open: clamp(t / 0.45), op: 0.9 });
        const aF = clamp((t - tTex) / 0.2);
        if (aF > 0) QC.tex.show("mc_price", { x: 540, y: 646, size: 40, align: "center", valign: "middle", a: aF,
          k: clamp((t - tTex) / 0.8), clip });
        // ---- the chart: where a million one-month paths end ----
        QC.panel(g, T, PX.x, PX.y, PX.w, PX.h, { open: clamp((t - 0.1) / 0.45), title: "where a million months end", index: "10",
          sub: `S₀ = ${M.S0} · ${M.T_months} month · σ = ${(100 * M.sigma).toFixed(0)}% · ${fmt(100 * M.crash, 0)}% crashes, ${M.crash_rate.toFixed(1)} a year`,
          tag: "SIMULATED", frame: f });
        const kAx = clamp((t - 0.25) / 0.5);
        QC.axes(g, T, F, { k: kAx, xt: [70, 80, 90, 100, 110, 120, 130], yt: YT, yf: () => "", xl: "price in one month",
          yl: "paths (log)", ylDx: 96 });
        // the y ticks as 10 with a raised exponent, all in one face (pow10's superscripts mix two fonts in the mono face)
        YT.forEach((v, i) => {
          const a = clamp((eo(kAx) - i / YT.length * 0.6) * 3), y = F.Y(v) + 21 * 0.36, x = F.x - 14;
          if (a <= 0) return;
          QC.text(g, T, String(v), x, y - 9, { size: 15, mono: true, align: "right", c: "hi", a: 0.85 * a });
          QC.text(g, T, "10", x - 10, y, { size: 21, mono: true, align: "right", c: "hi", a: 0.85 * a });
        });
        // the histogram: every path (blue), the paths that had a crash (accent)
        const kB = clamp((t - tBars) / 0.85);
        QC.bars(g, T, F, BA.x, BA.y, { bw: BW, base: 0, k: kB, c: "line", fa: 0.2 });
        QC.bars(g, T, F, BC.x, BC.y, { bw: BW, base: 0, k: kB, c: "acc", fa: 0.28 });
        // the strikes drop in from 80 to 120 as they are said
        KS.forEach((K, j) => {
          const t0 = lerp(tK0, tK1, j / (NK - 1)), k = clamp((t - t0) / 0.22);
          if (k <= 0) return;
          const x = F.X(K), y0 = F.y - 2, y1 = lerp(y0, F.y + F.h, eo(k));
          g.save(); g.setLineDash([6, 6]); g.strokeStyle = T.hi(0.6); g.lineWidth = 1.8;
          g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke(); g.restore();
          QC.text(g, T, String(K), x, F.y - 12, { size: 20, mono: true, align: "center", c: "hi", a: clamp(k * 3) });
          if (k < 1) QC.dot(g, T, x, y1, { r: 3.5, c: "hi" });
        });
        const kS = clamp((t - tK0) / 0.3);
        QC.text(g, T, "STRIKES", F.x + F.w, F.y - 40, { size: 19, wt: 600, ls: 2, align: "right", c: "line", a: kS });
        // the readout: a million paths, 8,171 with a crash
        const kN = clamp((t - tN) / (tNL - tN));
        if (kN > 0) {
          const y = 1426;
          g.save(); g.strokeStyle = T.dim(0.45); g.lineWidth = 1; g.beginPath(); g.moveTo(64, 1356); g.lineTo(64 + 952 * eo(clamp(kN * 2)), 1356); g.stroke(); g.restore();
          const x1 = 64 + vw(nf(M.paths), 60);   // the counters count up right-aligned in their final slot, so labels never move
          QC.value(g, T, nf(M.paths * eo(kN)), x1, y, { size: 60, align: "right", roll: kN >= 1 ? 1 : 0.999, frame: f, flash: hit(t, tNL), a: clamp(kN * 4) });
          QC.text(g, T, "PATHS", x1 + 14, y - 4, { size: 28, wt: 600, ls: 2, c: "hi", a: clamp(kN * 3) });
          const kc = clamp((t - tC) / (tCL - tC));
          if (kc > 0) {
            const xc = 560;
            const x2 = xc + vw(nf(M.paths_with_crash), 60);
            QC.value(g, T, nf(M.paths_with_crash * eo(kc)), x2, y, { size: 60, align: "right", roll: kc >= 1 ? 1 : 0.999, frame: f, flash: hit(t, tCL), a: clamp(kc * 4) });
            QC.text(g, T, "WITH A CRASH", x2 + 14, y - 4, { size: 28, wt: 600, ls: 2, c: "hi", a: clamp(kc * 3) });
          }
        }
        // the crash bump, locked with its count
        const kL = clamp((t - tCL) / 0.3);
        if (kL > 0) QC.lock(g, T, [F.X(70) + 16, F.Y(3.45), F.X(87.6), F.Y(0) - 4], kL, { pad: 10, flash: hit(t, tCL + 0.3) });
        g.restore();
        QC.scanLine(g, T, xIn < QC.STAGE.x1 ? xIn : xOut);
        QC.tex.end();
      }
      if (typeof init === "function") init();     // before the tween: fromTo renders (and draws) at once
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s10"] = tl;
    })();
  </script>
</template>
