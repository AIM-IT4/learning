  <script>
    (function () {
      const V = 0.3;
      const W = [0.0, 0.26, 0.58, 0.84, 1.32, 1.52, 1.74, 2.45, 2.62, 2.86, 3.04, 3.65, 4.44, 4.72, 4.86, 5.12, 5.89, 6.2, 6.26, 6.58, 6.78, 7.64,

      const VO_END = 25.64;
      const GROUPS = [7, 5, 9, 4, 5, 4, 3, 4, 5, 7, 5];
      const t = (i) => W[i] + V;
      const tl = gsap.timeline({ paused: true });

      // ---- the camera: focus (fx, fy) on the page lands on the focal point; rx tilts the page away, rz turns it, s is the zoom
      const camTo = (at, d, c, ease = "power3.inOut") => {
        tl.to("#q-pg", { x: 640 - c.fx, y: -c.fy, duration: d, ease }, at);
        tl.to("#q-cam", { rotationX: c.rx, rotation: c.rz, scale: c.s, duration: d, ease }, at);
      };
      gsap.set("#q-pg", { x: 640 - 380, y: -420 });
      gsap.set("#q-cam", { rotationX: 34, rotation: -8, scale: 1.15 });
      gsap.set([".q-hl"], { scaleX: 0 });
      gsap.set(["#q-b2", "#q-b4", "#q-b5", "#q-b6", "#q-b7", "#q-two", "#q-end", ".q-cap", ".q-pill"], { opacity: 0 });

      const mark = (id, at, d = 0.35) => tl.to(id, { scaleX: 1, duration: d, ease: "power3.out" }, at);
      const beat = (from, to, at) => {            // swap the card's contents: out goes up, in comes from below
        if (from) tl.to(from, { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, at - 0.2);
        tl.fromTo(to, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.32, ease: "expo.out" }, at);
      };
      const pulse = (id, at) => tl.fromTo(id, { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, at);

      // 1 — the hero: "इंटरव्यू ≠ डेस्क". A slow push-in; the page's own words get marked as they are said.
      camTo(0, t(11), { fx: 400, fy: 425, rx: 30, rz: -6, s: 1.3 }, "power1.inOut");
      mark("#q-h-int", t(1)); pulse("#q-b1 span:nth-child(1)", t(1));
      mark("#q-h-desk", t(8)); pulse("#q-b1 span:nth-child(3)", t(8));
      pulse("#q-b1 .ne", t(11));

      // 2 — "डेस्क टू क्वांट": up to the nav logo; the card shows the real logo; then pull back to the whole hero for "दोनों"
      camTo(t(12) - 0.35, 0.8, { fx: 300, fy: 150, rx: 26, rz: -4, s: 1.45 });
      mark("#q-h-logo", t(12) + 0.3);
      beat("#q-b1", "#q-b2", t(12));
      camTo(t(16) - 0.2, 1.0, { fx: 620, fy: 470, rx: 40, rz: -8, s: 0.95 });
      tl.fromTo("#q-two", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, t(16));

      // 3 — glide down to the products; one pill per kind of resource as it is said
      camTo(t(21) - 0.3, 1.7, { fx: 600, fy: 3720, rx: 50, rz: -14, s: 1.0 });
      beat("#q-b2", "#q-b4", t(21));
      tl.to("#q-pg", { y: -4500, duration: t(30) - 0.2 - (t(21) + 1.4), ease: "none" }, t(21) + 1.4);
      [["#q-p1", 24], ["#q-p2", 25], ["#q-p3", 29]].forEach(([id, i]) => {
        tl.fromTo(id, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t(i));
        tl.to(id, { backgroundColor: "#ffd23f", duration: 0.15 }, t(i));
      });

      // 4 — "54 से ज़्यादा": a fast run down the whole catalogue to the page's own "All 54 resources" link
      beat("#q-b4", "#q-b5", t(30) - 0.1);
      camTo(t(30) - 0.2, 1.25, { fx: 330, fy: 10220, rx: 46, rz: -12, s: 1.12 }, "power2.inOut");
      const N = { v: 0 }, num = document.getElementById("q-num");
      tl.fromTo(N, { v: 0 }, { v: 54, duration: 0.9, ease: "power2.out", immediateRender: false, onUpdate: () => { num.textContent = Math.round(N.v) + "+"; } }, t(30));
      mark("#q-h-all", t(33));
      pulse("#q-num", t(33));

      // 5 — the method: flatten over the heading and mark each phrase as it is said
      beat("#q-b5", "#q-b6", t(34));
      camTo(t(34) - 0.1, 1.4, { fx: 450, fy: 11770, rx: 24, rz: -4, s: 1.28 });
      tl.to("#q-pg", { y: -11800, duration: t(46) - 0.2 - t(37), ease: "none" }, t(37));
      [["#q-h-m1", "#q-v1", 37], ["#q-h-m2", "#q-v2", 39], ["#q-h-m3", "#q-v3", 41], ["#q-h-m4", "#q-v4", 42], ["#q-h-m5", "#q-v5", 44]].forEach(([h, v, i]) => {
        mark(h, t(i), 0.3);
        tl.fromTo(v, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, t(i));
        tl.to(v, { backgroundColor: "#0b7f79", color: "#ffffff", borderColor: "#0b7f79", duration: 0.15 }, t(i));
      });

      // 6 — 1-on-1 mentorship
      beat("#q-b6", "#q-b7", t(46));
      camTo(t(46) - 0.2, 1.1, { fx: 560, fy: 12560, rx: 38, rz: -10, s: 1.05 });
      mark("#q-h-one", t(48), 0.5);

      // 7 — "desk2quant.com": pull far back, the page streams away under the end card
      tl.to("#q-card", { opacity: 0, y: -60, duration: 0.25, ease: "power2.in" }, t(53) - 0.3);
      camTo(t(53) - 0.35, 1.6, { fx: 640, fy: 14000, rx: 58, rz: -24, s: 0.45 });
      tl.to("#q-pg", { y: -14600, duration: 3.5, ease: "none" }, t(53) + 1.25);
      tl.fromTo("#q-end", { opacity: 0, scale: 0.85, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, t(53));

      // captions: the spoken word gets the yellow bar
      let i0 = 0;
      GROUPS.forEach((n, g) => {
        const id = "#q-c" + (g + 1), spans = document.querySelectorAll(id + " span");
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t(i0) - 0.1);
        tl.to(id, { opacity: 0, duration: 0.1 }, g < GROUPS.length - 1 ? t(i0 + n) - 0.12 : VO_END + V + 0.4);
        for (let k = 0; k < n; k++) {
          tl.set(spans[k], { opacity: 1, backgroundColor: "rgba(255,210,63,1)" }, t(i0 + k));
          if (k > 0) tl.set(spans[k - 1], { backgroundColor: "rgba(255,210,63,0)" }, t(i0 + k));
        }
        i0 += n;
      });

      window.__timelines["site3d"] = tl;
    })();
