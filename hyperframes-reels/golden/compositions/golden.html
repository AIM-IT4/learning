<template>
  <style>
    @font-face { font-family: "Yatra One"; src: url("assets/fonts/YatraOne.ttf"); }
    @font-face { font-family: "Noto Sans Devanagari"; font-weight: 700; src: url("assets/fonts/NotoSansDevanagari_700Bold.ttf"); }
    @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/Poppins_700Bold.ttf"); }
    @font-face { font-family: "Sym"; font-weight: 700; src: url("assets/fonts/DejaVuSans-Bold.ttf"); }
    #root { position: absolute; inset: 0; background: #f7f7f3; overflow: hidden; }
    #s-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s-title { position: absolute; left: 70px; top: 232px; font-family: "Yatra One"; font-size: 104px; line-height: 1.1; color: #12221f; white-space: nowrap; }
    .s-num { position: absolute; top: 600px; width: 220px; margin-left: -110px; text-align: center; font-family: "Poppins"; font-weight: 700; font-size: 112px;
             line-height: 1.1; color: #12221f; }
    #s-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    .s-eq { position: absolute; left: 0; top: 960px; width: 1080px; text-align: center; white-space: nowrap; }
    .s-eq span { display: inline-block; padding: 4px 34px 8px; background: #ffd23f; border: 5px solid #12221f; border-radius: 24px; font-family: "Poppins";
                 font-weight: 700; font-size: 84px; line-height: 1.2; color: #12221f; box-shadow: 0 10px 0 #12221f; }
    #s-phi { position: absolute; left: 70px; top: 238px; white-space: nowrap; }
    #s-phi span { display: inline-block; padding: 4px 30px 10px; background: #ffd23f; border: 5px solid #12221f; border-radius: 24px; font-family: "Poppins";
                  font-weight: 700; font-size: 80px; line-height: 1.2; color: #12221f; box-shadow: 0 10px 0 #12221f; }
    #s-phi b, #s-rel b { font-family: "Sym"; font-weight: 700; }
    #s-rel { position: absolute; left: 604px; top: 266px; font-family: "Poppins"; font-weight: 700; font-size: 38px; line-height: 1.2; color: #0b7f79; white-space: nowrap; }
    .s-cap { position: absolute; left: 60px; top: 1330px; width: 960px; text-align: center; font-family: "Noto Sans Devanagari"; font-weight: 700; font-size: 46px;
             line-height: 1.3; color: #12221f; text-wrap: balance; }
    .s-cap span { display: inline-block; padding: 0 8px; margin: 0 1px; border-radius: 8px; opacity: 0.4; }
  </style>
  <div id="root" data-composition-id="golden" data-width="1080" data-height="1920">
    <canvas id="s-cv" width="1080" height="1920"></canvas>
    <div id="s-title">प्रकृति का गणित</div>
    <div id="s-n0" class="s-num" style="left: 140px">1</div>
    <div id="s-n1" class="s-num" style="left: 268px">1</div>
    <div id="s-n2" class="s-num" style="left: 396px">2</div>
    <div id="s-n3" class="s-num" style="left: 524px">3</div>
    <div id="s-n4" class="s-num" style="left: 652px">5</div>
    <div id="s-n5" class="s-num" style="left: 780px">8</div>
    <div id="s-n6" class="s-num" style="left: 920px">13</div>
    <svg id="s-svg" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="s-win" fill="none" stroke="#c4553a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 94 762 Q 94 828 204 828 Q 314 828 314 762" />
        <path d="M 204 828 C 204 895 396 895 396 782" />
        <path d="M 372 802 L 396 774 L 420 802" />
      </g>
    </svg>
    <div id="s-e0" class="s-eq"><span>1 + 1 = 2</span></div>
    <div id="s-e1" class="s-eq"><span>1 + 2 = 3</span></div>
    <div id="s-e2" class="s-eq"><span>2 + 3 = 5</span></div>
    <div id="s-e3" class="s-eq"><span>3 + 5 = 8</span></div>
    <div id="s-e4" class="s-eq"><span>5 + 8 = 13</span></div>
    <div id="s-phi"><span><b>φ</b> = 1.618…</span></div>
    <div id="s-rel">360° ÷ <b>φ</b>² = 137.5°</div>

    <div id="s-c1" class="s-cap"><span>एक,</span><span>एक,</span><span>दो,</span><span>तीन,</span><span>पाँच,</span><span>आठ,</span><span>तेरह…</span></div>
    <div id="s-c2" class="s-cap"><span>हर</span><span>संख्या,</span><span>पहले</span><span>की</span><span>दो</span><span>संख्याओं</span><span>का</span><span>जोड़।</span></div>
    <div id="s-c3" class="s-cap"><span>इन्हें</span><span>वर्गों</span><span>में</span><span>बनाइए,</span></div>
    <div id="s-c4" class="s-cap"><span>और</span><span>जोड़ते</span><span>जाइए…</span></div>
    <div id="s-c5" class="s-cap"><span>एक</span><span>सर्पिल</span><span>बनता</span><span>है।</span></div>
    <div id="s-c6" class="s-cap"><span>अब</span><span>हर</span><span>बीज</span><span>को,</span><span>पहले</span><span>वाले</span><span>से,</span></div>
    <div id="s-c7" class="s-cap"><span>एक</span><span>सौ</span><span>सैंतीस</span><span>दशमलव</span><span>पाँच</span><span>डिग्री</span><span>घुमाकर</span><span>रखिए…</span></div>
    <div id="s-c8" class="s-cap"><span>और</span><span>देखिए,</span><span>सूरजमुखी</span><span>बन</span><span>गया!</span></div>
    <div id="s-c9" class="s-cap"><span>प्रकृति</span><span>भी,</span><span>गणित</span><span>से</span><span>चलती</span><span>है।</span></div>
  </div>
  <script>
    (function () {
      const V = 0.3;
      // word onsets on the voice (patched after measuring); 52 words, captions in 9 groups
      const W = [0.0, 0.75, 1.36, 2.05, 2.85, 3.7, 4.55, 5.6, 5.74, 6.7, 6.96, 7.08, 7.22, 7.6, 7.72, 9.1, 9.32, 9.66, 9.74, 10.75, 10.94, 11.24, 12.25, 12.48, 12.8, 13.12, 14.021, 14.181, 14.341, 14.541, 15.371, 15.581, 15.801, 16.641, 16.801, 16.981, 17.381, 17.781, 18.001, 18.241, 18.621, 19.531, 19.691, 19.851, 20.7, 20.88, 21.971, 22.341, 23.021, 23.301, 23.441, 23.761];
      const VO_END = 23.97;
      const GROUPS = [7, 8, 4, 3, 4, 7, 8, 5, 6];
      const t = (i) => W[i] + V;
      const END = VO_END + V + 2.6;
      const TAU = Math.PI * 2;
      const EZ = { o2: gsap.parseEase("power2.out"), io2: gsap.parseEase("power2.inOut"), back: gsap.parseEase("back.out(1.7)"), i1: gsap.parseEase("power1.in") };
      const pr = (tt, t0, d, ez) => { const p = Math.min(1, Math.max(0, (tt - t0) / d)); return ez ? ez(p) : p; };
      const cv = document.getElementById("s-cv"), cx = cv.getContext("2d");

      // ---- Fibonacci squares, each added on the next side in turn (right, down, left, up …); arcs make the spiral
      const SQ = [[0, 0, 1], [1, 0, 1], [0, 1, 2], [-3, 0, 3], [-3, -5, 5], [2, -5, 8], [-3, 3, 13], [-24, -5, 21], [-24, -39, 34]];
      const ARC = [[1, 1, 0.5], [1, 1, 0.75], [0, 1, 0], [0, 0, 0.25], [2, 0, 0.5], [2, 3, 0.75], [-3, 3, 0], [-3, -5, 0.25], [10, -5, 0.5]]; // centre, start (turns)
      const FILL = ["#ffe48a", "#c8e3df", "#f0cfc6", "#ead9b0"];
      const sqT = (i) => t(15) - 0.05 + (i * (t(21) + 0.25 - t(15))) / 8;
      const KEY = SQ.map((_, i) => {
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (let j = 0; j <= i; j++) { const [a, b, s] = SQ[j]; x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, a + s); y1 = Math.max(y1, b + s); }
        return { u: Math.log(Math.min(860 / (x1 - x0), 880 / (y1 - y0), 150)), x: (x0 + x1) / 2, y: (y0 + y1) / 2 };
      });
      const cam = (tt) => {
        let u = KEY[0].u, x = KEY[0].x, y = KEY[0].y;
        for (let i = 1; i < KEY.length; i++) { const p = pr(tt, sqT(i) - 0.3, 0.45, EZ.io2); u += (KEY[i].u - u) * p; x += (KEY[i].x - x) * p; y += (KEY[i].y - y) * p; }
        const dive = pr(tt, t(26) - 0.1, 0.35, EZ.i1);                 // "अब": the squares fade out
        return { u: Math.exp(u), x, y, fade: 1 - dive };
      };
      const drawSquares = (tt) => {
        if (tt < sqT(0) - 0.01) return;
        const c = cam(tt); if (c.fade <= 0) return;
        cx.save(); cx.globalAlpha = c.fade;
        cx.translate(540, 810); cx.scale(c.u, c.u); cx.translate(-c.x, -c.y);
        SQ.forEach(([a, b, s], i) => {
          const p = pr(tt, sqT(i), 0.32, EZ.back); if (p <= 0) return;
          cx.save(); cx.translate(a + s / 2, b + s / 2); cx.scale(0.55 + 0.45 * p, 0.55 + 0.45 * p);
          cx.globalAlpha = c.fade * Math.min(1, p * 1.6);
          cx.fillStyle = FILL[i % 4]; cx.fillRect(-s / 2, -s / 2, s, s);
          cx.strokeStyle = "#12221f"; cx.lineWidth = 4 / c.u; cx.strokeRect(-s / 2, -s / 2, s, s);
          const px = 0.42 * s * c.u;
          if (px > 10) { cx.fillStyle = "#12221f"; cx.font = `700 ${Math.min(px, 170) / c.u}px Poppins`; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(String(s), 0, 0.04 * s); }
          cx.restore();
        });
        // the spiral: one quarter arc per square, drawn in turn
        const q = 9 * pr(tt, t(22) - 0.35, t(25) + 0.7 - t(22), EZ.i1);
        if (q > 0) {
          for (const [w, col] of [[16, "#12221f"], [9, "#ffd23f"]]) {
            cx.strokeStyle = col; cx.lineWidth = w / c.u; cx.lineCap = "round"; cx.beginPath();
            for (let i = 0; i < Math.min(9, Math.ceil(q)); i++) {
              const [ox, oy, a0] = ARC[i], r = SQ[i][2], f = Math.min(1, q - i);
              cx.moveTo(ox + r * Math.cos(TAU * a0), oy + r * Math.sin(TAU * a0));
              cx.arc(ox, oy, r, TAU * a0, TAU * (a0 + 0.25 * f));
            }
            cx.stroke();
          }
        }
        cx.restore(); cx.globalAlpha = 1;
      };

      // ---- the sunflower: seed n sits at angle n × 137.508°, distance √n from the centre
      const N = 600, GA = (TAU * 137.508) / 360, FX = 540, FY = 830;
      const SLOW = [t(28), t(31), t(33), t(35), t(37), t(39)].map((x) => x - 0.12);
      const R1 = t(40), R2 = t(43) + 0.15, HEAD = 300 + 2;
      const birth = (n) => (n < SLOW.length ? SLOW[n] : R1 + (R2 - R1) * Math.sqrt((n - SLOW.length + 1) / (N - SLOW.length)));
      const B = Array.from({ length: N }, (_, n) => birth(n));
      const count = (tt) => {                                          // seeds born so far, as a smooth number
        if (tt < B[0]) return 0;
        let lo = 0, hi = N - 1;
        if (tt >= B[hi]) return N;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (B[m] <= tt) lo = m; else hi = m; }
        return lo + 1 + (tt - B[lo]) / (B[hi] - B[lo]);
      };
      const mix = (a, b, m) => { const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
        return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * m)).join(",")})`; };
      const drawFlower = (tt) => {
        if (tt < B[0] - 0.3) return;
        const n = count(tt), c = Math.min(110, Math.max(12.25, 300 / Math.sqrt(Math.max(n, 0.5) + 0.5)));
        const m = pr(tt, t(43) - 0.15, 0.6, EZ.io2);
        // petals, two rings of 34
        for (const [ring, len, col, d0] of [[0, 150, "#f2b705", 0.12], [1, 132, "#ffd23f", 0]]) {
          for (let k = 0; k < 34; k++) {
            const s = pr(tt, t(43) + 0.05 + d0 + 0.01 * k, 0.45, EZ.back); if (s <= 0) continue;
            const a = (TAU * (k + 0.5 * ring)) / 34 - Math.PI / 2, R = HEAD, L = len * s;
            cx.save(); cx.translate(FX + R * Math.cos(a), FY + R * Math.sin(a)); cx.rotate(a);
            cx.fillStyle = col; cx.strokeStyle = "#12221f"; cx.lineWidth = 3.5;
            cx.beginPath(); cx.ellipse(L / 2 - 8, 0, L / 2 + 8, 26 * s, 0, 0, TAU); cx.fill(); cx.stroke(); cx.restore();
          }
        }
        if (m > 0) { cx.fillStyle = "#3a2610"; cx.globalAlpha = m; cx.beginPath(); cx.arc(FX, FY, c * Math.sqrt(N) + 4, 0, TAU); cx.fill(); cx.globalAlpha = 1; }
        // the angle between the newest seed and the one before it
        const newest = Math.min(N, Math.floor(n)) - 1, guide = 1 - pr(tt, t(41) - 0.1, 0.35);
        const rad = (k) => c * Math.sqrt(k + 0.5);
        let label = null;
        if (guide > 0 && newest >= 0) {
          cx.globalAlpha = guide;
          cx.strokeStyle = "#c4553a"; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(FX - 18, FY); cx.lineTo(FX + 18, FY); cx.moveTo(FX, FY - 18); cx.lineTo(FX, FY + 18); cx.stroke();
          if (newest >= 1) {
            const a1 = newest * GA, a0 = a1 - GA;
            cx.setLineDash([12, 10]); cx.strokeStyle = "#12221f"; cx.lineWidth = 3; cx.beginPath();
            cx.moveTo(FX, FY); cx.lineTo(FX + rad(newest - 1) * Math.cos(a0), FY + rad(newest - 1) * Math.sin(a0));
            cx.moveTo(FX, FY); cx.lineTo(FX + rad(newest) * Math.cos(a1), FY + rad(newest) * Math.sin(a1)); cx.stroke(); cx.setLineDash([]);
            cx.strokeStyle = "#c4553a"; cx.lineWidth = 7; cx.beginPath(); cx.arc(FX, FY, 64, a0, a1); cx.stroke();
            const am = (a0 + a1) / 2; label = [FX + 150 * Math.cos(am), FY + 150 * Math.sin(am)];
          }
          cx.globalAlpha = 1;
        }
        // seeds
        for (let k = 0; k < N; k++) {
          if (tt < B[k]) break;
          const s = pr(tt, B[k], 0.28, EZ.back), r = c * Math.sqrt(k + 0.5), a = k * GA;
          const fresh = k === newest && guide > 0;
          cx.fillStyle = fresh ? "#ffd23f" : mix("#12221f", (k % 34) % 2 ? "#e0a92a" : "#9c6a22", m);
          cx.beginPath(); cx.arc(FX + r * Math.cos(a), FY + r * Math.sin(a), c * (0.4 + 0.36 * m) * s, 0, TAU); cx.fill();
          if (fresh) { cx.strokeStyle = "#12221f"; cx.lineWidth = 4; cx.stroke(); }
        }
        if (label) {
          cx.globalAlpha = guide; cx.font = "700 42px Poppins"; cx.textAlign = "center"; cx.textBaseline = "middle";
          const w = cx.measureText("137.5°").width + 30, h = 58, [lx, ly] = label;
          cx.fillStyle = "#f7f7f3"; cx.strokeStyle = "#c4553a"; cx.lineWidth = 4;
          cx.beginPath(); cx.roundRect(lx - w / 2, ly - h / 2, w, h, 16); cx.fill(); cx.stroke();
          cx.fillStyle = "#c4553a"; cx.fillText("137.5°", lx, ly + 2); cx.globalAlpha = 1;
        }
      };

      const P = { time: 0 };
      const draw = () => { const tt = P.time; cx.clearRect(0, 0, 1080, 1920); drawSquares(tt); drawFlower(tt); };
      draw();

      const tl = gsap.timeline({ paused: true });
      tl.to(P, { time: END, duration: END, ease: "none", onUpdate: draw }, 0);
      const nums = ["#s-n0", "#s-n1", "#s-n2", "#s-n3", "#s-n4", "#s-n5", "#s-n6"], eqs = ["#s-e0", "#s-e1", "#s-e2", "#s-e3", "#s-e4"];
      gsap.set([...nums, ...eqs, "#s-win", "#s-phi", "#s-rel", ".s-cap"], { opacity: 0 });
      nums.forEach((id, i) => tl.fromTo(id, { opacity: 0, y: 40, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t(i) - 0.05));
      // the sum slides along the row: each number is the sum of the two before it
      const STEP = [t(7) - 0.15, t(7) + 1.05, t(7) + 2.3], POS = [0, 2, 4];  // three sums, each held long enough to read
      tl.fromTo("#s-win", { opacity: 0, x: 0 }, { opacity: 1, duration: 0.2 }, STEP[0] - 0.05);
      STEP.forEach((s, j) => {
        const e = eqs[POS[j]];
        if (j > 0) { tl.to("#s-win", { x: 128 * POS[j], duration: 0.3, ease: "power2.inOut" }, s - 0.15); tl.to(eqs[POS[j - 1]], { opacity: 0, duration: 0.08 }, s - 0.1); }
        tl.fromTo(e, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, s);
        tl.fromTo(nums[POS[j] + 2], { color: "#12221f" }, { color: "#c4553a", duration: 0.1 }, s);
        if (j > 0) tl.to(nums[POS[j - 1] + 2], { color: "#12221f", duration: 0.1 }, s);
      });
      tl.to([...nums, "#s-win", eqs[4]], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, t(15) - 0.1);
      // the end: the ratio behind it all
      tl.to("#s-title", { opacity: 0, y: -24, duration: 0.25, ease: "power2.in" }, t(46) - 0.25);
      tl.fromTo("#s-phi", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", transformOrigin: "0% 50%" }, t(46));
      tl.fromTo("#s-rel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, t(48));

      // captions
      let i0 = 0;
      GROUPS.forEach((n, g) => {
        const id = "#s-c" + (g + 1), spans = document.querySelectorAll(id + " span");
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t(i0) - 0.1);
        tl.to(id, { opacity: 0, duration: 0.07 }, g < GROUPS.length - 1 ? t(i0 + n) - 0.19 : VO_END + V + 0.4);
        for (let k = 0; k < n; k++) {
          tl.set(spans[k], { opacity: 1, backgroundColor: "rgba(255,210,63,1)" }, t(i0 + k));
          if (k > 0) tl.set(spans[k - 1], { backgroundColor: "rgba(255,210,63,0)" }, t(i0 + k));
        }
        i0 += n;
      });

      window.__timelines["golden"] = tl;
    })();
  </script>
</template>
