        // ---- the arrow cursor (tip at x, y), pressing (p 0..1) and the click ripple (r: seconds since the click)

        }

          g.moveTo(x - s * 0.45, y - s * 0.05); g.lineTo(x + s * 0.45, y - s * 0.42); g.lineTo(x + s * 0.12, y + s * 0.45); g.lineTo(x - s * 0.02, y + s * 0.08); g.closePath();

        // ---- chrome pipes: a polyline drawn as a glossy tube; flow (0..1 of its length) fills it with brand-blue light
        function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }

        }

        // ---- the glossy dial (gauge): chrome bezel, white face, a brand-blue value arc, ticks, needle, hub, and a
        // nameplate readout on the bottom rim. o: v (value), max, label, readout (string), glow (0..1), a
        function gauge(g, cx, cy, R, o = {}) {
          const max = o.max ?? 40, a0 = 0.75 * Math.PI, sweep = 1.5 * Math.PI;
          const ang = (v) => a0 + sweep * clamp(v / max, -0.03, 1.04);
          g.save(); g.globalAlpha *= o.a ?? 1;
          // bezel with the long shadow
          g.save(); g.shadowColor = "rgba(40,32,12,0.30)"; g.shadowBlur = 56; g.shadowOffsetY = 30;
          const bz = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
          bz.addColorStop(0, "#ffffff"); bz.addColorStop(0.45, "#c3cbd7"); bz.addColorStop(0.62, "#eef1f5"); bz.addColorStop(1, "#7f8a9d");
          g.beginPath(); g.arc(cx, cy, R + 30, 0, Math.PI * 2); g.fillStyle = bz; g.fill(); g.restore();
          const bz2 = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
          bz2.addColorStop(0, "#8c97aa"); bz2.addColorStop(0.5, "#e9edf2"); bz2.addColorStop(1, "#ffffff");
          g.beginPath(); g.arc(cx, cy, R + 12, 0, Math.PI * 2); g.fillStyle = bz2; g.fill();
          g.beginPath(); g.arc(cx, cy, R + 2, 0, Math.PI * 2); g.fillStyle = "#5d687b"; g.fill();

          g.beginPath(); g.arc(cx, cy, 34, 0, Math.PI * 2); g.fillStyle = hb; g.fill();
          g.beginPath(); g.arc(cx, cy, 14, 0, Math.PI * 2); g.fillStyle = C.blue; g.fill();

            rr(g, cx - rw / 2 + 6, ry + 6, rw - 12, rh - 12, 21); g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 2; g.stroke();

        // ---- split-flap digits: a cell shows char `cur`, flipping from `prev` (f 0..1)
        function flapHalf(g, ch, x, y, w, h, top, sy, o) {

        function flapState(seq, t0, dt, t) {

          const n = seq.length - 1, u = (t - t0) / dt;

        function flapRow(g, states, x, y, cw, ch, gap, o = {}) {
          states.forEach((S, i) => flapCell(g, x + i * (cw + gap), y, cw, ch, S.prev, S.cur, S.f, o));
          return states.length * (cw + gap) - gap;
        }

        // ---- an option ticket: a blue band, side notches and a perforation, the strike big, and a σ field of split-flap

        function ticket(g, x, y, w, h, o = {}) {

          g.beginPath(); rr(g, x, y, w, h, 20); g.fillStyle = C.white; g.fill(); g.restore();

          // the notches (paper-coloured bites) and the perforation

          text(g, "STRIKE", x + w / 2, y + band + 52, { size: 26, mono: true, ls: 2, align: "center", c: rgba(C.ink, 0.5) });
          text(g, String(o.K), x + w / 2, y + band + 138, { size: 84, align: "center", ls: -2 });
          // the σ field: o.sig = flap states; o.wide (0..1) blends from the 3-cell layout (σ 40 px, tiles 38 px) to the
          // 5-cell one (σ 30 px, tiles 29 px, a narrow "." tile); every glyph sits inside its tile with a margin
          const fy = y + h - 104;
          if (o.hl > 0) { g.save(); g.shadowColor = rgba(C.blue, 0.7 * o.hl); g.shadowBlur = 30 * o.hl; rr(g, x + 10, fy - 12, w - 20, 92, 16); g.fillStyle = rgba(C.blue, 0.14 * o.hl); g.fill(); g.restore(); }
          const wd = clamp(o.wide || 0);

            const ws = o.sig.map((S) => (S.cur === "." || S.prev === "." ? cw * 0.5 : cw));
            const rw = ws.reduce((p, q) => p + q, 0) + gap * (ws.length - 1);
            let cx = x + w - 12 - rw;

          }

        }

        // ---- the tear-off calendar page: binding, a red month band, the day big, the weekday and the year. Drawn at a
