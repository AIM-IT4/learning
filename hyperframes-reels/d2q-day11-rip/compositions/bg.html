<template>
  <style>

  <script>
    (function () {
      /*DATA*/ const DUR = 77.94; const B = [0.0, 2.91, 7.42, 13.22, 19.66, 25.2, 29.28, 32.78, 38.37, 44.05, 48.91, 58.9, 63.5, 69.0]; const THEME = ["L", "B", "L", "L", "L", "B", "L", "L", "L", "L", "L", "B", "L", "L"]; const STEP = [0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]; /*END*/
      /*NUM*/ const NUM = {}; /*ENDNUM*/
      /*TEX*/ const TEX = {}; /*ENDTEX*/
      // ===== K: the Day 11 "Ripping" kit (inlined into every canvas composition by tools/compose.py) =====
      // The look: warm paper with a faint grid, ink-navy type (D2QSans = Inter Bold), Share Tech Mono for small data (with
      // D2QSans as the fallback for σ, arrows and the like), brand blue for objects and colour blocks, yellow marker boxes,
      // red only for the crash and the tail. Big white cards with long soft shadows, glossy objects, thick strokes.
      // Everything is a pure function of time.
      const K = (function () {
        const C = { paper: "#f3efe6", ink: "#0d1526", blue: "#2563eb", blueD: "#1e40af", blueL: "#dbe6fd", blueM: "#93b4f8",
          yel: "#ffd43b", white: "#ffffff", red: "#e5484d", redD: "#b91c1c", redL: "#fde2e2", sheet: "#f6f5f1",
          mist: "#eef1f6", steel: "#95a1b3", steelL: "#dfe4eb", steelD: "#6b778a", green: "#16a34a" };
        const F = { sans: '"D2QSans"', mono: '"ShareTechMono", "D2QSans"' };
        const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
        const lerp = (a, b, k) => a + (b - a) * k;
        const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
        const ei = (x) => Math.pow(clamp(x), 3);
        const eio = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
        const back = (x, s = 1.7) => { x = clamp(x); const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };

        const spring = (u, z = 0.5, w = 15) => (u <= 0 ? 0 : u > 3 ? 1 : 1 - Math.exp(-z * w * u) * (Math.cos(w * Math.sqrt(1 - z * z) * u) + (z / Math.sqrt(1 - z * z)) * Math.sin(w * Math.sqrt(1 - z * z) * u)));

        const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
        const mix = (a, b, k, al = 1) => { const A = hex(a), Bc = hex(b); return `rgba(${A.map((v, i) => Math.round(lerp(v, Bc[i], clamp(k)))).join(",")},${al})`; };
        const rgba = (h, al) => { const A = hex(h); return `rgba(${A.join(",")},${al})`; };
        const MINUS = "−";
        const fmt = (v, d = 1) => (v < 0 ? MINUS : "") + Math.abs(v).toFixed(d);
        const comma = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        // how blue the frame is at film time t: THEME[k] "B" beats are brand blue; the change takes 0.2 s from the beat start
        function blueAt(t, B, TH) {
          let k = 0; for (let i = 0; i < B.length; i++) if (t >= B[i]) k = i;
          const cur = TH[k] === "B" ? 1 : 0, prev = k > 0 ? (TH[k - 1] === "B" ? 1 : 0) : cur;

        const beatAt = (t, B) => { let k = 0; for (let i = 0; i < B.length; i++) if (t >= B[i]) k = i; return k; };

          [amp * Math.exp(-u * 9) * Math.sin(u * 83 + seed), amp * 0.7 * Math.exp(-u * 9) * Math.sin(u * 61 + seed * 2.3)]);

        // ---- images: loaded in init (the render waits on __hf.buildReady), drawn only once complete, from smooth
        // step-by-step downscales cached per size
        const IMG = {}, CACHE = {};
        function load(map, readyKey, after) {
          const ps = Object.entries(map).map(([k, src]) => new Promise((res) => {
            const im = new Image(); IMG[k] = im;
            im.onload = () => { res(); if (after) after(); }; im.onerror = () => res(); im.src = src;
          }));
          window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady[readyKey] = Promise.all(ps);
          return window.__hf.buildReady[readyKey];
        }
        const ok = (k) => IMG[k] && IMG[k].complete && IMG[k].naturalWidth > 0;
        function down(src, sw, sh, wd, ht) {
          while (sw / 2 >= wd) {
            const c = document.createElement("canvas"); c.width = Math.round(sw / 2); c.height = Math.round(sh / 2);
            const cx = c.getContext("2d"); cx.imageSmoothingQuality = "high"; cx.drawImage(src, 0, 0, c.width, c.height);
            src = c; sw = c.width; sh = c.height;
          }

          return c;
        }
        function pic(k, wd) {
          wd = Math.round(wd); const key = k + "@" + wd;
          if (CACHE[key]) return CACHE[key];

        }

        // ---- formulas: MathJax SVGs (work/formulas.json, typeset at build time from numbers.json) drawn as images, so
        // they ride on cards (tilts, springs) like everything else. Each is recoloured: ink text, the \class{acc} parts in
        // the accent, \class{blu} in brand blue. Keys are id@variant.
        const TEXM = {};
        function texLoad(TEX, readyKey, variants, after) {
          const map = {};
          for (const [vn, col] of Object.entries(variants)) {
            for (const id in TEX) {
              const f = TEX[id], W0 = f.w * 100, H0 = f.h * 100;
              let s = f.svg.replace(/currentColor/g, col.ink);

        }
        // draw formula id at (x, y = baseline), em px per TeX em; o: align, variant, k (reveal from the left), a
        function tex(g, id, x, y, em, o = {}) {
          const f = TEXM[id], key = "tex:" + id + "@" + (o.variant || "ink");
          if (!f) return { w: 0, h: 0 };
          const w = f.w * em, h = f.h * em;
          const x0 = o.align === "center" ? x - w / 2 : o.align === "right" ? x - w : x;
          const top = o.valign === "middle" ? y - h / 2 : o.valign === "top" ? y : y - (f.h - f.a) * em;
          const k = clamp(o.k ?? 1);

            g.save(); g.globalAlpha *= o.a ?? 1;
            if (k < 1) { g.beginPath(); g.rect(x0 - 10, top - 20, (w + 20) * k, h + 40); g.clip(); }
            g.drawImage(IMG[key], x0, top, w, h);

        }
        const texSize = (id, em) => (TEXM[id] ? { w: TEXM[id].w * em, h: TEXM[id].h * em } : { w: 0, h: 0 });

        // ---- shapes and type
        function rr(g, x, y, w, h, r) {

          g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
        }
        // a white card with a long soft shadow (local coordinates)
        function card(g, x, y, w, h, o = {}) {
          g.save();
          g.shadowColor = o.shadow || "rgba(40,32,12,0.22)"; g.shadowBlur = o.blur ?? 44; g.shadowOffsetY = o.dy ?? 22;
          rr(g, x, y, w, h, o.r ?? 28); g.fillStyle = o.fill || C.white; g.fill();
          g.restore();
          if (o.stroke !== false) { g.save(); rr(g, x, y, w, h, o.r ?? 28); g.strokeStyle = o.stroke || "rgba(13,21,38,0.08)"; g.lineWidth = 1.5; g.stroke(); g.restore(); }
        }
        function font(g, size, mono, ls) { g.font = `${mono ? 400 : 700} ${size}px ${mono ? F.mono : F.sans}`; g.letterSpacing = (ls || 0) + "px"; }
        function tw(g, s, size, mono, ls) { g.save(); font(g, size, mono, ls); const v = g.measureText(s).width; g.restore(); return v; }
        function text(g, s, x, y, o = {}) {
          g.save(); font(g, o.size || 30, o.mono, o.ls); g.fillStyle = o.c || C.ink; g.globalAlpha *= o.a ?? 1;
          g.textAlign = o.align || "left"; g.textBaseline = o.base || "alphabetic";
          if (o.maxW) { let sz = o.size || 30; while (sz > 12 && g.measureText(s).width > o.maxW) { sz -= 1; font(g, sz, o.mono, o.ls); } }
          g.fillText(s, x, y);

        // ---- poses: a card that enters with a spring and a slight 3D tilt that settles (u: seconds since its start), and
        // leaves (v: seconds since its exit starts). apply(g, cx, cy, P) sets the transform about the card's centre.
        function enter(u, o = {}) {
          const p = spring(u, o.z ?? 0.52, o.w ?? 12.5), q = 1 - p;
          return { dx: (o.dx ?? 0) * q, dy: (o.dy ?? 150) * q, rot: (o.rot ?? 0.06) * q, sc: lerp(o.sc ?? 0.88, 1, p),
            yaw: (o.yaw ?? 0.32) * q, pitch: (o.pitch ?? 0.38) * q, a: clamp(u / (o.fade ?? 0.12)) };
        }
        function leave(v, o = {}) {
          const q = eio(clamp(v / (o.dur ?? 0.3)));
          return { dx: (o.dx ?? 0) * q, dy: (o.dy ?? -140) * q, rot: (o.rot ?? -0.05) * q, sc: lerp(1, o.sc ?? 0.9, q), yaw: 0, pitch: (o.pitch ?? 0.25) * q, a: 1 - q };
        }
        const still = { dx: 0, dy: 0, rot: 0, sc: 1, yaw: 0, pitch: 0, a: 1 };
        function combine(P, Q) { return { dx: P.dx + Q.dx, dy: P.dy + Q.dy, rot: P.rot + Q.rot, sc: P.sc * Q.sc, yaw: P.yaw + Q.yaw, pitch: P.pitch + Q.pitch, a: P.a * Q.a }; }
        // the pose of a card that enters at tIn and leaves at tOut (scene time)
        function life(t, tIn, tOut, oi = {}, oo = {}) {
          let P = t < tIn ? Object.assign({}, still, { a: 0 }) : enter(t - tIn, oi);
          if (tOut != null && t > tOut) P = combine(P, leave(t - tOut, oo));
          return P;
        }
        function apply(g, cx, cy, P) {
          g.translate(cx + P.dx, cy + P.dy); g.rotate(P.rot);
          // a 3D tilt approximated in 2D: turning about the vertical axis narrows and shears; pitching squashes
          const cy_ = Math.cos(clamp(P.yaw, -1.2, 1.2)), cp = Math.cos(clamp(P.pitch, -1.2, 1.2));
          g.transform(cy_, 0.18 * Math.sin(P.yaw), -0.1 * Math.sin(P.pitch), cp, 0, 0);
          g.scale(P.sc, P.sc); g.translate(-cx, -cy);
          g.globalAlpha *= clamp(P.a);
        }
        // a gentle float for resting objects
        const bob = (t, ph = 0, amp = 4) => amp * Math.sin(2 * Math.PI * t / 3.4 + ph);

        // ---- counters and labels
        function odometer(g, V, n, x, base, size, col, a) {
          font(g, size, false, 0);
          const dw = g.measureText("0").width * 1.02, top = base - size * 0.78, hh = size * 1.06;
          g.save(); g.beginPath(); g.rect(x - 4, top - size * 0.12, dw * n + 8, hh + size * 0.1); g.clip();
          for (let p = 0; p < n; p++) {
            const pw = Math.pow(10, p), lower = V % pw, carry = p === 0 ? V - Math.floor(V) : clamp(lower - (pw - 1));
            const d = Math.floor(V / pw) % 10, frac = carry;
            const cx = x + (n - 1 - p) * dw + dw / 2, lead = V < pw && p > 0;
            g.fillStyle = col; g.globalAlpha = a * (lead ? 0.22 : 1); g.textAlign = "center";
            g.fillText(String(d), cx, base - frac * hh);
            g.fillText(String((d + 1) % 10), cx, base + (1 - frac) * hh);
          }
          g.restore();
          return dw * n;
        }
        // a number that counts to its target: v the current value, d decimals; digits keep their width (tabular)
        function count(g, v, d, x, y, o = {}) {
          const s = (v < 0 || o.neg ? MINUS : (o.plus ? "+" : "")) + Math.abs(v).toFixed(d) + (o.unit || "");
          g.save(); font(g, o.size || 100, o.mono, o.ls ?? -1); g.fillStyle = o.c || C.ink; g.globalAlpha *= o.a ?? 1;
          g.textBaseline = "alphabetic";
          const dw = g.measureText("0").width;
          const widthOf = (ch) => (/[0-9]/.test(ch) ? dw : g.measureText(ch).width);
          let W = 0; for (const ch of s) W += widthOf(ch);
          let px = o.align === "right" ? x - W : o.align === "center" ? x - W / 2 : x;
          for (const ch of s) { const cw = widthOf(ch); g.textAlign = "center"; g.fillText(ch, px + cw / 2, y); px += cw; }
          g.restore();
          return W;
        }

        // ---- a pill chip with an optional badge, popping in
        function chip(g, s, x, y, o = {}) {
          if ((o.k ?? 1) <= 0) return 0;
          const size = o.size || 30, padX = o.padX ?? 22, bw = o.badge ? size * 1.25 : 0;
          const w = tw(g, s, size, o.mono, o.ls) + 2 * padX + (bw ? bw + 10 : 0), h = o.h || size * 1.75;
          const k = o.k ?? 1, sc = lerp(0.5, 1, back(k, 2.4)), a = clamp(k * 3);
          const ax = o.align === "center" ? x - w / 2 : o.align === "right" ? x - w : x;
          g.save(); g.globalAlpha *= a * (o.a ?? 1); g.translate(ax + w / 2, y); g.rotate(o.rot || 0); g.scale(sc, sc); g.translate(-(ax + w / 2), -y);
          card(g, ax, y - h / 2, w, h, { r: o.r ?? h / 2, fill: o.fill || C.white, shadow: o.shadow || "rgba(52,40,14,0.2)", blur: o.blur ?? 18, dy: o.sdy ?? 7, stroke: o.stroke });
          let tx = ax + padX;
          if (o.badge) {
            g.beginPath(); g.arc(tx + bw / 2 - 4, y, bw / 2, 0, Math.PI * 2); g.fillStyle = o.badgeFill || C.blue; g.fill();
            text(g, o.badge, tx + bw / 2 - 4, y + size * 0.36, { size: o.badgeSize || size * 0.82, c: o.badgeCol || C.white, align: "center", mono: o.badgeMono });
            tx += bw + 10;
          }
          text(g, s, tx, y + size * (o.mono ? 0.34 : 0.36), { size, c: o.col || C.ink, mono: o.mono, ls: o.ls });
          g.restore();
          return w;
        }
        // a label tag for data provenance: REAL DATA / SIMULATED / ILLUSTRATIVE, mono, with a coloured dot
        function prov(g, s, x, y, o = {}) {
          const size = o.size || 26, col = o.col || C.blue, w = tw(g, s, size, true, 1.5) + 58, h = size * 1.7;
          const ax = o.align === "right" ? x - w : o.align === "center" ? x - w / 2 : x;
          g.save(); g.globalAlpha *= o.a ?? 1;
          rr(g, ax, y - h / 2, w, h, h / 2); g.fillStyle = o.fill || rgba(col, 0.1); g.fill();
          g.strokeStyle = rgba(col, 0.55); g.lineWidth = 2; g.stroke();
          g.beginPath(); g.arc(ax + 24, y, 7, 0, Math.PI * 2); g.fillStyle = col; g.fill();
          text(g, s, ax + 42, y + size * 0.34, { size, mono: true, ls: 1.5, c: o.tc || C.ink });
          g.restore();
          return w;
        }

        // ---- a rubber stamp that slams down (u: seconds since the slam starts)
        function stamp(g, s, x, y, o = {}) {
          const u = o.u ?? 1; if (u <= 0) return;
          const size = o.size || 70, col = o.col || C.blue, ls = o.ls ?? 6;
          const w = tw(g, s, size, false, ls) + 64, h = size * 1.5;
          const sc = u < 0.12 ? lerp(2.1, 1, ei(u / 0.12)) : 1 + 0.07 * Math.exp(-(u - 0.12) * 16) * Math.sin((u - 0.12) * 46);
          g.save(); g.globalAlpha *= clamp(u / 0.05) * (o.a ?? 1);
          g.translate(x, y); g.rotate(o.rot ?? -0.2); g.scale(sc, sc);

          g.fillStyle = o.ground || C.white;

        // ---- the arrow cursor (tip at x, y), pressing (p 0..1) and the click ripple (r: seconds since the click)
        function cursor(g, x, y, o = {}) {

          if (o.r != null && o.r > 0 && o.r < 0.5) { const q = o.r / 0.5; g.save(); g.strokeStyle = rgba(C.blue, 0.7 * (1 - q)); g.lineWidth = 5;

          g.shadowColor = "transparent"; g.lineWidth = 3; g.lineJoin = "round"; g.strokeStyle = C.ink; g.stroke();
          g.restore();
        }
        // a cursor path: glides between waypoints [[t, x, y], ...] with an ease; clicks [t, ...] press it
        function cursorAt(t, pts, clicks = []) {
          let x = pts[0][1], y = pts[0][2];
          for (let i = 1; i < pts.length; i++) {
            const [t1, x1, y1] = pts[i], [t0, x0, y0] = pts[i - 1];

        function check(g, x, y, s, col, lw) {
          g.save(); g.strokeStyle = col; g.lineWidth = lw || s * 0.18; g.lineCap = "round"; g.lineJoin = "round";

        }

          g.save(); g.beginPath(); g.moveTo(x - s * 0.34, y - s * 0.5); g.lineTo(x + s * 0.34, y - s * 0.5); g.lineTo(x + s * 0.34, y + s * 0.5);
          g.lineTo(x, y + s * 0.22); g.lineTo(x - s * 0.34, y + s * 0.5); g.closePath(); g.lineJoin = "round";
          if (fill) { g.fillStyle = fill; g.fill(); }

        // ---- chrome pipes: a polyline drawn as a glossy tube; flow (0..1 of its length) fills it with brand-blue light
        function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }

        // ---- the glossy dial (gauge): chrome bezel, white face, a brand-blue value arc, ticks, needle, hub, and a

        function gauge(g, cx, cy, R, o = {}) {
          const max = o.max ?? 40, a0 = 0.75 * Math.PI, sweep = 1.5 * Math.PI;

        // ---- split-flap digits: a cell shows char `cur`, flipping from `prev` (f 0..1)

        // ---- an option ticket: a blue band, side notches and a perforation, the strike big, and a σ field of split-flap

        // ---- the tear-off calendar page: binding, a red month band, the day big, the weekday and the year. Drawn at a

          }

          // the year, with its highlighter sweep

        // ---- charts (bold): a plot frame maps data to px
        function frame(x, y, w, h, xr, yr) {
          return { x, y, w, h, xr, yr,
            X: (v) => x + (v - xr[0]) / (xr[1] - xr[0]) * w,

        // axes: o = { xt, yt, xf, yf, xl, yl, k (draw-in), a, size, grid, col }
        function axes(g, Fr, o = {}) {

          });
          if (!o.noY) (o.yt || []).forEach((v, i) => {

      // ---- bg: warm paper with a faint grid and a soft light behind the hero. The brand-blue colour blocks (s2 the
      // question, s6 "But it did.", s12 the answer) rise from the bottom in 0.2 s and drop away the same way.
      const g = document.getElementById("bg-cv").getContext("2d");
      const { C, clamp, eo } = K;
      const st = { t: 0 };
      const isB = (k) => THEME[k] === "B";
      function ground(blue, y0, y1, t) {

        g.save(); g.beginPath(); g.rect(0, y0, 1080, y1 - y0); g.clip();
        g.fillStyle = blue ? C.blue : C.paper; g.fillRect(0, y0, 1080, y1 - y0);
        // the soft light behind the hero
        const rg = g.createRadialGradient(540, 1060, 60, 540, 1060, 900);
        rg.addColorStop(0, blue ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.66)"); rg.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = rg; g.fillRect(0, y0, 1080, y1 - y0);
        // the grid drifts up very slowly
        const off = (t * 5) % 54;
        g.strokeStyle = blue ? "rgba(255,255,255,0.09)" : "rgba(13,21,38,0.058)"; g.lineWidth = 1.5; g.beginPath();
        for (let x = 18; x < 1080; x += 54) { g.moveTo(x, y0); g.lineTo(x, y1); }
        for (let y = 12 - off; y < 1974; y += 54) if (y >= y0 - 2 && y <= y1 + 2) { g.moveTo(0, y); g.lineTo(1080, y); }

        g.setTransform(1, 0, 0, 1, 0, 0);
        const cur = isB(k), prev = k > 0 ? isB(k - 1) : cur;
        if (cur !== prev && u < 1) {               // the new ground rises from the bottom

          ground(prev, 0, Math.ceil(yb), t); ground(cur, Math.floor(yb), 1920, t);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
