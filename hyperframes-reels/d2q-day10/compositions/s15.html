      // the formula board and the paid label arrive with the set; the moved label pops as its column grows
      tl.fromTo("#s15-fw", { opacity: 0, scale: 0.5, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.7)" }, 0.2);
      pop("#s15-lbp", 0.32, 0.36);
      pop("#s15-lbm", TG + 0.06, 0.36);
      // "moves": move² lights blue with the moved column
      tl.fromTo("#s15-mvc", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, TG);
      tl.fromTo("#s15-mvt", { color: "#0b1b3a" }, { color: "#ffffff", duration: 0.08 }, TG + 0.03);
      hop("#s15-mv", TG + 0.2, 12, 1);
      // "volatility you paid": σ²/252 lights sky with the paid column, the paid label hops on "paid"
      tl.fromTo("#s15-sgc", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, TV);
      hop("#s15-sg", TV + 0.16, 12, 1);
      hop("#s15-lbph", TP, 14, 0.86);
      // "more": MOVED > PAID pops; "volatility": the +₹3,964 footnote; "for,": the WIN stamp thumps on (the tile cascade
      // covers this cut's last 0.3 s, so the stamp lands half a second before "win."); "win.": confetti and the moved label hops
      pop("#s15-win", TM + 0.08, 0.36);
      tl.fromTo("#s15-ft", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" }, TV);
      tl.fromTo("#s15-wst", { opacity: 0, scale: 2.2, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "power3.in" }, TS - 0.16);
      tl.fromTo("#s15-wsth", { scaleY: 0.78, scaleX: 1.12 }, { scaleY: 1, scaleX: 1, duration: 0.26, ease: "back.out(3)", immediateRender: false }, TS);
      hop("#s15-winh", TS + 0.02, 10, 0.9);
      tl.fromTo("#s15-sc", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.5);
      hop("#s15-lbmh", TW - 0.08, 14, 0.86);

      const bob = document.getElementById("s15-bob");
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * st.t) / 3)).toFixed(2) + "px)"; draw(); } }, 0);
      draw();
      window.__timelines["s15"] = tl;
    })();
  </script>
