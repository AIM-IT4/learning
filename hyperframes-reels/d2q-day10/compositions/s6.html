        pf.style.opacity = clamp((pr - 0.55) / 0.3, 0, 1).toFixed(3);
        pf.style.transform = K.faceMatrix(P(xr, STP.y + STP.d, hf), P(xr, STP.y, hf), P(xr, STP.y + STP.d, hf - H98), PFW, PFH);
        // the STOCK 100 block: hops on "stock"
        const zb = hop(t, tHop, 0.34, 0.8);
        const bz = squash(t, tHop + 0.34, 0.14, 0.4), bx = 1 + (1 - bz) * 0.5;
        K.shadow(STK.x, STK.y, 0, STK.w, STK.d, 0.22 * clamp(1 - zb / 8, 0.25, 1));
        sbox(STK, zb, STK.h * bz, bx, MAT.navy);
        const wq = STK.w * bx, x0 = STK.x + (STK.w - wq) / 2, yf = STK.y + (STK.d + STK.d * bx) / 2;
        sf.style.transform = K.faceMatrix(P(x0, yf, zb + STK.h * bz), P(x0 + wq, yf, zb + STK.h * bz), P(x0, yf, zb), SFW, SFH);
        // the P&L columns grow with an overshoot; their boards ride on the tops; NET and its ghost hop on "ways."
        const jN = hop(t, tJ, 0.28, 0.5), jG = hop(t, tJ + 0.1, 0.28, 0.5);
        COLS.forEach((c, k) => {
          const [t0, t1] = grow[k], p = (t - t0) / (t1 - t0), H = c.v * SCALE, h = p <= 0 ? 0 : H * backOut(p, 1.8);
          const z = k === 2 ? jN : 0;
          if (h > 0.004) {
            K.shadow(c.c[0] - CW / 2, c.c[1] - CW / 2, 0, CW, CW, 0.18);
            K.box(c.c[0] - CW / 2, c.c[1] - CW / 2, z, CW, CW, h, c.mat);
          }
          const a = P(c.c[0], c.c[1], Math.max(h, H) + 0.3 + z);
          anc[k].style.left = a[0].toFixed(1) + "px"; anc[k].style.top = a[1].toFixed(1) + "px";
        });
        // the ghost: the +2% day's net, faint, beside this one (drawn last: it stands in front)
        const gA = clamp((t - tG) / 0.3, 0, 1);
        if (gA > 0) {
          const H = GHOST.v * SCALE * backOut(gA, 2), x = GHOST.c[0] - CW / 2, y = GHOST.c[1] - CW / 2;
          g.save(); g.globalAlpha = 0.8 * gA; K.box(x, y, jG, CW, CW, H, { top: "#c7dcfd", left: "#93c5fd", right: "#7fb0ff" }, null); g.restore();
          dashedTile(x, y, jG, CW, H, 0.95 * gA);
        }
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      draw(0);
      window.__timelines["s6"] = tl;
    })();
  </script>
