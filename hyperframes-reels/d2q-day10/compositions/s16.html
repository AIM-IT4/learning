  <script>
    (function () {
      /*DATA*/ const DUR = 7.86; const W = [0.16, 0.6, 0.96, 1.16, 1.36, 1.58, 1.74, 1.88, 2.1, 2.42, 2.64, 3.08, 3.48, 3.8, 4.06, 4.2, 4.36, 4.64, 5.28, 5.44, 5.58]; /*END*/
      // words: 0 Comment 1 GREEKS, 2 and 3 we'll 4 DM 5 you 6 the 7 free 8 Greeks 9 Cheat 10 Sheet. 11 Save 12 this, 13 share 14 it, 15 and 16 follow 17 Desk2Quant 18 for 19 Day 20 11.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.27);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

      // the phone screen face, measured on the plate (frame px): far corner = the screen's top-left, right corner = top-right, left corner = bottom-left
      function mapTo(el, w0, h0, TL, TR, BL) {
        const m = [(TR[0] - TL[0]) / w0, (TR[1] - TL[1]) / w0, (BL[0] - TL[0]) / h0, (BL[1] - TL[1]) / h0, TL[0], TL[1]];
        el.style.transform = "matrix(" + m.map((v) => v.toFixed(5)).join(",") + ")";
      }
      mapTo(document.getElementById("s16-scr"), 420, 828, [635.3, 954.1], [817.1, 1054.8], [277.2, 1152.7]);

      const tl = gsap.timeline({ paused: true });
      // entrance under the tile cascade: settle in from 1.1, then the slow push
      tl.fromTo("#s16-flip", { scale: 1.1, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#s16-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);
      const pop = (sel, t, d, s0) => tl.fromTo(sel, { opacity: 0, scale: s0 || 0.3, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.42, ease: "back.out(2.8)" }, t);

      // "Comment GREEKS": the letters type into the comment box (drawn below), then the send button is tapped
      const TY0 = w(0) + 0.14, TYG = clamp((w(1) + 0.15 - TY0) / 6, 0.06, 0.12);
      const TAP = Math.max(TY0 + 6 * TYG + 0.08, w(2) - 0.1);
      tl.fromTo("#s16-sb", { scale: 1 }, { scale: 0.78, duration: 0.07, ease: "power2.in" }, TAP);
      tl.fromTo("#s16-sb", { scale: 0.78 }, { scale: 1, duration: 0.36, ease: "back.out(3)", immediateRender: false }, TAP + 0.07);
      // the comment lands in the thread
      tl.fromTo("#s16-ub", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.8)" }, TAP + 0.1);
      // "DM": the reply arrives on the phone, with the real cover, and pops up out of it as a big bubble
      const DM = w(4) - 0.06;
      tl.fromTo("#s16-db", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.8)" }, DM);
      tl.fromTo("#s16-dcv", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.8)" }, DM + 0.12);
      tl.fromTo("#s16-dm", { opacity: 0, scale: 0.2, y: 190 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, DM + 0.04);
      // "Greeks Cheat Sheet": the cover hops
      tl.fromTo("#s16-fcv", { y: 0 }, { y: -20, duration: 0.12, ease: "power2.out", immediateRender: false }, w(9) - 0.02);
      tl.fromTo("#s16-fcv", { y: -20 }, { y: 0, duration: 0.13, ease: "power2.in", immediateRender: false }, w(9) + 0.1);
      tl.fromTo("#s16-fcv", { scaleY: 0.86, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, w(9) + 0.23);
      // "Save", "share", "follow": the three pills pop in turn
      pop("#s16-p1", w(11) - 0.06);
      pop("#s16-p2", w(13) - 0.06);
      pop("#s16-p3", w(16) - 0.06);
      // "Desk2Quant": the profile board rises up onto the platform and lands with a squash
      tl.fromTo("#s16-pro", { opacity: 0, scale: 0.3, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.46, ease: "back.out(2.4)" }, w(17) - 0.06);
      // "Day 11.": the sticker slaps down onto the board's corner
      tl.fromTo("#s16-day", { opacity: 0, scale: 1.7, y: -90 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "power3.in" }, w(19) - 0.08);
      tl.fromTo("#s16-dayh", { scaleY: 0.78, scaleX: 1.12 }, { scaleY: 1, scaleX: 1, duration: 0.36, ease: "back.out(3)", immediateRender: false }, w(19) + 0.14);
      // the profile board takes the hit
      tl.fromTo("#s16-pro .s16-hop", { y: 0 }, { y: 7, duration: 0.06, ease: "power2.out", immediateRender: false }, w(19) + 0.14);
      tl.fromTo("#s16-pro .s16-hop", { y: 7 }, { y: 0, duration: 0.3, ease: "back.out(3)", immediateRender: false }, w(19) + 0.2);

      // continuous layer: the diorama bob, typing, placeholder and caret
      const bob = document.getElementById("s16-bob");
      const letters = Array.from(document.querySelectorAll("#s16-ty span"));
      const ph = document.getElementById("s16-ph"), car = document.getElementById("s16-car");
      function frame(t) {
        bob.style.transform = "translateY(" + (-8 * Math.sin((t / 3) * Math.PI * 2)).toFixed(2) + "px)";
        const sent = t >= TAP + 0.08;
        let n = 0;
        letters.forEach((s, k) => { const on = !sent && t >= TY0 + k * TYG; s.style.display = on ? "inline" : "none"; if (on) n++; });
        ph.style.opacity = n > 0 ? "0" : "1";
        const typing = t >= TY0 - 0.05 && t < TY0 + 6 * TYG + 0.05;
        car.style.opacity = sent ? "0" : (typing || Math.floor(t * 2.4) % 2 === 0 ? "1" : "0");
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => frame(st.t) }, 0);
      frame(0);
      window.__timelines["s16"] = tl;
    })();
