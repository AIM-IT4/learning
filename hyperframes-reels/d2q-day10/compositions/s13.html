        for (let k = 0; k <= n; k++) { const d = Math.min(dh, k); pts.push(P((d / 252) * LX, R.y, zOf(valAt(R.a, d)))); }
        pts.push(P((dh / 252) * LX, R.y, Z0));
        K.poly(pts, R.cur, null);
        g.strokeStyle = R.band; g.lineWidth = 2.5;
        const vh = valAt(R.a, dh);
        for (let lev = 1; lev <= 3; lev++) {
          if (Math.abs(vh) < lev * PER) break;
          const L = Math.sign(vh) * lev * PER;
          let dc = 0; while (dc < 251 && Math.abs(R.a[dc + 1]) < lev * PER) dc++;
          const f = (lev * PER - Math.abs(R.a[dc])) / (Math.abs(R.a[dc + 1]) - Math.abs(R.a[dc]));
          const a = P(((dc + f) / 252) * LX, R.y, zOf(L)), b = P((dh / 252) * LX, R.y, zOf(L));
          g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
        }
      }
      function segs(R, dh, list) {
        if (dh <= 0) return;
        for (let d = 0; d < dh; d += 4) list.push({ k: (d / 252) * LX + R.y, R, d0: d, d1: Math.min(dh, d + 4) });
      }
      function drawSeg(s) {
        const R = s.R, y0 = R.y - RY, y1 = R.y + RY, [lo, hi] = thick(R);
        const xa = (s.d0 / 252) * LX, xb = (s.d1 / 252) * LX;
        const za = zOf(valAt(R.a, s.d0)), zb = zOf(valAt(R.a, s.d1));
        quad(P(xa, y1, za + lo), P(xb, y1, zb + lo), P(xb, y1, zb + hi), P(xa, y1, za + hi), R.mat.left, R.mat.left, 1);
        quad(P(xa, y0, za + hi), P(xb, y0, zb + hi), P(xb, y1, zb + hi), P(xa, y1, za + hi), R.mat.top, R.mat.top, 1);
      }
      function cap(R, dh) {
        if (dh <= 0) return;
        const x = (dh / 252) * LX, z = zOf(valAt(R.a, dh)), [lo, hi] = thick(R);
        quad(P(x, R.y - RY, z + lo), P(x, R.y + RY, z + lo), P(x, R.y + RY, z + hi), P(x, R.y - RY, z + hi), R.mat.right, "rgba(15,35,90,0.2)", 1.2);
        // a white edge along the rail's top front, for the toy look
        const n = Math.max(1, Math.ceil(dh / 3));
        g.strokeStyle = "rgba(255,255,255,0.7)"; g.lineWidth = 2; g.beginPath();
        for (let k = 0; k <= n; k++) { const d = Math.min(dh, k * 3), q = P((d / 252) * LX, R.y + RY, zOf(valAt(R.a, d)) + hi); k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }
        g.stroke();
      }
      function glass(lift) {
        const z = Z0 + lift;
        quad(P(GX0, GY1, z - GT), P(GX1, GY1, z - GT), P(GX1, GY1, z), P(GX0, GY1, z), "rgba(147,197,253,0.75)", null);
        quad(P(GX1, GY0, z - GT), P(GX1, GY1, z - GT), P(GX1, GY1, z), P(GX1, GY0, z), "rgba(96,165,250,0.75)", null);
        quad(P(GX0, GY0, z), P(GX1, GY0, z), P(GX1, GY1, z), P(GX0, GY1, z), "rgba(219,234,254,0.62)", "rgba(255,255,255,1)", 3);
        // quarter lines across the plane (days 63, 126, 189) and the three lane tracks
        g.strokeStyle = "rgba(37,99,235,0.16)"; g.lineWidth = 2; g.beginPath();
        for (let q = 1; q <= 3; q++) { const a = P((LX * q) / 4, GY0, z), b = P((LX * q) / 4, GY1, z); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
        [RIB.r30, RIB.r20, RIB.r10].forEach((R) => {
          const a = P(0, R.y - RY, z), b = P(LX, R.y - RY, z), c = P(0, R.y + RY, z), d = P(LX, R.y + RY, z);
          g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.moveTo(c[0], c[1]); g.lineTo(d[0], d[1]);
        });
        g.stroke();
      }
      // the two back walls the glass rests on (a room corner, like the dioramas)
      function walls() {
        const hw = Z0 - GT, TR = 0.22;
        K.box(X0 + WT, Y0 + WT, 0, X1 - 0.12 - X0 - WT, Y1 - 0.12 - Y0 - WT, 0.05, { top: "#f8e1c0", left: "#e9bd8f", right: "#d6a271" });
        K.box(X0, Y0, 0, X1 - X0, WT, hw - TR, MAT.white); K.box(X0, Y0, hw - TR, X1 - X0, WT, TR, MAT.blue);
        K.box(X0, Y0 + WT, 0, WT, GY1 - Y0 - WT, hw - TR, MAT.white); K.box(X0, Y0 + WT, hw - TR, WT, GY1 - Y0 - WT, TR, MAT.blue);
      }
      // x-axis ticks on the platform's front face: day 0, 63, 126, 189, 252
      function ticks() {
        g.strokeStyle = "#2563eb"; g.lineWidth = 3; g.lineCap = "round"; g.beginPath();
        for (let q = 0; q <= 4; q++) { const a = P((LX * q) / 4, Y1, -0.06), b = P((LX * q) / 4, Y1, q % 4 ? -0.3 : -0.44); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
        g.stroke(); g.lineCap = "butt";
      }
      // dotted leaders from each finished path's end to its signboard
      function leader(R, t, id) {
        const k = clamp((t - R.t[1]) / 0.18, 0, 1);
        if (k <= 0) return;
        const e = document.getElementById(id), a = P(LX, R.y, zOf(R.a[252]));
        const bx = parseFloat(e.style.left) - 8, by = parseFloat(e.style.top) + 62;
        g.save(); g.globalAlpha = k; g.strokeStyle = R.lead; g.lineWidth = 6; g.lineCap = "round"; g.setLineDash([0.1, 13]);
        g.beginPath(); g.moveTo(a[0] + 12, a[1]); g.lineTo(a[0] + 12 + (bx - a[0] - 12) * k, a[1] + (by - a[1]) * k); g.stroke(); g.restore();
      }

      const st = { t: 0 };
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        K.shadow(X0, Y0, -1.7, X1 - X0, Y1 - Y0, 0.2);
        K.platform(X0, Y0, X1 - X0, Y1 - Y0);
        ticks();
        const lift = glassLift(t);
        const d20 = headDay(RIB.r20, t), d30 = headDay(RIB.r30, t), d10 = headDay(RIB.r10, t);
        // below the glass: the back walls, the 10% curtain and rail
        K.shadow(0, 0.6, 0, GX1 - 0.4, GY1 - 0.6, 0.1);
        walls();
        curtain(RIB.r10, d10);
        const below = []; segs(RIB.r10, d10, below);
        below.forEach(drawSeg); cap(RIB.r10, d10);
        // the glass zero plane
        glass(lift);
        // above the glass: the 30% curtain, then the rails of 30% and 20% in painter's order
        curtain(RIB.r30, d30);
        const above = []; segs(RIB.r30, d30, above); segs(RIB.r20, d20, above);
        above.sort((a, b) => a.k - b.k);
        above.forEach(drawSeg);
        cap(RIB.r30, d30); cap(RIB.r20, d20);
        leader(RIB.r20, t, "s13-e20"); leader(RIB.r30, t, "s13-e30"); leader(RIB.r10, t, "s13-e10");
        // the live readouts on the end signboards
        roll(RIB.r20, d20, "s13-v20"); roll(RIB.r30, d30, "s13-v30"); roll(RIB.r10, d10, "s13-v10");
      }
      const fmt = (v) => { const r = Math.round(v), n = String(Math.abs(r)); return (r > 0 ? "+" : r < 0 ? "−" : "") + "₹" + (n.length > 3 ? n.slice(0, -3) + "," + n.slice(-3) : n); };
      const LAST = {};
      function roll(R, dh, id) {
        const s = fmt(valAt(R.a, dh));
        if (LAST[id] !== s) { document.getElementById(id).textContent = s; LAST[id] = s; }
      }

      // ---- the signboards at the ends of the lanes (frame px from the projection), the axis tags, the plaque
      const at = (id, p, dx, dy) => { const e = document.getElementById(id); e.style.left = (p[0] + dx).toFixed(1) + "px"; e.style.top = (p[1] + dy).toFixed(1) + "px"; };
      at("s13-e30", P(LX, RIB.r30.y, zOf(M30[252])), 40, -66);
      at("s13-e20", P(LX, RIB.r20.y, zOf(M20[252])), 52, -40);
      at("s13-e10", P(LX, RIB.r10.y, zOf(M10[252])), 52, -54);
      at("s13-ax0", P(0, Y1, -1.5), -56, 12);
      at("s13-ax1", P(LX, Y1, -1.5), -70, 12);
      at("s13-axz", P(GX0, GY1, Z0), -150, -30);

      // ---- camera: the cube flip in and out, slow push; the bob lives in the proxy tween
      tl.fromTo("#s13-flip", { rotationY: -90, scale: 0.94 }, { rotationY: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo("#s13-flip", { rotationY: 0 }, { rotationY: 90, duration: 0.26, ease: "power2.in", immediateRender: false }, DUR - 0.26);
      tl.fromTo("#s13-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);

      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.4, ease: "back.out(2.8)" }, t);
      const land = (sel, t) => {
        tl.fromTo(sel, { y: 0 }, { y: -16, duration: 0.11, ease: "power2.out", immediateRender: false }, t - 0.2);
        tl.fromTo(sel, { y: -16 }, { y: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, t - 0.09);
        tl.fromTo(sel, { scaleY: 0.82, scaleX: 1.12 }, { scaleY: 1, scaleX: 1, duration: 0.32, ease: "back.out(3)", immediateRender: false }, t + 0.03);
      };
      pop("#s13-plq", 0.3);
      tl.fromTo(".s13-ax", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.06 }, 0.72);
      // 20%: draws on from "20%", lands "+₹10" on "zero."; 30%: lands "+₹3,964" on "profit."; 10%: lands "−₹3,958" on "lose."
      pop("#s13-e20", T20[0]);
      land("#s13-h20", w(12));
      pop("#s13-e30", T30[0] - 0.02);
      land("#s13-h30", w(16));
      pop("#s13-e10", T10[0] - 0.02);
      land("#s13-h10", w(20));

      const bob = document.getElementById("s13-bob");
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * st.t) / 3)).toFixed(2) + "px)"; draw(); } }, 0);
      draw();
      window.__timelines["s13"] = tl;
    })();
  </script>
</template>
