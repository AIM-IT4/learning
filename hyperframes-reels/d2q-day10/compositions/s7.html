          const E2 = 0.26 * EXT, T2 = PLT * (1 - psq), lift = -pz * 48;
          const a1 = add(F(SA, HL(SA)), [0, 1], lift), a2 = add(F(SB, HL(SB)), [0, 1], lift);
          g.save(); g.shadowColor = "rgba(30,64,175,0.28)"; g.shadowBlur = 16; g.shadowOffsetY = 10;
          K.poly([add(a1, [0, 1], E2), add(a2, [0, 1], E2), add(a2, [0, 1], E2 + T2), add(a1, [0, 1], E2 + T2)], "#ffffff");
          g.restore();
          K.poly([a1, a2, add(a2, [0, 1], E2), add(a1, [0, 1], E2)], "#dbe5f7", "#9fb6e3", 2);                        // top side
          K.poly([add(a1, [0, 1], E2), add(a2, [0, 1], E2), add(a2, [0, 1], E2 + T2), add(a1, [0, 1], E2 + T2)], "#ffffff", "#9fb6e3", 2.5);
          // the label printed on the plank's face
          const s2w = 330 / (0.2425 * 58.79), s1 = 100 - s2w / 2, s2 = 100 + s2w / 2;
          const b1 = add(add(F(s1, HL(s1)), [0, 1], lift), [0, 1], E2), b2 = add(add(F(s2, HL(s2)), [0, 1], lift), [0, 1], E2);
          els.pl.style.transform = K.faceMatrix(b1, b2, add(b1, [0, 1], T2), 330, 34);
          els.pl.style.opacity = String(prog(t, tP0, 0.08));
          g.restore();
        } else els.pl.style.opacity = "0";

        // the call price ribbon (blue), extruded out of the board, drawing on from 80 to 120
        const pR = sine(prog(t, tR0, tR1 - tR0));
        if (pR > 0) {
          const Send = 80 + 40 * pR, pts = [];
          for (let S = 80; S < Send; S += 0.25) pts.push(F(S, Cof(S)));
          pts.push(F(Send, Cof(Send)));
          if (pts.length > 1) {
            const n = normals(pts), E1 = 0.42 * EXT, hw = 8;
            g.save(); g.shadowColor = "rgba(30,64,175,0.3)"; g.shadowBlur = 14; g.shadowOffsetY = 10;
            band(pts, n, hw, -hw, E1, E1, "#2563eb"); g.restore();
            band(pts, n, hw, hw, 0, E1, "#93c5fd");             // top side (faces up)
            band(pts, n, hw, -hw, E1, E1, "#2563eb");           // front face
            const e = pts[pts.length - 1];                        // a round cap where it is drawing
            g.fillStyle = "#3b82f6"; g.beginPath(); g.arc(e[0], e[1] + E1 * 0.5, hw + 3, 0, 6.2832); g.fill();
          }
        }

        // markers left on the curve where delta was read (102, 98), with leaders to their signboards
        const m1 = prog(t, w(15) - 0.08, 0.2), m2 = prog(t, w(20) - 0.06, 0.2);
        const mk = (S, a, to) => {
          if (a <= 0) return;
          const p = add(F(S, Cof(S)), [0, 1], 0.21 * EXT);
          g.save(); g.globalAlpha = a; line([p, to], "#1e3a8a", 2.5, [6, 6]);
          g.fillStyle = "#f59e0b"; g.strokeStyle = "#ffffff"; g.lineWidth = 3;
          g.beginPath(); g.arc(p[0], p[1], 8, 0, 6.2832); g.fill(); g.stroke(); g.restore();
        };
        const D1 = [752, 892], D2 = [352, 812], G3 = [500, 712];         // signboard top-centres
        mk(102, m1, [D1[0] - 86, D1[1] + 22]);
        mk(98, m2, [D2[0] + 86, D2[1] + 46]);

        // the bend bracket between 96 and 104, on "bend"
        const bp = prog(t, tBr, 0.32);
        if (bp > 0) {
          const pts = [];
          for (let S = 96; S <= 104 + 1e-6; S += 0.25) pts.push(F(S, Cof(S)));
          const n = normals(pts), off = pts.map((p, i) => add(p, n[i], 30));
          const k = Math.max(2, Math.round(off.length * bp));
          line(off.slice(0, k), "#2563eb", 6);
          if (bp >= 1) {
            line([off[0], add(pts[0], n[0], 14)], "#2563eb", 6);
            line([off[off.length - 1], add(pts[pts.length - 1], n[n.length - 1], 14)], "#2563eb", 6);
            const mid = off[Math.floor(off.length / 2)], mn = n[Math.floor(off.length / 2)];
            line([mid, add(mid, mn, 12)], "#2563eb", 6);
          }
          const gs = prog(t, tG, 0.2);
          if (gs > 0) { const mid = off[Math.floor(off.length / 2)]; g.save(); g.globalAlpha = gs; line([add(mid, [0, -1], 12), [G3[0] + 20, G3[1] + 80]], "#2563eb", 5); g.restore(); }
        }

        // the gold ball and its tangent stick
        if (t >= tBall) {
          const S = ballS(t), C = Cof(S);
          const pts = [F(S - 0.25, Cof(S - 0.25)), F(S, C), F(S + 0.25, Cof(S + 0.25))], n = normals(pts)[1];
          const contact = add(add(F(S, C), n, 8), [0, 1], 0.21 * EXT);
          // the tangent stick: slope = delta at S
          const st = prog(t, tBallL, 0.25);
          if (st > 0) {
            const d = DEL(S), L = 9 * st;
            const pa = F(S - L, C - d * L), pb = F(S + L, C + d * L);
            const off = [contact[0] - F(S, C)[0], contact[1] - F(S, C)[1]];
            const A = add(pa, off, 1), B = add(pb, off, 1);
            line([A, B], "#d97706", 9); line([A, B], "#fbbf24", 5);
          }
          // drop in with bounces, then roll
          const r = 25;
          let lift = 0, sq = 0;
          if (t < tBallL) { const p = (t - tBall) / (tBallL - tBall); lift = 220 * (1 - p * p); }
          else if (t < tBallL + 0.24) { const p = (t - tBallL) / 0.24; lift = 60 * 4 * p * (1 - p); }
          else if (t < tBallL + 0.38) { const p = (t - tBallL - 0.24) / 0.14; lift = 14 * 4 * p * (1 - p); }
          if (t >= tBallL && t < tBallL + 0.1) sq = 0.22 * (1 - (t - tBallL) / 0.1);
          if (t >= tBallL + 0.24 && t < tBallL + 0.31) sq = 0.1 * (1 - (t - tBallL - 0.24) / 0.07);
          const roll = (S - 100) * 14.26 / r;   // px travelled / radius
          const c = add(add(contact, n, r), [0, -1], lift);
          ball(c, r, roll, sq);
        }

        // DOM labels ride with the board
        [80, 90, 100, 110, 120].forEach((S, i) => pin(els["k" + i], add(F(S, -5.5), [0, 1], 4)));
        pin(els.ty, add(BP(-QH + 0.45, 10.275, 0), [0, -16], 1));
        pin(els.tx, add(BP(0, 0.55, 0), [0, -33], 1));
        pin(els.p1, D1); pin(els.p2, D2); pin(els.p3, G3);
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      draw(0);

      // camera: enter under the tile cascade (scale + fade), slow push, cube flip out
      tl.fromTo("#s7-flip", { scale: 1.1, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#s7-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#s7-flip", { rotationY: 0 }, { rotationY: 90, duration: 0.26, ease: "power2.in", immediateRender: false }, DUR - 0.26);

      // axis labels
      ["#s7-k0", "#s7-k1", "#s7-k2", "#s7-k3", "#s7-k4"].forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.24, ease: "back.out(2.6)" }, 0.5 + i * 0.06);
      });
      tl.fromTo("#s7-ty", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "back.out(2.6)" }, w(3) - 0.06);
      // signboards
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.36, ease: "back.out(2.8)" }, t);
      const hop = (sel, t) => {
        tl.fromTo(sel, { y: 0 }, { y: -14, duration: 0.11, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { y: -14 }, { y: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, t + 0.11);
        tl.fromTo(sel, { scaleX: 1.07, scaleY: 0.86 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.23);
      };
      pop("#s7-d1", w(15) - 0.08); hop("#s7-d1", w(16));
      pop("#s7-d2", w(20) - 0.06); hop("#s7-d2", w(21));
      tl.fromTo("#s7-d3", { opacity: 0, scale: 0.25, rotation: -10 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "back.out(2.8)" }, tG);
      window.__timelines["s7"] = tl;
    })();
  </script>
</template>
