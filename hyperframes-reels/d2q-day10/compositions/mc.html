          g.strokeStyle = "#1e40af"; g.lineWidth = 2.6; g.beginPath(); g.ellipse(sd * 15 + 2, -7.5, 17, 8.5, 0, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
          g.strokeStyle = "#3b82f6"; g.lineWidth = 2.4; g.beginPath(); g.moveTo(sd * 15 - 6, -9); g.quadraticCurveTo(sd * 15 + 2, -12, sd * 15 + 10, -8); g.stroke();
        }
        // the hood bunched behind the neck, the neck, then the hoodie
        const hd = g.createLinearGradient(0, -122, 0, -98); hd.addColorStop(0, "#3b82f6"); hd.addColorStop(1, "#1e40af");

        g.fillStyle = "#c98a63"; g.beginPath(); g.ellipse(0, -104, 13, 8.5, 0, 0, Math.PI); g.fill();

        g.strokeStyle = "rgba(255,255,255,0.32)"; g.lineWidth = 2; g.beginPath(); g.moveTo(-22, -61); g.lineTo(22, -61); g.stroke();

      function drawTile(t) {
