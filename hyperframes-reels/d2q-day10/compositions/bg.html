<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #e7f0ff; }
    #bg-grad { position: absolute; inset: 0;
               background: radial-gradient(ellipse 85% 52% at 50% 64%, #ffffff 0%, #eef4ff 48%, #dbe8ff 78%, #cfdfff 100%); }
    #bg-floor { position: absolute; left: 90px; top: 1430px; width: 900px; height: 260px; border-radius: 50%;
                background: radial-gradient(ellipse at center, rgba(37,99,235,0.16) 0%, rgba(37,99,235,0.05) 50%, rgba(37,99,235,0) 72%); }
    #bg-cubes { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="bg" data-width="1080" data-height="1920">
    <div id="bg-grad"></div>
    <div id="bg-floor"></div>
    <canvas id="bg-cubes" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 84.0; const SHOTS = [[0.0, "L"], [1.86, "L"], [7.13, "L"], [14.03, "L"], [18.98, "L"], [25.88, "L"], [30.74, "L"], [39.13, "L"], [43.68, "L"], [46.98, "L"], [52.22, "L"], [56.18, "L"], [61.13, "L"], [67.53, "L"], [73.13, "L"], [76.14, "L"]]; /*END*/
      const tl = gsap.timeline({ paused: true });
      // small isometric cubes drifting up through the studio air: white tops, blue sides, slow spin of shade
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(410);
      const cubes = [];
      for (let i = 0; i < 30; i++) {
        const side = rnd() < 0.5 ? rnd() * 0.28 : 0.72 + rnd() * 0.28;          // mostly at the sides, a few in the middle
        const x = (rnd() < 0.8 ? side : 0.3 + rnd() * 0.4) * 1080;
        cubes.push({ x, y: rnd() * 2100, s: 10 + rnd() * 30, v: 6 + rnd() * 16, ph: rnd() * 6.283, a: 0.35 + rnd() * 0.5,
                     drift: 8 + rnd() * 18, blue: rnd() < 0.55 });
      }
      const g = document.getElementById("bg-cubes").getContext("2d");
      function cube(x, y, s, a, blue) {
        const h = s * 0.58;
        g.globalAlpha = a;
        g.fillStyle = blue ? "#93b4fb" : "#ffffff";                         // top
        g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + s, y); g.lineTo(x, y + h); g.lineTo(x - s, y); g.closePath(); g.fill();
        g.fillStyle = blue ? "#3b82f6" : "#c7d8f8";                         // left face
        g.beginPath(); g.moveTo(x - s, y); g.lineTo(x, y + h); g.lineTo(x, y + h + s * 1.05); g.lineTo(x - s, y + s * 1.05); g.closePath(); g.fill();
        g.fillStyle = blue ? "#2563eb" : "#aec6f2";                         // right face
        g.beginPath(); g.moveTo(x + s, y); g.lineTo(x, y + h); g.lineTo(x, y + h + s * 1.05); g.lineTo(x + s, y + s * 1.05); g.closePath(); g.fill();
        g.globalAlpha = 1;
      }
      const st = { t: 0 };
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        for (const c of cubes) {
          let y = (c.y - c.v * t) % 2100; if (y < -100) y += 2100;
          const x = c.x + Math.sin(t * 0.35 + c.ph) * c.drift;
          const mid = Math.abs(x - 540) < 260 && y > 560 && y < 1500 ? 0.35 : 1;  // quieter behind the dioramas
          cube(x, y - 100, c.s, c.a * mid, c.blue);
        }
      }
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      window.__timelines["bg"] = tl;
    })();
  </script>
</template>
