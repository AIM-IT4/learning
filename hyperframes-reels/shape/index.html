<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f7f7f3; }
      #root { position: relative; width: 100%; height: 100%; background: #f7f7f3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="shape" data-composition-id="shape" data-composition-src="compositions/shape.html" data-start="0" data-duration="20"
           data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="vo" class="clip" src="assets/vo.wav" data-start="0.3" data-track-index="2" data-volume="1"></audio>
      <audio id="bgm" class="clip" src="assets/bgm.wav" data-start="0" data-duration="20" data-track-index="3"
             data-timeline-role="music" data-volume="1" data-fade-in="0.2" data-fade-out="1.5"></audio>
      <audio id="sfx-enter" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.02" data-duration="0.57" data-track-index="4" data-volume="0.25"></audio>
      <audio id="sfx-click1" class="clip" src="assets/sfx/click.mp3" data-start="2.42" data-duration="0.36" data-track-index="5" data-volume="0.6"></audio>
      <audio id="sfx-click2" class="clip" src="assets/sfx/click.mp3" data-start="4.75" data-duration="0.36" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-done" class="clip" src="assets/sfx/chime.mp3" data-start="6.08" data-duration="1.4" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sfx-morph1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.0" data-duration="0.57" data-track-index="8" data-volume="0.25"></audio>
      <audio id="sfx-notif" class="clip" src="assets/sfx/notification.mp3" data-start="7.4" data-duration="1.2" data-track-index="9" data-volume="0.3"></audio>
      <audio id="sfx-click3" class="clip" src="assets/sfx/click.mp3" data-start="8.75" data-duration="0.36" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-play" class="clip" src="assets/sfx/click-soft.mp3" data-start="9.55" data-duration="0.36" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-morph2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.23" data-duration="0.57" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-grab" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.0" data-duration="0.36" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-recap" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="12.1" data-duration="1.4" data-track-index="14" data-volume="0.22"></audio>
      <audio id="sfx-icons" class="clip" src="assets/sfx/pop.mp3" data-start="14.16" data-duration="0.72" data-track-index="15" data-volume="0.35"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/sparkle.mp3" data-start="16.22" data-duration="1.6" data-track-index="16" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
