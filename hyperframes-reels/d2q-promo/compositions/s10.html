  <script>
    (function () {
      /*DATA*/ const DUR = 4.026; const W = [0.18, 0.56, 0.84, 1.0, 1.1, 1.734, 1.854, 2.094, 2.434, 2.674, 2.914, 3.194]; /*END*/
      // words: 0 Textbooks 1 teach 2 you 3 the 4 model. | 5 The 6 desk 7 teaches 8 you 9 what 10 breaks 11 it.
      const w = (i) => (W.length > i ? W[i] : 0.2 + i * 0.36);
      const FLIP = w(5) + 0.05;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s10-cam", { scale: 1, rotation: -1.4 }, { scale: 1.06, rotation: 1.4, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#s10-coin", { opacity: 0, y: 60, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.05);
      // the flip: squeeze to an edge with motion blur, swap the face, open again; the coin hops on the flip
      tl.fromTo("#s10-coin", { scaleX: 1, filter: "blur(0px)" }, { scaleX: 0.02, filter: "blur(6px)", duration: 0.13, ease: "power2.in", immediateRender: false }, FLIP);
      tl.fromTo("#s10-fa", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, FLIP + 0.13);
      tl.fromTo("#s10-fb", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, FLIP + 0.13);
      tl.fromTo("#s10-coin", { scaleX: 0.02, filter: "blur(6px)" }, { scaleX: 1, filter: "blur(0px)", duration: 0.17, ease: "power2.out", immediateRender: false }, FLIP + 0.14);
      tl.fromTo("#s10-bob", { y: 0 }, { y: -46, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, FLIP);

      // the hit on "breaks" (critic: the burst must land with the word): coin punch, glow flash, shockwave, chips fling out
      const HIT = w(10) - 0.02;
      tl.fromTo("#s10-bob", { scale: 1 }, { scale: 1.13, duration: 0.11, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, HIT);
      tl.fromTo("#s10-flash", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.05, duration: 0.12, ease: "power2.out", immediateRender: false }, HIT);
      tl.fromTo("#s10-flash", { opacity: 1 }, { opacity: 0.35, duration: 0.7, ease: "power2.in", immediateRender: false }, HIT + 0.14);
      tl.fromTo("#s10-ring", { opacity: 0.85, scale: 0.92 }, { opacity: 0, scale: 1.9, duration: 0.65, ease: "power2.out", immediateRender: false }, HIT);
      // desk chips burst out of the coin and orbit it (front half over the coin, back half behind)
      const CHIPS = [["g", "Δ", 74], ["p", "P&L", 172], ["g", "Γ", 74], ["p", "VaR", 172], ["g", "ν", 74], ["p", "XVA", 172], ["g", "Θ", 74], ["p", "Model risk", 268]];
      const front = document.getElementById("s10-front"), back = document.getElementById("s10-back"), bob = document.getElementById("s10-bob");
      const els = CHIPS.map(([k, label, wd]) => {
        const c = document.createElement("div"); c.className = "s10-chip" + (k === "g" ? " g" : "");
        c.innerHTML = k === "g" ? label : "<i>●</i>" + label; c.style.width = wd + "px"; c.dataset.w = wd;
        front.appendChild(c); return c;

      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      function draw(t) {
        const t0 = FLIP + 0.13, cx = 540, cy = 980;
        els.forEach((c, i) => {
          if (t < t0) { c.style.opacity = "0"; return; }
          const u = clamp((t - t0) / 0.55, 0, 1), grow = 1 - Math.pow(1 - u, 3) * (1 - 2.2 * u * (1 - u));
          const dh = t - HIT, kick = dh <= 0 ? 0 : (dh < 0.16 ? dh / 0.16 : 0.3 + 0.7 * Math.exp(-(dh - 0.16) * 3.2));
          const spin = 0.85 * (t - t0) + (dh <= 0 ? 0 : 1.1 * (1 - Math.exp(-dh * 4)));
          const ang = (i / CHIPS.length) * 6.2832 + spin;
          const R = 420 * grow * (1 + 0.2 * kick), half = +c.dataset.w / 2;
          const x = Math.max(16 + half, Math.min(1064 - half, cx + 0.86 * R * Math.cos(ang))), y = cy + (0.42 + 0.16 * kick) * R * Math.sin(ang) + 40;
          const host = Math.sin(ang) > 0 ? front : back;
          if (c.parentNode !== host) host.appendChild(c);
          const sc = (0.78 + 0.22 * (Math.sin(ang) + 1) / 2) * (0.4 + 0.6 * grow);
          c.style.transform = "translate(" + (x - half).toFixed(1) + "px," + (y - 37).toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
          c.style.opacity = String(clamp(u * 3, 0, 1));
        });
        bob.style.marginTop = (8 * Math.sin(t * 2.6)).toFixed(1) + "px";
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
