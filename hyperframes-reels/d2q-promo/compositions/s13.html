      <svg class="s13-spark" id="s13-sp2" viewBox="0 0 48 48"><path d="M24 0 C26 16 32 22 48 24 C32 26 26 32 24 48 C22 32 16 26 0 24 C16 22 22 16 24 0 Z" fill="#16a34a" /></svg>

  <script>
    (function () {
      /*DATA*/ const DUR = 1.34; const W = [0.16, 0.3, 0.76, 0.98]; /*END*/
      // words: 0 10 1 resources 2 are 3 free.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.27);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const tl = gsap.timeline({ paused: true });

      // camera: a zoom-out that settles on the hand of covers, then a slow push
      tl.fromTo("#s13-cam", { scale: 1.3 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#s13-cam", { scale: 1 }, { scale: 1.02, duration: Math.max(0.2, DUR - 0.6), ease: "none", immediateRender: false }, 0.6);
      tl.fromTo("#s13-glow", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.14);
      tl.fromTo("#s13-floor", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.15);

      // the ten covers fly up one after another and swing out about a common pivot, like a hand of cards;
      // each later card lands on top, so every cover keeps its title edge in view
      const PX = 540, PY = 1208, R = 340, TM = 35;
      const cards = Array.from(document.querySelectorAll("#s13-fan .s13-cv"));
      const GAP = clamp((w(2) - 0.36 - 0.04) / 9, 0.03, 0.05);
      const S0 = cards.map((c, i) => 0.04 + i * GAP);
      const LAND = S0.map((s) => s + 0.3);
      const easeOut3 = (p) => 1 - Math.pow(1 - p, 3);
      const backOut = (p, s) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
      cards.forEach((c, i) => { c.style.zIndex = String(i + 1); });

      tl.fromTo("#s13-pill", { opacity: 0, scale: 0.5, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: "back.out(2)" }, LAND[0] - 0.06);

      // "free.": the ribbon stamps across the fan, the covers feel the hit, sparkles, a shine runs along the ribbon
      const FT = w(3) - 0.05;
      tl.fromTo("#s13-rib", { opacity: 0, scale: 1.9, rotation: -15 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.2, ease: "power4.out" }, FT);
      tl.fromTo("#s13-fan", { scale: 1 }, { scale: 1.035, duration: 0.07, ease: "power2.out" }, FT + 0.08);
      tl.fromTo("#s13-fan", { scale: 1.035 }, { scale: 1, duration: 0.32, ease: "back.out(3)", immediateRender: false }, FT + 0.15);
      tl.fromTo("#s13-rshine", { x: -160 }, { x: 900, duration: 0.5, ease: "power2.inOut" }, FT + 0.16);
      [[156, 958], [930, 912], [902, 1196]].forEach(([x, y], k) => {
        tl.fromTo("#s13-sp" + k, { x: x, y: y, scale: 0, rotation: 0, opacity: 1 }, { x: x, y: y, scale: 1.25, rotation: 45, opacity: 1, duration: 0.2, ease: "back.out(2)" }, FT + 0.08 + k * 0.04);
      });

      // continuous layer: card flight + swing, the counter and its bump
      const num = document.getElementById("s13-num"), unit = document.getElementById("s13-unit"), pin = document.getElementById("s13-pin");
      function draw(t) {
        cards.forEach((c, i) => {
          const th = -TM + (2 * TM * i) / 9;
          // each card rises in its own lane from the lower left or right (clear of the counter) and swings into the hand
          const pr = clamp((t - S0[i]) / 0.26, 0, 1), ps = clamp((t - S0[i] - 0.04) / 0.28, 0, 1);
          const side = i < 5 ? -1 : 1, e = easeOut3(pr);
          const dy = 1150 * (1 - e), dx = side * (330 + 26 * Math.abs(i - 4.5)) * (1 - e);
          const a0 = th * 0.4 + side * 14;
          const a = a0 + (th - a0) * (ps <= 0 ? 0 : backOut(ps, 1.3));
          const rad = a * Math.PI / 180;
          const x = PX + dx + R * Math.sin(rad), y = PY + dy - R * Math.cos(rad);
          const sc = 0.86 + 0.14 * easeOut3(pr);
          c.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + a.toFixed(2) + "deg) rotateY(" + (a * 0.45).toFixed(2) + "deg) rotateX(10deg) scale(" + sc.toFixed(3) + ")";
          c.style.visibility = t >= S0[i] ? "visible" : "hidden";
        });
        let n = 0, last = -9;
        LAND.forEach((l) => { if (t >= l) { n++; last = l; } });
        num.textContent = String(Math.max(1, n));
        unit.textContent = n > 1 ? "resources" : "resource";
        const bump = n > 0 ? 0.12 * Math.exp(-(t - last) * 14) : 0;
        pin.style.transform = "scale(" + (1 + bump).toFixed(3) + ")";
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s13"] = tl;
    })();
  </script>
