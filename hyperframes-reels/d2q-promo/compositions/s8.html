  <script>
    (function () {
      /*DATA*/ const DUR = 2.83; const W = [0.18, 0.52, 0.6, 1.2, 1.48, 1.94, 2.22]; /*END*/
      // words: 0 Then 1 the 2 interview: 3 1000+ 4 problems, 5 with 6 solutions.
      const w = (i) => (W.length > i ? W[i] : 0.18 + i * 0.4);
      const T1 = w(1), T3 = w(3);                      // the counter rolls from "the" and lands exactly on "1000+"
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const tl = gsap.timeline({ paused: true });

      // page-edge lines of the book block (static, built once)
      const pl = document.getElementById("s8-pl");
      [0.17, 0.33, 0.5, 0.67, 0.83].forEach((k) => {
        const d = 24 * k;
        const a = document.createElementNS("http://www.w3.org/2000/svg", "path");
        a.setAttribute("d", "M" + (500 + d) + " " + (12 + d) + " V" + (500 + d) + " M" + (12 + d) + " " + (500 + d) + " H" + (500 + d));
        pl.appendChild(a);
      });
      // odometer reels: 0-9 then 0 again so 9 can roll into 0
      for (let k = 0; k < 4; k++) {
        const s = document.getElementById("s8-r" + k);
        for (let d = 0; d <= 10; d++) { const e = document.createElement("div"); e.textContent = String(d % 10); s.appendChild(e); }
      }

      // camera: gentle push-in
      tl.fromTo("#s8-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none" }, 0);
      // W0: the book arrives big, with a little overshoot, and a glint runs across its glossy cover
      const B0 = Math.max(0.02, w(0) - 0.14);
      tl.fromTo("#s8-book", { opacity: 0, y: 170, scale: 0.8, rotation: -13 }, { opacity: 1, y: 0, scale: 1, rotation: -4, duration: 0.55, ease: "back.out(1.3)" }, B0);
      tl.fromTo("#s8-glint", { x: -200, rotation: 18 }, { x: 640, rotation: 18, duration: 0.8, ease: "power2.inOut" }, B0 + 0.3);
      tl.fromTo("#s8-ped", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.02);
      tl.fromTo("#s8-floor", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.05);

      // the problem cards deal out from behind the book while the counter climbs; the top card comes last
      const CARDS = [["#s8-c4", 255, 676, -15], ["#s8-c3", 455, 651, -5], ["#s8-c2", 655, 668, 6], ["#s8-c1", 845, 736, 15], ["#s8-c0", 836, 1002, 6]];   // review C: +36 px, out of the caption zone
      const gap = clamp((w(4) - T1 - 0.5) / 4, 0.06, 0.2);
      CARDS.forEach(([id, x, y, r], k) => {
        const t = T1 + 0.05 + k * gap;
        tl.fromTo(id, { x: 372, y: 930, rotation: -4, scale: 0.78 }, { x: x, y: y, rotation: r, scale: 1, duration: 0.5, ease: "back.out(1.25)" }, t);
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.08 }, t);
      });

      // the counter lands: the "+" pops in, the display flashes; "problems" lights under it
      tl.fromTo("#s8-plus", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(3)" }, T3 - 0.02);
      tl.fromTo("#s8-dflash", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, T3 - 0.02);
      tl.fromTo("#s8-dflash", { opacity: 1 }, { opacity: 0.35, duration: 0.6, ease: "power2.out", immediateRender: false }, T3 + 0.1);
      tl.fromTo("#s8-disp", { scale: 1 }, { scale: 1.05, duration: 0.09, ease: "power2.out" }, T3 - 0.02);
      tl.fromTo("#s8-disp", { scale: 1.05 }, { scale: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, T3 + 0.07);
      tl.fromTo("#s8-lab", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, w(4) - 0.05);

      // W5 "with": the teal stamp slams onto the top card, the card jolts, an ink ring spreads, its box ticks
      const ST = w(5) - 0.16;
      tl.fromTo("#s8-stamp", { opacity: 0, scale: 2.3, rotation: -24 }, { opacity: 1, scale: 1, rotation: -9, duration: 0.18, ease: "power3.in" }, ST);
      tl.fromTo("#s8-ink", { opacity: 0, scale: 0.9, rotation: -9 }, { opacity: 0.75, scale: 0.9, rotation: -9, duration: 0.01 }, ST + 0.17);
      tl.fromTo("#s8-ink", { opacity: 0.75, scale: 0.9 }, { opacity: 0, scale: 1.5, duration: 0.45, ease: "power2.out", immediateRender: false }, ST + 0.18);
      tl.fromTo("#s8-c0in", { y: 0 }, { y: 9, duration: 0.06, ease: "power2.out" }, ST + 0.18);
      tl.fromTo("#s8-c0in", { y: 9 }, { y: 0, duration: 0.35, ease: "back.out(3)", immediateRender: false }, ST + 0.24);
      tl.fromTo("#s8-t0", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, ST + 0.18);
      // W6 "solutions": the worked lines write in on the top card, and every other card gets its tick
      document.querySelectorAll("#s8-c0 .s8-sol").forEach((el, k) => {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power2.out" }, w(6) - 0.05 + k * 0.08);
      });
      document.querySelectorAll("#s8-c0 .s8-dot").forEach((el, k) => {
        tl.fromTo(el, { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.5)" }, w(6) - 0.07 + k * 0.08);
      });
      ["#s8-c1", "#s8-c2", "#s8-c3", "#s8-c4"].forEach((id, k) => {
        tl.fromTo(id + " .s8-tick", { scale: 0 }, { scale: 1, duration: 0.26, ease: "back.out(2.5)" }, w(6) - 0.06 + k * 0.05);
      });

      // continuous layer: odometer reels with motion blur, book float + its shadow, glow and rim pulse
      const reels = [0, 1, 2, 3].map((k) => document.getElementById("s8-r" + k));
      const bob = document.getElementById("s8-bob"), bshad = document.getElementById("s8-bshad");
      const glow = document.getElementById("s8-glow"), lip = document.getElementById("s8-lip");
      const ease3 = (p) => 1 - Math.pow(1 - p, 3);
      const valAt = (t) => 1000 * ease3(clamp((t - T1) / (T3 - T1), 0, 1));
      function draw(t) {
        const v = valAt(t), dv = (valAt(t + 0.004) - valAt(t - 0.004)) / 0.008;
        for (let k = 0; k < 4; k++) {
          const P = Math.pow(10, k);
          let pos;
          if (k === 0) pos = v % 10;
          else { const n = Math.floor(v / P), lower = v - n * P; pos = (n % 10) + clamp(lower - (P - 1), 0, 1); }
          const r = reels[k];
          r.style.transform = "translateY(" + (-pos * 172).toFixed(1) + "px)";
          const travel = (dv / P) * 172 / 30;           // px per frame
          r.style.filter = travel > 8 ? "blur(" + Math.min(5, travel * 0.05 + 1).toFixed(1) + "px)" : "none";
          r.style.opacity = k > 0 && v < P - 0.5 ? "0.28" : "1";
        }
        const fy = Math.sin(t * 3.4) * 9;
        bob.style.transform = "translateY(" + fy.toFixed(1) + "px)";
        const sc = 1 - fy / 120;
        bshad.style.transform = "scale(" + sc.toFixed(3) + ")";
        bshad.style.opacity = (0.85 + fy / 60).toFixed(3);
        glow.style.opacity = (0.8 + 0.2 * Math.sin(t * 4.2)).toFixed(3);
        lip.style.opacity = (t >= T3 ? 0.95 : 0.55) + 0.05 * Math.sin(t * 6);
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s8"] = tl;
    })();
  </script>
