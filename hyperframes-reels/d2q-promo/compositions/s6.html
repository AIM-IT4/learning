    .s6-pl { position: absolute; left: -40px; top: 500px; width: 1160px; height: 1160px;

            <path d="M -12 0 L -2.6 -218 Q 0 -233 2.6 -218 L 12 0 Z" fill="url(#s6-gN)" stroke="#1a0509" stroke-width="1.4" stroke-linejoin="round" />

  <script>
    (function () {
      /*DATA*/ const DUR = 4.31; const W = [0.16, 0.23, 0.65, 0.89, 1.13, 1.29, 1.49, 2.11, 2.63, 2.83, 3.07, 3.43]; /*END*/
      // words: 0 But 1 formulas 2 were 3 never 4 the 5 hard 6 part. 7 Explaining 8 them 9 under 10 pressure 11 is.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.28);
      const tl = gsap.timeline({ paused: true });
      const T1 = w(7) - 0.04;                 // "Explaining": the needle climbs
      const T2 = Math.max(T1 + 0.2, w(10) - 0.06); // "pressure": it slams into the red
      const HIT = T2 + 0.1;                   // the moment it hits the stop
      // camera: a quick settle, then a slow push into the dial that keeps accelerating, plus a short shake on the hit
      tl.fromTo("#s6-cam", { scale: 0.94 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo("#s6-cam", { scale: 1 }, { scale: 1.12, duration: Math.max(0.2, DUR - 0.5), ease: "power1.in", immediateRender: false }, 0.5);
      // the dial, its halo and the background glow tint red on the hit; the chip pops under the gauge
      tl.fromTo("#s6-tint", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, HIT - 0.04);
      tl.fromTo("#s6-pw", { "--ho": 1 }, { "--ho": 0, duration: 0.18, ease: "power2.out" }, HIT - 0.04);
      tl.fromTo("#s6-rw", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, HIT - 0.04);
      tl.fromTo("#s6-bgtint", { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, HIT - 0.04);
      tl.fromTo("#s6-chipin", { opacity: 0, scale: 0.4, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: "back.out(2.2)" }, HIT - 0.02);

      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const backOut = (x, s) => { x -= 1; return x * x * ((s + 1) * x + s) + 1; };
      const climb = (t) => -112 + 92 * backOut(clamp01((t - T1) / 0.46), 1.3);
      function angleAt(t) {
        let base;
        if (t < T2) base = climb(t);
        else {
          const u = t - T2;
          if (u < 0.1) { const s = u / 0.1, b0 = climb(T2); base = b0 + (130 - b0) * (s * s * (1.6 - 0.6 * s)); }
          else { const v = u - 0.1; base = 122 + 8 * Math.exp(-v * 8) * Math.cos(v * 2 * Math.PI * 4.2); }
        }
        // barely trembling at rest, a little more as it climbs, a high-frequency jitter once it is pinned in the red
        let amp, f;
        if (t < T2) { amp = 0.5 + 0.45 * clamp01((t - T1) / 0.3); f = 1; }
        else { amp = 1.4 * clamp01((t - HIT + 0.02) / 0.12); f = 2.7; }
        return base + amp * (0.65 * Math.sin(t * 2 * Math.PI * 7.3 * f) + 0.35 * Math.sin(t * 2 * Math.PI * 11.9 * f + 1.3));
      }
      const ng = document.getElementById("s6-ng"), nsh = document.getElementById("s6-nsh"), shake = document.getElementById("s6-shake");
      const st = { t: 0 };
      function draw() {
        const t = st.t, a = angleAt(t).toFixed(2);
        ng.setAttribute("transform", "rotate(" + a + ")");
        nsh.setAttribute("transform", "translate(9 12) rotate(" + a + ")");
        const k = t - HIT;
        if (k >= 0 && k < 0.3) {
          const e = Math.exp(-k * 11);
          shake.style.transform = "translate(" + (6 * e * Math.sin(k * 2 * Math.PI * 17)).toFixed(2) + "px," + (4.5 * e * Math.cos(k * 2 * Math.PI * 21)).toFixed(2) + "px)";
        } else shake.style.transform = "none";
      }
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s6"] = tl;
    })();
  </script>
