  <script>
    (function () {
      /*DATA*/ const DUR = 2.65; const W = [0.18, 0.88, 1.04, 1.2, 1.28, 1.56, 1.7, 1.96]; /*END*/
      // words: 0 First, 1 notes 2 with 3 the 4 code 5 that 6 runs 7 them.
      const w = (i) => (W.length > i ? W[i] : 0.2 + i * 0.31);
      const T0 = 0.6, T1 = Math.max(T0 + 0.4, w(6) - 0.15), RUN = w(6), LINK = w(2);   // review B: type through the pause before "notes", readable
      const tl = gsap.timeline({ paused: true });

      // static build: keyboard keys and binder rings
      const NS = "http://www.w3.org/2000/svg";
      const keys = document.getElementById("s6-keys");
      for (let r = 0; r < 4; r++) {
        const y0 = 23 + r * 13.6, y1 = y0 + 10, ym = (y0 + y1) / 2;
        const xl = 122 - ((ym - 18) / 60) * 28 + 8, xr = 698 + ((ym - 18) / 60) * 28 - 8;
        const n = 14, gap = 5, kw = (xr - xl - gap * (n - 1)) / n;
        for (let k = 0; k < n; k++) {
          if (r === 3 && k > 4 && k < 9) { if (k === 5) { const sp = document.createElementNS(NS, "rect"); sp.setAttribute("x", (xl + 5 * (kw + gap)).toFixed(1)); sp.setAttribute("y", y0); sp.setAttribute("width", (4 * kw + 3 * gap).toFixed(1)); sp.setAttribute("height", 10); sp.setAttribute("rx", 2.5); sp.setAttribute("fill", "#334155"); keys.appendChild(sp); } continue; }
          const kr = document.createElementNS(NS, "rect");
          kr.setAttribute("x", (xl + k * (kw + gap)).toFixed(1)); kr.setAttribute("y", y0); kr.setAttribute("width", kw.toFixed(1)); kr.setAttribute("height", 10); kr.setAttribute("rx", 2.5); kr.setAttribute("fill", "#334155");
          keys.appendChild(kr);
        }
      }
      const rg = document.getElementById("s6-ringg");
      [96, 231, 366].forEach((cy) => {
        const hole = document.createElementNS(NS, "ellipse");
        hole.setAttribute("cx", 84); hole.setAttribute("cy", cy); hole.setAttribute("rx", 8); hole.setAttribute("ry", 12); hole.setAttribute("fill", "#043f3c");
        rg.appendChild(hole);
        const ring = document.createElementNS(NS, "path");
        ring.setAttribute("d", "M84 " + (cy - 9) + " C 52 " + (cy - 26) + ", 10 " + (cy - 18) + ", 10 " + cy + " C 10 " + (cy + 18) + ", 52 " + (cy + 26) + ", 84 " + (cy + 9));
        ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "url(#s6-chrome)"); ring.setAttribute("stroke-width", 10); ring.setAttribute("stroke-linecap", "round");
        rg.appendChild(ring);
        const edge = document.createElementNS(NS, "path");
        edge.setAttribute("d", "M84 " + (cy - 9) + " C 52 " + (cy - 26) + ", 10 " + (cy - 18) + ", 10 " + cy + " C 10 " + (cy + 18) + ", 52 " + (cy + 26) + ", 84 " + (cy + 9));
        edge.setAttribute("fill", "none"); edge.setAttribute("stroke", "rgba(71,85,105,0.55)"); edge.setAttribute("stroke-width", 2);
        rg.insertBefore(edge, ring);
      });

      // camera: one slow push-in
      tl.fromTo("#s6-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);

      // the laptop rises in first, its screen wakes
      tl.fromTo("#s6-lap", { opacity: 0, y: 260, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.48, ease: "back.out(1.3)" }, 0.02);
      tl.fromTo("#s6-floor", { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.08);
      tl.fromTo("#s6-ui", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.32);

      // W[1] "notes": the ring binder arrives from the left
      tl.fromTo("#s6-binder", { opacity: 0, x: -720, y: 40, rotation: -24 }, { opacity: 1, x: 0, y: 0, rotation: -4, duration: 0.5, ease: "back.out(1.2)" }, w(1) - 0.08);

      // W[2] "with": the teal link line draws from the binder to the laptop
      tl.fromTo("#s6-end0", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, LINK - 0.06);
      tl.fromTo(["#s6-lpath", "#s6-lglowp"], { attr: { "stroke-dashoffset": 1.1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.34, ease: "power2.inOut" }, LINK);
      tl.fromTo("#s6-end1", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, LINK + 0.28);

      // W[6] "runs": the Run button pulses and the output appears
      tl.fromTo("#s6-run", { scale: 1 }, { scale: 1.16, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, RUN - 0.04);
      tl.fromTo("#s6-out", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, RUN - 0.02);
      tl.fromTo("#s6-lglow", { opacity: 0.6, scale: 1 }, { opacity: 1, scale: 1.08, duration: 0.3, ease: "power2.out", immediateRender: false }, RUN + 0.06);

      // typing, cursor, ripple and the pulses travelling along the link
      const LINES = [
        [["from", "k"], [" math ", "i"], ["import", "k"], [" ", "i"], ["exp", "f"]],
        [["def", "k"], [" ", "i"], ["forward", "f"], ["(", "p"], ["S", "i"], [", ", "p"], ["r", "i"], [", ", "p"], ["q", "i"], [", ", "p"], ["T", "i"], ["):", "p"]],
        [["    ", "i"], ["return", "k"], [" S ", "i"], ["*", "p"], [" ", "i"], ["exp", "f"], ["((", "p"], ["r", "i"], [" - ", "p"], ["q", "i"], [")", "p"], [" * ", "p"], ["T", "i"], [")", "p"]],
        [["print", "f"], ["(", "p"], ["forward", "f"], ["(", "p"], ["100", "n"], [", ", "p"], ["0.05", "n"], [", ", "p"], ["0.01", "n"], [", ", "p"], ["1", "n"], ["))", "p"]],
      ];
      const LEN = LINES.map((L) => L.reduce((a, [s]) => a + s.length, 0));
      const TOTAL = LEN.reduce((a, b) => a + b, 0);
      const codeEls = [0, 1, 2, 3].map((i) => document.getElementById("s6-c" + i));
      const cur = document.getElementById("s6-cur"), ripple = document.getElementById("s6-ripple");
      const pulses = [document.getElementById("s6-p0"), document.getElementById("s6-p1")];
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const shown = [-1, -1, -1, -1];
      function lineHTML(L, n) {
        let out = "", left = n;
        for (const [s, c] of L) { if (left <= 0) break; const part = s.slice(0, left); left -= part.length; out += '<span class="' + c + '">' + part + "</span>"; }
        return out;
      }
      const bez = (a, b, c, d, u) => { const v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; };
      function draw(t) {
        const n = Math.floor(TOTAL * clamp((t - T0) / (T1 - T0), 0, 1));
        let rest = n, li = 0, col = 0;
        for (let i = 0; i < 4; i++) {
          const k = clamp(rest, 0, LEN[i]);
          if (k !== shown[i]) { codeEls[i].innerHTML = lineHTML(LINES[i], k); shown[i] = k; }
          if (rest > 0 || i === 0) { li = i; col = k; }
          rest -= LEN[i];
          if (rest <= 0 && k < LEN[i]) { rest = 0; }
        }
        if (n >= TOTAL) { li = 3; col = LEN[3]; }
        cur.style.transform = "translate(" + (col * 16.2).toFixed(1) + "px," + (li * 50).toFixed(1) + "px)";
        const typing = t >= T0 && t <= T1 + 0.05;
        cur.style.opacity = typing || Math.floor(t * 3.2) % 2 === 0 ? "1" : "0";
        const rd = t - RUN;
        if (rd >= 0 && rd < 0.42) { const q = rd / 0.42; ripple.style.opacity = (0.95 * (1 - q) * (1 - q)).toFixed(3); ripple.style.transform = "scale(" + (1 + 0.3 * q).toFixed(3) + "," + (1 + 0.55 * q).toFixed(3) + ")"; }
        else ripple.style.opacity = "0";
        pulses.forEach((p, k) => {
          const t0 = LINK + 0.36;
          if (t < t0) { p.style.opacity = "0"; return; }
          const u = (((t - t0) * 1.05 + k * 0.5) % 1 + 1) % 1;
          const x = bez(636, 800, 886, 852, u), y = bez(712, 700, 830, 1000, u);
          p.style.transform = "translate(" + (x - 9).toFixed(1) + "px," + (y - 9).toFixed(1) + "px) rotate(45deg)";
          p.style.opacity = (clamp(u * 6, 0, 1) * clamp((1 - u) * 6, 0, 1)).toFixed(3);
        });
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s6"] = tl;
    })();
  </script>
