              <path class="s14-ink" d="M140 46 C173 21 222 17 262 25 V174 C222 166 173 170 140 194 Z" fill="rgba(255,255,255,0.5)" stroke="#1f2933" stroke-width="10" stroke-linejoin="round" />
              <path class="s14-ln" d="M46 64 H112 M46 91 H112 M46 118 H100 M168 64 H234 M168 91 H234 M168 118 H222" stroke="#1f2933" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round" />

  <script>
    (function () {
      /*DATA*/ const DUR = 3.57; const W = [0.16, 0.68, 0.88, 1.02, 1.1, 1.69, 1.93, 2.15, 2.37, 2.55, 2.67, 2.89]; /*END*/
      // words: 0 Textbooks 1 teach 2 you 3 the 4 model. | 5 The 6 desk 7 teaches 8 you 9 what 10 breaks 11 it.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.25);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const FLIP = w(5) + 0.05, HIT = w(10) - 0.02;
      const tl = gsap.timeline({ paused: true });

      // split the plate: the coin layer = everything above y 1428 plus the coin's own outline; the pedestal = the rest
      // (img-local px: frame + (40, -500); coin ellipse centre (576.5,575) rx 372 ry 378; split y 928)
      const CX = 576.5, CY = 575, RX = 372, RY = 378, YS = 928;
      const f0 = Math.asin((YS - CY) / RY), arc = [];
      for (let k = 0; k <= 16; k++) { const f = f0 + (Math.PI - 2 * f0) * k / 16; arc.push([CX + RX * Math.cos(f), CY + RY * Math.sin(f)]); }
      const pp = (a) => a.map(([x, y]) => x.toFixed(1) + "px " + y.toFixed(1) + "px").join(", ");
      document.getElementById("s14-cplate").style.clipPath = "polygon(0px 0px, 1160px 0px, 1160px " + YS + "px, " + pp(arc) + ", 0px " + YS + "px)";
      document.getElementById("s14-pplate").style.clipPath = "polygon(0px " + YS + "px, " + pp(arc.slice().reverse()) + ", 1160px " + YS + "px, 1160px 1160px, 0px 1160px)";

      // camera: settle up from below, then v2's slow rotation drift with a gentle push
      tl.fromTo("#s14-cam", { y: 60 }, { y: 0, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#s14-cam", { scale: 1, rotation: -1.4 }, { scale: 1.06, rotation: 1.4, duration: DUR, ease: "none" }, 0);

      // "Textbooks": the open-book emblem inks itself onto the silver face, the word stamps in under it
      document.querySelectorAll("#s14-book .s14-ink").forEach((p, k) => {
        p.setAttribute("stroke-dasharray", "620");
        tl.fromTo(p, { strokeDashoffset: 620 }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.inOut" }, 0.06 + k * 0.06);
      });
      tl.fromTo("#s14-book .s14-ln", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.34);
      tl.fromTo("#s14-acc", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: "0% 50%", duration: 0.22, ease: "power2.out" }, 0.44);
      tl.fromTo("#s14-la", { opacity: 0, y: 14, scaleX: 1.12 }, { opacity: 1, y: 0, scaleX: 1, duration: 0.32, ease: "power3.out" }, w(0) + 0.02);

      // "model.": the hero slam lands on the coin, a glint crosses it, the face ring flares, the emblem pulses
      const MD = w(4) - 0.04;
      tl.fromTo("#s14-glint", { opacity: 0 }, { opacity: 1, duration: 0.04 }, MD - 0.06);
      tl.fromTo("#s14-glint", { x: 140, rotation: 20 }, { x: 900, rotation: 20, duration: 0.5, ease: "power2.inOut" }, MD - 0.06);
      tl.fromTo("#s14-facering", { opacity: 0, scale: 0.94 }, { opacity: 0.95, scale: 1, duration: 0.1, ease: "power2.out" }, MD);
      tl.fromTo("#s14-facering", { opacity: 0.95 }, { opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, MD + 0.12);
      tl.fromTo("#s14-fa", { scale: 1 }, { scale: 1.07, duration: 0.08, ease: "power2.out" }, MD);
      tl.fromTo("#s14-fa", { scale: 1.07 }, { scale: 1, duration: 0.36, ease: "back.out(3)", immediateRender: false }, MD + 0.08);

      // "The desk": the coin flips — it squeezes to its edge with motion blur, shows its milled edge, opens on the logo face
      tl.fromTo("#s14-coin", { scaleX: 1, filter: "blur(0px)" }, { scaleX: 0.02, filter: "blur(6px)", duration: 0.13, ease: "power2.in" }, FLIP);
      tl.fromTo("#s14-fa", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, FLIP + 0.13);
      tl.fromTo("#s14-fb", { opacity: 0 }, { opacity: 1, duration: 0.01 }, FLIP + 0.13);
      tl.fromTo("#s14-coin", { scaleX: 0.02, filter: "blur(6px)" }, { scaleX: 1, filter: "blur(0px)", duration: 0.17, ease: "power2.out", immediateRender: false }, FLIP + 0.14);
      tl.fromTo("#s14-edge", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.07, ease: "power2.in" }, FLIP + 0.07);
      tl.fromTo("#s14-edge", { opacity: 1, scaleX: 1 }, { opacity: 0, scaleX: 0.3, duration: 0.09, ease: "power2.out", immediateRender: false }, FLIP + 0.15);
      tl.fromTo("#s14-bob", { y: 0 }, { y: -46, duration: 0.15, ease: "power2.out" }, FLIP);
      tl.fromTo("#s14-bob", { y: -46 }, { y: 0, duration: 0.17, ease: "power2.in", immediateRender: false }, FLIP + 0.15);
      tl.fromTo("#s14-tile", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, FLIP + 0.14);

      // "breaks": coin punch, glow flash, shockwave; the desk chips are flung out and keep orbiting
      tl.fromTo("#s14-bob", { scale: 1 }, { scale: 1.12, duration: 0.11, ease: "power2.out" }, HIT);
      tl.fromTo("#s14-bob", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, HIT + 0.11);
      tl.fromTo("#s14-flash", { opacity: 0, scale: 0.8 }, { opacity: 0.85, scale: 1.05, duration: 0.1, ease: "power2.out" }, HIT);
      tl.fromTo("#s14-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, HIT + 0.12);
      tl.fromTo("#s14-ring", { opacity: 0, scale: 0.92 }, { opacity: 0.9, scale: 0.92, duration: 0.01 }, HIT);
      tl.fromTo("#s14-ring", { opacity: 0.9, scale: 0.92 }, { opacity: 0, scale: 1.6, duration: 0.6, ease: "power2.out", immediateRender: false }, HIT + 0.01);
      tl.fromTo("#s14-halo", { opacity: 0.55 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, HIT);
      tl.fromTo("#s14-halo", { opacity: 1 }, { opacity: 0.78, duration: 0.6, ease: "power2.inOut", immediateRender: false }, HIT + 0.12);

      // desk chips (from v2): front half of the orbit over the coin, back half behind it
      const CHIPS = [["g", "Δ", 76], ["p", "P&L", 176], ["g", "Γ", 76], ["p", "VaR", 176], ["g", "ν", 76], ["p", "XVA", 176], ["g", "Θ", 76], ["p", "Model risk", 270]];
      const front = document.getElementById("s14-front"), back = document.getElementById("s14-back");
      const els = CHIPS.map(([k, label, wd]) => {
        const c = document.createElement("div"); c.className = "s14-chip" + (k === "g" ? " g" : "");
        c.innerHTML = k === "g" ? label : "<i>●</i>" + label; c.style.width = wd + "px"; c.dataset.w = wd;
        front.appendChild(c); return c;
      });
      function draw(t) {
        const t0 = FLIP + 0.13, cx = 536, cy = 1075;
        els.forEach((c, i) => {
          if (t < t0) { c.style.opacity = "0"; return; }
          const u = clamp((t - t0) / 0.55, 0, 1), grow = 1 - Math.pow(1 - u, 3) * (1 - 2.2 * u * (1 - u));
          const dh = t - HIT, kick = dh <= 0 ? 0 : (dh < 0.16 ? dh / 0.16 : 0.3 + 0.7 * Math.exp(-(dh - 0.16) * 3.2));
          const spin = 0.85 * (t - t0) + (dh <= 0 ? 0 : 1.1 * (1 - Math.exp(-dh * 4)));
          const ang = (i / CHIPS.length) * 6.2832 + spin;
          const R = 500 * grow * (1 + 0.2 * kick), half = +c.dataset.w / 2;
          const x = Math.max(60 + half, Math.min(1020 - half, cx + 0.88 * R * Math.cos(ang))), y = cy + (0.42 + 0.16 * kick) * R * Math.sin(ang) + 40;
          const host = Math.sin(ang) > 0 ? front : back;
          if (c.parentNode !== host) host.appendChild(c);
          const sc = (0.78 + 0.22 * (Math.sin(ang) + 1) / 2) * (0.4 + 0.6 * grow);
          c.style.transform = "translate(" + (x - half).toFixed(1) + "px," + (y - 38).toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
          c.style.opacity = (clamp(u * 3, 0, 1) * (0.62 + 0.38 * (Math.sin(ang) + 1) / 2)).toFixed(3);   // the far side of the orbit sits back
        });
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s14"] = tl;
    })();
  </script>
