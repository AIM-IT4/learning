  <script>
    (function () {
      /*DATA*/ const DUR = 2.06; const W = [0.16, 0.9, 1.22, 1.68]; /*END*/
      // words: 0 Desk2Quant 1 trains 2 exactly 3 that.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.45);
      const tl = gsap.timeline({ paused: true });
      const TL = w(0) + 0.05;                  // the tile lands on "Desk2Quant"
      // camera: a tilted, close start that settles level, then holds (the impact shake is in draw)
      tl.fromTo("#s7-cam", { rotation: -3, scale: 1.15 }, { rotation: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 0);
      // the landing lights the ring, flares the top, sends a ripple across the pedestal
      tl.fromTo("#s7-ring", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, TL - 0.01);
      tl.fromTo("#s7-ring", { opacity: 1 }, { opacity: 0.55, duration: 0.7, ease: "power2.out", immediateRender: false }, TL + 0.06);
      tl.fromTo("#s7-glow", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, TL - 0.01);
      tl.fromTo("#s7-glow", { opacity: 1 }, { opacity: 0.5, duration: 0.7, ease: "power2.out", immediateRender: false }, TL + 0.07);
      tl.fromTo("#s7-wave", { opacity: 0.95, scale: 1 }, { opacity: 0, scale: 1.5, duration: 0.55, ease: "power2.out" }, TL);
      tl.fromTo("#s7-spec", { x: -300 }, { x: 330, duration: 0.6, ease: "power2.inOut" }, TL + 0.14);
      // "trains", "exactly", "that": a pill rises beside the tile on each word
      const P = [w(1) - 0.06, w(2) - 0.06, Math.min(w(3) - 0.1, DUR - 0.5)];
      P.forEach((at, i) => tl.fromTo("#s7-p" + i, { opacity: 0, y: 70, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.8)" }, at));

      // the drop, squash and bounce of the tile, its shadow, the impact shake and the pixel burst are one function of time
      const tile = document.getElementById("s7-tile"), shadow = document.getElementById("s7-shadow"), shake = document.getElementById("s7-shake");
      const g = document.getElementById("s7-px").getContext("2d");
      const DROP = 184;
      // keyframes after landing: [u, y, scaleX, scaleY, ease into this key]
      const K = [[0, 0, 0.95, 1.06, 0], [0.06, 0, 1.14, 0.83, 1], [0.2, -44, 0.97, 1.05, 1], [0.33, 0, 0.99, 1.02, 2], [0.38, 0, 1.05, 0.94, 1], [0.58, 0, 1, 1, 3]];
      const ez = [(s) => s, (s) => 1 - (1 - s) * (1 - s), (s) => s * s, (s) => (s < 0.5 ? 2 * s * s : 1 - 2 * (1 - s) * (1 - s))];
      function tileAt(t) {
        if (t < TL) { const s = Math.max(0, t) / TL; return [-DROP * (1 - s * s), 0.95, 1.06]; }
        const u = t - TL;
        for (let i = 1; i < K.length; i++) {
          if (u <= K[i][0]) {
            const a = K[i - 1], b = K[i], s = ez[b[4]]((u - a[0]) / (b[0] - a[0]));
            return [a[1] + (b[1] - a[1]) * s, a[2] + (b[2] - a[2]) * s, a[3] + (b[3] - a[3]) * s];
          }
        }
        return [0, 1, 1];
      }
      // seeded squares, like the mosaic's cells, burst out from under the tile
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(31), COL = ["#22c55e", "#16a34a", "#4ade80", "#22c55e", "#86efac", "#15803d"];
      const PX = [...Array(36)].map((_, i) => {
        const side = i % 2 ? 1 : -1, th = (-90 + side * (18 + 70 * rnd())) * Math.PI / 180, sp = 520 + 980 * rnd();
        return { x: 540 + side * (40 + 110 * rnd()), y: 1150 + 14 * rnd(), vx: Math.cos(th) * sp, vy: Math.sin(th) * sp,
                 s: 6 * (3 + Math.floor(4 * rnd())), c: COL[Math.floor(rnd() * COL.length)], life: 0.5 + 0.4 * rnd(), d: 0.03 * rnd() };
      });
      const st = { t: 0 };
      function draw() {
        const t = st.t, [y, sx, sy] = tileAt(t);
        tile.style.transform = "translateY(" + y.toFixed(2) + "px) scale(" + sx.toFixed(4) + "," + sy.toFixed(4) + ")";
        const h = Math.min(1, -y / DROP);
        shadow.style.transform = "scale(" + (sx * (1 - 0.45 * h)).toFixed(4) + "," + (1 - 0.3 * h).toFixed(4) + ")";
        shadow.style.opacity = (1 - 0.7 * h).toFixed(3);
        const k = t - TL;
        if (k >= 0 && k < 0.36) {
          const e = Math.exp(-k * 12);
          shake.style.transform = "translate(" + (2.2 * e * Math.sin(k * 2 * Math.PI * 19)).toFixed(2) + "px," + (6 * e * Math.cos(k * 2 * Math.PI * 15)).toFixed(2) + "px)";
        } else shake.style.transform = "none";
        g.clearRect(0, 0, 1080, 1920);
        if (k < 0 || k > 1.0) return;
        for (const q of PX) {
          const u = k - q.d; if (u <= 0 || u > q.life) continue;
          const f = (1 - Math.exp(-4.2 * u)) / 4.2;
          const x = q.x + q.vx * f, yy = q.y + q.vy * f + 420 * u * u;
          const a = Math.pow(1 - u / q.life, 1.4), sz = q.s * Math.min(1, u / 0.05);
          g.globalAlpha = a; g.fillStyle = q.c;
          g.fillRect(Math.round((x - sz / 2) / 6) * 6, Math.round((yy - sz / 2) / 6) * 6, sz, sz);
        }
        g.globalAlpha = 1;
      }
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s7"] = tl;
    })();
