  <script>
    (function () {
      /*DATA*/ const DUR = 4.85; const W = [0.18, 0.32, 0.42, 0.86, 1.53, 2.04, 2.86, 3.73, 4.02]; /*END*/
      // words: 0 Then 1 the 2 desk: 3 Greeks, 4 P&L 5 explain, 6 XVA, 7 model 8 validation.
      const w = (i) => (W.length > i ? W[i] : 0.18 + i * 0.42);
      const ON = [w(3), w(4), w(6), w(7)];          // each monitor lights on its word
      const DESK = w(2);                             // "desk": the desk powers up (ticker + standby lights)
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const tl = gsap.timeline({ paused: true });

      // camera: slow push-in over the whole scene
      tl.fromTo("#s7-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
      // arrival: the desk rig slides up and settles, the monitors land one after another with a little overshoot
      tl.fromTo("#s7-scene", { opacity: 0, y: 110 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.02);
      for (let i = 0; i < 4; i++) {
        tl.fromTo("#s7-m" + i, { scale: 0.88 }, { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.04 + i * 0.045);
      }
      // "desk": the ticker on the desk edge wakes up
      tl.fromTo("#s7-tick", { opacity: 0.25 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, DESK - 0.04);

      // each monitor powers on: a bright scan line opens to the full screen, the cover fades through it, a glint sweeps
      // the glass, the label lights, the teal ring + glow come up, and the monitor gives a small bounce
      ON.forEach((t, i) => {
        const m = "#s7-m" + i;
        tl.fromTo(m + " .s7-flash", { opacity: 0, scaleY: 0.03 }, { opacity: 1, scaleY: 1, duration: 0.11, ease: "power2.out" }, t - 0.04);
        tl.fromTo(m + " .s7-flash", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.08);
        tl.fromTo(m + " .s7-cov", { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, t);
        tl.fromTo(m + " .s7-sweep", { x: -260, rotation: 16 }, { x: 560, rotation: 16, duration: 0.75, ease: "power2.inOut" }, t + 0.12);
        tl.fromTo(m + " .s7-off", { opacity: 1 }, { opacity: 0, duration: 0.18 }, t);
        tl.fromTo(m + " .s7-on", { opacity: 0 }, { opacity: 1, duration: 0.18 }, t);
        tl.fromTo(m + " .s7-ring", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
        tl.fromTo(m + " .s7-bob", { scale: 1 }, { scale: 1.032, duration: 0.11, ease: "power2.out" }, t);
        tl.fromTo(m + " .s7-bob", { scale: 1.032 }, { scale: 1, duration: 0.5, ease: "back.out(3.2)", immediateRender: false }, t + 0.11);
      });

      // continuous layer: glow pulses on lit monitors, the room glow grows with each one, standby lights blink, ticker scrolls
      const glows = Array.from(document.querySelectorAll("#s7-rig .s7-glow"));
      const leds = Array.from(document.querySelectorAll("#s7-rig .s7-off i"));
      const aura = document.getElementById("s7-aura"), tickIn = document.getElementById("s7-tickin");
      const S = "GREEKS  •  P&L EXPLAIN  •  XVA  •  MODEL VALIDATION  •  ";
      tickIn.textContent = S.repeat(3);
      const PERIOD = S.length * 26 * 0.6;            // JetBrains Mono advance is 0.6 em
      function draw(t) {
        let lit = 0;
        glows.forEach((g, i) => {
          const u = clamp((t - ON[i] + 0.02) / 0.3, 0, 1);
          lit += u;
          g.style.opacity = (u * (0.8 + 0.2 * Math.sin((t - ON[i]) * 5.6))).toFixed(3);
        });
        aura.style.opacity = (0.16 + 0.12 * lit + 0.05 * Math.sin(t * 2.6)).toFixed(3);
        leds.forEach((l, i) => {
          const awake = t >= DESK;
          l.style.opacity = !awake ? "0.25" : (Math.sin((t - DESK) * 10 + i * 1.3) > -0.2 ? "1" : "0.3");
        });
        tickIn.style.transform = "translateX(" + (-((t * 115) % PERIOD)).toFixed(1) + "px)";
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s7"] = tl;
    })();
  </script>
