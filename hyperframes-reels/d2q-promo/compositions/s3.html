      <!-- the stopwatch's blank dial gets a live hand and a green "time left" wedge -->

  <script>
    (function () {
      /*DATA*/ const DUR = 3.19; const W = [0.16, 0.44, 0.54, 0.86, 1.08, 1.2, 1.38, 2.0, 2.12, 2.42, 2.64, 2.8]; /*END*/
      // words: 0 If 1 you're 2 preparing 3 for 4 a 5 quant 6 interview, 7 this 8 changes 9 how 10 you 11 study.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.24);
      const tl = gsap.timeline({ paused: true });
      const IV = w(6), FLIP = w(8);
      // camera: slides in from the right and settles, then a slow push toward the desk
      tl.fromTo("#s3-cam", { x: 90, scale: 1.08 }, { x: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo("#s3-cam", { scale: 1 }, { scale: 1.05, duration: Math.max(0.2, DUR - 0.7), ease: "sine.inOut", immediateRender: false }, 0.7);
      // "preparing": the clock starts, a timer chip pops over the stopwatch
      tl.fromTo("#s3-chip", { opacity: 0, scale: 0.5, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, w(2) - 0.08);
      // "interview": the question card slides along the desk and stops on it
      tl.fromTo("#s3-qwrap", { x: 430, y: -128, rotation: 5, filter: "blur(6px)" }, { x: 0, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.44, ease: "expo.out" }, IV - 0.14);
      tl.fromTo("#s3-qshadow", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" }, IV - 0.02);
      tl.fromTo("#s3-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out" }, IV + 0.2);
      // the toggle card rises under the desk, still on "Memorise"
      tl.fromTo("#s3-tog", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, IV + 0.3);
      // "this": strike it ... "changes": the pill flips to Practise, the check draws, the card glows on "study"
      tl.fromTo("#s3-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power2.out" }, w(7) - 0.04);
      tl.fromTo("#s3-pill", { rotationX: 0, transformPerspective: 600 }, { rotationX: 90, duration: 0.09, ease: "power2.in" }, FLIP - 0.04);
      tl.fromTo("#s3-pA", { opacity: 1 }, { opacity: 0, duration: 0.01 }, FLIP + 0.05);
      tl.fromTo("#s3-pB", { opacity: 0 }, { opacity: 1, duration: 0.01 }, FLIP + 0.05);
      tl.fromTo("#s3-pill", { rotationX: -90 }, { rotationX: 0, duration: 0.28, ease: "back.out(1.9)", immediateRender: false }, FLIP + 0.05);
      tl.fromTo("#s3-tog", { y: 0 }, { y: -14, duration: 0.1, ease: "power2.out", immediateRender: false }, FLIP - 0.04);
      tl.fromTo("#s3-tog", { y: -14 }, { y: 0, duration: 0.24, ease: "power2.inOut", immediateRender: false }, FLIP + 0.06);
      tl.fromTo("#s3-ckp", { attr: { "stroke-dashoffset": 100, opacity: 0 } }, { attr: { "stroke-dashoffset": 0, opacity: 1 }, duration: 0.2, ease: "power2.out" }, FLIP + 0.2);
      tl.fromTo("#s3-tglow", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, Math.min(w(11) - 0.06, DUR - 0.45));

      // the stopwatch dial: minute ticks, a hand and a wedge of time left that ticks down with the chip (00:45 → ...)
      const NS = "http://www.w3.org/2000/svg", tg = document.getElementById("s3-ticks");
      for (let i = 0; i < 12; i++) {
        const a = (i * 30 * Math.PI) / 180, r0 = i % 3 === 0 ? 40 : 44, r1 = 50;
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", (r0 * Math.sin(a)).toFixed(2)); ln.setAttribute("y1", (-r0 * Math.cos(a)).toFixed(2));
        ln.setAttribute("x2", (r1 * Math.sin(a)).toFixed(2)); ln.setAttribute("y2", (-r1 * Math.cos(a)).toFixed(2));
        ln.setAttribute("stroke", i % 3 === 0 ? "#111418" : "#8a94a1"); ln.setAttribute("stroke-width", i % 3 === 0 ? "3.2" : "2");
        ln.setAttribute("stroke-linecap", "round"); tg.appendChild(ln);
      }
      const hand = document.getElementById("s3-hand"), wedge = document.getElementById("s3-wedge");
      const ss = document.getElementById("s3-ss"), dot = document.getElementById("s3-dot");
      const T0 = w(2) + 0.06, TICK = 0.5;
      const backOut = (x) => { const s = 2.4; x -= 1; return x * x * ((s + 1) * x + s) + 1; };
      const st = { t: 0 };
      function draw() {
        const t = st.t, el = Math.max(0, t - T0), k = t > T0 ? Math.floor(el / TICK) : 0, n = Math.max(0, 45 - k);
        const ft = el - k * TICK, snap = k > 0 ? backOut(Math.min(1, ft / 0.09)) : 1;
        const A = 6 * (n + 1 - snap), a = (A * Math.PI) / 180, r = 40;
        const x = r * Math.sin(a), y = -r * Math.cos(a);
        wedge.setAttribute("d", "M 0 0 L 0 " + -r + " A " + r + " " + r + " 0 " + (A > 180 ? 1 : 0) + " 1 " + x.toFixed(2) + " " + y.toFixed(2) + " Z");
        hand.setAttribute("x2", (44 * Math.sin(a)).toFixed(2)); hand.setAttribute("y2", (-44 * Math.cos(a)).toFixed(2));
        hand.setAttribute("x1", (-9 * Math.sin(a)).toFixed(2)); hand.setAttribute("y1", (9 * Math.cos(a)).toFixed(2));
        ss.textContent = String(n).padStart(2, "0");
        const bump = k > 0 ? Math.max(0, 1 - ft / 0.18) : 0;
        ss.style.transform = "scale(" + (1 + 0.16 * bump * bump).toFixed(3) + ")";
        dot.style.boxShadow = "0 0 0 " + (6 + 7 * bump).toFixed(1) + "px rgba(22,163,74," + (0.16 + 0.18 * bump).toFixed(3) + ")";
      }
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s3"] = tl;
    })();
  </script>
