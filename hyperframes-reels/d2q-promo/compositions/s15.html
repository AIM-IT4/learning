  <script>
    (function () {
      /*DATA*/ const DUR = 3.86; const W = [0.16, 0.54, 0.8, 0.98, 1.16, 1.34, 1.52, 1.62]; /*END*/
      // words: 0 Comment 1 FREE, 2 and 3 we'll 4 DM 5 you 6 all 7 ten.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.22);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const tl = gsap.timeline({ paused: true });

      // the banner: a little green pixel mosaic (seeded, the film's motif), not any app's branding
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(31);
      let sq = "";
      for (let r = 0; r < 4; r++) for (let c = 0; c < 37; c++) {
        const x = c * 26, wgt = Math.pow(c / 36, 1.6) * 0.15 + Math.pow(1 - c / 36, 2.2) * 0.85;
        if (rnd() > wgt * 0.9 + 0.05) continue;
        const a = (0.12 + 0.5 * rnd()).toFixed(2);
        sq += '<rect x="' + (x + 2) + '" y="' + (r * 26 + 2) + '" width="22" height="22" rx="3" fill="rgba(22,163,74,' + a + ')"/>';
      }
      document.getElementById("s15-ban").innerHTML = '<svg width="960" height="104" viewBox="0 0 960 104">' + sq + "</svg>";

      // camera: rise and settle, then hold still for the end card
      tl.fromTo("#s15-cam", { y: 80, scale: 1.06 }, { y: 0, scale: 1, duration: 0.75, ease: "expo.out" }, 0);
      tl.fromTo("#s15-glow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);

      // arrival: the comment box and the profile card float in on a 3D tilt, together, then part for the DM
      const LIFT = 214, DROP = 196;
      tl.fromTo("#s15-cmt", { opacity: 0, y: 110, rotationX: 34, rotationY: -18, scale: 0.92, transformPerspective: 1600 },
                            { opacity: 1, y: 0, rotationX: 7, rotationY: -5, scale: 1, transformPerspective: 1600, duration: 0.6, ease: "back.out(1.4)" }, 0.02);
      tl.fromTo("#s15-pro", { opacity: 0, y: 150, rotationX: 30, rotationY: 16, transformPerspective: 1600 },
                            { opacity: 1, y: 0, rotationX: 6, rotationY: 5, transformPerspective: 1600, duration: 0.62, ease: "power3.out" }, 0.08);

      // "Comment FREE": the letters type in one by one (drawn below), then the send button is tapped
      const TY0 = w(0) + 0.08, TYG = clamp((w(1) + 0.12 - TY0) / 4, 0.07, 0.16);
      const TAP = Math.max(TY0 + 4 * TYG + 0.1, w(2) - 0.08);
      tl.fromTo("#s15-send", { scale: 1 }, { scale: 0.8, duration: 0.08, ease: "power2.in" }, TAP);
      tl.fromTo("#s15-send", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, TAP + 0.08);
      tl.fromTo("#s15-rip", { opacity: 0, scale: 0.9 }, { opacity: 0.75, scale: 0.9, duration: 0.01 }, TAP + 0.07);
      tl.fromTo("#s15-rip", { opacity: 0.75, scale: 0.9 }, { opacity: 0, scale: 1.9, duration: 0.5, ease: "power2.out", immediateRender: false }, TAP + 0.08);
      tl.fromTo("#s15-plane", { opacity: 1 }, { opacity: 0, duration: 0.1 }, TAP + 0.1);
      tl.fromTo("#s15-chk", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, TAP + 0.12);
      // the sent comment glides up and the profile card drops to make room for the reply
      tl.fromTo("#s15-cmtw", { y: LIFT }, { y: 0, duration: 0.55, ease: "power3.inOut" }, TAP + 0.2);
      tl.fromTo("#s15-prow", { y: -DROP }, { y: 0, duration: 0.55, ease: "power3.inOut" }, TAP + 0.2);

      // "DM": the direct message swings in from the right
      const DM = w(4) - 0.1;
      tl.fromTo("#s15-dm", { x: 640, opacity: 0, rotationY: -38, transformPerspective: 1600 }, { x: 0, opacity: 1, rotationY: 4, transformPerspective: 1600, duration: 0.55, ease: "power3.out" }, DM);
      // "all": the ten free covers pop in under the bubble
      document.querySelectorAll("#s15-row .s15-tc").forEach((el, k) => {
        tl.fromTo(el, { opacity: 0, y: 30, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, w(6) - 0.06 + k * 0.03);
      });
      // "ten": a wave runs along the row and a green line underlines all ten
      document.querySelectorAll("#s15-row .s15-tcin").forEach((el, k) => {
        const t = w(7) - 0.02 + k * 0.03;
        tl.fromTo(el, { y: 0 }, { y: -16, duration: 0.12, ease: "power2.out" }, t);
        tl.fromTo(el, { y: -16 }, { y: 0, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, t + 0.12);
      });
      tl.fromTo("#s15-rline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, w(7) - 0.02);
      // the end card lands: a shine runs across the profile card and the logo tile pops once
      const END = Math.min(DUR - 0.8, w(7) + 0.44);
      tl.fromTo("#s15-shine", { x: -220, rotation: 16 }, { x: 1100, rotation: 16, duration: 0.7, ease: "power2.inOut" }, END);
      tl.fromTo("#s15-logo", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out" }, END + 0.06);
      tl.fromTo("#s15-logo", { scale: 1.08 }, { scale: 1, duration: 0.45, ease: "back.out(3)", immediateRender: false }, END + 0.18);

      // continuous layer: typing and caret
      const letters = Array.from(document.querySelectorAll("#s15-typed span"));
      const ph = document.getElementById("s15-ph"), caret = document.getElementById("s15-caret");
      function draw(t) {
        let n = 0;
        letters.forEach((s, k) => { const on = t >= TY0 + k * TYG; s.style.display = on ? "inline" : "none"; if (on) n++; });
        ph.style.opacity = n > 0 ? "0" : "1";
        const typing = t >= TY0 - 0.05 && t < TY0 + 4 * TYG + 0.05;
        caret.style.opacity = t >= TAP + 0.05 ? "0" : (typing || Math.floor(t * 2.4) % 2 === 0 ? "1" : "0");
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s15"] = tl;
    })();
  </script>
