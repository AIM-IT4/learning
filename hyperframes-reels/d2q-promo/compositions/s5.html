<template>
  <style>
    @font-face { font-family: "D2QSans"; font-weight: 100 900; src: url("assets/fonts/D2QSans.ttf"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("assets/fonts/JetBrainsMono.ttf"); }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s5-cam { position: absolute; inset: 0; transform-origin: 540px 1150px; }
    /* p04 shown at 1024 px from (28,690), so the chips have room to rise above it:
       top card x 268-788, y 820-1075 (face centre ~(533,935)); stack body x 259-818; base y~1612 */
    #s5-stack { position: absolute; inset: 0; transform-origin: 540px 1600px; }
    #s5-plate { position: absolute; left: 28px; top: 690px; width: 1024px; height: 1024px; }
    #s5-flash { position: absolute; left: 300px; top: 838px; width: 470px; height: 190px; border-radius: 50%; opacity: 0;
                background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.5) 40%, rgba(255,255,255,0) 72%); }
    /* each chip: a slot centred on (533, 888) that moves in the column and then bursts out, and an inner face that flips up out of the deck */
    .s5-slot { position: absolute; left: 233px; top: 855px; width: 600px; height: 66px; display: flex; justify-content: center; transform-origin: 300px 33px; }
    /* a block (not flex) so sub/sup keep their baseline shifts; line-height centres the one line in the pill */
    .s5-chip { position: relative; flex: none; display: block; height: 66px; padding: 0 28px; white-space: nowrap;
               transform-origin: 50% 100%; border-radius: 33px; opacity: 0;
               background: linear-gradient(180deg, #ffffff 0%, #ffffff 45%, #f3f5f8 100%); border: 2px solid #dfe4ea;
               box-shadow: 0 30px 60px rgba(17,20,24,0.12), 0 8px 18px rgba(17,20,24,0.06), inset 0 2px 0 #ffffff, inset 0 -3px 0 rgba(17,20,24,0.04);
               font: 700 33px/62px "JetBrains Mono", monospace; letter-spacing: -0.02em; word-spacing: -0.24em; color: #111418; }
    .s5-chip i { font-style: normal; color: #16a34a; font-weight: 800; }
    .s5-chip sub, .s5-chip sup { font-size: 0.62em; line-height: 0; }
    .s5-chip sub { vertical-align: -0.28em; }
    .s5-chip sup { vertical-align: 0.66em; }
    .s5-rt { display: inline-block; border-top: 2.5px solid currentColor; line-height: 0.95; padding: 1px 1px 0 1px; margin-left: -1px; }
  </style>
  <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
    <div id="s5-cam">
      <div id="s5-stack"><img id="s5-plate" src="assets/plates/p04.png" alt="" /></div>
      <div id="s5-flash"></div>
      <div class="s5-slot" id="s5-s0"><div class="s5-chip" id="s5-c0"><i>Δ</i>&nbsp;=&nbsp;N(d<sub>1</sub>)</div></div>
      <div class="s5-slot" id="s5-s1"><div class="s5-chip" id="s5-c1"><i>Γ</i>&nbsp;=&nbsp;<i>φ</i>(d<sub>1</sub>)/(S<i>σ</i>√<span class="s5-rt">T</span>)</div></div>
      <div class="s5-slot" id="s5-s2"><div class="s5-chip" id="s5-c2">C&nbsp;−&nbsp;P&nbsp;=&nbsp;S&nbsp;−&nbsp;Ke<sup>−rT</sup></div></div>
      <div class="s5-slot" id="s5-s3"><div class="s5-chip" id="s5-c3">dS&nbsp;=&nbsp;<i>μ</i>S&nbsp;dt&nbsp;+&nbsp;<i>σ</i>S&nbsp;dW</div></div>
      <div class="s5-slot" id="s5-s4"><div class="s5-chip" id="s5-c4"><i>Θ</i>,&nbsp;<i>ν</i>,&nbsp;<i>ρ</i>&nbsp;…</div></div>
    </div>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 1.95; const W = [0.16, 0.72, 1.16]; /*END*/
      // words: 0 Everyone 1 memorises 2 formulas.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.44);
      const tl = gsap.timeline({ paused: true });
      // camera: rises from below and settles on the stack, then holds
      tl.fromTo("#s5-cam", { y: 110, scale: 1.1 }, { y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0);

      const N = 5, GAP = 66, CX = 533, CY = 888;
      // the drill: one chip after another flips up out of the top card, each new one shoving the column up a notch,
      // a little faster each time, like rote; the fourth lands on "memorises"
      const BURST = w(2) - 0.03;
      const span = Math.max(0.5, Math.min(w(1) + 0.14, BURST - 0.2) - 0.06);
      const T = [0, 0.3, 0.55, 0.78, 1].map((f) => 0.06 + span * f);
      const tilt = [-2.5, 2, -1.5, 2.5, -1.8];
      for (let i = 0; i < N; i++) {
        tl.fromTo("#s5-c" + i, { opacity: 0, y: 46, scale: 0.86, rotationX: -88, transformPerspective: 700 },
                               { opacity: 1, y: 0, scale: 1, rotationX: 0, duration: 0.22, ease: "back.out(1.6)" }, T[i]);
        tl.fromTo("#s5-s" + i, { rotation: 0 }, { rotation: tilt[i], duration: 0.22, ease: "power2.out" }, T[i]);
        for (let k = i + 1; k < N; k++) {
          tl.fromTo("#s5-s" + i, { y: -GAP * (k - i - 1) }, { y: -GAP * (k - i), duration: 0.16, ease: "power3.out", immediateRender: false }, T[k]);
        }
        // the deck kicks and its top card flashes as each card leaves it
        tl.fromTo("#s5-stack", { y: 0 }, { y: 5, duration: 0.05, ease: "power1.out", immediateRender: i === 0 }, T[i]);
        tl.fromTo("#s5-stack", { y: 5 }, { y: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, T[i] + 0.05);
        tl.fromTo("#s5-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.04, ease: "none", immediateRender: i === 0 }, T[i]);
        tl.fromTo("#s5-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, T[i] + 0.04);
      }
      // "formulas": the whole column bursts out and the chips float around the stack, slightly turned
      const DEST = [[205, 706, -9], [800, 672, 7], [262, 1150, 6], [806, 1036, -6], [215, 1450, 8]];
      for (let i = 0; i < N; i++) {
        const [dx, dy, rot] = DEST[i], at = BURST + 0.012 * i;
        tl.fromTo("#s5-s" + i, { x: 0, y: -GAP * (N - 1 - i), rotation: tilt[i] },
                               { x: dx - CX, y: dy - CY, rotation: rot, duration: 0.55, ease: "expo.out", immediateRender: false }, at);
        tl.fromTo("#s5-c" + i, { scale: 1 }, { scale: 1.12, duration: 0.07, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo("#s5-c" + i, { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, at + 0.07);
        // a slow float on the face while the slot finishes its flight
        tl.fromTo("#s5-c" + i, { y: 0, rotation: 0 }, { y: i % 2 ? 10 : -12, rotation: i % 2 ? -1.6 : 1.6,
                  duration: Math.max(0.1, DUR - at - 0.08), ease: "sine.inOut", immediateRender: false }, at + 0.08);
      }
      tl.fromTo("#s5-stack", { scale: 1 }, { scale: 1.035, duration: 0.08, ease: "power2.out", immediateRender: false }, BURST);
      tl.fromTo("#s5-stack", { scale: 1.035 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, BURST + 0.08);
      window.__timelines["s5"] = tl;
    })();
  </script>
</template>
