    (function () {
      /*DATA*/ const DUR = 3.65; const W = [0.18, 0.52, 0.64, 0.96, 1.2, 1.32, 1.46, 2.1, 2.26, 2.56, 2.82, 2.96]; /*END*/
      // words: 0 If 1 you're 2 preparing 3 for 4 a 5 quant 6 interview, 7 this 8 changes 9 how 10 you 11 study.

      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const P = { press: w(2), glint: w(4), lit: w(6) - 0.04, q0: w(6) + 0.04, strike: w(7), flip: Math.max(w(8) + 0.06, w(7) + 0.3), chk: w(10), glow: w(11) };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s2-cam", { scale: 1, y: 0 }, { scale: 1.05, y: -10, duration: DUR, ease: "none" }, 0);
      // the set arrives in the first 0.3 s: desk slides up and settles, props scale in on a short stagger

      [["#s2-glass", 0.08], ["#s2-np", 0.13], ["#s2-sw", 0.1], ["#s2-sc", 0.18], ["#s2-holder", 0.16]].forEach(([id, at]) =>
        tl.fromTo(id, { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)" }, at));
      // W[6] "interview": the whiteboard lights up with the question

      tl.fromTo("#s2-scin", { scaleX: 0.02, filter: "blur(5px)" }, { scaleX: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out", immediateRender: false }, P.flip + 0.14);

      tl.fromTo("#s2-scglow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, P.glow);

      // stopwatch ticks (built once)

        ln.setAttribute("x2", (130 + r1 * Math.sin(a)).toFixed(2)); ln.setAttribute("y2", (145 - r1 * Math.cos(a)).toFixed(2));
        ln.setAttribute("stroke", maj ? "#0f172a" : "#94a3b8"); ln.setAttribute("stroke-width", maj ? "5" : "2.5"); ln.setAttribute("stroke-linecap", "round");

      ["s2-qlp","s2-strike","s2-chkp"].forEach((id) => { const e = document.getElementById(id); e.setAttribute("stroke-dasharray", "100 100"); e.setAttribute("stroke-dashoffset", "100"); });
      const backOut = (x) => { const s = 2.2; x -= 1; return x * x * ((s + 1) * x + s) + 1; };
      const TICK = 0.25;
      function draw(t) {
        // the hand ticks one mark every quarter second, with a small snap
        const n = Math.floor(t / TICK), f = clamp((t - n * TICK) / 0.08, 0, 1);
        const ang = -36 + 6 * (n - 1 + backOut(f));
        hand.setAttribute("transform", "rotate(" + ang.toFixed(2) + " 130 145)");
        // the button is pressed on "preparing"; a teal elapsed arc then follows the hand
        const pr = t - P.press, dip = pr >= 0 && pr < 0.2 ? Math.sin((pr / 0.2) * Math.PI) * 7 : 0;
        btn.setAttribute("transform", "rotate(44 130 145) translate(0 " + dip.toFixed(2) + ")");
        const from = -36 + 6 * Math.floor(P.press / TICK), span = pr >= 0 ? Math.max(0, ang - from) : 0;
        arc.setAttribute("stroke-dasharray", span.toFixed(2) + " 360");
        arc.setAttribute("transform", "rotate(" + (-90 + from).toFixed(2) + " 130 145)");
        // the water sways gently; a slosh when the props land and on "interview"
        const sl = 3.2 * Math.exp(-t * 3) * Math.sin(t * 13) + 1.6 * Math.sin(t * 2.6) + (t > P.lit ? 2.4 * Math.exp(-(t - P.lit) * 4) * Math.sin((t - P.lit) * 15) : 0);
        water.setAttribute("transform", "rotate(" + sl.toFixed(2) + " 75 78)");
        // nameplate glint on "a"
        const gp = clamp((t - P.glint) / 0.5, 0, 1);
        npsheen.setAttribute("x", (-60 + 520 * eio(gp)).toFixed(1));
        // the question writes on as the board lights up, a teal underline under "Hedge"
        const qp = clamp((t - P.q0) / 0.42, 0, 1);
        q.style.clipPath = qp >= 1 ? "none" : "inset(-20% " + (100 - 100 * qp).toFixed(1) + "% -20% -2%)";
        const lp = clamp((t - P.q0 - 0.4) / 0.25, 0, 1); qlp.setAttribute("stroke-dashoffset", (100 - 100 * lp).toFixed(2)); qlp.setAttribute("opacity", lp > 0 ? "1" : "0");
        wbsheen.style.transform = "translateX(" + (1200 * eio(clamp((t - P.lit) / 0.55, 0, 1))).toFixed(1) + "px) rotate(16deg)";
        const sp = clamp((t - P.strike) / 0.22, 0, 1); strike.setAttribute("stroke-dashoffset", (100 - 100 * sp).toFixed(2)); strike.setAttribute("opacity", sp > 0 ? "1" : "0");
        const cp = clamp((t - P.chk) / 0.22, 0, 1); chkp.setAttribute("stroke-dashoffset", (100 - 100 * cp).toFixed(2)); chkp.setAttribute("opacity", cp > 0 ? "1" : "0");
        if (t > P.glow) scglow.style.transform = "scale(" + (1 + 0.04 * Math.sin((t - P.glow) * 8)).toFixed(3) + ")";
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
