                  background: linear-gradient(140deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.16) 26%, rgba(255,255,255,0) 44%, rgba(255,255,255,0) 82%, rgba(255,255,255,0.18) 100%); }
  </style>
  <div id="root" data-composition-id="s9" data-width="1080" data-height="1920">
    <div id="s9-cam">
      <div id="s9-glow"></div>
      <img id="s9-plate" src="assets/plates/p08.png" alt="" />
      <div id="s9-screen">
        <div id="s9-bar">
          <div class="s9-dot" style="left:20px; background:#f43f5e;"></div>
          <div class="s9-dot" style="left:44px; background:#f59e0b;"></div>
          <div class="s9-dot" style="left:68px; background:#22c55e;"></div>
          <div id="s9-file">forward.py</div>
        </div>
        <div id="s9-ripple"></div>
        <div id="s9-runw" data-layout-allow-overlap><div id="s9-run0">▶ Run</div><div id="s9-run1">▶ Run</div></div>
        <div id="s9-hl"></div>
        <div class="s9-ln" style="top:70px" data-layout-ignore>1</div><div class="s9-ln" style="top:120px" data-layout-ignore>2</div><div class="s9-ln" style="top:170px" data-layout-ignore>3</div><div class="s9-ln" style="top:220px" data-layout-ignore>4</div>
        <div id="s9-code">
          <div class="s9-c" id="s9-c0" style="top:70px"></div>
          <div class="s9-c" id="s9-c1" style="top:120px"></div>
          <div class="s9-c" id="s9-c2" style="top:170px"></div>
          <div class="s9-c" id="s9-c3" style="top:220px"></div>
        </div>
        <div id="s9-cur"></div>
        <div id="s9-div"></div>
        <div id="s9-out"><span>Out</span><b>104.08</b></div>
        <div id="s9-glare"></div>
      </div>
      <div id="s9-cvp">
        <div id="s9-cover"><img src="assets/covers/equity-derivatives-quant-notes.jpg" alt="" /><i></i></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 2.2; const W = [0.16, 0.76, 0.92, 1.04, 1.14, 1.36, 1.5, 1.76]; /*END*/
      // words: 0 First, 1 notes 2 with 3 the 4 code 5 that 6 runs 7 them.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.2);
      const RUN = w(6), CODE = w(4);
      const T0 = 0.08, T1 = Math.max(T0 + 0.5, RUN - 0.1);   // typing finishes just before "runs"
      const tl = gsap.timeline({ paused: true });
      // camera: a whip in from the left with motion blur, then a slow push
      tl.fromTo("#s9-cam", { x: -140, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo("#s9-cam", { scale: 1 }, { scale: 1.04, duration: Math.max(0.2, DUR - 0.35), ease: "none" }, 0.35);
      // "notes": the real notes cover slides in at the lower left, tilted in 3D, over the laptop's corner
      tl.fromTo("#s9-cover", { x: -520, y: 40, rotationY: 58, rotationX: 8, rotation: -18 },
                { x: 0, y: 0, rotationY: 18, rotationX: 6, rotation: -6, duration: 0.5, ease: "expo.out" }, w(1) - 0.08);
      // "code": the code lights up, the Run button arms and the laptop's glow flares
      tl.fromTo("#s9-code", { filter: "brightness(1) drop-shadow(0px 0px 0px rgba(34,197,94,0))" },
                { filter: "brightness(1.35) drop-shadow(0px 0px 9px rgba(34,197,94,0.85))", duration: 0.1, ease: "power2.out" }, CODE - 0.04);
      tl.fromTo("#s9-code", { filter: "brightness(1.35) drop-shadow(0px 0px 9px rgba(34,197,94,0.85))" },
                { filter: "brightness(1) drop-shadow(0px 0px 0px rgba(34,197,94,0))", duration: 0.32, ease: "power2.out", immediateRender: false }, CODE + 0.08);
      tl.fromTo("#s9-hl", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, CODE - 0.04);
      tl.fromTo("#s9-run1", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, CODE - 0.02);
      tl.fromTo("#s9-runw", { scale: 1 }, { scale: 1.12, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, CODE - 0.02);
      tl.fromTo("#s9-glow", { opacity: 0.25 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, CODE - 0.04);
      tl.fromTo("#s9-glow", { opacity: 1 }, { opacity: 0.55, duration: 0.24, ease: "sine.out", immediateRender: false }, CODE + 0.12);
      // "runs": the button is pressed, a ripple leaves it, and the real output pops
      tl.fromTo("#s9-runw", { scale: 1 }, { scale: 0.9, duration: 0.06, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, RUN - 0.08);
      tl.fromTo("#s9-hl", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.out", immediateRender: false }, RUN - 0.04);
      tl.fromTo("#s9-out", { opacity: 0, y: 16, scale: 0.86 }, { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: "back.out(2.2)" }, RUN - 0.03);
      tl.fromTo("#s9-glow", { opacity: 0.55 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, RUN - 0.02);
      tl.fromTo("#s9-glow", { opacity: 1 }, { opacity: 0.6, duration: 0.4, ease: "sine.out", immediateRender: false }, RUN + 0.12);

      // the code (v2's forward-price example), typed in on the timeline
      const LINES = [
        [["from", "k"], [" math ", "i"], ["import", "k"], [" ", "i"], ["exp", "f"]],
        [["def", "k"], [" ", "i"], ["forward", "f"], ["(", "p"], ["S", "i"], [", ", "p"], ["r", "i"], [", ", "p"], ["q", "i"], [", ", "p"], ["T", "i"], ["):", "p"]],
        [["    ", "i"], ["return", "k"], [" S ", "i"], ["*", "p"], [" ", "i"], ["exp", "f"], ["((", "p"], ["r", "i"], [" - ", "p"], ["q", "i"], [")", "p"], [" * ", "p"], ["T", "i"], [")", "p"]],
        [["print", "f"], ["(", "p"], ["forward", "f"], ["(", "p"], ["100", "n"], [", ", "p"], ["0.05", "n"], [", ", "p"], ["0.01", "n"], [", ", "p"], ["1", "n"], ["))", "p"]],
      ];
      const LEN = LINES.map((L) => L.reduce((a, [s]) => a + s.length, 0));
      const TOTAL = LEN.reduce((a, b) => a + b, 0);
      const CH = 15.6;   // JetBrains Mono advance at 26 px
      const codeEls = [0, 1, 2, 3].map((i) => document.getElementById("s9-c" + i));
      const cur = document.getElementById("s9-cur"), ripple = document.getElementById("s9-ripple"), hl = document.getElementById("s9-hl");
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const shown = [-1, -1, -1, -1];
      function lineHTML(L, n) {
        let out = "", left = n;
        for (const [s, c] of L) { if (left <= 0) break; const part = s.slice(0, left); left -= part.length; out += '<span class="s9-' + c + '">' + part + "</span>"; }
        return out;
      }
      function draw(t) {
        const n = Math.floor(TOTAL * clamp((t - T0) / (T1 - T0), 0, 1));
        let rest = n, li = 0, col = 0;
        for (let i = 0; i < 4; i++) {
          const k = clamp(rest, 0, LEN[i]);
          if (k !== shown[i]) { codeEls[i].innerHTML = lineHTML(LINES[i], k); shown[i] = k; }
          if (k > 0 || i === 0) { li = i; col = k; }
          rest -= LEN[i];
        }
        cur.style.transform = "translate(" + (col * CH).toFixed(1) + "px," + (li * 50).toFixed(1) + "px)";
        const typing = t >= T0 && t <= T1 + 0.04;
        cur.style.opacity = t < RUN - 0.04 && (typing || Math.floor(t * 4) % 2 === 0) ? "1" : "0";
        // the line highlight follows the line being typed
        hl.style.top = (70 + li * 50) + "px";
        const rd = t - RUN + 0.04;
        if (rd >= 0 && rd < 0.42) { const q = rd / 0.42; ripple.style.opacity = (0.95 * (1 - q) * (1 - q)).toFixed(3); ripple.style.transform = "scale(" + (1 + 0.3 * q).toFixed(3) + "," + (1 + 0.6 * q).toFixed(3) + ")"; }
        else { ripple.style.opacity = "0"; ripple.style.transform = "scale(1,1)"; }
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s9"] = tl;
    })();
  </script>
