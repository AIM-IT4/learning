  <script>
    (function () {
      /*DATA*/ const DUR = 2.88; const W = [0.18, 0.44, 0.58, 0.74, 0.9, 1.38, 1.54, 1.98, 2.28]; /*END*/
      // words: 0 Don't 1 know 2 where 3 to 4 start? 5 10 6 resources 7 are 8 free.
      const w = (i) => (W.length > i ? W[i] : 0.18 + i * 0.35);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const T5 = w(5), T8 = w(8);
      const tl = gsap.timeline({ paused: true });

      // camera: slow pull-out that reveals the arc of covers
      tl.fromTo("#s9-cam", { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none" }, 0);
      // the signpost springs up from its base (its sway is drawn below)
      tl.fromTo("#s9-post", { opacity: 0, y: 240 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.02);
      tl.fromTo("#s9-floor", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.05);
      // "?" bubbles pop around it on Don't / know / where / to
      const Q = [[190, 1090], [892, 1012], [248, 1392], [838, 1338]];
      Q.forEach(([x, y], k) => {
        tl.fromTo("#s9-q" + k, { x: x, y: y, scale: 0, rotation: -20 }, { x: x, y: y, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.2)" }, Math.max(0.06, w(k) - 0.02));
        tl.fromTo("#s9-q" + k, { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, T5 - 0.12 + k * 0.03);
      });
      // "start?": the sign pumps and a shine crosses it
      tl.fromTo("#s9-signp", { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out" }, w(4) - 0.04);
      tl.fromTo("#s9-signp", { scale: 1.07 }, { scale: 1, duration: 0.45, ease: "back.out(3)", immediateRender: false }, w(4) + 0.08);
      tl.fromTo("#s9-shine", { x: -200 }, { x: 1060, duration: 0.6, ease: "power2.inOut" }, w(4) - 0.04);
      // "10": the signpost settles back a touch while the resources arrive under it
      tl.fromTo("#s9-post", { scale: 1 }, { scale: 0.96, duration: 0.5, ease: "power3.inOut" }, T5 - 0.1);

      // the stack pops in, then the ten covers fly out one after another into an arc hanging under the sign
      tl.fromTo("#s9-covers", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, T5 - 0.04);
      // slots: equal arc length along an ellipse hanging under the sign, so the covers spread evenly
      const RX = 400, RY = 580, CY = 900, SX = 540, SY = 1250, A0 = -76 * Math.PI / 180, A1 = 76 * Math.PI / 180;
      const PTS = [];
      let acc = 0, px = 0, py = 0;
      for (let k = 0; k <= 400; k++) {
        const a = A0 + (A1 - A0) * k / 400, x = 540 + RX * Math.sin(a), y = CY + RY * Math.cos(a);
        if (k > 0) acc += Math.hypot(x - px, y - py);
        PTS.push([a, x, y, acc]); px = x; py = y;
      }
      const slot = (i) => { const target = acc * i / 9; let k = 0; while (k < 400 && PTS[k + 1][3] <= target) k++; return PTS[k]; };
      const gapC = clamp((T8 - 0.08 - 0.34 - (T5 + 0.12)) / 9, 0.03, 0.1);
      const covers = Array.from(document.querySelectorAll("#s9-covers .s9-cv"));
      const LAND = [];
      covers.forEach((c, i) => {
        const [a, x, y] = slot(i);
        const d = 9 - i;                               // cover 0 sits on top of the stack and flies first
        c.style.zIndex = String(20 - i);
        const t0 = T5 + 0.12 + i * gapC;
        LAND.push(t0 + 0.22);
        tl.fromTo(c, { x: SX + d * 2, y: SY - d * 4, rotation: (i % 2 ? 4 : -4), scale: 0.92 },
                     { x: x, y: y, rotation: -a * 180 / Math.PI * 0.1, scale: 1, duration: 0.34, ease: "back.out(1.3)" }, t0);
      });
      tl.fromTo("#s9-chip", { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, LAND[0] - 0.04);

      // "free": the ribbon stamps across the arc; the covers feel the hit; sparkles; a shine runs along the ribbon
      const FT = T8 - 0.03;
      tl.fromTo("#s9-rib", { opacity: 0, scale: 1.9, rotation: -15 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.22, ease: "power4.out" }, FT);
      tl.fromTo("#s9-covers", { scale: 1 }, { scale: 1.03, duration: 0.07, ease: "power2.out", immediateRender: false }, FT + 0.12);
      tl.fromTo("#s9-covers", { scale: 1.03 }, { scale: 1, duration: 0.35, ease: "back.out(3)", immediateRender: false }, FT + 0.19);
      tl.fromTo("#s9-rshine", { x: -160 }, { x: 900, duration: 0.6, ease: "power2.inOut" }, FT + 0.28);
      [[150, 1150], [935, 1120], [905, 1390]].forEach(([x, y], k) => {
        tl.fromTo("#s9-sp" + k, { x: x, y: y, scale: 0, rotation: 0 }, { x: x, y: y, scale: 1.2, rotation: 45, duration: 0.22, ease: "back.out(2)" }, FT + 0.12 + k * 0.05);
        tl.fromTo("#s9-sp" + k, { scale: 1.2, opacity: 1 }, { scale: 0.7, opacity: 0.85, duration: 0.5, ease: "power2.out", immediateRender: false }, FT + 0.34 + k * 0.05);
      });

      // continuous layer: damped sway of the signpost, bobbing bubbles and covers, glow pulse, the counter chip
      const sway = document.getElementById("s9-sway"), glow = document.getElementById("s9-glow");
      const qin = Array.from(document.querySelectorAll("#s9-qs .s9-qin"));
      const cvin = covers.map((c) => c.querySelector(".s9-cvin"));
      const num = document.getElementById("s9-num"), unit = document.getElementById("s9-unit"), chipin = document.getElementById("s9-chipin");
      const SW0 = 0.04;
      function draw(t) {
        const tau = Math.max(0, t - SW0);
        const th = -12 * Math.exp(-3.0 * tau) * Math.cos(6.8 * tau) + 1.1 * Math.sin(2.4 * t + 0.4) * (1 - Math.exp(-2 * tau));
        sway.style.transform = "rotate(" + th.toFixed(2) + "deg)";
        qin.forEach((q, k) => { q.style.transform = "translateY(" + (10 * Math.sin(t * 3.1 + k * 1.7)).toFixed(1) + "px)"; });
        cvin.forEach((c, i) => {
          const on = clamp((t - LAND[i] - 0.1) / 0.3, 0, 1);
          c.style.transform = "translateY(" + (on * 7 * Math.sin(t * 2.8 + i * 0.9)).toFixed(1) + "px)";
        });
        let n = 0, last = -9;
        LAND.forEach((l) => { if (t >= l) { n++; last = l; } });
        num.textContent = String(Math.max(1, n));
        unit.textContent = n > 1 ? "resources" : "resource";
        const bump = n > 0 ? 0.1 * Math.exp(-(t - last) * 12) : 0;
        chipin.style.transform = "scale(" + (1 + bump).toFixed(3) + ")";
        glow.style.opacity = (0.75 + 0.25 * Math.sin(t * 3.6) + (t > T8 ? 0.15 : 0)).toFixed(3);
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s9"] = tl;
    })();
  </script>
