  <style>

    #s4-halo { position: absolute; left: -10px; top: 640px; width: 1100px; height: 960px; border-radius: 50%; opacity: 0.6;

               border: 1.5px solid rgba(255,255,255,0.14);

              font: 700 26px/41px "JetBrains Mono", monospace; color: #fb7185; background: rgba(244,63,94,0.12); border: 1.5px solid rgba(244,63,94,0.55); }
    #s4-chart { position: absolute; left: 24px; top: 100px; width: 852px; height: 420px; }
    .s4-ax { position: absolute; left: 62px; width: 34px; text-align: right; font: 600 26px/32px "JetBrains Mono", monospace; color: #9aa4b2; }
    #s4-tx { position: absolute; left: 112px; top: 462px; font: 600 26px/32px "JetBrains Mono", monospace; color: #9aa4b2; }

    #s4-track { position: absolute; left: 290px; top: 585px; width: 520px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.10); }

               box-shadow: 0 0 12px rgba(34,197,94,0.55); }
    #s4-knob { position: absolute; left: 267px; top: 569px; width: 46px; height: 46px; border-radius: 23px; background: #f4f6f7; border: 7px solid #22c55e;
               box-shadow: 0 0 0 6px rgba(34,197,94,0.16), 0 6px 16px rgba(0,0,0,0.5), 0 0 18px rgba(34,197,94,0.5); }
    #s4-slv { position: absolute; left: 240px; top: 520px; width: 100px; text-align: center; font: 800 36px/1 "JetBrains Mono", monospace; color: #f4f6f7; }

                border: 1.5px solid rgba(255,255,255,0.20); box-shadow: 0 22px 44px rgba(0,0,0,0.5), 0 0 30px rgba(34,197,94,0.16); }
    #s4-cover img { display: block; width: 100%; height: 100%; }
    #s4-cover i { position: absolute; inset: 0; background: linear-gradient(140deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.10) 26%, rgba(255,255,255,0) 44%); }
    #s4-sheen { position: absolute; left: -900px; top: 0; width: 2700px; height: 950px;
                background: linear-gradient(105deg, rgba(255,255,255,0) 44%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0) 56%); }
    #s4-glint { position: absolute; left: 0; top: -40px; width: 280px; height: 1030px; opacity: 0;
                background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.13) 50%, rgba(255,255,255,0) 100%); }
  </style>
  <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
    <div id="s4-cam">
      <div id="s4-halo"></div>
      <div id="s4-under"></div>
      <div id="s4-persp">
        <div id="s4-card">
          <div id="s4-head">
            <div class="s4-dot" style="left:34px; background:#f43f5e;"></div>
            <div class="s4-dot" style="left:64px; background:#f59e0b;"></div>
            <div class="s4-dot" style="left:94px; background:#22c55e;"></div>
            <div id="s4-file" data-layout-ignore>delta_hedging.ipynb</div>
            <div id="s4-one">one simulated path</div>
          </div>
          <canvas id="s4-chart" width="852" height="420"></canvas>
          <div class="s4-ax" style="top:394px">0</div>
          <div class="s4-ax" style="top:197px">2</div>
          <div id="s4-tx">time to expiry →</div>
          <div id="s4-sllab">rebalances</div>
          <div id="s4-track"><div id="s4-fill"></div></div>
          <div id="s4-knob"></div>
          <div id="s4-slv">5</div>
          <div id="s4-errlab">final hedging error</div>
          <div id="s4-ph">–.––</div>
          <div id="s4-err">2.32</div>
          <div id="s4-cover"><img src="assets/covers/stochastic-calculus-visual-lab.jpg" alt="" /><i></i></div>
          <div id="s4-sheen"></div>
          <div id="s4-glint"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 7.75; const W = [0.16, 0.37, 0.85, 1.66, 1.85, 1.97, 2.23, 2.91, 3.03, 3.15, 3.43, 3.75, 4.845, 5.053, 5.47, 6.26]; /*END*/
      // words: 0 One 1 simulated 2 path. 3 Hedge 4 it 5 five 6 times, 7 and 8 the 9 error 10 is 11 2.32 | 12 Two 13 hundred 14 times: 15 0.07
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.32);
      // v2's beats: the path draws from "One" to "Hedge", ticks on "five", a rose pulse from "error" to "Two",
      // the readout on "2.32", and from "Two" the knob, the path and the error move together; the final jump lands on "0.07"
      const P = { chart0: w(0), chart1: w(3), ticks0: w(5), pulse0: w(9), pulse1: w(12), errIn: w(11) - 0.1, slide0: w(12), land: w(15) - 0.02 };
      P.slide1 = Math.max(P.slide0 + 0.3, P.land);
      const tl = gsap.timeline({ paused: true });
      // camera: the card orbits in (rotateY -10 -> 0, expo.out 0.8 s), then drifts on to +4 deg; a slow push over the whole shot
      tl.fromTo("#s4-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#s4-card", { rotationY: -10, rotationX: 8, z: -160, y: 40 }, { rotationY: 0, rotationX: 4, z: 0, y: 0, duration: 0.8, ease: "expo.out" }, 0);
      tl.fromTo("#s4-card", { rotationY: 0 }, { rotationY: 4, duration: DUR - 0.8, ease: "sine.inOut", immediateRender: false }, 0.8);
      tl.fromTo("#s4-sheen", { x: -340 }, { x: 0, duration: 0.8, ease: "expo.out" }, 0);
      tl.fromTo("#s4-sheen", { x: 0 }, { x: 150, duration: DUR - 0.8, ease: "sine.inOut", immediateRender: false }, 0.8);
      // "simulated": the label; "path.": the real notebook's cover
      tl.fromTo("#s4-one", { opacity: 0, scale: 0.6, x: 24 }, { opacity: 1, scale: 1, x: 0, duration: 0.3, ease: "back.out(2)" }, w(1) - 0.04);
      tl.fromTo("#s4-cover", { opacity: 0, rotation: 12, y: 40, scale: 0.85 }, { opacity: 1, rotation: 3, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, w(2) + 0.3);
      // "0.07": the card punches, the glow under it flares, a glint crosses the glass, the label turns green
      tl.fromTo("#s4-card", { scale: 1 }, { scale: 1.025, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, P.land - 0.01);
      tl.fromTo("#s4-under", { opacity: 0.7, scaleX: 1 }, { opacity: 1, scaleX: 1.16, duration: 0.16, ease: "power2.out" }, P.land);
      tl.fromTo("#s4-under", { opacity: 1, scaleX: 1.16 }, { opacity: 0.9, scaleX: 1.06, duration: 0.8, ease: "sine.out", immediateRender: false }, P.land + 0.16);
      tl.fromTo("#s4-halo", { opacity: 0.6 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, P.land);
      tl.fromTo("#s4-halo", { opacity: 1 }, { opacity: 0.8, duration: 0.8, ease: "sine.out", immediateRender: false }, P.land + 0.16);
      tl.fromTo("#s4-glint", { x: -320, opacity: 1 }, { x: 960, opacity: 1, duration: 0.6, ease: "power2.inOut" }, P.land + 0.06);
      tl.fromTo("#s4-one", { color: "#fb7185", backgroundColor: "rgba(244,63,94,0.12)", borderColor: "rgba(244,63,94,0.55)" },
                { color: "#4ade80", backgroundColor: "rgba(34,197,94,0.14)", borderColor: "rgba(34,197,94,0.65)", duration: 0.08, ease: "none" }, P.land);
      tl.fromTo("#s4-one", { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, P.land);

      const nr = (function (a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })(77);
      const NOISE = Array.from({ length: 400 }, () => (nr() + nr() + nr() - 1.5) / 0.75);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const mix = (a, b, k) => a + (b - a) * k;
      const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
      const mixa = (c1, c2, k) => { const a = hex(c1), b = hex(c2); return a.map((v, i) => Math.round(mix(v, b[i], k))); };
      const rgb = (a, al) => (al === undefined ? "rgb(" + a.join(",") + ")" : "rgba(" + a.join(",") + "," + al.toFixed(3) + ")");
      // rose -> amber -> green through hue (a straight RGB mix of rose and green goes muddy brown)
      const hsl2rgb = (h, s, l) => { h = ((h % 360) + 360) % 360; const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
        const v = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
        return v.map((q) => Math.round((q + m) * 255)); };
      const heat = (k) => hsl2rgb(349.7 + 152.4 * k, 0.892 - 0.187 * k, 0.602 - 0.149 * k);
      // a 0 -> 1 -> 0 bump: up over `up` seconds from `at`, back down over `dn`
      const bump = (t, at, up, dn) => (t < at ? 0 : t < at + up ? Math.sin(((t - at) / up) * Math.PI / 2) : t < at + up + dn ? 1 - (t - at - up) / dn : 0);
      const cv = document.getElementById("s4-chart"), g = cv.getContext("2d");
      const err = document.getElementById("s4-err"), ph = document.getElementById("s4-ph");
      const knob = document.getElementById("s4-knob"), fill = document.getElementById("s4-fill"), slv = document.getElementById("s4-slv");
      // the notebook's two real readings: 5 rebalances -> 2.32, 200 -> 0.07; in between a power law joins them
      const nAt = (t) => 5 * Math.pow(40, ease(clamp((t - P.slide0) / (P.slide1 - P.slide0), 0, 1)));
      const errAt = (N) => 2.32 * Math.pow(N / 5, Math.log(0.07 / 2.32) / Math.log(40));
      const goodness = (E) => clamp(Math.log(2.32 / E) / Math.log(2.32 / 0.07), 0, 1);   // 0 at 2.32 (rose), 1 at 0.07 (green)
      const L = 84, R = 812, Tp = 34, Bt = 350, y0 = -0.4, y1 = 2.8;
      const Y = (v) => Bt - ((v - y0) / (y1 - y0)) * (Bt - Tp);
      function drawChart(t) {
        g.clearRect(0, 0, 852, 420);
        g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,0.07)";
        for (let gl = 0.5; gl <= 2.5; gl += 0.5) { g.beginPath(); g.moveTo(L, Y(gl)); g.lineTo(R, Y(gl)); g.stroke(); }
        g.strokeStyle = "rgba(255,255,255,0.18)"; g.beginPath(); g.moveTo(L, Bt + 2); g.lineTo(R, Bt + 2); g.stroke();
        g.setLineDash([10, 10]); g.strokeStyle = "rgba(255,255,255,0.32)"; g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(R, Y(0)); g.stroke(); g.setLineDash([]);
        const N = nAt(t), E = errAt(N);
        const rev = clamp((t - P.chart0) / (P.chart1 - P.chart0), 0, 1);
        if (rev <= 0) return;
        const steps = Math.max(1, Math.round(N));
        const landed = t >= P.land;
        const col = landed ? hex("#22c55e") : heat(goodness(E));
        // the path: hedging error along one simulated path, re-hedged at each rebalance
        const M = 400, upto = Math.floor(M * rev), pts = [];
        for (let i = 0; i <= upto; i++) {
          const x = i / M, xq = Math.floor(x * steps) / steps, j = Math.min(M - 1, Math.floor(xq * M));
          pts.push([L + x * (R - L), Y(E * (xq + 0.55 * NOISE[j] * Math.sin(Math.PI * xq)))]);
        }
        const grd = g.createLinearGradient(0, Tp, 0, Y(0));
        grd.addColorStop(0, rgb(col, 0.26)); grd.addColorStop(1, rgb(col, 0));
        g.fillStyle = grd; g.beginPath(); g.moveTo(pts[0][0], Y(0));
        pts.forEach(([x, y]) => g.lineTo(x, y));
        g.lineTo(pts[pts.length - 1][0], Y(0)); g.closePath(); g.fill();
        g.save();
        g.shadowColor = rgb(col, 0.9); g.shadowBlur = 16;
        g.strokeStyle = rgb(col); g.lineWidth = 6; g.lineJoin = "round"; g.lineCap = "round";
        g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke();
        if (rev >= 1) { g.fillStyle = rgb(col); g.beginPath(); g.arc(R, Y(E), 11, 0, 6.2832); g.fill(); }
        g.restore();
        // the rebalances themselves: one tick per hedge on the time axis, popping in on "five", a dense comb at 200
        const shown = t < P.slide0 ? Math.min(5, Math.floor(clamp((t - P.ticks0) / 0.5, 0, 1) * 5.999)) : steps;
        for (let k = 1; k <= shown; k++) {
          const x = L + (k / steps) * (R - L);
          const pop = t < P.slide0 ? clamp((t - P.ticks0 - (k - 1) * 0.1) / 0.15, 0, 1) : 1;
          g.strokeStyle = "rgba(34,197,94," + ((steps > 40 ? 0.6 : 0.95) * pop).toFixed(3) + ")";
          g.lineWidth = steps > 40 ? 2 : 4;
          g.beginPath(); g.moveTo(x, Bt + 2); g.lineTo(x, Bt - (steps > 40 ? 12 : 20 * pop)); g.stroke();
          if (steps <= 40) { g.setLineDash([6, 8]); g.strokeStyle = "rgba(34,197,94," + (0.22 * pop).toFixed(3) + ")"; g.lineWidth = 2;
            g.beginPath(); g.moveTo(x, Bt - 20); g.lineTo(x, Tp); g.stroke(); g.setLineDash([]); }
        }
        // a rose pulse on the path's end while the error is named; a green burst when it lands
        if (rev >= 1 && t > P.pulse0 && t < P.pulse1) {
          const q = ((t - P.pulse0) % 0.55) / 0.55;
          g.strokeStyle = "rgba(244,63,94," + (0.65 * (1 - q)).toFixed(3) + ")"; g.lineWidth = 4;
          g.beginPath(); g.arc(R, Y(E), 14 + 30 * q, 0, 6.2832); g.stroke();
        }
        if (landed && t < P.land + 0.6) {
          const q = (t - P.land) / 0.6;
          g.strokeStyle = "rgba(34,197,94," + (0.95 * (1 - q) * (1 - q)).toFixed(3) + ")"; g.lineWidth = 5;
          g.beginPath(); g.arc(R, Y(E), 14 + 64 * q, 0, 6.2832); g.stroke();
        }
      }
      function drawReadouts(t) {
        const p = ease(clamp((t - P.slide0) / (P.slide1 - P.slide0), 0, 1));
        const x = p * 520;
        knob.style.left = (267 + x).toFixed(1) + "px";
        slv.style.left = (240 + x).toFixed(1) + "px";
        fill.style.width = x.toFixed(1) + "px";
        slv.textContent = String(Math.round(nAt(t)));
        // the knob answers "five", and again when 200 lands
        const pk = Math.max(bump(t, P.ticks0 - 0.04, 0.14, 0.16), bump(t, P.land, 0.1, 0.25));
        knob.style.transform = "scale(" + (1 + 0.3 * pk).toFixed(3) + ")";
        slv.style.transform = "scale(" + (1 + 0.35 * pk).toFixed(3) + ")";
        slv.style.color = rgb(mixa("#f4f6f7", "#4ade80", Math.max(pk, p)));
        // the error readout: 2.32 in rose, counting down through the power law, the final jump to 0.07 on the word
        const c = clamp((t - P.slide0) / (P.land - P.slide0), 0, 1);
        const landed = t >= P.land;
        const E = landed ? 0.07 : Math.max(0.08, errAt(nAt(t)));
        let s = E.toFixed(2);
        if (c > 0.04 && c < 0.72) { const f = Math.floor(t * 30); s = s.slice(0, -2) + ((f * 7) % 10) + ((f * 3 + 5) % 10); }
        err.textContent = s;
        const vis = clamp((t - P.errIn) / 0.16, 0, 1);
        err.style.opacity = vis.toFixed(3);
        ph.style.opacity = (1 - vis).toFixed(3);
        if (landed) {
          const gl = 1 - 0.5 * clamp((t - P.land) / 0.8, 0, 1);
          err.style.color = "#22c55e";
          err.style.textShadow = "0 0 " + (54 * gl).toFixed(1) + "px rgba(34,197,94," + (0.95 * gl).toFixed(3) + ")";
        } else {
          const breathe = t > P.pulse0 && t < P.slide0 ? 0.5 - 0.5 * Math.cos(((t - P.pulse0) / 0.55) * 2 * Math.PI) : 0;
          err.style.color = rgb(heat(0.9 * goodness(E)));
          err.style.textShadow = "0 0 " + (26 + 18 * breathe).toFixed(1) + "px rgba(244,63,94," + ((0.32 + 0.3 * breathe) * (1 - goodness(E))).toFixed(3) + ")";
        }
        const pop = Math.max(bump(t, P.errIn, 0.001, 0.26) * 0.16, bump(t, P.land, 0.001, 0.3) * 0.14);
        err.style.transform = "scale(" + (1 + pop).toFixed(3) + ")";
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { drawChart(st.t); drawReadouts(st.t); } }, 0);
      window.__timelines["s4"] = tl;
    })();
  </script>
</template>
