  <script>
    (function () {
      /*DATA*/ const DUR = 5.509; const W = [0.18, 0.54, 1.0, 2.005, 2.145, 2.485, 2.725, 2.925, 3.065, 3.245, 3.705, 4.145, 4.305, 4.525, 4.905]; /*END*/
      // words: 0 Everyone 1 memorises 2 formulas. | 3 But 4 formulas 5 were 6 never 7 the 8 hard 9 part. 10 Explaining 11 them 12 under 13 pressure 14 is.
      const w = (i) => (W.length > i ? W[i] : 0.2 + i * 0.32);
      const CARD0 = 0.04, CARD4 = Math.max(CARD0 + 0.8, w(2) + 0.02);          // five cards, one about every 0.3 s
      const P2 = w(3);                                                         // the pile slides left, the gauge rises
      const LAND = P2 + 0.1 + 0.62;                                             // gauge settled
      const ARC0 = P2 + 0.5, ARC1 = P2 + 1.1;                                   // coloured arc draws on
      const SW0 = w(10), SW1 = Math.max(w(13), w(10) + 0.3);                    // needle sweep, lands on "pressure"
      const tl = gsap.timeline({ paused: true });

      // one slow camera move
      tl.fromTo("#s4-cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);

      // formula cards fly in from alternating sides and stack into a neat cascade
      const ROT = [-1.1, 0.9, -0.7, 1.0, -0.5];
      for (let i = 0; i < 5; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const at = CARD0 + ((CARD4 - CARD0) * i) / 4;
        tl.fromTo("#s4-c" + i,
          { x: side * 820, y: -260 + (i % 3) * 60, rotation: side * 26, scale: 1.08, opacity: 0, filter: "blur(5px)" },
          { x: 0, y: 0, rotation: ROT[i], scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.44, ease: "back.out(1.25)" }, at);
      }
      tl.fromTo("#s4-pfloor", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: CARD4 + 0.4, ease: "power2.out" }, 0.05);

      // the pile slides left and dims; the gauge rises in from below
      tl.fromTo("#s4-pile", { x: 0, y: 0, scale: 1, opacity: 1 }, { x: -232, y: -315, scale: 0.54, opacity: 0.5, duration: 0.7, ease: "power3.inOut" }, P2);
      tl.fromTo("#s4-pfloor", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, P2);
      tl.fromTo("#s4-gwrap", { y: 1150, opacity: 1 }, { y: 0, opacity: 1, duration: 0.72, ease: "back.out(0.85)" }, P2 + 0.1);
      tl.fromTo("#s4-gfloor", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, P2 + 0.4);
      tl.fromTo("#s4-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, ARC1 - 0.2);

      // "Explain it. Live." pops
      tl.fromTo("#s4-chip", { opacity: 0, scale: 0.35, rotation: -10 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.42, ease: "back.out(2.2)" }, SW0);

      // procedural parts: arc + ticks, needle, shake, glows, live dot
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const mix = (a, b, k) => a + (b - a) * k;
      const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
      const mixc = (c1, c2, k) => { const a = hex(c1), b = hex(c2); return "rgb(" + a.map((v, i) => Math.round(mix(v, b[i], k))).join(",") + ")"; };
      const easeOut = (x) => 1 - Math.pow(1 - x, 3);
      const R = Math.PI / 180;
      const g = document.getElementById("s4-arc").getContext("2d");
      const GC = 370, AR = 272, AW = 46, A0 = -130, A1 = 130;
      const STOPS = [[-130, "#08a9a2"], [-48, "#14b8a6"], [-18, "#f59e0b"], [26, "#f59e0b"], [56, "#f43f5e"], [130, "#e11d48"]];
      function colAt(a) {
        for (let k = 0; k < STOPS.length - 1; k++) {
          const [a0, c0] = STOPS[k], [a1, c1] = STOPS[k + 1];
          if (a <= a1) return mixc(c0, c1, clamp((a - a0) / (a1 - a0), 0, 1));
        }
        return STOPS[STOPS.length - 1][1];
      }
      function drawGauge(p, hot) {
        g.clearRect(0, 0, 740, 740);
        // groove for the arc
        g.lineCap = "round"; g.lineWidth = AW + 12; g.strokeStyle = "rgba(15,23,42,0.07)";
        g.beginPath(); g.arc(GC, GC, AR, (A0 - 90) * R, (A1 - 90) * R); g.stroke();
        if (p <= 0) return;
        const aEnd = A0 + (A1 - A0) * p;
        g.lineCap = "butt"; g.lineWidth = AW;
        for (let a = A0; a < aEnd; a += 1) {
          const b = Math.min(aEnd, a + 1.25);
          g.strokeStyle = colAt(a + 0.5);
          if (hot > 0 && a > 50) { g.shadowColor = "rgba(244,63,94," + (0.85 * hot).toFixed(3) + ")"; g.shadowBlur = 26 * hot; } else { g.shadowBlur = 0; }
          g.beginPath(); g.arc(GC, GC, AR, (a - 90) * R, (b - 90) * R); g.stroke();
        }
        g.shadowBlur = 0;
        // rounded ends
        [[A0, colAt(A0)], [aEnd, colAt(aEnd)]].forEach(([a, c]) => {
          g.fillStyle = c; g.beginPath(); g.arc(GC + AR * Math.cos((a - 90) * R), GC + AR * Math.sin((a - 90) * R), AW / 2, 0, 6.2832); g.fill();
        });
        // gloss: a bright line along the outer edge, a soft shade along the inner edge
        g.lineCap = "round";
        g.lineWidth = 5; g.strokeStyle = "rgba(255,255,255,0.55)";
        g.beginPath(); g.arc(GC, GC, AR + AW / 2 - 7, (A0 - 90) * R, (aEnd - 90) * R); g.stroke();
        g.lineWidth = 4; g.strokeStyle = "rgba(15,23,42,0.13)";
        g.beginPath(); g.arc(GC, GC, AR - AW / 2 + 3, (A0 - 90) * R, (aEnd - 90) * R); g.stroke();
        // ticks
        for (let k = 0; k <= 40; k++) {
          const a = A0 + k * 6.5;
          if (a > aEnd + 0.01) break;
          const major = k % 4 === 0, r1 = AR - AW / 2 - 14, r0 = r1 - (major ? 38 : 18);
          g.strokeStyle = major ? "#334155" : "#94a3b8"; g.lineWidth = major ? 7 : 4;
          const c = Math.cos((a - 90) * R), s = Math.sin((a - 90) * R);
          g.beginPath(); g.moveTo(GC + r0 * c, GC + r0 * s); g.lineTo(GC + r1 * c, GC + r1 * s); g.stroke();
        }
      }
      const A_REST = -112, A_HIT = 108;
      function needleAngle(t) {
        const tremor = 1.6 * Math.sin(t * 11.3) + 0.9 * Math.sin(t * 27.1 + 1.3);
        if (t < LAND - 0.25) return -130;
        if (t < SW0) { const d = t - (LAND - 0.25); return A_REST + (-130 - A_REST) * Math.exp(-d * 6) * Math.cos(d * 16) + tremor * clamp(d * 3, 0, 1); }
        if (t < SW1) { const u = (t - SW0) / (SW1 - SW0); return mix(A_REST, A_HIT, Math.pow(u, 1.7)) + tremor * (1 - u); }
        const d = t - SW1;
        return A_HIT + 10 * Math.exp(-d * 7) * Math.sin(d * 34) + 1.4 * Math.sin(t * 31) + 0.8 * Math.sin(t * 47 + 2);
      }
      const needle = document.getElementById("s4-needle"), shake = document.getElementById("s4-gshake");
      const rglow = document.getElementById("s4-rglow"), ring = document.getElementById("s4-ring");
      function draw(t) {
        const p = easeOut(clamp((t - ARC0) / (ARC1 - ARC0), 0, 1));
        const hot = t < SW1 - 0.04 ? 0 : clamp((t - SW1 + 0.04) / 0.14, 0, 1) * (0.78 + 0.22 * Math.sin((t - SW1) * 12));
        drawGauge(p, hot);
        needle.style.transform = "rotate(" + needleAngle(t).toFixed(2) + "deg)";
        const d = t - SW1;
        if (d >= 0) {
          const k = Math.exp(-d * 8);
          shake.style.transform = "translate(" + (13 * k * Math.sin(d * 46)).toFixed(2) + "px," + (4 * k * Math.sin(d * 39 + 1)).toFixed(2) + "px) rotate(" + (0.9 * k * Math.sin(d * 37)).toFixed(3) + "deg)";
        } else shake.style.transform = "none";
        rglow.style.opacity = hot.toFixed(3);
        const ph = ((t * 1.5) % 1 + 1) % 1;
        ring.style.transform = "scale(" + (1 + 1.3 * ph).toFixed(3) + ")";
        ring.style.opacity = (0.75 * (1 - ph)).toFixed(3);
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s4"] = tl;
    })();
