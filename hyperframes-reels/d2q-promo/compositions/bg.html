<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #eef3f8; }
    #bg-a { position: absolute; inset: 0; background-color: #eef3f8;
            background-image: radial-gradient(circle at 1.5px 1.5px, #d3dce8 1.5px, transparent 2px); background-size: 36px 36px; }
    #bg-b { position: absolute; inset: 0; opacity: 0; background-color: #e6f6f4;
            background-image: radial-gradient(ellipse 62% 40% at 50% 56%, rgba(8,169,162,0.30), rgba(8,169,162,0) 72%),
                              radial-gradient(circle at 1.5px 1.5px, #c9e7e3 1.5px, transparent 2px);
            background-size: 100% 100%, 36px 36px; }
    #bg-sq { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="bg" data-width="1080" data-height="1920">
    <div id="bg-a"></div>
    <div id="bg-b"></div>
    <canvas id="bg-sq" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 45.49; const SHOTS = [[0.0, "A"], [3.117, "B"], [6.726, "A"], [14.351, "B"], [19.86, "A"], [24.177, "B"], [26.661, "A"], [31.511, "B"], [34.949, "A"], [37.829, "B"], [41.855, "A"]]; /*END*/
      const tl = gsap.timeline({ paused: true });
      // the background alternates paper (A) and mint (B) on every cut; the pixel wipe in the overlay hides the switch
      SHOTS.forEach(([t0, bg]) => tl.set("#bg-b", { opacity: bg === "B" ? 1 : 0 }, t0));
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(2026);
      const SQ = Array.from({ length: 44 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, s: 8 + rnd() * 18, v: 8 + rnd() * 22,
        a: 0.08 + rnd() * 0.2, w: 0.6 + rnd() * 1.4, ph: rnd() * 6.28, teal: rnd() < 0.7 }));
      const g = document.getElementById("bg-sq").getContext("2d");
      const st = { t: 0 };
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        SQ.forEach((q) => {
          const y = ((q.y - q.v * t) % 1920 + 1920) % 1920;
          const al = q.a * (0.55 + 0.45 * Math.sin(t * q.w + q.ph));
          g.fillStyle = q.teal ? "rgba(8,169,162," + al.toFixed(3) + ")" : "rgba(15,23,42," + (al * 0.4).toFixed(3) + ")";
          g.fillRect(q.x, y, q.s, q.s);
        });
      }
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      window.__timelines["bg"] = tl;
    })();
  </script>
</template>
