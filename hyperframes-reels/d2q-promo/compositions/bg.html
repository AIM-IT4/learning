<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #eceef0; }
    #bg-l { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 45% at 50% 58%, #f7f8f9 0%, #eceef0 60%, #e4e7ea 100%); }
    #bg-d { position: absolute; inset: 0; opacity: 0;
            background: radial-gradient(ellipse 58% 34% at 50% 60%, rgba(34,197,94,0.34) 0%, rgba(34,197,94,0.10) 45%, rgba(34,197,94,0) 72%),
                        radial-gradient(ellipse 90% 70% at 50% 55%, #1a2028 0%, #12161c 70%, #0d1015 100%); }
    #bg-px { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="bg" data-width="1080" data-height="1920">
    <div id="bg-l"></div>
    <div id="bg-d"></div>
    <canvas id="bg-px" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 47.07; const SHOTS = [[0.0, "L"], [1.93, "D"], [3.33, "L"], [7.1, "D"], [14.91, "L"], [16.86, "D"], [21.2, "L"], [23.44, "D"], [25.37, "L"], [27.57, "D"], [32.03, "L"], [35.11, "D"], [36.93, "L"], [38.83, "D"], [43.07, "L"]]; /*END*/
      const tl = gsap.timeline({ paused: true });
      // light and dark scenes alternate on every cut, as in the reference; the overlay's wipe hides each switch
      SHOTS.forEach(([t0, th]) => tl.set("#bg-d", { opacity: th === "D" ? 1 : 0 }, t0));

      // the pixel mosaic: big square cells, denser toward the sides and the bottom, each one breathing slowly
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(129);
      const S = 60, C = 18, R = 32, cells = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const x = (c + 0.5) / C, y = (r + 0.5) / R;
        const side = Math.pow(Math.abs(x - 0.5) * 2, 2.2), low = Math.pow(Math.max(0, y - 0.45) / 0.55, 1.6), top = y < 0.24 ? 0.25 : 1;
        const weight = Math.min(1, 0.85 * side + 0.55 * low) * top;
        const p = rnd();
        if (p > weight * 0.95 + 0.04) continue;                       // empty cell
        cells.push({ x: c * S, y: r * S, w: weight, a: 0.35 + 0.65 * rnd(), f: 0.25 + 0.6 * rnd(), ph: rnd() * 6.283, k: rnd() });
      }
      const g = document.getElementById("bg-px").getContext("2d");
      let theme = "L";
      const themeAt = (t) => { let th = "L"; for (const [t0, x] of SHOTS) if (t >= t0) th = x; return th; };
      const st = { t: 0 };
      function draw() {
        const t = st.t, th = themeAt(t);
        g.clearRect(0, 0, 1080, 1920);
        for (const q of cells) {
          const breathe = 0.55 + 0.45 * Math.sin(t * q.f + q.ph);
          const a = q.a * q.w * breathe;
          if (th === "D") {
            if (q.k < 0.18) g.fillStyle = "rgba(34,197,94," + (0.22 * a).toFixed(3) + ")";
            else if (q.k < 0.62) g.fillStyle = "rgba(42,50,60," + (0.75 * a).toFixed(3) + ")";
            else g.fillStyle = "rgba(4,6,9," + (0.55 * a).toFixed(3) + ")";
          } else {
            if (q.k < 0.12) g.fillStyle = "rgba(34,197,94," + (0.10 * a).toFixed(3) + ")";
            else if (q.k < 0.7) g.fillStyle = "rgba(196,202,209," + (0.55 * a).toFixed(3) + ")";
            else g.fillStyle = "rgba(255,255,255," + (0.8 * a).toFixed(3) + ")";
          }
          g.fillRect(q.x, q.y, S - 2, S - 2);
        }
      }
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      window.__timelines["bg"] = tl;
    })();
  </script>
</template>
