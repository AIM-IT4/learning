      tl.fromTo("#s1-hl", { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 0.28, ease: "back.out(1.6)" }, P.hl);

      // ---- the formula writes itself term by term; the stylus follows the write front
      const TERMS = [[0, 142, 100], [0, 242, 122], [0, 364, 92], [0, 456, 310], [1, 81, 104], [1, 185, 92], [1, 277, 228], [1, 505, 322]];
      const LY = [168, 352];
      const tEls = TERMS.map((_, k) => document.getElementById("s1-t" + k));
      const total = TERMS.reduce((s, x) => s + x[2], 0), GAP = 0.03, BRK = 0.07;
      const avail = Math.max(0.3, P.write1 - GAP * 6 - BRK);
      let tc = 0;
      const SCH = TERMS.map((tm, k) => { tc += k === 4 ? BRK : k > 0 ? GAP : 0; const d = (avail * tm[2]) / total; const s = [tc, tc + d]; tc += d; return s; });
      const KF = [];
      TERMS.forEach((tm, k) => { KF.push([SCH[k][0], tm[1] + 8, LY[tm[0]] + 98, 1]); KF.push([SCH[k][1], tm[1] + tm[2] - 10, LY[tm[0]] + 98, 0]); });
      KF.push([P.und0, 81, 540, 1]); KF.push([P.und1, 827, 520, 0]); KF.push([P.penOut + 0.32, 990, 250, 0]);
      function penAt(t) {
        if (t <= KF[0][0]) return [KF[0][1], KF[0][2]];
        for (let i = 0; i < KF.length - 1; i++) {
          const a = KF[i], b = KF[i + 1];
          if (t < b[0]) {
            const u = clamp((t - a[0]) / Math.max(1e-3, b[0] - a[0]), 0, 1), e = a[3] ? u : eio(u);
            const n = Math.max(1, Math.round(Math.abs(b[1] - a[1]) / 45));
            return [mix(a[1], b[1], e), mix(a[2], b[2], e) + (a[3] ? 7 * Math.sin(u * Math.PI * n) : 0)];
          }
        }
        const z = KF[KF.length - 1]; return [z[1], z[2]];
      }
      const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
      const mixc = (c1, c2, k) => { const a = hex(c1), b = hex(c2); return "rgb(" + a.map((v, i) => Math.round(mix(v, b[i], k))).join(",") + ")"; };
      const $ = (id) => document.getElementById(id);
      ["s1-undp"].forEach((id) => { const e = document.getElementById(id); e.setAttribute("stroke-dasharray", "100 100"); e.setAttribute("stroke-dashoffset", "100"); });
      const pen = $("s1-pen"), und = $("s1-undp"), sheen = $("s1-sheen"), bob = $("s1-bob"), glow = $("s1-glow");

      // ---- the balance: beam angle is a pure function of t (tip left with a wobble, then swing level with an overshoot)
      const A = -13, PX = 540, PY = 1250, L = 360;
      function step(u, wn, z) { if (u <= 0) return 0; const wd = wn * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * wn * u) * (Math.cos(wd * u) + ((z * wn) / wd) * Math.sin(wd * u)); }
      function angle(t) {
        if (t < P.land) return A * step(t - P.tilt, 11, 0.45);
        const aL = A * step(P.land - P.tilt, 11, 0.45);
        return aL * (1 - step(t - P.land, 10, 0.42));
      }
      function ends(a) { const r = (a * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r); return [PX - L * c, PY - L * s, PX + L * c, PY + L * s]; }
      const beam = $("s1-beam"), dLb = $("s1-dLb"), dLf = $("s1-dLf"), dRb = $("s1-dRb"), dRf = $("s1-dRf"), ldL = $("s1-ldL"), wt = $("s1-wt"), wts = $("s1-wts");
      const shR = $("s1-shR"), ring = $("s1-ring"), tick0 = $("s1-tick0"), pulse = $("s1-pulse");
      const place = (el, x, y, r) => { el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + r.toFixed(2) + "deg)"; };

      function draw(t) {
        // formula ink
        TERMS.forEach((tm, k) => {
          const u = clamp((t - SCH[k][0]) / (SCH[k][1] - SCH[k][0]), 0, 1), el = tEls[k];
          el.style.clipPath = u >= 1 ? "none" : "inset(-30% " + (100 - 100 * u).toFixed(1) + "% -30% -8%)";
          el.style.color = mixc("#67d6cf", "#f8fafc", clamp((t - SCH[k][1]) / 0.35, 0, 1));
        });
        const up = clamp((t - P.und0) / (P.und1 - P.und0), 0, 1);
        und.setAttribute("stroke-dashoffset", (100 - 100 * up).toFixed(2)); und.setAttribute("opacity", up > 0 ? "1" : "0");
        const pp = penAt(t), po = 1 - clamp((t - P.penOut) / 0.3, 0, 1);
        pen.style.transform = "translate(" + (26 + pp[0]).toFixed(1) + "px," + (32 + pp[1]).toFixed(1) + "px) rotate(28deg)";
        pen.style.opacity = po.toFixed(3);
        sheen.style.transform = "translateX(" + (1500 * eio(clamp((t - P.sheen) / 0.6, 0, 1))).toFixed(1) + "px) rotate(18deg)";
        bob.style.transform = "translateY(" + (-6 * Math.sin((t * 2 * Math.PI) / 2.4)).toFixed(2) + "px)";
        glow.style.opacity = (0.8 + 0.2 * Math.sin(t * 3.4)).toFixed(3);

        // balance
        const a = angle(t), av = (a - angle(t - 0.04)) / 0.04, rock = clamp(-0.05 * av, -5, 5);
        const [lx, ly, rx, ry] = ends(a);
        beam.style.transform = "rotate(" + a.toFixed(2) + "deg)";
        place(dLb, lx, ly, rock); place(dLf, lx, ly, rock); place(ldL, lx, ly, rock);
        place(dRb, rx, ry, rock); place(dRf, rx, ry, rock);
        // the Δ weight falls onto the right dish and rides it
        let wx = rx, wy = 742, sx = 1, sy = 1, op = 0, rr = 0;
        if (t >= P.drop && t < P.land) {
          const u = (t - P.drop) / (P.land - P.drop), yl = ends(angle(P.land))[3];
          const lift = 450 * (1 - gsap.parseEase('back.out(1.1)')(clamp((t - P.arrive) / 0.5, 0, 1))); wy = mix(780 - lift, yl, u * u);   // review A: fall in screen space op = clamp((t - P.drop) / 0.07, 0, 1); sy = 1 + 0.07 * u; sx = 1 - 0.03 * u;
        } else if (t >= P.land) {
          const v = t - P.land, k = Math.exp(-v / 0.07);
          wy = ry; op = 1; rr = rock; sy = 1 - 0.13 * k * Math.cos(v * 30); sx = 1 + 0.09 * k * Math.cos(v * 30);
        }
        place(wt, wx, wy, rr); wt.style.opacity = op.toFixed(3);
        wts.style.transform = "scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
        const lv = t - P.land;
        wts.style.filter = lv >= 0 ? "drop-shadow(0 12px 12px rgba(15,23,42,0.28)) drop-shadow(0 0 " + (12 + 6 * Math.sin(lv * 7)).toFixed(1) + "px rgba(8,169,162,0.65))" : "drop-shadow(0 12px 12px rgba(15,23,42,0.28))";
        shR.setAttribute("opacity", lv >= 0 ? "1" : "0");
        const rp = clamp(lv / 0.4, 0, 1);
        ring.setAttribute("opacity", lv >= 0 && rp < 1 ? (1 - rp).toFixed(3) : "0");
        ring.setAttribute("transform", "translate(0 -112) scale(" + (0.7 + 0.6 * rp).toFixed(3) + ") translate(0 112)");
        tick0.setAttribute("opacity", clamp((t - P.land - 0.35) / 0.2, 0, 1).toFixed(3));
        const pq = clamp((t - P.pulse) / 0.55, 0, 1);
        pulse.style.opacity = t >= P.pulse && pq < 1 ? (0.9 * (1 - pq)).toFixed(3) : "0";
        pulse.style.transform = "scale(" + (1 + 2.2 * pq).toFixed(3) + ")";
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
