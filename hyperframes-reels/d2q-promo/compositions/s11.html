<template>
  <style>
    @font-face { font-family: "D2QSans"; font-weight: 100 900; src: url("assets/fonts/D2QSans.ttf"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("assets/fonts/JetBrainsMono.ttf"); }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s11-cam { position: absolute; inset: 0; transform-origin: 540px 1080px; }
    /* p10 paper stack at the standard placement; its top face: L(145,946) B(470,651) R(918,768) F(618,1082), clip x 583-765 y 611-769 */
    #s11-plate, #s11-clip { position: absolute; left: -40px; top: 500px; width: 1160px; height: 1160px; }
    /* a second copy of the plate cut to the binder clip, so the dealt sheets slide under its jaw */
    #s11-clip { clip-path: polygon(620px 222px, 626px 212px, 664px 160px, 730px 113px, 748px 108px, 764px 108px, 773px 110px, 792px 119px, 796px 126px,
                                   807px 203px, 808px 224px, 804px 237px, 766px 272px, 756px 271px, 740px 267px, 650px 243px, 625px 236px, 620px 226px); }
    .s11-sh { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 532px 866px; }
    .s11-sh svg { position: absolute; left: 0; top: 0; overflow: visible; }
    /* the counter badge: a chunky glossy tile with a thickness edge */
    #s11-badge { position: absolute; left: 58px; top: 618px; width: 404px; height: 190px; transform-origin: 202px 110px; opacity: 0; }
    #s11-bslab { position: absolute; left: 0; top: 13px; width: 404px; height: 190px; border-radius: 42px;
                 background: linear-gradient(180deg, #cfd6de 0%, #aeb8c4 100%); box-shadow: 0 30px 60px rgba(17,20,24,0.14), 0 8px 18px rgba(17,20,24,0.07); }
    #s11-bface { position: absolute; left: 0; top: 0; width: 404px; height: 190px; border-radius: 42px; overflow: hidden; border: 2px solid #dfe4ea;
                 background: linear-gradient(180deg, #ffffff 0%, #f2f4f6 100%); box-shadow: inset 0 3px 0 #ffffff, inset 0 -5px 0 rgba(17,20,24,0.04); }
    #s11-bgloss { position: absolute; left: 10px; top: 6px; width: 380px; height: 64px; border-radius: 34px 34px 60px 60px;
                  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0)); }
    #s11-num { position: absolute; left: 0; top: 16px; width: 400px; height: 122px; display: flex; justify-content: center; align-items: center; gap: 0; }
    .s11-reel { position: relative; width: 66px; height: 122px; overflow: hidden;
                -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 13%, #000 87%, transparent 100%);
                mask-image: linear-gradient(180deg, transparent 0%, #000 13%, #000 87%, transparent 100%); }
    .s11-reel.s11-k3 .s11-strip div { text-align: right; padding-right: 3px; }

    #s11-plus { width: 70px; height: 122px; font: 900 116px/118px "D2QSans", sans-serif; color: #16a34a; text-align: center; opacity: 0;
                text-shadow: 0 8px 22px rgba(22,163,74,0.30); }
    #s11-lab { position: absolute; left: 0; top: 140px; width: 400px; text-align: center; font: 800 27px/1 "D2QSans", sans-serif; letter-spacing: 0.26em; color: #5b6573; }
    #s11-bring { position: absolute; left: -8px; top: -8px; width: 420px; height: 206px; border-radius: 50px; border: 5px solid #16a34a; opacity: 0; }
    /* the problem book standing in front */
    #s11-bshadow { position: absolute; left: 560px; top: 1500px; width: 420px; height: 74px; border-radius: 50%;
                   background: radial-gradient(ellipse at center, rgba(17,20,24,0.26), rgba(17,20,24,0) 70%); opacity: 0; }
    #s11-book { position: absolute; left: 558px; top: 1086px; width: 424px; height: 424px; transform-origin: 212px 424px; opacity: 0; }
    #s11-pages { position: absolute; left: 0; top: 0; }
    #s11-cover { position: absolute; left: 0; top: 0; width: 400px; height: 400px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(17,20,24,0.14);
                 box-shadow: 0 30px 60px rgba(17,20,24,0.16), 0 8px 18px rgba(17,20,24,0.08), inset 0 2px 0 rgba(255,255,255,0.9); }
    #s11-cover img { display: block; width: 100%; height: 100%; }
    #s11-spine { position: absolute; left: 0; top: 0; width: 38px; height: 100%;
                 background: linear-gradient(90deg, rgba(17,20,24,0.30) 0%, rgba(17,20,24,0.08) 50%, rgba(255,255,255,0.55) 62%, rgba(255,255,255,0) 100%); }
    #s11-gloss { position: absolute; inset: 0; background: linear-gradient(128deg, rgba(255,255,255,0.46) 0%, rgba(255,255,255,0.12) 30%, rgba(255,255,255,0) 31%, rgba(255,255,255,0) 100%); }
    #s11-glint { position: absolute; left: 0; top: -80px; width: 120px; height: 560px;
                 background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.7), rgba(255,255,255,0)); }
    /* the worked-solution stamp */
    #s11-stamp { position: absolute; left: 22px; top: 196px; width: 356px; height: 88px; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 12px;
                 background: linear-gradient(180deg, #2fd16b 0%, #16a34a 100%); border: 3px solid #0f7a37; opacity: 0; white-space: nowrap;
                 box-shadow: inset 0 0 0 4px #22c55e, inset 0 0 0 7px rgba(255,255,255,0.9), 0 14px 26px rgba(22,163,74,0.40);
                 font: 800 35px/1 "D2QSans", sans-serif; color: #ffffff; letter-spacing: -0.01em; }
    #s11-ink { position: absolute; left: 22px; top: 196px; width: 356px; height: 88px; border-radius: 26px; border: 7px solid #16a34a; opacity: 0; }
    .s11-px { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 4px; background: #22c55e; opacity: 0;
              box-shadow: 0 6px 12px rgba(22,163,74,0.30); }
  </style>
  <div id="root" data-composition-id="s11" data-width="1080" data-height="1920">
    <div id="s11-cam">
      <img id="s11-plate" src="assets/plates/p10.png" alt="" />
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <filter id="s11-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13" /></filter>
          <linearGradient id="s11-pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#f1f3f6" /></linearGradient>
        </defs>
      </svg>
      <div id="s11-sheets" data-layout-allow-overlap></div>
      <img id="s11-clip" src="assets/plates/p10.png" alt="" />
      <div id="s11-bshadow"></div>
      <div id="s11-book">
        <svg id="s11-pages" width="424" height="424" viewBox="0 0 424 424" fill="none">
          <defs><linearGradient id="s11-gpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#e4e8ec" /></linearGradient></defs>
          <path d="M400 8 L420 28 L420 420 L28 420 L8 400 L400 400 Z" fill="url(#s11-gpg)" stroke="#cdd4dc" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M404 12 V404 M12 404 H404 M408 16 V408 M16 408 H408 M412 20 V412 M20 412 H412 M416 24 V416 M24 416 H416" stroke="#d3d9e0" stroke-width="1.2" />
        </svg>
        <div id="s11-cover">
          <img src="assets/covers/quant-interview-problem-book.jpg" alt="" />
          <div id="s11-spine"></div>
          <div id="s11-gloss"></div>
          <div id="s11-glint"></div>
          <div id="s11-ink"></div>
          <div id="s11-stamp"><svg width="34" height="30" viewBox="0 0 34 30" fill="none"><path d="M3 15.5 L12.5 25 L31 4" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" /></svg>Worked solution</div>
        </div>
      </div>
      <div id="s11-badge">
        <div id="s11-bslab"></div>
        <div id="s11-bface">
          <div id="s11-bgloss"></div>
          <div id="s11-num">
            <div class="s11-reel s11-k3"><div class="s11-strip" id="s11-r3"></div></div>
            <div class="s11-reel"><div class="s11-strip" id="s11-r2"></div></div>
            <div class="s11-reel"><div class="s11-strip" id="s11-r1"></div></div>
            <div class="s11-reel"><div class="s11-strip" id="s11-r0"></div></div>
            <div id="s11-plus">+</div>
          </div>
          <div id="s11-lab">PROBLEMS</div>
        </div>
        <div id="s11-bring"></div>
      </div>
      <div id="s11-pxs"></div>
    </div>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 3.9; const W = [0.16, 0.66, 0.75, 1.71, 2.13, 2.91, 3.05]; /*END*/
      // words: 0 Then 1 the 2 interview: 3 1000+ 4 problems, 5 with 6 solutions.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.16 + i * 0.32);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const tl = gsap.timeline({ paused: true });

      // ---- the dealt sheets: each one is the stack's top face (a perspective quad) with a printed problem on it
      const QUAD = "145,946 470,651 918,768 618,1082";
      // page space (u along the back edge B->R, v along B->L, both 0..1000) mapped onto the face
      const MAT = "matrix(0.448 0.117 -0.325 0.295 470 651)";
      const sheetsEl = document.getElementById("s11-sheets");
      const sheetSvg = (k) =>
        '<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">' +
        '<polygon class="s11-shd" points="' + QUAD + '" transform="translate(14 24)" fill="rgba(17,20,24,0.22)" filter="url(#s11-blur)"/>' +
        '<polygon points="' + QUAD + '" fill="url(#s11-pg)" stroke="#d5dbe2" stroke-width="2" stroke-linejoin="round"/>' +
        '<g transform="' + MAT + '">' +
        '<text x="92" y="330" font-family="D2QSans, sans-serif" font-weight="900" font-size="120" fill="#16a34a">Q.</text>' +
        '<rect x="250" y="262" width="' + (560 - (k % 3) * 60) + '" height="40" rx="20" fill="#dfe4ea"/>' +
        '<rect x="96" y="410" width="' + (720 - (k % 2) * 90) + '" height="40" rx="20" fill="#e6eaef"/>' +
        '<rect x="96" y="520" width="' + (640 + (k % 3) * 40) + '" height="40" rx="20" fill="#e6eaef"/>' +
        '<rect x="96" y="630" width="' + (470 + (k % 2) * 120) + '" height="40" rx="20" fill="#e6eaef"/>' +
        '<rect x="96" y="760" width="300" height="40" rx="20" fill="#bbf7d0"/>' +
        "</g></svg>";
      // [start, from x, from y, from rotation, from scale, flight]
      const DEAL = [
        [0.04, -820, -36, -9, 1, 0.34], [0.2, 820, -24, 8, 1, 0.34], [w(2) - 0.18, 0, 560, -4, 1.26, 0.36],
        [w(3) - 0.06, -820, -20, -7, 1, 0.24], [w(3) + 0.02, 820, -18, 6, 1, 0.24], [w(3) + 0.1, -820, -14, -5, 1, 0.22],
        [w(3) + 0.18, 820, -12, 5, 1, 0.22], [w(3) + 0.26, 0, 420, -3, 1.2, 0.22],
      ];
      DEAL.forEach(([t0, x, y, r, s, d], k) => {
        const el = document.createElement("div");
        el.className = "s11-sh"; el.id = "s11-sh" + k; el.innerHTML = sheetSvg(k);
        sheetsEl.appendChild(el);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, t0);
        tl.fromTo(el, { x: x, y: y, rotation: r, scale: s }, { x: 0, y: 0, rotation: 0, scale: 1, duration: d, ease: "power3.out" }, t0);
        // its shadow tightens and vanishes as it lands flat on the pile
        tl.fromTo(el.querySelector(".s11-shd"), { opacity: 1 }, { opacity: 0, duration: d, ease: "power2.in" }, t0);
      });

      // camera: tilt-up rise that settles on the stack, then a slow push
      tl.fromTo("#s11-cam", { y: 120, rotation: 2 }, { y: 0, rotation: 0, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo("#s11-cam", { scale: 1 }, { scale: 1.04, duration: Math.max(0.2, DUR - 0.7), ease: "none" }, 0.7);

      // "interview:": the real problem book stands up in front of the stack, a glint runs over its glossy cover
      const BK = w(2) - 0.08;
      tl.fromTo("#s11-book", { opacity: 0, y: 300, rotationX: 62, rotationY: -12, rotation: 3, scale: 0.9, transformPerspective: 1400 },
                             { opacity: 1, y: 0, rotationX: 0, rotationY: -12, rotation: 3, scale: 1, transformPerspective: 1400, duration: 0.55, ease: "back.out(1.35)" }, BK);
      tl.fromTo("#s11-bshadow", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out" }, BK + 0.1);
      tl.fromTo("#s11-glint", { x: -180, rotation: 18 }, { x: 560, rotation: 18, duration: 0.7, ease: "power2.inOut" }, BK + 0.42);

      // "1000+": the badge slams in with the caption's hero word and its reels roll to 1000 by "problems"
      const T3 = w(3), T4 = w(4), C0 = T3 - 0.02, C1 = Math.max(T3 + 0.2, T4 - 0.06);
      tl.fromTo("#s11-badge", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out" }, T3 - 0.05);
      tl.fromTo("#s11-badge", { scale: 0.35, rotation: -16, y: 40 }, { scale: 1, rotation: -4, y: 0, duration: 0.34, ease: "back.out(2)" }, T3 - 0.05);
      tl.fromTo("#s11-plus", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, C1 - 0.01);
      tl.fromTo("#s11-bring", { opacity: 0, scale: 0.96 }, { opacity: 0.9, scale: 0.96, duration: 0.01 }, C1);
      tl.fromTo("#s11-bring", { opacity: 0.9, scale: 0.96 }, { opacity: 0, scale: 1.1, duration: 0.42, ease: "power2.out", immediateRender: false }, C1 + 0.01);
      tl.fromTo("#s11-bface", { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power2.out" }, C1);
      tl.fromTo("#s11-bface", { scale: 1.06 }, { scale: 1, duration: 0.36, ease: "back.out(3)", immediateRender: false }, C1 + 0.08);
      tl.fromTo("#s11-lab", { color: "#5b6573" }, { color: "#16a34a", duration: 0.16, ease: "power2.out" }, T4 - 0.04);

      // "solutions.": the green stamp thumps onto the book; the book jolts, an ink ring spreads, green pixels kick out
      const ST = w(6) - 0.16;
      tl.fromTo("#s11-stamp", { opacity: 0, scale: 2.3, rotation: -24 }, { opacity: 1, scale: 1, rotation: -9, duration: 0.16, ease: "power3.in" }, ST);
      tl.fromTo("#s11-ink", { opacity: 0, scale: 0.92, rotation: -9 }, { opacity: 0.8, scale: 0.92, rotation: -9, duration: 0.01 }, ST + 0.15);
      tl.fromTo("#s11-ink", { opacity: 0.8, scale: 0.92 }, { opacity: 0, scale: 1.45, duration: 0.45, ease: "power2.out", immediateRender: false }, ST + 0.16);
      tl.fromTo("#s11-cover", { y: 0 }, { y: 10, duration: 0.06, ease: "power2.out" }, ST + 0.16);
      tl.fromTo("#s11-cover", { y: 10 }, { y: 0, duration: 0.35, ease: "back.out(3)", immediateRender: false }, ST + 0.22);
      // pixel kick from the stamp (the mosaic's squares), in frame space around the stamp's centre on the book
      const pxs = document.getElementById("s11-pxs");
      const PXA = [196, 164, 128, 98, 64, 22, 338, 290, 250, 228];
      PXA.forEach((deg, k) => {
        const p = document.createElement("div"); p.className = "s11-px"; pxs.appendChild(p);
        const a = deg * Math.PI / 180, cx = 778, cy = 1332, s0 = 0.7 + (k % 3) * 0.25, t0 = ST + 0.16 + (k % 3) * 0.015;
        const x0 = cx + 196 * Math.cos(a), y0 = cy + 62 * Math.sin(a), x1 = cx + 316 * Math.cos(a), y1 = cy + 190 * Math.sin(a);
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
        tl.fromTo(p, { x: x0, y: y0, scale: s0, rotation: 0 }, { x: x1, y: y1, scale: s0 * 0.4, rotation: (k % 2 ? 50 : -50), duration: 0.34, ease: "power3.out" }, t0);
        tl.fromTo(p, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, t0 + 0.04);
      });

      // continuous layer: the odometer reels (motion-blurred while they spin), leading zeros dimmed
      const reels = [0, 1, 2, 3].map((k) => document.getElementById("s11-r" + k));
      reels.forEach((s) => { for (let d = 0; d <= 10; d++) { const e = document.createElement("div"); e.textContent = String(d % 10); s.appendChild(e); } });
      const ease3 = (p) => 1 - Math.pow(1 - p, 3);
      const valAt = (t) => 1000 * ease3(clamp((t - C0) / (C1 - C0), 0, 1));
      function draw(t) {
        const v = valAt(t), dv = (valAt(t + 0.004) - valAt(t - 0.004)) / 0.008;
        for (let k = 0; k < 4; k++) {
          const P = Math.pow(10, k);
          let pos;
          if (k === 0) pos = v % 10;
          else { const n = Math.floor(v / P), lower = v - n * P; pos = (n % 10) + clamp(lower - (P - 1), 0, 1); }
          const r = reels[k];
          r.style.transform = "translateY(" + (-pos * 122).toFixed(1) + "px)";
          const travel = (dv / P) * 122 / 30;
          r.style.filter = travel > 8 ? "blur(" + Math.min(5, travel * 0.05 + 1).toFixed(1) + "px)" : "none";
          r.style.opacity = k > 0 && v < P - 0.5 ? "0.22" : "1";
        }
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s11"] = tl;
    })();
  </script>
</template>
