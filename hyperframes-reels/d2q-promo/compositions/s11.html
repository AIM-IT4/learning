  <script>
    (function () {
      /*DATA*/ const DUR = 3.92; const W = [0.18, 0.74, 1.0, 1.26, 1.44, 1.64, 1.88, 2.1]; /*END*/
      // words: 0 Comment 1 FREE, 2 and 3 we'll 4 DM 5 you 6 all 7 ten.
      const w = (i) => (W.length > i ? W[i] : 0.18 + i * 0.44);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const HOLD = Math.min(DUR - 0.2, w(7) + 0.5);   // from here on only the soft glow pulse moves
      const tl = gsap.timeline({ paused: true });

      // camera: a slow push-in that comes to rest when the final layout holds
      tl.fromTo("#s11-cam", { scale: 1 }, { scale: 1.035, duration: HOLD, ease: "power1.inOut" }, 0);
      // arrival: the comment box slides up and settles mid-frame; the profile card rises below it
      const LIFT = 200, DROP = 170;            // the comment box and the profile card start together and part for the DM
      tl.fromTo("#s11-cmt", { opacity: 0, y: 90, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.02);
      tl.fromTo("#s11-pro", { opacity: 0, y: 130 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.08);

      // "Comment FREE": the letters type in one by one (drawn below), then the send arrow is tapped
      const TY0 = w(0) + 0.08, TYG = clamp((w(1) + 0.12 - TY0) / 4, 0.07, 0.16);
      const TAP = Math.max(TY0 + 4 * TYG + 0.1, w(2) - 0.08);
      tl.fromTo("#s11-send", { scale: 1 }, { scale: 0.8, duration: 0.08, ease: "power2.in" }, TAP);
      tl.fromTo("#s11-send", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, TAP + 0.08);
      tl.fromTo("#s11-rip", { opacity: 0, scale: 0.9 }, { opacity: 0.7, scale: 0.9, duration: 0.01 }, TAP + 0.07);
      tl.fromTo("#s11-rip", { opacity: 0.7, scale: 0.9 }, { opacity: 0, scale: 1.9, duration: 0.5, ease: "power2.out", immediateRender: false }, TAP + 0.08);
      tl.fromTo("#s11-plane", { opacity: 1 }, { opacity: 0, duration: 0.1 }, TAP + 0.1);
      tl.fromTo("#s11-chk", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, TAP + 0.12);
      // the sent comment glides up to make room for the reply
      tl.fromTo("#s11-cmtw", { y: LIFT }, { y: 0, duration: 0.55, ease: "power3.inOut" }, TAP + 0.2);
      tl.fromTo("#s11-prow", { y: -DROP }, { y: 0, duration: 0.55, ease: "power3.inOut" }, TAP + 0.2);

      // "DM": the direct message slides in from the right
      const DM = w(4) - 0.1;
      tl.fromTo("#s11-dm", { x: 720, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, DM);
      tl.fromTo("#s11-glow2", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, DM + 0.1);
      // "all": the ten tiny free covers pop in under the bubble
      document.querySelectorAll("#s11-row .s11-tc").forEach((el, k) => {
        tl.fromTo(el, { opacity: 0, y: 26, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, w(6) - 0.06 + k * 0.035);
      });
      // "ten": a wave runs along the row and a teal line underlines all ten
      document.querySelectorAll("#s11-row .s11-tcin").forEach((el, k) => {
        const t = w(7) - 0.04 + k * 0.03;
        tl.fromTo(el, { y: 0 }, { y: -14, duration: 0.12, ease: "power2.out" }, t);
        tl.fromTo(el, { y: -14 }, { y: 0, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, t + 0.12);
      });
      tl.fromTo("#s11-rline", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, w(7) - 0.04);

      // continuous layer: typing + caret, and the soft glow pulse behind the profile logo (the only motion in the hold)
      const letters = Array.from(document.querySelectorAll("#s11-typed span"));
      const ph = document.getElementById("s11-ph"), caret = document.getElementById("s11-caret");
      const glow = document.getElementById("s11-glow");
      function draw(t) {
        let n = 0;
        letters.forEach((s, k) => { const on = t >= TY0 + k * TYG; s.style.display = on ? "inline" : "none"; if (on) n++; });
        ph.style.opacity = n > 0 ? "0" : "1";
        const typing = t >= TY0 - 0.05 && t < TY0 + 4 * TYG + 0.05;
        caret.style.opacity = t >= TAP + 0.05 ? "0" : (typing || Math.floor(t * 2.4) % 2 === 0 ? "1" : "0");
        glow.style.opacity = (0.72 + 0.28 * Math.sin(t * 3.4)).toFixed(3);
        glow.style.transform = "scale(" + (1 + 0.04 * Math.sin(t * 3.4)).toFixed(3) + ")";
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s11"] = tl;
    })();
