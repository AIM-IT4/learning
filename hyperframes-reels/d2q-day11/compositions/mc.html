        // the neckline, the kangaroo pocket and the drawstrings
        g.fillStyle = "#c98a63"; g.beginPath(); g.ellipse(0, -104, 13, 8.5, 0, 0, Math.PI); g.fill();
        g.strokeStyle = "#1e40af"; g.lineWidth = 4; g.beginPath(); g.ellipse(0, -104, 15, 10, 0, 0.05, Math.PI - 0.05); g.stroke();
        g.fillStyle = "rgba(30,64,175,0.32)"; rr(-27, -62, 54, 24, 9); g.fill();
        g.strokeStyle = "rgba(255,255,255,0.32)"; g.lineWidth = 2; g.beginPath(); g.moveTo(-22, -61); g.lineTo(22, -61); g.stroke();
        g.strokeStyle = "#ffffff"; g.lineWidth = 2.8; g.lineCap = "round";
        for (const sd of [-1, 1]) {
          const ex = sd * 9 + sp * 10, ey = -80 + sd * 2;
          g.beginPath(); g.moveTo(sd * 8, -98); g.quadraticCurveTo(sd * 9, -90, ex, ey); g.stroke();
          g.fillStyle = "#dbe5f5"; g.beginPath(); g.arc(ex, ey + 2, 2.6, 0, 6.2832); g.fill();
        }
        g.restore();
        // arms (an arm crossing in front, the thinking hand on the chin, is drawn after the head)
        if (o.aL > -0.6) arm(-41, -92, o.aL, -1, o.hL, o);
        if (o.aR > -0.6) arm(41, -92, o.aR, 1, o.hR, o);
        // the head tilts about the neck
        const tk = talk(t);
        g.save(); g.translate(0, -104 + 1.6 * tk.open); g.rotate(o.tilt + 0.035 * (tk.open - 0.35) * (tk.open > 0.05 ? 1 : 0)); head(o, t); g.restore();
        if (o.aL <= -0.6) arm(-41, -92, o.aL, -1, o.hL, o);
        if (o.aR <= -0.6) arm(41, -92, o.aR, 1, o.hR, o);
        g.restore();

        // above the head (unsquashed): a "?" when puzzled, sparkles on a cheer, hearts on the goodbye
        const topY = FY + bob + hy * SC - 226 * SC;
        if (o.q) {
          const p = backOut(o.since / 0.28), y = topY - 8 + 3 * Math.sin(o.since * 7);
          g.save(); g.translate(FX + 20 * SC, y); g.rotate(0.12); g.scale(0.4 + 0.6 * p, 0.4 + 0.6 * p);
          g.font = '700 50px "Fredoka", "D2QSans", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
          g.lineWidth = 8; g.strokeStyle = "#ffffff"; g.lineJoin = "round"; g.strokeText("?", 0, 0);
          g.fillStyle = "#2563eb"; g.fillText("?", 0, 0); g.restore();
        }
        if (o.fx === "sparkle") {
          for (let i = 0; i < 5; i++) {
            const d = o.since - i * 0.07, p = clamp(d / 0.5, 0, 1);
            if (d <= 0 || p >= 1) continue;
            const a = -Math.PI / 2 + (i - 2) * 0.62, R = (70 + 34 * easeOut(p)) * SC;
            const x = FX + Math.cos(a) * R * 1.25, y = FY + bob + hy * SC - 160 * SC + Math.sin(a) * R;
            g.save(); g.globalAlpha = Math.sin(Math.PI * p); g.fillStyle = i % 2 ? "#fde68a" : "#ffffff";
            g.shadowColor = "rgba(245,158,11,0.8)"; g.shadowBlur = 10; star(x, y, 10 * (0.6 + 0.4 * Math.sin(Math.PI * p)), 4, 0.36); g.fill(); g.restore();
          }
        }
        if (o.fx === "hearts") {
          for (let i = 0; i < 6; i++) {
            const d = (o.since - i * 0.55) % 3.3;
            if (o.since - i * 0.55 < 0 || d > 1.6) continue;
            const p = d / 1.6, x = FX + (i % 2 ? 46 : -40) * SC + Math.sin(d * 5 + i) * 7, y = topY + 10 - 90 * p;
            g.save(); g.globalAlpha = Math.sin(Math.PI * p) * 0.95; g.fillStyle = "#fb7185"; heart(x, y, 9 + 3 * p); g.fill(); g.restore();
          }
        }
      }

      function drawTile(t) {
        // the tile pops up under him at the very start, then floats with him
        const p = backOut((t - T_TILE) / 0.36);
        if (p <= 0) return false;
        const bob = 3 * Math.sin((2 * Math.PI * t) / 3.2);
        g.save(); g.translate(FX, FY + bob); g.scale(p, p); g.translate(-FX, -(FY + bob));
        const K = ISO.make(g, FX, FY + bob - 2.5 * U, U);   // top vertex 32.5 px above the tile's centre
        K.platform(0, 0, 5, 5);
        g.restore();
        return true;
      }

      const st = { t: 0 };
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, cv.width, cv.height);
        if (!drawTile(t)) return;
        if (t >= T_DROP) drawGuy(t);
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["mc"] = tl;
    })();
  </script>
