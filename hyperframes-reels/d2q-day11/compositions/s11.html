        band(pts, n, HW + 2.5, -HW - 2.5, 0, E1 + 2.5, "#ffffff");      // a white sticker edge so it reads over the blue columns
        band(pts, n, HW, HW, 0, E1, "#93c5fd");                          // top side (faces up)
        band(pts, n, HW, -HW, E1, E1, "#1d4ed8");                        // front face
        const e = pts[pts.length - 1], s0 = pts[0];
        g.fillStyle = "#1d4ed8"; g.beginPath(); g.arc(e[0], e[1] + E1 * 0.5, HW + 3, 0, 6.2832); g.fill();
        g.beginPath(); g.arc(s0[0], s0[1] + E1 * 0.5, HW + 3, 0, 6.2832); g.fill();
        return aEnd;
      }

      const st = { t: 0 }, bob = document.getElementById("s11-bob");
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * (t + 2.0)) / 3)).toFixed(2) + "px)";
        K.shadow(0, 0, -1.6, 10, 10, 0.22);
        K.platform(0, 0, 10, 10);
        ROW.forEach((r) => ticket(r));
        // the column tops flash white as the smile passes over them
        ROW.forEach((r) => { const dt = t - r.TP; column(r, t, dt >= 0 && dt < 0.4 ? 1 - dt / 0.4 : 0); });
        plank(t);
        smile(t);
      }

      // ---- static anchors for the readouts: centred over each column's top, with room for the growth overshoot
      const place = (id, r, dx, gap) => {
        const e = document.getElementById(id), top = P(r.x - CW / 2, r.y - CW / 2, TH + r.H);
        e.style.left = (top[0] - 200 + dx).toFixed(1) + "px"; e.style.width = "400px"; e.style.top = (top[1] - gap).toFixed(1) + "px";
      };
      const v80 = document.getElementById("s11-v80"), v90 = document.getElementById("s11-v90"), v100 = document.getElementById("s11-v100");
      place("s11-v100", ROW[4], 38, 130);
      place("s11-v90", ROW[2], 42, 150);
      place("s11-v80", ROW[0], 0, 148);

      // ---- camera: the cube flip in, slow push; the end sits under the tile cascade (no flip out)
      tl.fromTo("#s11-flip", { rotationY: -90, scale: 0.94 }, { rotationY: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo("#s11-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- signboards on their words
      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.4, ease: "back.out(2.8)" }, t);
      const hop = (sel, t, h, sq) => {
        tl.fromTo(sel, { y: 0 }, { y: -h, duration: 0.11, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { y: -h }, { y: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, t + 0.11);
        tl.fromTo(sel, { scaleY: sq, scaleX: 1 + (1 - sq) * 0.6 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.23);
      };
      const squash = (sel, t) => {
        tl.fromTo(sel, { scaleY: 1, scaleX: 1 }, { scaleY: 0.86, scaleX: 1.08, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { scaleY: 0.86, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.07);
      };
      pop("#s11-plq", 0.34);
      tl.fromTo("#s11-note", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.62);
      // "At the money": K100 hops, the tag pops under it
      hop(ROW[4].el, w(2) - 0.06, 12, 0.86);
      tl.fromTo("#s11-atm", { opacity: 0, scale: 0.4, y: -12 }, { opacity: 1, scale: 1, y: 0, duration: 0.36, ease: "back.out(2.6)" }, w(2) - 0.02);
      // the three readouts land with their columns
      pop("#s11-v100", w(6) - 0.06);
      squash("#s11-h100", ROW[4].G + GD);
      hop(ROW[2].el, w(8) - 0.04, 12, 0.86);
      pop("#s11-v90", w(9) - 0.06);
      squash("#s11-h90", ROW[2].G + GD);
      hop(ROW[0].el, w(11) - 0.04, 12, 0.86);
      pop("#s11-v80", w(12) - 0.06, 0.44);
      squash("#s11-h80", ROW[0].G + GD);
      // one stock, one model
      pop("#s11-o1", w(13) - 0.04);
      pop("#s11-o2", w(15) - 0.04);
      // the flat line: the plank lands, "one volatility"
      pop("#s11-ov", PLAND - 0.06, 0.36);
      // the smile: the plaque hops as the ribbon lands on "smile."
      hop("#s11-plqh", w(24) + 0.02, 14, 0.86);

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s11"] = tl;
    })();
  </script>
</template>
