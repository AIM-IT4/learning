      const growF = (s, t) => outBack((t - G1 - Math.abs(s) * 0.045) / 0.5, 1.7);
      const tailK = (t) => clamp((t - G1 - 0.3) / 0.3, 0, 1);                // the normal curve's tails turn rose as the fat curve arrives
      function sigmaLines() {
        [-1.26, 1.26].forEach((s) => {
          const i = Math.round((s + 5) / 0.05), h = HS * dN(i);
          const a = at(s, CF, h), b = at(s, CF, 0);
          g.lineWidth = 3; g.strokeStyle = "rgba(255,255,255,0.8)"; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
        });
      }
      function drawAxis() {
        const l = at(-5, CA, 0), r = at(5, CA, 0);
        g.lineWidth = 3; g.strokeStyle = "#1e3a8a"; g.lineCap = "round"; g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(r[0], r[1]); g.stroke();
        [-5, -1.26, 0, 1.26, 5].forEach((s) => {
          const p0 = at(s, CA - 0.25, 0), p1 = at(s, CA + 0.25, 0);
          g.lineWidth = Math.abs(s) === 1.26 ? 4 : 3; g.strokeStyle = Math.abs(s) === 1.26 ? "#2563eb" : "#1e3a8a";
          g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
        });
      }

      // ---- the crash day: a rose block turned toward the camera (like Day 10's contract card), slamming onto the left end ----
      const TH = -Math.PI / 6, EX = Math.cos(TH), EY = Math.sin(TH), NX = -EY, NY = EX;
      const ES = Math.hypot((EX - EY) * 0.8660254, (EX + EY) * 0.5);
      const BLK = { c: [2.2, 10.0], L: 4.0, T: 1.0, H: 2.4 };
      const BW = BLK.L * ES * U, BH = BLK.H * U;
      const bf = document.getElementById("s6-bf");
      bf.style.width = BW.toFixed(1) + "px"; bf.style.height = BH.toFixed(1) + "px";
      function prism(c, L, T, z0, H, mat, front) {
        const hx = (EX * L) / 2, hy = (EY * L) / 2, tx = (NX * T) / 2, ty = (NY * T) / 2, z1 = z0 + H, ed = "rgba(127,29,29,0.22)";
        const FL = [c[0] - hx + tx, c[1] - hy + ty], FR = [c[0] + hx + tx, c[1] + hy + ty];
        const BL = [c[0] - hx - tx, c[1] - hy - ty], BR = [c[0] + hx - tx, c[1] + hy - ty];
        K.poly([P(FL[0], FL[1], z0), P(FR[0], FR[1], z0), P(FR[0], FR[1], z1), P(FL[0], FL[1], z1)], front || mat.left, ed);
        K.poly([P(FR[0], FR[1], z0), P(BR[0], BR[1], z0), P(BR[0], BR[1], z1), P(FR[0], FR[1], z1)], mat.right, ed);
        K.poly([P(BL[0], BL[1], z1), P(BR[0], BR[1], z1), P(FR[0], FR[1], z1), P(FL[0], FL[1], z1)], mat.top, ed);
        return { FL, FR, z0, z1 };
      }
      function drawBlock(t) {
        if (t < tFall) { bf.style.opacity = "0"; return; }
        let z = 0;
        if (t < tLand) { const p = (t - tFall) / (tLand - tFall); z = 10 * (1 - p * p); }
        const sq = land(t - tLand), sx = 1 + (1 - sq) * 0.45;
        const sh = clamp(1 - z / 10, 0.2, 1);
        const pc = P(BLK.c[0], BLK.c[1], 0);
        g.save(); g.translate(pc[0], pc[1]); g.scale(1, 0.32);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, 150 * sh);
        gr.addColorStop(0, `rgba(30,64,175,${0.3 * sh})`); gr.addColorStop(1, "rgba(30,64,175,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 150 * sh, 0, 6.2832); g.fill(); g.restore();
        const b = prism(BLK.c, BLK.L * sx, BLK.T * sx, z, BLK.H * sq, M.rose, "#f43f5e");
        bf.style.opacity = "1";
        bf.style.transform = K.faceMatrix(P(b.FL[0], b.FL[1], b.z1), P(b.FR[0], b.FR[1], b.z1), P(b.FL[0], b.FL[1], b.z0), BW, BH);
      }

      // ---- the zoomed left tail (-5% ... -3.5%, where the fat-tailed curve is above the normal one), both curves at 25x the wall's height scale ----
      const zg = document.getElementById("s6-zcv").getContext("2d");
      const ZW = 404, ZHt = 132, ZB = ZHt - 2, ZPX = ZW / 1.5, ZH = HS * U * 25, ZN = 30;   // px per 1%; px per unit of density; points
      function drawZoom(t) {
        const k = outBack((t - tZm - 0.1) / 0.45, 1.6);
        zg.clearRect(0, 0, ZW, ZHt);
        zg.fillStyle = "#f4f7fe"; zg.fillRect(0, 0, ZW, ZHt);
        zg.strokeStyle = "#dbe5f7"; zg.lineWidth = 2;
        [ZPX / 2, ZPX, ZPX * 1.5].forEach((x) => { zg.beginPath(); zg.moveTo(x, 0); zg.lineTo(x, ZB); zg.stroke(); });
        if (k > 0) {
          const pts = (dens) => { const a = []; for (let i = 0; i <= ZN; i++) a.push([i * 0.05 * ZPX, ZB - dens(i) * ZH * k]); return a; };
          const fillA = (a, fill) => { zg.beginPath(); zg.moveTo(0, ZB); a.forEach(([x, y]) => zg.lineTo(x, y)); zg.lineTo(ZW, ZB); zg.closePath(); zg.fillStyle = fill; zg.fill(); };
          const lineA = (a, col, lw) => { zg.beginPath(); a.forEach(([x, y], i) => (i ? zg.lineTo(x, y) : zg.moveTo(x, y))); zg.strokeStyle = col; zg.lineWidth = lw; zg.lineJoin = "round"; zg.lineCap = "round"; zg.stroke(); };
          const F = pts(dF), N = pts(dN);
          fillA(F, "rgba(244,63,94,0.9)");                   // fat-tailed: rose area, behind
          fillA(N, "#3b82f6");                               // normal: blue area, in front
          lineA(N, "#1e40af", 4);
          lineA(F, "#be123c", 5);                            // the fat-tailed curve's line, over both
        }
        zg.strokeStyle = "#1e3a8a"; zg.lineWidth = 3; zg.beginPath(); zg.moveTo(0, ZB + 0.5); zg.lineTo(ZW, ZB + 0.5); zg.stroke();
      }

      function floorShadow() {
        const cx = OX - 20, cy = OY + 11 * U + 1.5 * U + 40, rx = 470, ry = 120;
        g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
        gr.addColorStop(0, "rgba(37,99,235,0.26)"); gr.addColorStop(0.55, "rgba(37,99,235,0.1)"); gr.addColorStop(1, "rgba(37,99,235,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill(); g.restore();
      }

      const st = { t: 0 }, bob = document.getElementById("s6-bob");
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * (t + 0.4 + 5.54)) / 3)).toFixed(2) + "px)";
        floorShadow();
        K.shadow(0, 0, -1.6, 10, 11.5, 0.2);
        K.platform(0, 0, 10, 11.5);
        K.shadow(1.6, 1.6, 0, 7.2, 7.2, 0.12);
        wall(dN, CB, CF, growN, BODY_N, TAIL_N, tailK(t), t);
        sigmaLines();
        wall(dF, RB, RF, growF, BODY_F, TAIL_F, 1, t);
        drawAxis();
        drawBlock(t);
        drawZoom(t);
      }

      // ---- camera: the cube flip in, a slow push; no flip out (the tile cascade covers this cut) ----
      tl.fromTo("#s6-flip", { rotationY: -90, scale: 0.94 }, { rotationY: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo("#s6-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);
      // the landing jolts the set
      tl.fromTo("#s6-cam", { y: 0 }, { y: 9, duration: 0.05, ease: "power2.out" }, tLand);
      tl.fromTo("#s6-cam", { y: 9 }, { y: 0, duration: 0.32, ease: "back.out(3)", immediateRender: false }, tLand + 0.05);
      // the -5% label is under the block once it lands
      tl.fromTo("#s6-tk0", { opacity: 1 }, { opacity: 0, duration: 0.08 }, tLand - 0.04);

      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.4, ease: "back.out(2.8)" }, t);
      const hop = (sel, t, h, sq) => {
        tl.fromTo(sel, { y: 0 }, { y: -h, duration: 0.11, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { y: -h }, { y: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, t + 0.11);
        tl.fromTo(sel, { scaleY: sq, scaleX: 1 + (1 - sq) * 0.6 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.23);
      };
      // IT HAPPENED: the stamp thumps down over the block, then an ink squash
      tl.fromTo("#s6-st", { opacity: 0, scale: 2.1, rotation: -16 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.14, ease: "power3.in" }, tStamp);
      tl.fromTo("#s6-sti", { scaleX: 1, scaleY: 1 }, { scaleX: 1.12, scaleY: 0.84, duration: 0.06, ease: "power2.out", immediateRender: false }, tStamp + 0.14);
      tl.fromTo("#s6-sti", { scaleX: 1.12, scaleY: 0.84 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, tStamp + 0.2);
      // "fat tails:": the rose curve's label
      pop("#s6-fl", tFl, 0.38);
      // the normal curve keeps its label; the Black-Scholes tag steps aside for the fat-tailed curve
      tl.fromTo("#s6-bs", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4, duration: 0.2, ease: "power2.in" }, G1 + 0.04);
      tl.fromTo("#s6-tg", { opacity: 0, scale: 0.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2.8)" }, G1 + 0.42);
      // "crashes": the note gives way to the zoomed tail
      tl.fromTo("#s6-nt", { opacity: 1 }, { opacity: 0, duration: 0.14 }, tZm - 0.06);
      pop("#s6-zm", tZm, 0.4);
      // "far more often": x97
      pop("#s6-oft", tOft, 0.38);
      tl.fromTo("#s6-ill", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.24, ease: "back.out(2.4)" }, tOft + 0.2);
      tl.fromTo("#s6-x97", { scale: 1 }, { scale: 1.22, duration: 0.1, ease: "power2.out", immediateRender: false }, tX);
      tl.fromTo("#s6-x97", { scale: 1.22 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, tX + 0.1);
      hop("#s6-ofth", w(11) - 0.02, 10, 0.9);

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s6"] = tl;
    })();
  </script>
</template>
