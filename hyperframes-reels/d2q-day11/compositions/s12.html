      ROW.forEach((r, i) => hop(r.el, w(15) - 0.02 + i * 0.035, 14, 0.86));

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s12"] = tl;
    })();
