        g.beginPath(); g.arc(0, 0, r, 0, 6.2832); g.clip();
        g.rotate(roll); g.strokeStyle = "rgba(255,255,255,0.75)"; g.lineWidth = r * 0.28;
        g.beginPath(); g.ellipse(0, 0, r * 0.98, r * 0.42, 0, 0, 6.2832); g.stroke();
        g.restore();
      }
      // a soft shadow of the chart on the platform, along the diagonal
      function chartShadow(k) {
        const c = Q(0, BC + 0.5, 0);
        g.save(); g.translate(c[0], c[1]); g.scale(1, 0.075);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, 470);
        gr.addColorStop(0, `rgba(30,64,175,${(0.2 * k).toFixed(3)})`); gr.addColorStop(1, "rgba(30,64,175,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 470, 0, 6.2832); g.fill(); g.restore();
      }

      const R = 19;                                           // ball radius, px
      const bob = document.getElementById("s9-bob");
      const st = { t: 0 };
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * (t + 0.4)) / 3)).toFixed(2) + "px)";
        K.shadow(0, 0, -1.6, 10, 10, 0.22);
        K.platform(0, 0, 10, 10);

        // the year ticks on the platform in front of the chart: 0 .. 10 years
        const ta = clamp((t - 0.3) / 0.3, 0, 1);
        if (ta > 0) {
          g.save(); g.globalAlpha = ta;
          for (let y = 0; y <= 10; y++) { const a = aOf(252 * y); line([Q(a, 10.1, 0), Q(a, y % 5 ? 10.6 : 10.85, 0)], "#1e3a8a", y % 5 ? 3 : 4.5); }
          g.restore();
        }
        // the 10-year bracket: draws on along the axis with "once every", a rose mark where the one crash came
        const bp = clamp((t - TBR) / 0.42, 0, 1);
        if (bp > 0) {
          const bb = 10.98, aE = A0 + (A1 - A0) * mild(bp);
          line([Q(A0, bb, 0), Q(aE, bb, 0)], "#2563eb", 7);
          if (aE > AC) { const m = Q(AC, bb, 0); g.save(); g.fillStyle = "#e11d48"; g.strokeStyle = "#ffffff"; g.lineWidth = 3;
            g.beginPath(); g.moveTo(m[0], m[1] - 12); g.lineTo(m[0] + 12, m[1]); g.lineTo(m[0], m[1] + 12); g.lineTo(m[0] - 12, m[1]); g.closePath(); g.fill(); g.stroke(); g.restore(); }
        }

        const dh = dayAt(t);
        chartShadow(clamp((t - T0) / 0.5, 0.25, 1));
        if (ta > 0) { g.save(); g.globalAlpha = ta; [2, 4, 6].forEach((z) => line([Q(A0, BC - RY, z), Q(A1, BC - RY, z)], "rgba(37,99,235,0.22)", 2.5, [10, 10])); g.restore(); }
        if (dh > 0) {
          const pts = seg(0, dh);
          curtain(pts, dh);
          rail(pts, M.blue.top, M.blue.left, "rgba(255,255,255,0.7)");
          // the cliff grows down with the fall; then the crash turns rose
          const hk = clamp((t - TH0) / 0.12, 0, 1);
          if (dh > CD) {
            const zBot = priceAt(Math.min(dh, CD + 1)) * ZS - RT;
            cliff(PB * ZS, zBot, M.blue.top, M.blue.left);
            if (hk > 0) {
              g.save(); g.globalAlpha = hk;
              rail(seg(CD - 40, CD), M.rose.top, M.rose.left);
              if (dh > CD + 1) rail(seg(CD + 1, Math.min(dh, CD + 44)), M.rose.top, M.rose.left);
              cliff(PB * ZS, zBot, M.rose.top, M.rose.right);
              g.restore();
            }
          }
          // the dotted leader from the crash signboard to the cliff
          const lk = clamp((t - (w(10) + 0.04)) / 0.2, 0, 1);
          if (lk > 0) {
            const mid = Q(AC + CW, BC + RY, (PB + PA) / 2 * ZS), bx = 592, by = 822;
            g.save(); g.globalAlpha = lk; g.strokeStyle = "#e11d48"; g.lineWidth = 6; g.lineCap = "round"; g.setLineDash([0.1, 13]);
            g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + (mid[0] + 10 - bx) * lk, by + (mid[1] - by) * lk); g.stroke(); g.restore();
          }
        }

        // the gold ball: drops onto the start, rides the head, falls down the cliff with two bounces, rides on to year 10
        if (t >= TB0) {
          let d = dh, lift = 0, sq = 0;
          if (t < T0) { const p = (t - TB0) / (T0 - TB0); lift = 3.2 * (1 - p * p); }
          if (t >= TL1 && t < TR) {
            const q = t - TL1;
            if (q < 0.22) lift = 0.45 * 4 * (q / 0.22) * (1 - q / 0.22);
            else if (q < 0.36) { const k = (q - 0.22) / 0.14; lift = 0.14 * 4 * k * (1 - k); }
          }
          [T0, TL1, TL1 + 0.22, TL1 + 0.36].forEach((tt, i) => { const dt = t - tt; if (dt >= 0 && dt < 0.12) sq = Math.max(sq, (i ? 0.16 : 0.22) * (1 - dt / 0.12)); });
          // down the cliff it falls straight (at the cliff's foot), then waits there until the path carries on
          const dB = d > CD ? Math.max(d, CD + 2) : d;
          const a = aOf(dB);
          const z = (d > CD && d < CD + 1 ? priceAt(d) : priceAt(dB)) * ZS + lift + R / U;
          const c = Q(a, BC, z);
          ball(c, R, (c[0] - 153) / R, sq);
        }
      }

      // ---- static label positions (frame px from the projection)
      const at = (id, p, dx, dy) => { const e = document.getElementById(id); e.style.left = (p[0] + dx).toFixed(1) + "px"; e.style.top = (p[1] + dy).toFixed(1) + "px"; };
      at("s9-ax0", Q(A0 - 0.2, BC - RY, 2), 0, -20);
      at("s9-ax1", Q(A0 - 0.2, BC - RY, 4), 0, -20);
      at("s9-ax2", Q(A0 - 0.2, BC - RY, 6), 0, -20);

      // ---- camera: enter under the tile cascade (scale + fade), slow push, cube flip out
      tl.fromTo("#s9-flip", { scale: 1.1, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#s9-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#s9-flip", { rotationY: 0 }, { rotationY: 90, duration: 0.26, ease: "power2.in", immediateRender: false }, DUR - 0.26);

      // ---- signboards on their words
      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.4, ease: "back.out(2.8)" }, t);
      const hop = (sel, t, h, sq) => {
        tl.fromTo(sel, { y: 0 }, { y: -h, duration: 0.11, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { y: -h }, { y: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, t + 0.11);
        tl.fromTo(sel, { scaleY: sq, scaleX: 1 + (1 - sq) * 0.6 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.23);
      };
      pop("#s9-plq", 0.3);
      tl.fromTo(".s9-ax", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", stagger: 0.06 }, 0.42);
      pop("#s9-vol", w(6) - 0.04);
      hop("#s9-volh", w(7) + 0.02, 12, 0.88);
      pop("#s9-crash", w(10) - 0.04, 0.36);
      pop("#s9-ten", Math.max(TR + 0.14, w(11) - 0.24));
      hop("#s9-tenh", w(14) + 0.02, 14, 0.86);

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s9"] = tl;
    })();
  </script>
</template>
