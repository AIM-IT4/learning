<template>
  <style>
    @font-face { font-family: "Fredoka"; font-weight: 400; src: url("assets/fonts/fredoka-400.woff2"); }
    @font-face { font-family: "Fredoka"; font-weight: 700; src: url("assets/fonts/fredoka-700.woff2"); }
    @font-face { font-family: "D2QSans"; font-weight: 100 900; src: url("assets/fonts/D2QSans.ttf"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("assets/fonts/JetBrainsMono.ttf"); }
    #root { position: absolute; inset: 0; overflow: hidden; perspective: 2400px; perspective-origin: 540px 1150px; }

    #s1-cam { transform-origin: 540px 1000px; }
    #s1-drop { transform-origin: 540px 1452px; }
    #s1-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    .s1-k { position: absolute; left: 0; top: 0; width: 80px; margin-left: -40px; height: 46px; border-radius: 23px; background: #ffffff;

    #s1-bsw { position: absolute; left: 240px; top: 600px; width: 600px; height: 84px; display: flex; justify-content: center; }

    #s1-sgw { position: absolute; left: 190px; top: 722px; width: 700px; height: 120px; display: flex; justify-content: center; }

             box-shadow: 0 10px 0 #2563eb, 0 24px 36px rgba(30,64,175,0.22); transform-origin: 50% 100%; opacity: 0; }
    #s1-sg b { font-family: "D2QSans", sans-serif; font-weight: 800; font-size: 74px; line-height: 84px; color: #2563eb; }
    #s1-sg span { font-size: 74px; line-height: 84px; color: #0b1b3a; }

    #s1-notew { position: absolute; left: 80px; top: 1508px; width: 680px; height: 60px; display: flex; justify-content: center; }
    #s1-note { height: 56px; padding: 0 26px; border-radius: 28px; background: rgba(255,255,255,0.9); font-size: 32px; line-height: 56px;
               box-shadow: 0 6px 0 #bfdbfe; transform-origin: 50% 0%; opacity: 0; }

  </style>
  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
    <div id="s1-flip">
      <div id="s1-cam">
        <div id="s1-drop">
          <div id="s1-bob">
            <canvas id="s1-cv" width="1080" height="1920"></canvas>
            <div id="s1-ks" data-layout-ignore></div>
          </div>
        </div>
        <div id="s1-bsw"><div class="s1-t" id="s1-bs">BLACK–SCHOLES</div></div>
        <div id="s1-sgw"><div class="s1-t" id="s1-sg"><b>σ</b><span>= 20%</span><em>for every strike</em></div></div>
        <div id="s1-notew"><div class="s1-t" id="s1-note">one <b>σ</b> for every option · illustrative</div></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      /*DATA*/ const DUR = 2.91; const W = [0.09, 0.27, 0.39, 0.91, 1.21, 1.47, 1.91, 2.25, 2.55]; /*END*/
      // words: 0 You 1 know 2 Black-Scholes 3 uses 4 one 5 volatility 6 for 7 every 8 option.
      const w = (i) => Math.max(0, W.length > i ? W[i] : 0.12 + i * 0.3);
// ISO KIT v1: isometric toy-world drawing on a 2D canvas, matching the Flow dioramas' look.
// Copy this block verbatim into a scene's <script> (inside its IIFE). World units: x to the right-back, y to the left-back,
// z up. P(x, y, z) -> frame px. Visible faces of a box: top, the face at y+d (front-left) and the face at x+w (front-right).
// Draw back to front: sort what you draw by (x + y) ascending, then z ascending (painter's order).
const ISO = (function () {
  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  const MAT = {
    white: { top: "#ffffff", left: "#e3ebfb", right: "#c9d8f5" },
    blue:  { top: "#7fb0ff", left: "#3b82f6", right: "#2563eb" },
    navy:  { top: "#4f6fe0", left: "#1e40af", right: "#1e3a8a" },
    sky:   { top: "#dbeafe", left: "#bfdbfe", right: "#93c5fd" },
    rose:  { top: "#fda4af", left: "#f43f5e", right: "#e11d48" },
    gold:  { top: "#fde68a", left: "#f59e0b", right: "#d97706" },
    grey:  { top: "#f1f5f9", left: "#cbd5e1", right: "#94a3b8" },
    wood:  { top: "#f3c58f", left: "#d99a5b", right: "#b97a3f" },
  };
  function make(g, ox, oy, u) {
    const P = (x, y, z) => [ox + (x - y) * C30 * u, oy + (x + y) * S30 * u - (z || 0) * u];
    function poly(pts, fill, stroke, lw) {
      g.beginPath(); pts.forEach(([a, b], i) => (i ? g.lineTo(a, b) : g.moveTo(a, b))); g.closePath();
      if (fill) { g.fillStyle = fill; g.fill(); }
      if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1.5; g.stroke(); }
    }
    function box(x, y, z, w, d, h, mat, edge) {
      if (h <= 0 || w <= 0 || d <= 0) return;
      edge = edge === undefined ? "rgba(15,35,90,0.14)" : edge;
      poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], mat.left, edge);
      poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], mat.right, edge);
      poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], mat.top, edge);
    }
    // a soft contact shadow on the floor plane z
    function shadow(x, y, z, w, d, a) {
      const c = P(x + w / 2, y + d / 2, z); const rx = (w + d) * C30 * u * 0.55, ry = (w + d) * S30 * u * 0.55;
      const gr = g.createRadialGradient(c[0], c[1], 0, c[0], c[1], rx);
      gr.addColorStop(0, `rgba(30,64,175,${a || 0.18})`); gr.addColorStop(1, "rgba(30,64,175,0)");
      g.save(); g.translate(c[0], c[1]); g.scale(1, ry / rx); g.translate(-c[0], -c[1]);
      g.fillStyle = gr; g.beginPath(); g.arc(c[0], c[1], rx, 0, 6.2832); g.fill(); g.restore();
    }
    // the floating platform: white top slab, blue band, white band, blue base (like the dioramas), its top at z = 0
    function platform(x, y, w, d) {
      box(x, y, -1.5, w, d, 0.42, MAT.blue);
      box(x, y, -1.08, w, d, 0.3, MAT.white);
      box(x, y, -0.78, w, d, 0.28, MAT.blue);
      box(x, y, -0.5, w, d, 0.5, MAT.white);
    }
    // a 2D affine matrix that maps a flat w x h DOM element onto a face given three projected corners (TL, TR, BL)
    function faceMatrix(tl, tr, bl, w, h) {
      const a = (tr[0] - tl[0]) / w, b = (tr[1] - tl[1]) / w, c = (bl[0] - tl[0]) / h, d = (bl[1] - tl[1]) / h;
      return `matrix(${a.toFixed(5)},${b.toFixed(5)},${c.toFixed(5)},${d.toFixed(5)},${tl[0].toFixed(2)},${tl[1].toFixed(2)})`;
    }
    return { P, poly, box, shadow, platform, faceMatrix, u };
  }
  return { make, MAT };
})();

      const tl = gsap.timeline({ paused: true });
      const g = document.getElementById("s1-cv").getContext("2d");
      const K = ISO.make(g, 540, 900, 48), M = ISO.MAT, P = K.P;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const outBack = (p, s) => { if (p <= 0) return 0; if (p >= 1) return 1; p -= 1; return p * p * ((s + 1) * p + s) + 1; };
      const land = (dt) => (dt < 0 ? 1 : 1 - 0.18 * Math.exp(-dt / 0.08) * Math.cos(dt * 26));

      // ---- the strike row: nine option tickets on the screen-horizontal diagonal, strike i at world (1 + i, 9 - i) ----
      const KS = [80, 85, 90, 95, 100, 105, 110, 115, 120];
      const ROW = KS.map((k, i) => ({ k, x: 1 + i, y: 9 - i, T: 0.3 + i * 0.035 }));
      const TK = 0.84, TH = 0.16;                       // ticket footprint and thickness
      const CW = 0.6, CH = 3.4;                         // vol column: footprint, height (all equal: one volatility)
      const G0 = Math.max(w(4) + 0.12, w(5) - 0.05), GS = Math.min(0.06, Math.max(0.03, (w(8) - G0 - 0.25) / 8));
      ROW.forEach((r, i) => { r.G = G0 + i * GS; });
      const PLANK = Math.max(ROW[8].G + 0.3, w(8) - 0.1);

      // camera-facing strike pills
      const ksEl = document.getElementById("s1-ks");
      ROW.forEach((r) => {
        const d = document.createElement("div"); d.className = "s1-k s1-t"; d.innerHTML = "<i>K</i>" + r.k; ksEl.appendChild(d); r.el = d;
        const p = P(r.x + 0.62, r.y + 0.62, 0); d.style.left = p[0].toFixed(1) + "px"; d.style.top = (p[1] - 6).toFixed(1) + "px";
      });

      function ticket(r, t) {
        if (t < r.T - 0.2) return;
        let z = 0; if (t < r.T) { const p = (t - (r.T - 0.2)) / 0.2; z = 1.6 * (1 - p * p); }
        const sq = land(t - r.T), s = 1 + (1 - sq) * 0.4, wd = TK * s, x0 = r.x - wd / 2, y0 = r.y - wd / 2;
        K.shadow(x0 - 0.1, y0 - 0.1, 0, wd + 0.2, wd + 0.2, 0.14);
        K.box(x0, y0, z, wd, wd, TH * sq, M.white, "rgba(15,35,90,0.18)");
        const zt = z + TH * sq;   // the blue header band along the ticket's back edge, and two printed lines
        K.poly([P(x0, y0, zt), P(x0 + wd, y0, zt), P(x0 + wd, y0 + 0.24 * s, zt), P(x0, y0 + 0.24 * s, zt)], "#3b82f6");
        [0.46, 0.66].forEach((f) => K.poly([P(x0 + 0.14, y0 + f * wd, zt), P(x0 + wd - 0.14, y0 + f * wd, zt), P(x0 + wd - 0.14, y0 + (f + 0.08) * wd, zt), P(x0 + 0.14, y0 + (f + 0.08) * wd, zt)], "#c9d8f5"));
      }
      function column(r, t) {
        const p = (t - r.G) / 0.42; if (p <= 0) return;
        const h = CH * outBack(p, 2.2);
        K.box(r.x - CW / 2, r.y - CW / 2, TH, CW, CW, h, M.blue);
      }
      // the level plank across the column tops: a beam along the row's diagonal, dropping in with a bounce
      function plank(t) {
        const p = (t - PLANK) / 0.4; if (p <= 0) return;
        const drop = 1.4 * (1 - clamp(p / 0.55, 0, 1)) ** 2, sq = land(t - PLANK - 0.22);
        const z = TH + CH + drop + 0.02, th = 0.16 * sq, o = 0.13;
        const A = [0.55, 9.45], B = [9.45, 0.55];
        K.poly([P(A[0] - o, A[1] - o, z + th), P(B[0] - o, B[1] - o, z + th), P(B[0] + o, B[1] + o, z + th), P(A[0] + o, A[1] + o, z + th)], "#ffffff", "rgba(15,35,90,0.18)");
        K.poly([P(A[0] + o, A[1] + o, z + th), P(B[0] + o, B[1] + o, z + th), P(B[0] + o, B[1] + o, z), P(A[0] + o, A[1] + o, z)], "#c9d8f5", "rgba(15,35,90,0.18)");
      }

      const st = { t: 0 }, bob = document.getElementById("s1-bob");
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * (t + 0.6)) / 3)).toFixed(2) + "px)";
        K.shadow(0, 0, -1.6, 10, 10, 0.22);
        K.platform(0, 0, 10, 10);
        ROW.forEach((r) => ticket(r, t));
        ROW.forEach((r) => column(r, t));
        plank(t);
        ROW.forEach((r) => { r.el.style.opacity = t > r.T + 0.05 ? "1" : "0"; });
      }

      // ---- camera: the platform drops in from above on frame 1 and lands with a squash; slow push; exit flip ----
      tl.fromTo("#s1-drop", { y: -700 }, { y: 0, duration: 0.6, ease: "back.out(1.6)" }, 0);
      tl.fromTo("#s1-drop", { scaleX: 1, scaleY: 1 }, { scaleX: 1.05, scaleY: 0.9, duration: 0.08, ease: "power2.out" }, 0.2);
      tl.fromTo("#s1-drop", { scaleX: 1.05, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.42, ease: "back.out(3)", immediateRender: false }, 0.28);
      tl.fromTo("#s1-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#s1-flip", { rotationY: 0 }, { rotationY: 90, duration: 0.26, ease: "power2.in", immediateRender: false }, DUR - 0.26);

      // ---- signboards on their words ----
      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.4, ease: "back.out(2.8)" }, t);
      pop("#s1-bs", w(2) - 0.06);
      pop("#s1-sg", w(4) - 0.04);
      tl.fromTo("#s1-sg", { scaleY: 0.86, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, PLANK + 0.22);
      tl.fromTo("#s1-note", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, PLANK);

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s1"] = tl;
    })();
  </script>
