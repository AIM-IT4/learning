        ROW.forEach((r) => {
          const a = clamp((t - 0.12 - r.S * 0.002) / 0.2, 0, 1); if (a <= 0) return;
          const x0 = r.x - CWD / 2, y0 = r.y - CWD / 2;
          g.globalAlpha = a;
          K.poly([P(x0 - 0.06, y0 - 0.06, 0), P(x0 + CWD + 0.06, y0 - 0.06, 0), P(x0 + CWD + 0.06, y0 + CWD + 0.06, 0), P(x0 - 0.06, y0 + CWD + 0.06, 0)], "#e6eefd", "rgba(37,99,235,0.3)", 2);
          g.globalAlpha = 1;
          const k = r.h > 0 ? outBack((t - r.T) / 0.42, 2.0) : 0, h = r.h * k;
          if (h > 0.01) { K.shadow(x0, y0, 0, CWD, CWD, 0.2); K.box(x0, y0, 0, CWD, CWD, h, M.blue); }
          else K.box(x0, y0, 0, CWD, CWD, 0.1 * a, r.S === 90 ? M.navy : M.sky);
        });
      }

      function floorShadow() {
        const cx = OX + 10, cy = OY + 10 * U + 1.5 * U + 60, rx = 450, ry = 116;
        g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
        gr.addColorStop(0, "rgba(37,99,235,0.28)"); gr.addColorStop(0.55, "rgba(37,99,235,0.11)"); gr.addColorStop(1, "rgba(37,99,235,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill(); g.restore();
      }

      const st = { t: 0 }, bob = document.getElementById("s7-bob");
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * (t + 1.3)) / 3)).toFixed(2) + "px)";
        floorShadow();
        K.shadow(0, 0, -1.6, 10, 10, 0.2);
        K.platform(0, 0, 10, 10);
        // painter's order: the card (back left), the stock (back right), then the row in front
        drawCard(t);
        drawStock(t);
        drawRow(t);
        ROW.forEach((r) => { r.el.style.opacity = clamp((t - 0.16 - r.S * 0.002) / 0.2, 0, 1).toFixed(3); });
      }

      // ---- camera: in under the tile cascade, a slow push, the cube flip out ----
      tl.fromTo("#s7-flip", { scale: 1.1, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#s7-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#s7-flip", { rotationY: 0 }, { rotationY: 90, duration: 0.26, ease: "power2.in", immediateRender: false }, DUR - 0.26);

      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.4, ease: "back.out(2.8)" }, t);
      const squashIn = (sel, t) => {
        tl.fromTo(sel, { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.86, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { scaleX: 1.08, scaleY: 0.86 }, { scaleX: 1, scaleY: 1, duration: 0.28, ease: "back.out(3)", immediateRender: false }, t + 0.07);
      };
      tl.fromTo("#s7-ax", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" }, 0.4);
      // "crash?": 100 becomes 80, the -20% pill, the 80 on the row turns rose
      tl.fromTo("#s7-sfv100", { opacity: 1 }, { opacity: 0, duration: 0.06 }, tDrop + 0.06);
      tl.fromTo("#s7-sfv80", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2.6)" }, tDrop + 0.08);
      tl.fromTo("#s7-dn", { opacity: 0, scale: 0.3, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "back.out(2.8)" }, tDrop + 0.14);
      const k80 = ROW[2].el;
      tl.fromTo(k80, { backgroundColor: "#ffffff", color: "#0b1b3a" }, { backgroundColor: "#e11d48", color: "#ffffff", duration: 0.16 }, tDrop + 0.2);
      // "low-strike put.": the header lights, then the terms
      tl.fromTo("#s7-cf-bt", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, tHead);
      tl.fromTo("#s7-cf-1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.26, ease: "back.out(2.4)" }, tBody);
      tl.fromTo("#s7-cf-2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.26, ease: "back.out(2.4)" }, tBody + 0.08);
      pop("#s7-pl", tPl, 0.36);
      tl.fromTo("#s7-nt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, tPl + 0.14);
      // "So traders pay more": one volatility's price, the price with crashes, x6.4
      pop("#s7-p1", tP1, 0.36);
      pop("#s7-p2", tP2, 0.36);
      squashIn("#s7-p2h", tP2 + 0.3);
      tl.fromTo("#s7-xc", { opacity: 0, scale: 0.2, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.26, ease: "back.out(3)" }, tX);

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s7"] = tl;
    })();
  </script>
</template>
