      /*DATA*/ const DUR = 5.59; const W = [0.16, 0.28, 0.44, 0.68, 0.98, 1.16, 1.72, 2.04, 2.28, 2.42, 2.5, 2.92, 3.34, 3.54, 3.68, 4.08, 4.3]; /*END*/

  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  const MAT = {
    white: { top: "#ffffff", left: "#e3ebfb", right: "#c9d8f5" },
    blue:  { top: "#7fb0ff", left: "#3b82f6", right: "#2563eb" },
    navy:  { top: "#4f6fe0", left: "#1e40af", right: "#1e3a8a" },

      box(x, y, -1.08, w, d, 0.3, MAT.white);

    function faceMatrix(tl, tr, bl, w, h) {

      return `matrix(${a.toFixed(5)},${b.toFixed(5)},${c.toFixed(5)},${d.toFixed(5)},${tl[0].toFixed(2)},${tl[1].toFixed(2)})`;
    }

})();

      const tl = gsap.timeline({ paused: true });

      const U = 48, OX = 540, OY = 940;

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const outBack = (p, s) => { if (p <= 0) return 0; if (p >= 1) return 1; p -= 1; return p * p * ((s + 1) * p + s) + 1; };

      // ---- the price token: the 90 put's simulated price 0.090, a blue block that drops into the slot ----
      const TOK = { c0: [7.4, 7.4], L: 2.6, T: 0.5, H: 1.4 };
      const TW = TOK.L * ES * U, THp = TOK.H * U;

        let x = TOK.c0[0], y = TOK.c0[1], z = 0;
        if (t >= a && t < b) z = 0.9 * Math.sin((Math.PI / 2) * (t - a) / (b - a));
        else if (t >= b && t < c) {
          const p = (t - b) / (c - b), e = p * p * (3 - 2 * p);
          x = TOK.c0[0] + (MCH.c[0] - TOK.c0[0]) * e; y = TOK.c0[1] + (MCH.c[1] - TOK.c0[1]) * e;
          z = 0.9 + (zt + 1.5 - 0.9) * p + 3.2 * Math.sin(Math.PI * p);
        } else if (t >= c) {

        g.beginPath(); const m = P(x + wd, y + d, h); g.moveTo(...P(x, y + d, h)); g.lineTo(...m); g.lineTo(...P(x + wd, y, h));

        K.shadow(x, y, 0, CWD, CWD, 0.12 * a);

        dashedBox(x, y, CWD, CWD, h, "#3b82f6", 0.9 * a);
      }
      // the sigma cube that comes out of the machine, and the implied-vol column that grows from it
      const OUT0 = [MCH.c[0] + EX * (MCH.L / 2 + 0.5), MCH.c[1] + EY * (MCH.L / 2 + 0.5)];
      function drawSigma(t) {
        if (t < tOut) return;
        const x = BL.c[0] - CWD / 2, y = BL.c[1] - CWD / 2;
        if (t < tLandC) {
          const p = (t - tOut) / (tLandC - tOut), e = p;
          const cx = OUT0[0] + (BL.c[0] - OUT0[0]) * e, cy = OUT0[1] + (BL.c[1] - OUT0[1]) * e, cz = 2.0 * (1 - p) + 3.0 * Math.sin(Math.PI * p);
          K.shadow(cx - 0.5, cy - 0.5, 0, 1, 1, 0.18);
          K.box(cx - 0.35, cy - 0.35, cz, 0.7, 0.7, 0.7, M.blue);

        K.box(x, y, 0, CWD, CWD, h, M.blue);

        if (h > GH.h + 0.05) {
          g.save(); g.setLineDash([10, 8]); g.strokeStyle = "rgba(255,255,255,0.9)"; g.lineWidth = 3;
          const a = P(x, y + CWD, GH.h), b2 = P(x + CWD, y + CWD, GH.h), c2 = P(x + CWD, y, GH.h);
          g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b2[0], b2[1]); g.lineTo(c2[0], c2[1]); g.stroke(); g.restore();
        }
      }

      // ---- the display: the price in, then a bisection on the Black-Scholes put price (S 100, K 90, 1 month, r 0) ----
      // sigma tried (%): each guess too high or too low halves the range; it settles where BS(sigma) = 0.090
      const TRIES = ["25.0%", "17.5%", "21.3%", "19.4%", "20.3%", "20.8%", "20.5%", "20.7%"];
      const sigEl = document.getElementById("s8-sig");
      function display(t) {
        let txt = "?";
        if (t >= tSpin) { const i = Math.min(TRIES.length - 1, Math.floor((t - tSpin) / ((tSet - tSpin) / TRIES.length))); txt = TRIES[i]; }
        if (sigEl.textContent !== txt) sigEl.textContent = txt;
      }

      function floorShadow() {
        const cx = OX + 10, cy = OY + 10 * U + 1.5 * U + 60, rx = 450, ry = 116;
        g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
        gr.addColorStop(0, "rgba(37,99,235,0.28)"); gr.addColorStop(0.55, "rgba(37,99,235,0.11)"); gr.addColorStop(1, "rgba(37,99,235,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill(); g.restore();
      }

      const st = { t: 0 }, bob = document.getElementById("s8-bob");
      function draw() {
        const t = st.t;
        g.clearRect(0, 0, 1080, 1920);
        bob.style.transform = "translateY(" + (-8 * Math.sin((2 * Math.PI * (t + 0.2)) / 3)).toFixed(2) + "px)";
        floorShadow();
        K.shadow(0, 0, -1.6, 10, 10, 0.2);
        K.platform(0, 0, 10, 10);
        // painter's order: the machine (left), the ghost and the implied-vol column (right), the token (front, or above the slot)
        const zt = drawMachine(t);
        drawGhost(t);
        drawSigma(t);
        drawToken(t, zt);
        display(t);
      }

      // ---- camera: the cube flip in, a slow push; no flip out (the tile cascade covers this cut) ----
      tl.fromTo("#s8-flip", { rotationY: -90, scale: 0.94 }, { rotationY: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo("#s8-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);

      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.4, ease: "back.out(2.8)" }, t);
      const bump = (sel, t, h, sq) => {
        tl.fromTo(sel, { y: 0 }, { y: -h, duration: 0.11, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(sel, { y: -h }, { y: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, t + 0.11);
        tl.fromTo(sel, { scaleY: sq, scaleX: 1 + (1 - sq) * 0.6 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.23);
      };
      // the token's tag leaves with it; the ghost's board comes with the ghost
      tl.fromTo("#s8-tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" }, 0.3);
      tl.fromTo("#s8-tag", { opacity: 1 }, { opacity: 0, duration: 0.16, immediateRender: false }, tLift + 0.06);
      pop("#s8-gl", 0.62, 0.36);
      // "into Black-Scholes": the price shows on the display, the title lights, price in -> sigma out
      tl.fromTo("#s8-d1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(2.4)" }, tIn + 0.12);
      tl.fromTo("#s8-mf-t", { color: "#bfdbfe" }, { color: "#ffffff", duration: 0.12 }, tLit);
      pop("#s8-io", tLit + 0.1, 0.36);
      // "higher.": the implied-vol board rides in on its column; "That's implied volatility.": the definition, then the note
      pop("#s8-bl", tGrow + 0.16, 0.36);
      bump("#s8-blh", w(15) - 0.02, 12, 0.86);
      pop("#s8-def", tDef, 0.4);
      tl.fromTo("#s8-nt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, tGrow + 0.3);

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s8"] = tl;
    })();
  </script>
</template>
