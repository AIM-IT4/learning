        // the calendar: drops in on the flip, hops on "19th" and "1987"
        const zc = (t < tCal ? 3.6 : t < tCal + dCal ? 3.6 * (1 - bounceOut((t - tCal) / dCal)) : 0) + hopZ(t, t19 + 0.02, 0.28, 0.35) + hopZ(t, tYr + 0.02, 0.28, 0.3);
        const sq = land(t - tCal - dCal / 2.75, 0.14) * land(t - t19 - 0.3, 0.1) * land(t - tYr - 0.3, 0.1), sx = 1 + (1 - sq) * 0.4;
        K.shadow(BASE.x - 0.2, BASE.y - 0.2, 0, BASE.w + 0.4, BASE.d + 0.4, 0.22 * clamp(1 - zc / 3.6, 0.2, 1));
        const bw = BASE.w * sx, bd = BASE.d * sx, bx = BASE.x + (BASE.w - bw) / 2, by = BASE.y + (BASE.d - bd) / 2;
        K.box(bx, by, zc, bw, bd, BASE.h * sq, M.wood);
        const pw = PAD.w * sx, pd = PAD.d * sx, px = PAD.x + (PAD.w - pw) / 2, py = PAD.y + (PAD.d - pd) / 2;
        const z0 = zc + BASE.h * sq, ph = PAD.h * sq, pb = PAD.band * sq;
        K.box(px, py, z0, pw, pd, ph - pb, M.white, "rgba(15,35,90,0.16)");
        K.box(px, py, z0 + ph - pb, pw, pd, pb, M.rose, "rgba(120,10,40,0.2)");
        [0.28, 0.72].forEach((f) => K.box(px + pw * 0.3, py + pd * f - 0.14, z0 + ph, 0.3, 0.28, 0.22, M.navy));   // binder rings
        const fx = px + pw;
        cf.style.transform = K.faceMatrix(P(fx, py + pd, z0 + ph), P(fx, py, z0 + ph), P(fx, py + pd, z0), FW, FH);

        // Friday's column (blue) and Monday's: same height until "fell", then it drops to 224.84 and turns rose
        const hF = H_FRI * backOut(prog(t, tFri, dGrow), 1.8);
        if (hF > 0.01) { K.shadow(FRI.cx - CW / 2, FRI.cy - CW / 2, 0, CW, CW, 0.2); column(FRI, hF, M.blue, 1); }
        let hM = H_FRI * backOut(prog(t, tMon, dGrow), 1.8), matM = M.blue, sxM = 1;
        if (t >= TB) {
          const s2 = land(t - TB - 0.02, 0.22);
          hM = H_MON * s2; sxM = 1 + (1 - s2) * 0.35;
          matM = t >= TB + 0.03 ? M.rose : M.blue;
        }
        if (hM > 0.01) { K.shadow(MON.cx - CW / 2, MON.cy - CW / 2, 0, CW, CW, 0.2); column(MON, hM, matM, sxM); }
        ghost(prog(t, TB + 0.14, 0.2));
        if (ch && !ch.behind) rbox(ch.c, CW / 2, CW / 2, H_LOST / 2, ch.r, M.rose);
      }

      // ---- camera: cube flip in, slow push, a thump when the drop lands, cube flip out ----
      tl.fromTo("#s3-flip", { rotationY: -90, scale: 0.94 }, { rotationY: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo("#s3-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#s3-cam", { y: 0 }, { y: 8, duration: 0.05, ease: "power2.out" }, tBig + 0.16);
      tl.fromTo("#s3-cam", { y: 8 }, { y: 0, duration: 0.32, ease: "back.out(3)", immediateRender: false }, tBig + 0.21);
      tl.fromTo("#s3-flip", { rotationY: 0 }, { rotationY: 90, duration: 0.26, ease: "power2.in", immediateRender: false }, DUR - 0.26);

      // ---- the calendar page fills on "October", "19th", "1987" ----
      const popIn = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.32, ease: "back.out(3)" }, t);
      popIn("#s3-oct", tOct);
      popIn("#s3-day", t19, 0.36);
      popIn("#s3-wd", t19 + 0.08);
      popIn("#s3-yr", tYr);

      // ---- the base pills: Friday's when its column lands, Monday's on "500"; Monday's close fills its slot on "fell" ----
      const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.3, y: -14 }, { opacity: 1, scale: 1, y: 0, duration: d || 0.36, ease: "back.out(2.8)" }, t);
      pop("#s3-pf", tFri + 0.3);
      pop("#s3-pm", Math.max(tMon + 0.3, w(6) - 0.1));
      tl.fromTo("#s3-pm", { boxShadow: "0 9px 0 #2563eb, 0 20px 30px rgba(30,64,175,0.2)" }, { boxShadow: "0 9px 0 #e11d48, 0 20px 30px rgba(159,18,57,0.22)", duration: 0.02, ease: "none", immediateRender: false }, TB + 0.03);
      tl.fromTo("#s3-pmd", { color: "#2563eb" }, { color: "#e11d48", duration: 0.02, ease: "none", immediateRender: false }, TB + 0.03);
      tl.fromTo("#s3-slot", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.out", immediateRender: false }, TB + 0.2);
      tl.fromTo("#s3-pmv", { opacity: 0, scale: 0.3, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(3)" }, TB + 0.22);
      tl.fromTo("#s3-pm", { y: 0 }, { y: 10, duration: 0.07, ease: "power2.out", immediateRender: false }, TB + 0.06);
      tl.fromTo("#s3-pm", { y: 10 }, { y: 0, duration: 0.3, ease: "back.out(3)", immediateRender: false }, TB + 0.13);
      tl.fromTo("#s3-n1", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, tMon + 0.1);
      tl.fromTo("#s3-n2", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, tMon + 0.25);

      // ---- "20.47%": the big rose board drops onto the stage with a squash; then the lost points; "in one day" ----
      tl.fromTo("#s3-big", { opacity: 0, scale: 1.2, y: -20 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: "power3.in" }, tBig);
      tl.fromTo("#s3-big", { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 0.82, duration: 0.06, ease: "power2.out", immediateRender: false }, tBig + 0.18);
      tl.fromTo("#s3-big", { scaleX: 1.1, scaleY: 0.82 }, { scaleX: 1, scaleY: 1, duration: 0.34, ease: "back.out(3)", immediateRender: false }, tBig + 0.24);
      tl.fromTo("#s3-lost", { opacity: 0, scale: 0.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "back.out(2.8)" }, Math.max(TB + 0.62, tBig + 0.3));
      tl.fromTo("#s3-dayp", { opacity: 0, scale: 0.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(2.8)" }, tDay);
      tl.fromTo("#s3-dayp", { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.86, duration: 0.06, ease: "power2.out", immediateRender: false }, Math.max(tDay + 0.32, w(10)));
      tl.fromTo("#s3-dayp", { scaleX: 1.08, scaleY: 0.86 }, { scaleX: 1, scaleY: 1, duration: 0.24, ease: "back.out(3)", immediateRender: false }, Math.max(tDay + 0.32, w(10)) + 0.06);

      tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["s3"] = tl;
    })();
  </script>
</template>
