      const st = { t: 0 }, bob = document.getElementById("s5-bob");
      function draw() {

      // ---- camera: the cube flip in, a slow push, the cube flip out ----
      tl.fromTo("#s5-flip", { rotationY: -90, scale: 0.94 }, { rotationY: 0, scale: 1, duration: 0.36, ease: "power3.out" }, 0);
      tl.fromTo("#s5-cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "sine.inOut" }, 0);

      const hop = (sel, t, h, sq) => {
