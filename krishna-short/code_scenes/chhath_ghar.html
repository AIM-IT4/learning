<body><canvas id="c" width="1080" height="1920"></canvas>

<script>
// "छठ — घर बुलाता है": a Bihari working in Mumbai goes home for Chhath. Part 1 (the journey: Mumbai, Maa's call,
// packing, flights and the Chhath special train, station boards, the auto to the village, Maa at the door) runs on
// the song's instrumental intro; part 2 (the four days with the family, the daura, kosi and fireworks, thekua) on its
// vocals. Shot times, subtitles and word cues come from voice/make_timing_ghar.py through window.setTiming().
const DEF = {
  shots: [['mumbai', 0, 5.29], ['phone', 5.29, 11.45], ['pack', 11.45, 15.87], ['flight', 15.87, 18.53], ['train', 18.53, 22.73], ['stations', 22.73, 29.94],
    ['auto', 29.94, 37.42], ['door', 37.42, 42.7], ['family', 42.7, 50.629], ['day1', 50.629, 56.391], ['day2', 56.391, 62.154], ['day3', 62.154, 71.757],
    ['kosi', 71.757, 77.52], ['day4', 77.52, 82.322], ['end', 82.322, 89.044]],
  subs: [], cues: {}, total: 89.044, fast: ['day1', 'day2', 'day3', 'kosi', 'day4', 'end'],
};
const SC = {}, OVER = {};
// the family
const SON = { kind: 'man', outfit: 'shirt', shirt: '#2f6fb0', pants: '#2a2a38', bangles: false, alta: false, seed: 1 };
const SON_HOME = { ...SON, outfit: 'kurta', kurta: C.yellow, pants: C.white, border: C.red, shoe: 'sandal' };
const MAA = { kind: 'woman', ghunghat: true, sari: C.red, sari2: C.yellow, border: C.gold, blouse: C.yellow, seed: 2 };
const PAPA = { kind: 'man', outfit: 'kurta', kurta: C.cream, pants: C.white, border: C.maroon, mustache: true, hairCol: '#9a9a9a', glasses: true, shoe: 'sandal', seed: 3 };
const BHABHI = { kind: 'woman', ghunghat: true, sari: C.pink, sari2: C.gold, border: C.red, blouse: C.green, seed: 4 };
const GIRL = { kind: 'woman', child: true, sindoor: false, sari: C.orange, sari2: C.yellow, border: C.red, blouse: C.green, seed: 5, bangles: false, alta: false };
const BOY = { kind: 'man', outfit: 'shirt', child: true, shirt: C.red, pants: '#2a4a8a', seed: 6 };

// ------------------------------------------------------------------ small helpers
function rr(x, y, w, h, r) { g.roundRect(x, y, w, h, r); }
function palm(x, y, s, t) { // taad (palmyra) tree
  g.save(); g.translate(x, y); g.scale(s, s);
  shape(() => { g.moveTo(-0.22, 0); g.quadraticCurveTo(0.2, -4, 0.05, -8.2); g.lineTo(0.3, -8.2); g.quadraticCurveTo(0.45, -4, 0.22, 0); g.closePath(); }, '#5a3a22', { w: 0.06, pattern: () => { for (let yy = -0.5; yy > -8.2; yy -= 0.5) { g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.05; g.beginPath(); g.moveTo(-0.5, yy); g.lineTo(0.8, yy - 0.1); g.stroke(); } } });
  for (let i = 0; i < 11; i++) { const a = -Math.PI + i / 10 * Math.PI + Math.sin(t * 1.3 + i) * 0.04, L = 2.1 + (i % 2) * 0.4;
    shape(() => { g.moveTo(0.17, -8.2); g.quadraticCurveTo(0.17 + Math.cos(a - 0.15) * L * 0.6, -8.2 + Math.sin(a - 0.15) * L * 0.6, 0.17 + Math.cos(a) * L, -8.2 + Math.sin(a) * L * 0.8 + 0.3); g.quadraticCurveTo(0.17 + Math.cos(a + 0.15) * L * 0.6, -8.2 + Math.sin(a + 0.15) * L * 0.6, 0.17, -8.2); }, i % 2 ? C.green : C.leaf, { w: 0.05 }); }
  g.restore();
}
function hut(x, y, s, col = '#c98a52', lit = 0) {
  g.save(); g.translate(x, y); g.scale(s, s);
  shape(() => g.rect(-2, -2.2, 4, 2.2), col, { w: 0.07, pattern: () => zigzagBand(-2, 2, -1.9, 0.18, C.red, 0.4) });
  shape(() => { g.moveTo(-2.5, -2.1); g.lineTo(0, -4.0); g.lineTo(2.5, -2.1); g.closePath(); }, '#b0904a', { w: 0.07, pattern: () => patLines('rgba(90,60,20,0.5)', 0.22, 0.05, 1.2, 6) });
  shape(() => g.rect(-0.45, -1.5, 0.9, 1.5), lit ? '#ffcf70' : '#2a1a0a', { w: 0.06 });
  if (lit) glow(0, -0.75, 2.6, `rgba(255,190,90,${0.5 * lit})`);
  g.restore();
}
function mug(x, y, t) { shape(() => rr(x - 20, y - 26, 40, 50, 6), C.cream, { w: 3, pattern: () => zigzagBand(x - 20, x + 20, y - 4, 6, C.red, 10) }); g.beginPath(); g.arc(x + 22, y, 12, -1.2, 1.2); inkStroke(5, C.cream); g.beginPath(); g.arc(x + 22, y, 12, -1.2, 1.2); inkStroke(2); steam(x, y - 30, 0.35, t, 2); }
function aripanFloor(cx, cy, r) {
  g.save(); g.translate(cx, cy); g.scale(1, 0.4); g.strokeStyle = 'rgba(252,246,232,0.95)'; g.fillStyle = 'rgba(252,246,232,0.95)'; g.globalAlpha = REVEAL.f;
  for (let k = 0; k < 3; k++) { g.lineWidth = 6; g.beginPath(); g.arc(0, 0, r * (0.35 + k * 0.3), 0, TAU); g.stroke(); for (let i = 0; i < 8 + k * 4; i++) { const a = i / (8 + k * 4) * TAU; g.beginPath(); g.arc(Math.cos(a) * r * (0.5 + k * 0.3), Math.sin(a) * r * (0.5 + k * 0.3), 7, 0, TAU); g.fill(); } }
  g.beginPath(); g.arc(0, 0, r * 0.12, 0, TAU); g.fillStyle = C.red; g.fill(); g.restore();
}
function bag(x, y, w, col = C.maroon) { // a travel bag hanging from (x, y)
  g.beginPath(); g.arc(x, y + 6, w * 0.16, Math.PI, 0); inkStroke(5, '#3a2418');
  shape(() => rr(x - w / 2, y + 6, w, w * 0.62, 12), col, { w: 4, pattern: () => { zigzagBand(x - w / 2, x + w / 2, y + w * 0.32, 8, C.gold, 16); } });
}
function dustPuff(x, y, t, n = 6) { for (let i = 0; i < n; i++) { const p = (t * 1.4 + i / n) % 1; g.fillStyle = `rgba(222,190,140,${0.45 * (1 - p)})`; g.beginPath(); g.arc(x - p * 120 - i * 6, y - p * 40, 14 + p * 30, 0, TAU); g.fill(); } }
// fireworks: a burst `age` seconds after it pops; rgb 'r,g,b'
function burst(cx, cy, age, seed, rgb, n = 54, rad = 230) {
  if (age < 0 || age > 2.4) return;
  const r = R(seed), k = easeOut(age / 1.0), fade = 1 - clamp((age - 0.7) / 1.7);
  g.save(); g.globalCompositeOperation = 'lighter';
  if (age < 0.35) glow(cx, cy, 300 * (1 - age / 0.35) + 60, `rgba(255,240,200,${0.6 * (1 - age / 0.35)})`);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + r() * 0.12, sp = rad * (0.7 + r() * 0.4), dy = 70 * age * age;
    const x = cx + Math.cos(a) * sp * k, y = cy + Math.sin(a) * sp * k + dy, x0 = cx + Math.cos(a) * sp * k * 0.72, y0 = cy + Math.sin(a) * sp * k * 0.72 + dy * 0.85;
    g.strokeStyle = `rgba(${rgb},${0.45 * fade})`; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x, y); g.stroke();
    const tw = 0.55 + 0.45 * Math.sin(age * 28 + i * 1.7);
    g.fillStyle = `rgba(${rgb},${fade * tw})`; g.beginPath(); g.arc(x, y, 5, 0, TAU); g.fill();
    if (i % 3 === 0) { g.fillStyle = `rgba(255,255,255,${fade * tw * 0.85})`; g.beginPath(); g.arc(x, y, 2.2, 0, TAU); g.fill(); }
  }
  g.restore();
}
function rocketTrail(x, y0, y1, p) { if (p <= 0 || p >= 1) return; const y = lerp(y0, y1, easeOut(p)); g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 12; i++) { g.fillStyle = `rgba(255,210,140,${0.6 * (1 - i / 12)})`; g.beginPath(); g.arc(x + Math.sin(i) * 2, y + i * 9, 3.5 - i * 0.2, 0, TAU); g.fill(); } g.restore(); }
function anar(x, y, t, h = 300) { // ground fountain firework
  g.save(); g.globalCompositeOperation = 'lighter'; const r = R(99);
  for (let i = 0; i < 110; i++) { const ph = (t * 1.7 + r()) % 1, a = -Math.PI / 2 + (r() - 0.5) * 0.75, v = h * (0.7 + r() * 0.5);
    const px = x + Math.cos(a) * v * ph, py = y - 30 + Math.sin(a) * v * ph + 320 * ph * ph;
    g.fillStyle = `rgba(255,${190 + Math.floor(r() * 60)},${80 + Math.floor(r() * 90)},${(1 - ph) * 0.9})`; g.beginPath(); g.arc(px, py, 2.4 + (1 - ph) * 2.2, 0, TAU); g.fill(); }
  g.restore(); glow(x, y - 40, 150, 'rgba(255,200,90,0.45)');
  shape(() => { g.moveTo(x - 24, y + 6); g.lineTo(x - 12, y - 34); g.lineTo(x + 12, y - 34); g.lineTo(x + 24, y + 6); g.closePath(); }, C.red, { w: 3, pattern: () => patDots(C.yellow, 12, 2, x - 30, y - 40, x + 30, y + 10) });
}
// a local ink-wipe between two painters inside one shot (p 0..1)
function wipeBetween(p, a, b, seed, cx = 540, cy = 1000) {
  if (p <= 0) return a(); if (p >= 1) return b();
  a(); g.save(); inkWipe(p, seed, cx, cy); g.clip(); b(); g.restore();
  g.save(); inkWipe(p, seed, cx, cy); g.strokeStyle = `rgba(40,15,5,${0.5 * (1 - p)})`; g.lineWidth = 14; g.stroke(); g.restore();
}

// ------------------------------------------------------------------ 1 Mumbai: alone on a high-rise balcony at night
function skyline(seed, base, hmin, hmax, wmin, wmax, col, lit, t, ant) {
  const r = R(seed); let x = -240;
  while (x < 1320) { const w = wmin + r() * (wmax - wmin), h = hmin + r() * (hmax - hmin); tower(x, base, w, h, t, { col, lit, seed: Math.floor(r() * 1e6), antenna: ant && r() < 0.4, cw: w > 110 ? 22 : 17, chh: 26 }); x += w + 8 + r() * 24; }
}
function seaLink(x, y, s, t) { // cable-stayed bridge across the bay
  g.save(); g.translate(x, y); g.strokeStyle = 'rgba(205,215,255,0.55)'; g.lineWidth = 1.6;
  for (const px of [0, 300 * s]) {
    for (let k = 1; k <= 8; k++) { g.beginPath(); g.moveTo(px, -170 * s); g.lineTo(px - k * 24 * s, 0); g.moveTo(px, -170 * s); g.lineTo(px + k * 24 * s, 0); g.stroke(); }
    shape(() => { g.moveTo(px - 14 * s, 4); g.lineTo(px - 3 * s, -186 * s); g.lineTo(px + 3 * s, -186 * s); g.lineTo(px + 14 * s, 4); g.closePath(); }, '#3a3f7a', { w: 2 });
  }
  shape(() => g.rect(-320 * s, -3, 980 * s, 8), '#2a2f66', { w: 2 });
  for (let i = 0; i < 48; i++) { g.fillStyle = `rgba(255,220,150,${0.55 + 0.45 * Math.sin(t * 2 + i)})`; g.fillRect(-310 * s + i * 20 * s, -7, 3, 3); }
  g.restore();
}
function necklace(t) { // the curve of streetlights along the sea front
  const P = u => [lerp(-140, 1220, u), (1 - u) * (1 - u) * 1395 + 2 * (1 - u) * u * 1500 + u * u * 1345];
  g.beginPath(); for (let i = 0; i <= 40; i++) { const [x, y] = P(i / 40); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.strokeStyle = '#1a1730'; g.lineWidth = 30; g.stroke();
  for (let i = 0; i < 18; i++) { const uu = (t * 0.045 + i / 18) % 1, [x, y] = P(uu); g.fillStyle = i % 2 ? 'rgba(255,90,70,0.95)' : 'rgba(255,248,220,0.95)'; g.fillRect(x - 7, y - 4 + (i % 2) * 7, 14, 3.5); }
  for (let i = 0; i <= 50; i++) { const [x, y] = P(i / 50); glow(x, y - 18, 30, 'rgba(255,190,90,0.5)'); g.fillStyle = '#ffe0a0'; g.beginPath(); g.arc(x, y - 18, 4.2, 0, TAU); g.fill(); }
}
SC.mumbai = (u, T) => {
  camPath(u / T, [520, 900, 1.0], [600, 980, 1.1]);
  layer(0.1, () => { skyGrad([[0, '#05081f'], [0.4, '#121845'], [0.54, '#2a2357'], [0.62, '#55305e']]); paperOver(0.2); stars(70, 9, 700, u); moon(860, 300, 52, '#0a0f30'); });
  layer(0.25, () => { skyline(21, 1130, 220, 520, 50, 110, '#262b66', 0.26, u, false); });
  layer(0.42, () => {
    skyline(5, 1170, 380, 780, 90, 175, '#151944', 0.5, u, true);
    shape(() => g.rect(-300, 1165, 1680, 420), '#0b1238', { ink: false });
    seaLink(130, 1210, 0.85, u);
    g.save(); g.globalCompositeOperation = 'lighter'; const r = R(8);
    for (let i = 0; i < 70; i++) { const x = r() * 1240 - 80, y = 1225 + r() * 170, w = 6 + r() * 28; g.fillStyle = `rgba(255,${190 + (r() * 50 | 0)},120,${0.1 + 0.16 * (0.5 + 0.5 * Math.sin(u * 2 + i))})`; g.fillRect(x + Math.sin(u * 1.5 + i) * 6, y, w, 3); }
    g.restore();
    necklace(u);
  });
  layer(0.95, () => {
    shape(() => g.rect(-300, 1640, 1680, 600), '#33263a', { w: 4, pattern: () => { patLines('rgba(255,220,160,0.1)', 96, 3, 0, 2600); patLines('rgba(255,220,160,0.1)', 96, 3, 1.57, 2600); } });
    shape(() => g.rect(-300, 1462, 1680, 22), '#2a2238', { w: 4, inkCol: '#c99a40' });
    for (let x = -280; x < 1380; x += 64) shape(() => g.rect(x, 1484, 9, 160), '#2a2238', { w: 2, inkCol: '#c99a40' });
    shape(() => g.rect(-300, 1630, 1680, 16), '#2a2238', { w: 3, inkCol: '#c99a40' });
    glow(-60, 1560, 760, 'rgba(255,170,80,0.26)');
    tulsi(930, 1700, 34, u);
    const f = figure(300, 1830, 84, { ...SON, pose: 'hold' }, u);
    mug(f.hand[0] + 10, f.hand[1] + 4, u);
  });
};
OVER.mumbai = (u, T) => place(u, T, 'मुंबई', 'घर से बहुत दूर…', 150);

// ------------------------------------------------------------------ 2 Maa calls
function bokeh(t, seed = 3) { const r = R(seed); g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 34; i++) { const x = r() * 1180 - 50, y = r() * 1900, rad = 30 + r() * 80, warm = r() < 0.6, a = 0.07 + r() * 0.14 + 0.04 * Math.sin(t * 1.2 + i); g.fillStyle = warm ? `rgba(255,180,90,${a})` : `rgba(120,160,255,${a})`; g.beginPath(); g.arc(x + Math.sin(t * 0.3 + i) * 8, y, rad, 0, TAU); g.fill(); } g.restore(); }
function handset(x, y, s, rot, col) { g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.beginPath(); g.moveTo(-0.85, -0.3); g.quadraticCurveTo(0, 0.5, 0.85, -0.3); g.lineWidth = 0.36; g.strokeStyle = col; g.lineCap = 'round'; g.stroke(); g.restore(); }
function portrait(cx, cy, r, who, t) {
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.clip(); g.fillStyle = C.turmeric; g.fillRect(cx - r, cy - r, 2 * r, 2 * r); patDots(C.orange, 26, 3, cx - r, cy - r, cx + r, cy + r);
  const k = r * 0.8; g.translate(cx - 0.2 * k, cy + 6.45 * k); g.scale(k, k);
  shape(() => g.ellipse(0.15, -5.0, 1.15, 0.8, 0, 0, TAU), who.sari, { w: 0.04, pattern: () => patDots(who.sari2, 0.3, 0.05, -1.2, -6, 1.4, -4.2) });
  shape(() => { g.moveTo(0.1, -6.18); g.lineTo(0.42, -6.12); g.lineTo(0.42, -5.72); g.lineTo(0.0, -5.74); g.closePath(); }, C.skin, { w: 0.03 });
  head({ ...who, skin: C.skin, t });
  g.restore(); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.lineWidth = 6; g.strokeStyle = C.gold; g.stroke();
}
SC.phone = (u, T) => {
  camPath(u / T, [540, 990, 1.07], [540, 930, 1.0]);
  const pick = cue('babua', 3.9) - 0.6, on = ease((u - pick) / 0.3);
  layer(0.2, () => { skyGrad([[0, '#0b0d2e'], [0.6, '#22163e'], [1, '#3a1a3a']]); paperOver(0.25); bokeh(u); });
  layer(0.85, () => {
    const px = 300, py = 440, pw = 480, ph = 980, cx = 540;
    shape(() => { g.moveTo(10, 2100); g.lineTo(230, 1500); g.lineTo(560, 1590); g.lineTo(430, 2100); g.closePath(); }, SON.shirt, { w: 6, pattern: () => { patLines('rgba(0,0,0,0.13)', 26, 4, 0, 3000); patLines('rgba(0,0,0,0.1)', 26, 4, 1.57, 3000); } });
    shape(() => { g.moveTo(250, 1560); g.quadraticCurveTo(270, 1330, 420, 1270); g.lineTo(770, 1250); g.quadraticCurveTo(850, 1420, 720, 1580); g.quadraticCurveTo(500, 1660, 250, 1560); g.closePath(); }, C.skin, { w: 6 });
    shape(() => rr(px, py, pw, ph, 64), '#16131d', { w: 7, inkCol: '#d9a520' });
    g.save(); g.beginPath(); rr(px + 20, py + 20, pw - 40, ph - 40, 48); g.clip();
    const gr = g.createLinearGradient(0, py, 0, py + ph); gr.addColorStop(0, '#5a1420'); gr.addColorStop(1, '#1e1440'); g.fillStyle = gr; g.fillRect(px, py, pw, ph);
    patDots('rgba(255,210,120,0.08)', 30, 3, px, py, px + pw, py + ph);
    const cy = py + 340;
    if (on < 1) tx('कॉल आ रहा है…', cx, py + 125, '36px NotoDeva', '#f2d48a', { a: 1 - on });
    if (on > 0) tx('00:0' + Math.min(9, Math.max(0, Math.floor(u - pick))), cx, py + 125, '36px NotoDeva', '#9be59b', { a: on });
    if (on < 1) for (let k = 0; k < 3; k++) { const p = (u * 0.8 + k / 3) % 1; g.beginPath(); g.arc(cx, cy, 150 + p * 110, 0, TAU); g.strokeStyle = `rgba(255,210,120,${0.55 * (1 - p) * (1 - on)})`; g.lineWidth = 4; g.stroke(); }
    portrait(cx, cy, 150, MAA, u);
    tx('माँ', cx, py + 650, '124px "Yatra One"', '#ffd34d', { stroke: '#3a0a06', sw: 10 });
    tx('मधुबनी, बिहार', cx, py + 712, '32px NotoDeva', '#f2d48a');
    const by = py + ph - 165;
    if (on < 1) { g.save(); g.globalAlpha = 1 - on; shape(() => g.arc(cx - 120, by, 58, 0, TAU), '#d8382a', { w: 4 }); handset(cx - 120, by + 6, 34, Math.PI, '#fff');
      const pul = 1 + 0.08 * Math.sin(u * 9); shape(() => g.arc(cx + 120, by, 58 * pul, 0, TAU), '#2fae5a', { w: 4 }); handset(cx + 120, by - 6, 34, 0, '#fff'); g.restore(); }
    if (on > 0) { g.save(); g.globalAlpha = on; shape(() => g.arc(cx, by, 58, 0, TAU), '#d8382a', { w: 4 }); handset(cx, by + 6, 34, Math.PI, '#fff'); g.restore(); }
    g.restore();
    for (let i = 0; i < 4; i++) shape(() => rr(px + pw - 36, py + 560 + i * 102, 92, 86, 40), C.skin, { w: 5 });
    shape(() => g.ellipse(px + 14, py + 720, 48, 120, -0.2, 0, TAU), C.skin, { w: 5 });
  });
  const bub = ease((u - cue('babua', 3.9) + 0.15) / 0.35);
  if (bub > 0) { g.save(); const s2 = 0.85 + 0.15 * easeOut(bub); g.translate(540, 290); g.scale(s2, s2); g.globalAlpha = bub;
    shape(() => { g.moveTo(-40, 80); g.lineTo(10, 175); g.lineTo(50, 80); g.closePath(); }, '#fff4dc', { w: 6 });
    shape(() => rr(-460, -110, 920, 196, 56), '#fff4dc', { w: 6 });
    g.fillStyle = '#fff4dc'; g.fillRect(-36, 70, 82, 22);
    tx('“बबुआ, छठ में आ रहे हो ना?”', 0, 22, '62px Tiro', '#5a0a06'); g.restore(); }
};

// ------------------------------------------------------------------ 3 packing: the calendar, a waiting-list ticket, gifts for home
function calendar(x, y, w, u) {
  const h = w * 1.28; g.save(); g.translate(x, y);
  g.beginPath(); g.moveTo(w / 2, -44); g.lineTo(w * 0.3, 0); g.moveTo(w / 2, -44); g.lineTo(w * 0.7, 0); inkStroke(3); g.beginPath(); g.arc(w / 2, -46, 7, 0, TAU); fillA(C.ink);
  shape(() => g.rect(0, 0, w, h), '#fffaf0', { w: 4 });
  shape(() => g.rect(0, 0, w, h * 0.15), C.red, { w: 4, pattern: () => zigzagBand(0, w, h * 0.135, 8, C.yellow, 18) });
