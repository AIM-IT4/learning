<script type="module">
// Every scene of the 3D Chhath status, modelled from primitives with three.js (no photos, no AI images, no model files).
// window.render(name, t, T) builds the scene once, poses it for time t of a T-second shot and returns a JPEG data URL.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const W = 1080, H = 1920, PI = Math.PI;
const { Group, Mesh, Vector2: V2, Vector3: V3 } = THREE;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(new THREE.Scene(), new THREE.PerspectiveCamera());

composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(new OutputPass());
const pmrem = new THREE.PMREMGenerator(renderer);

// ------------------------------------------------------------------ materials
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0, ...o });
const glowMat = (r, g, b, o = {}) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b), toneMapped: false, ...o });
const GOLD = mat(0xd9a520, { metalness: 1, roughness: 0.32 });
const BRASS = mat(0xd8a53a, { metalness: 1, roughness: 0.22 });
const SKIN = mat(0xa8673e, { roughness: 0.55 });
const CLAY = mat(0xa04a22, { roughness: 0.85 });
const STONE = mat(0xb08d72, { roughness: 0.9 });
const STONE2 = mat(0x9a7a62, { roughness: 0.9 });
const FLAME = glowMat(9.0, 4.2, 1.0);
const FLAME_CORE = glowMat(14.0, 12.0, 7.0);
const SARIS = [
  { sari: 0xffc21a, blouse: 0xc8102e }, { sari: 0xff7a00, blouse: 0x8b0000 }, { sari: 0xe8364f, blouse: 0x1e7b4a },
  { sari: 0xff4f9a, blouse: 0x5a1a8a }, { sari: 0xf2b705, blouse: 0x2a6f97 }, { sari: 0xc1121f, blouse: 0xffcc33 },
];
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const WEAVE = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#dcae55'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < w; i += 16) { g.fillStyle = (i / 16) % 2 ? '#c8913a' : '#e9c26e'; g.fillRect(i, 0, 8, h); }
  g.globalAlpha = 0.55; for (let j = 0; j < h; j += 16) { g.fillStyle = (j / 16) % 2 ? '#b07a28' : '#f2d184'; g.fillRect(0, j, w, 8); }
}, [3, 3]);
const BAMBOO = mat(0xffffff, { map: WEAVE, roughness: 0.8 });
const SOFT = canvasTex(128, 128, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });

// tileable water normal map made from integer-frequency waves
const NORMALS = (() => {
  const N = 256, d = new Uint8Array(N * N * 4), waves = [[1, 2, 0.6, 0.3], [3, -1, 0.45, 1.1], [-2, 3, 0.4, 2.0], [5, 4, 0.22, 0.7], [-6, 2, 0.18, 2.6], [7, -5, 0.12, 1.9], [11, 9, 0.07, 0.4], [-13, 6, 0.05, 1.2]];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let dx = 0, dy = 0;
    for (const [kx, ky, a, ph] of waves) { const c = Math.cos(2 * PI * (kx * x + ky * y) / N + ph); dx += a * kx * c; dy += a * ky * c; }
    const n = new V3(-dx * 0.09, -dy * 0.09, 1).normalize(), i = (y * N + x) * 4;
    d[i] = (n.x * 0.5 + 0.5) * 255; d[i + 1] = (n.y * 0.5 + 0.5) * 255; d[i + 2] = (n.z * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, N, N); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.needsUpdate = true; return t;
})();

// ------------------------------------------------------------------ environment
function sunVec(elev, azim) { return new V3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - elev), THREE.MathUtils.degToRad(azim)); }
const SKYPAL = {
  sunset:  ['#ffb54d', '#e4603a', '#7b2d5b', '#2b1747', '#ffcf8a'],
  dusk:    ['#f6b26b', '#e07a4a', '#6a3a6e', '#1d1e4a', '#ffd6a0'],
  sunrise: ['#ffc890', '#ff9a7a', '#a8688f', '#2e3a7a', '#ffe6c0'],
  predawn: ['#ffd0a0', '#e89a8a', '#6a5a9a', '#1d2350', '#ffe2b8'],
  golden:  ['#ffe0a8', '#f4c088', '#a8c0dc', '#5d7fb8', '#fff0c8'],

// gradient sky with a glowing sun disc (values above 1 only in the sun, so only the sun and flames bloom)
function addSky(scene, elev, azim, o = {}) {
  const P = SKYPAL[o.pal || 'sunset'], col = c => new THREE.Color(c);
  const sun = sunVec(elev, azim);
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { c0: { value: col(P[0]) }, c1: { value: col(P[1]) }, c2: { value: col(P[2]) }, c3: { value: col(P[3]) }, sc: { value: col(P[4]) }, sunDir: { value: sun.clone() }, size: { value: o.size ?? 0.9994 } },
    vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position.z = gl_Position.w; }',
    fragmentShader: `uniform vec3 c0, c1, c2, c3, sc, sunDir; uniform float size; varying vec3 p;
      void main(){ vec3 d = normalize(p); float h = d.y;
        vec3 col = mix(c0, c1, smoothstep(0.0, 0.08, h)); col = mix(col, c2, smoothstep(0.06, 0.28, h)); col = mix(col, c3, smoothstep(0.25, 0.75, h));
        if (h < 0.0) col = mix(c0, c1 * 0.5, smoothstep(0.0, -0.3, h));
        float g = max(dot(d, sunDir), 0.0);
        col += sc * (pow(g, 8.0) * 0.22 + pow(g, 90.0) * 0.45);
        float disc = smoothstep(size - 0.00025, size + 0.00005, g);
        col = mix(col, sc * 7.0, disc);
        gl_FragColor = vec4(col, 1.0); }` });
  const sky = new Mesh(new THREE.SphereGeometry(5000, 48, 24), m); sky.renderOrder = -1; scene.add(sky);
  const env = new THREE.Scene(); env.add(new Mesh(new THREE.SphereGeometry(100, 32, 16), m)); scene.environment = pmrem.fromScene(env, 0.04).texture;
  return { sky, sun, setSun(e, a) { const v = sunVec(e, a); m.uniforms.sunDir.value.copy(v); this.sun.copy(v); } };
}
function nightSky(scene, top = 0x03041a, bottom = 0x2a1630, stars = 900) {
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { top: { value: new THREE.Color(top) }, bottom: { value: new THREE.Color(bottom) } },
    vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 p; void main(){ float k = smoothstep(-0.05, 0.6, p.y); gl_FragColor = vec4(mix(bottom, top, k), 1.0); }' });
  scene.add(new Mesh(new THREE.SphereGeometry(3000, 32, 16), m));
  const r = R(3), pos = [];
  for (let i = 0; i < stars; i++) { const v = new V3(r() * 2 - 1, r() * 0.9 + 0.08, r() * 2 - 1).normalize().multiplyScalar(2500); pos.push(v.x, v.y, v.z); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff2d8, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.85 })));
  const env = new THREE.Scene(); env.add(new Mesh(new THREE.SphereGeometry(100, 16, 8), m)); scene.environment = pmrem.fromScene(env, 0.05).texture;
}
function addWater(scene, sun, o = {}) {
  const w = new Water(new THREE.PlaneGeometry(6000, 6000), { textureWidth: 512, textureHeight: 512, waterNormals: NORMALS, sunDirection: sun.clone().normalize(),
    sunColor: o.sunColor ?? 0x9a6a48, waterColor: o.color ?? 0x0e1a26, distortionScale: o.dist ?? 3.2, fog: !!scene.fog });
  w.rotation.x = -PI / 2; w.position.y = o.y ?? 0; w.material.uniforms.size.value = o.size ?? 4; scene.add(w); return w;
}
function addLights(scene, sun, o = {}) {
  scene.add(new THREE.HemisphereLight(o.sky ?? 0xffd2b0, o.ground ?? 0x3a2448, o.hemi ?? 0.9));
  const d = new THREE.DirectionalLight(o.col ?? 0xffb27a, o.i ?? 2.4); d.position.copy(sun).multiplyScalar(60); scene.add(d);
  if (o.shadow) { d.castShadow = true; d.shadow.mapSize.set(1024, 1024); const c = d.shadow.camera; c.left = -6; c.right = 6; c.top = 6; c.bottom = -6; c.near = 1; c.far = 150; d.shadow.bias = -0.0005; }
  if (o.fill) { const f = new THREE.DirectionalLight(o.fillCol ?? 0xc8b8ff, o.fill); f.position.set(0, 4, 10); scene.add(f); }
  return d;
}

// ------------------------------------------------------------------ props
const DIYA_GEO = new THREE.LatheGeometry([new V2(0, 0), new V2(0.045, 0.004), new V2(0.07, 0.02), new V2(0.078, 0.034), new V2(0.068, 0.036), new V2(0.05, 0.024), new V2(0, 0.022)], 20);
const FLAME_GEO = new THREE.SphereGeometry(0.011, 10, 8);
function makeDiya(s = 1) {
  const g = new Group(), b = new Mesh(DIYA_GEO, CLAY); g.add(b);
  const sp = new Mesh(new THREE.ConeGeometry(0.018, 0.05, 8), CLAY); sp.rotation.z = -PI / 2; sp.position.set(0.075, 0.03, 0); g.add(sp);
  const f = new Mesh(FLAME_GEO, FLAME); f.position.set(0.085, 0.058, 0); g.add(f);
  const c = new Mesh(FLAME_GEO, FLAME_CORE); c.scale.setScalar(0.45); c.position.set(0.085, 0.05, 0); g.add(c);
  g.scale.setScalar(s); g.userData = { f, c }; return g;
}
function flicker(d, t, seed, lit = 1) {
  const { f, c } = d.userData, k = lit * (1 + 0.16 * nz(t * 7, seed));
  f.scale.set(k, 2.7 * k * (1 + 0.12 * nz(t * 5, seed + 2)), k); c.scale.set(0.45 * k, 0.9 * k, 0.45 * k); f.visible = c.visible = lit > 0.03;
  f.position.x = 0.085 + 0.004 * nz(t * 4, seed + 5);
}
function diyaLight(scene, x, y, z, i = 1.6, dist = 3) { const l = new THREE.PointLight(0xff9a3a, i, dist, 2); l.position.set(x, y, z); scene.add(l); return l; }
function sugarcane(h = 1.4, r = 0.018) {
  const g = new Group(); const st = new Mesh(new THREE.CylinderGeometry(r, r * 1.1, h, 8), mat(0x5d7a2c, { roughness: 0.6 })); st.position.y = h / 2; g.add(st);
  const nodeM = mat(0x3c4a1c); for (let y = 0.15; y < h; y += 0.16) { const n = new Mesh(new THREE.CylinderGeometry(r * 1.15, r * 1.15, 0.012, 8), nodeM); n.position.y = y; g.add(n); }
  const leafM = mat(0x6f9a35, { side: THREE.DoubleSide, roughness: 0.6 });
  for (let i = 0; i < 5; i++) { const lf = new Mesh(new THREE.PlaneGeometry(0.06, 0.55, 1, 4), leafM); bendLeaf(lf.geometry, 0.25); lf.position.y = h; lf.rotation.set(0.6, i / 5 * PI * 2, 0); lf.translateY(0.25); g.add(lf); }
  return g;
}
function bendLeaf(geo, amt) { const p = geo.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setZ(i, amt * (y + 0.3) * (y + 0.3)); } geo.computeVertexNormals(); }
function banana(len = 0.15, r = 0.017) {
  const c = new THREE.QuadraticBezierCurve3(new V3(-len / 2, 0, 0), new V3(0, len * 0.35, 0), new V3(len / 2, 0, 0));
  return new Mesh(new THREE.TubeGeometry(c, 12, r, 8), mat(0xf3cf2a, { roughness: 0.5 }));
}
function makeSoop(o = {}) {
  const g = new Group();
  const sh = new THREE.Shape(); sh.moveTo(-0.21, 0); sh.lineTo(0.21, 0); sh.quadraticCurveTo(0.25, 0.22, 0, 0.31); sh.quadraticCurveTo(-0.25, 0.22, -0.21, 0);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.008, bevelSegments: 2, curveSegments: 18 });
  geo.rotateX(-PI / 2); const base = new Mesh(geo, BAMBOO); g.add(base);
  const back = new Mesh(new THREE.BoxGeometry(0.44, 0.08, 0.016), BAMBOO); back.position.set(0, 0.04, 0); g.add(back);
  const rimC = new THREE.QuadraticBezierCurve3(new V3(-0.21, 0.02, 0), new V3(-0.3, 0.03, -0.26), new V3(0, 0.02, -0.31));
  const rimC2 = new THREE.QuadraticBezierCurve3(new V3(0.21, 0.02, 0), new V3(0.3, 0.03, -0.26), new V3(0, 0.02, -0.31));
  const rimM = mat(0xa86e22, { roughness: 0.7 }); g.add(new Mesh(new THREE.TubeGeometry(rimC, 16, 0.009, 6), rimM), new Mesh(new THREE.TubeGeometry(rimC2, 16, 0.009, 6), rimM));
  for (let i = -3; i <= 3; i++) { const dot = new Mesh(new THREE.SphereGeometry(0.008, 6, 4), mat(0xd01010)); dot.position.set(i * 0.055, 0.075, -0.012); g.add(dot); }
  const items = [];
  const put = (m, x, y, z) => { m.position.set(x, y, z); m.scale.multiplyScalar(o.big ?? 1); m.userData.base = m.scale.clone(); g.add(m); items.push(m); return m; };
  if (o.cane) { const sc1 = sugarcane(0.75, 0.012); sc1.rotation.z = 0.18; put(sc1, -0.17, 0.0, -0.03); const sc2 = sugarcane(0.75, 0.012); sc2.rotation.z = -0.18; put(sc2, 0.17, 0.0, -0.03); }
  else { put(new Group(), 0, 0, 0); put(new Group(), 0, 0, 0); }
  const bunch = (x, z, ry) => { const b = new Group(); for (let i = 0; i < 4; i++) { const m = banana(); m.position.set(0, i * 0.012, i * 0.02); m.rotation.y = (i - 1.5) * 0.15; b.add(m); } b.rotation.y = ry; return b; };
  put(bunch(-0.09, -0.08, 0.3), -0.09, 0.025, -0.09); put(bunch(0.08, -0.1, -0.4), 0.07, 0.025, -0.12);
  const coco = () => { const m = new Mesh(new THREE.SphereGeometry(0.048, 16, 12), mat(0x6b4224, { roughness: 1 })); m.scale.y = 0.9; return m; };
  put(coco(), -0.01, 0.05, -0.14); put(coco(), 0.12, 0.05, -0.19);
  const ball = (c, r) => new Mesh(new THREE.SphereGeometry(r, 14, 10), mat(c, { roughness: 0.45 }));
  put(ball(0xc0141c, 0.03), -0.14, 0.03, -0.17); put(ball(0xc0141c, 0.028), 0.03, 0.03, -0.23);
  put(ball(0xf28a12, 0.028), -0.07, 0.03, -0.22); put(ball(0xf28a12, 0.027), 0.14, 0.03, -0.1);
  const thekua = () => new Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.012, 16), mat(0xb8702a, { roughness: 0.8 }));
  put(thekua(), -0.12, 0.02, -0.04); put(thekua(), 0.11, 0.02, -0.04);

function lotaMesh() {
  return new Mesh(new THREE.LatheGeometry([new V2(0, 0), new V2(0.05, 0), new V2(0.078, 0.045), new V2(0.072, 0.085), new V2(0.04, 0.115), new V2(0.034, 0.13), new V2(0.052, 0.145), new V2(0.045, 0.15), new V2(0, 0.15)], 24), BRASS);

// ------------------------------------------------------------------ characters
function sariTexture(hex) {
  const c = new THREE.Color(hex), base = '#' + c.getHexString(), dark = '#' + c.clone().multiplyScalar(0.72).getHexString();
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,214,90,0.9)'; for (let y = 10; y < h - 60; y += 26) for (let x = (y / 26 % 2) * 13 + 6; x < w; x += 26) { g.beginPath(); g.arc(x, y, 3.2, 0, Math.PI * 2); g.fill(); }

}
function makeArm(side, M) {
  const sh = new Group(); sh.position.set(side * 0.215, 1.35, 0.01);
  const sl = new Mesh(new THREE.CylinderGeometry(0.046, 0.042, 0.1, 12), M.blouse); sl.position.y = -0.035; sh.add(sl);
  const up = new Mesh(new THREE.CylinderGeometry(0.036, 0.031, 0.27, 12), SKIN); up.position.y = -0.135; sh.add(up);
  const el = new Group(); el.position.y = -0.27; sh.add(el);
  const fo = new Mesh(new THREE.CylinderGeometry(0.031, 0.026, 0.25, 12), SKIN); fo.position.y = -0.125; el.add(fo);
  const hand = new Mesh(new THREE.SphereGeometry(0.034, 12, 8), SKIN); hand.position.y = -0.27; hand.scale.set(0.9, 1.25, 0.7); el.add(hand);
  [[-0.2, M.red], [-0.215, M.green], [-0.23, M.red]].forEach(([y, m]) => { const b = new Mesh(new THREE.TorusGeometry(0.029, 0.006, 6, 16), m); b.rotation.x = PI / 2; b.position.y = y; el.add(b); });
  return { sh, el, hand };

function makeVrati(o = SARIS[0]) {

  for (const [y, r] of [[0.045, 0.289], [0.11, 0.285]]) { const b = new Mesh(new THREE.TorusGeometry(r, 0.012, 6, 48), GOLD); b.rotation.x = PI / 2; b.position.y = y; body.add(b); }
  for (let i = 0; i < 5; i++) { const p = new Mesh(new THREE.BoxGeometry(0.012, 0.8, 0.012), mat(new THREE.Color(o.sari).multiplyScalar(0.8))); p.position.set(-0.08 + i * 0.04, 0.45, -0.23 + Math.abs(i - 2) * 0.012); p.rotation.x = -0.12; body.add(p); }
  const torso = new Mesh(new THREE.LatheGeometry([new V2(0, 0.9), new V2(0.155, 0.9), new V2(0.15, 1.02), new V2(0.17, 1.16), new V2(0.2, 1.3), new V2(0.19, 1.36), new V2(0.08, 1.43), new V2(0.045, 1.46), new V2(0, 1.46)], 28), M.blouse);
  torso.castShadow = true; body.add(torso);
