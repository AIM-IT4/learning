<!doctype html>
<html><head><meta charset="utf-8"><title>Chhath documentary</title>
<style>
@font-face { font-family: 'Yatra One'; src: url('fonts/YatraOne.ttf'); }
@font-face { font-family: 'Tiro'; src: url('fonts/TiroDevanagariHindi-0.ttf'); }
@font-face { font-family: 'NotoDeva'; src: url('fonts/NotoSansDevanagari-0.ttf'); }
@font-face { font-family: 'Rozha'; src: url('fonts/RozhaOne.ttf'); }
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="mithila.js"></script>
<script>
// "छठ — आस्था की कहानी": a 60 s animated Mithila-painting documentary on how Chhath began, then 30 s of
// the four days of rituals on the song. One timeline; render('doc', t) draws the frame at t seconds.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
setCtx(ctx);

// ------------------------------------------------------------------ timing (overridable: window.TIMING)
const DEF = {
  shots: [ // [id, start, end]
    ['diwali', 0, 6.5], ['surya', 6.5, 12.6], ['vedic', 12.6, 16.2], ['sita', 16.2, 22.8], ['karna', 22.8, 32.4], ['shashthi', 32.4, 42.2],
    ['deo', 42.2, 50.0], ['today', 50.0, 60.11],
    ['day1', 60.11, 67.793], ['day2', 67.793, 75.476], ['day3', 75.476, 83.159], ['day4', 83.159, 90.841],
  ],
  subs: [], // [start, end, text]
  cues: {},  // absolute times of spoken key words: draupadi, shashthi, alive, today1..today4
  disclose: null, // optional on-screen voice label: [from, to] seconds
  total: 90.841,
};
let TM = DEF, SHOT_T0 = 0;
const cue = (k, dflt) => (TM.cues && TM.cues[k] != null) ? TM.cues[k] - SHOT_T0 : dflt;
const XF = 0.8; // transition length

// ------------------------------------------------------------------ backgrounds
const PAPERS = {};
function paper(name, base, seed) { if (!PAPERS[name]) PAPERS[name] = paperTexture(W, H, seed, base); return PAPERS[name]; }
function skyGrad(stops, y0 = 0, y1 = H) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(-300, y0 - 300, W + 600, y1 - y0 + 600); }
function paperOver(a = 0.5) { g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = a; g.drawImage(paper('cream', C.paper, 3), -300, -300, W + 600, H + 600); g.restore(); }

// camera: layer(k, fn) draws fn with parallax depth k under the shot camera
let CAM = { x: 540, y: 960, z: 1 };
function layer(k, fn) {
  g.save(); const z = 1 + (CAM.z - 1) * k;
  g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-(W / 2 + (CAM.x - W / 2) * k), -(H / 2 + (CAM.y - H / 2) * k));
  fn(); g.restore();
}
function camPath(u, a, b) { const k = ease(u); CAM = { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), z: lerp(a[2], b[2], k) }; }
function stream(x0, y0, x1, y1, t, n = 40, col = '255,250,235') {
  for (let i = 0; i < n; i++) { const u = (t * 1.3 + i / n) % 1; const x = lerp(x0, x1, u), y = y0 + (y1 - y0) * u * u; g.fillStyle = `rgba(${col},${0.85 * (1 - u * 0.5)})`; g.beginPath(); g.arc(x + Math.sin(i * 3) * 3, y, 3.5 + 2 * Math.sin(i), 0, TAU); g.fill(); }
}
function lightBeams(x, y, t, a = 0.25, n = 9, spread = 1.2, len = 1600) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) { const ang = Math.PI / 2 + (i - (n - 1) / 2) * spread / n + Math.sin(t * 0.4 + i) * 0.02; const gr = g.createLinearGradient(x, y, x + Math.cos(ang) * len, y + Math.sin(ang) * len); gr.addColorStop(0, `rgba(255,220,140,${a})`); gr.addColorStop(1, 'rgba(255,200,100,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang - 0.04) * len, y + Math.sin(ang - 0.04) * len); g.lineTo(x + Math.cos(ang + 0.04) * len, y + Math.sin(ang + 0.04) * len); g.fill(); }
  g.restore();
}
function sparkles(x, y, w, h, t, n, seed) { const r = R(seed); g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < n; i++) { const px = x + r() * w, py = y + r() * h - ((t * (20 + r() * 30)) % h), a = 0.5 + 0.5 * Math.sin(t * 3 + i); g.fillStyle = `rgba(255,220,140,${0.6 * a})`; g.beginPath(); g.arc(px, py < y ? py + h : py, 2 + r() * 3, 0, TAU); g.fill(); } g.restore(); }
// a figure standing in water: the water band covers it below the waterline
function inWater(fn, wl, t, col = C.blue) { fn(); g.save(); waterBand(wl, H + 400, t, col, { a: 0.75 }); g.restore(); }

// ------------------------------------------------------------------ scenes (u = local time, T = length)
const SC = {};
function aripan(cx, cy, r, u) {
  // Mithila floor art in white rice paste: concentric lotus rings, a central sun-lotus and Lakshmi's footprints
  g.save(); g.translate(cx, cy); g.scale(1, 0.42);
  const W8 = 'rgba(252,246,232,0.95)'; g.strokeStyle = W8; g.fillStyle = W8; g.lineCap = 'round';
  const dd = REVEAL.d;
  for (let ring = 0; ring < 4; ring++) {
    const rr = r * (0.3 + ring * 0.2), n = 8 + ring * 4;
    g.lineWidth = 7; g.setLineDash([TAU * rr * dd, TAU * rr]); g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.stroke(); g.setLineDash([]);
    if (REVEAL.f > 0.05) for (let i = 0; i < n; i++) { const a = i / n * TAU + ring * 0.3; g.save(); g.rotate(a); g.globalAlpha = REVEAL.f;
      g.beginPath(); g.moveTo(rr, 0); g.quadraticCurveTo(rr + r * 0.08, -r * 0.05, rr + r * 0.16, 0); g.quadraticCurveTo(rr + r * 0.08, r * 0.05, rr, 0); g.fill(); g.restore(); }
  }
  g.globalAlpha = REVEAL.f;
  for (let i = 0; i < 8; i++) { g.save(); g.rotate(i / 8 * TAU); g.beginPath(); g.ellipse(r * 0.13, 0, r * 0.12, r * 0.045, 0, 0, TAU); g.fill(); g.restore(); }
  g.beginPath(); g.arc(0, 0, r * 0.06, 0, TAU); g.fillStyle = C.red; g.fill(); g.restore();
  // Lakshmi's footprints walking in
  for (let k = 0; k < 4; k++) { const fx = cx - r * 1.5 + k * r * 0.32, fy = cy + r * 0.62 - k * r * 0.06 + (k % 2) * 20;
    g.save(); g.translate(fx, fy); g.rotate(-0.2); g.globalAlpha = REVEAL.f * 0.95; g.fillStyle = 'rgba(252,246,232,0.95)';
    g.beginPath(); g.ellipse(0, 0, 16, 30, 0, 0, TAU); g.fill(); for (let tt = 0; tt < 5; tt++) { g.beginPath(); g.arc(-12 + tt * 6, -34 - Math.abs(tt - 2) * -2, 4, 0, TAU); g.fill(); } g.restore(); }
  g.globalAlpha = 1;
}
SC.diwali = (u, T) => {
  camPath(u / T, [540, 1000, 1.08], [540, 1040, 1.0]);
  layer(0.2, () => { skyGrad([[0, '#0a0d2a'], [0.6, '#1a1640'], [1, '#2a1a3a']]); paperOver(0.25); stars(160, 5, 900, u); });  // Diwali is amavasya: no moon
  layer(0.55, () => {
    // Mithila house: mud wall with painted bands, a kohbar-style doorway
    shape(() => g.rect(-200, 640, 1480, 760), '#8a5a3a', { w: 5, pattern: () => { patDots('rgba(40,20,10,0.25)', 34, 4, -200, 640, 1300, 1400); } });
    shape(() => g.rect(-200, 640, 1480, 70), C.maroon, { w: 4, pattern: () => zigzagBand(-200, 1300, 690, 22, C.yellow, 44) });
    shape(() => { g.moveTo(-220, 650); g.lineTo(540, 470); g.lineTo(1300, 650); g.closePath(); }, '#5a3a22', { w: 5, pattern: () => patLines('rgba(240,200,120,0.35)', 14, 3, 0.6, 1600) });
    shape(() => { g.moveTo(420, 1400); g.lineTo(420, 940); g.quadraticCurveTo(540, 800, 660, 940); g.lineTo(660, 1400); g.closePath(); }, '#1a0e08', { w: 6, inkCol: C.gold });
    for (const x of [300, 780]) { mFish(x, 860, 26, x < 540 ? 0.2 : Math.PI - 0.2, C.yellow, C.red, u); lotus(x, 1010, 34); }
    // ledge with the row of diyas going out
    shape(() => g.rect(-200, 1180, 1480, 36), '#6a3a22', { w: 4 });
    for (let i = 0; i < 9; i++) {
      const x = 70 + i * 118, out = 0.9 + ((i * 5) % 9) * 0.32, lit = i === 4 ? 1 : 1 - ease((u - out) / 0.45);
      diya(x, 1178, 50, u, i, lit);
      if (lit < 0.98) { const k = clamp((u - out) / 2.2); g.strokeStyle = `rgba(210,210,225,${0.45 * (1 - k)})`; g.lineWidth = 3; g.beginPath();
        for (let j = 0; j <= 14; j++) g.lineTo(x + 30 + Math.sin(u * 2 + j * 0.6 + i) * j * 1.4, 1160 - j * 9 - k * 30); g.stroke(); }
    }
  });
  layer(1.0, () => { shape(() => g.rect(-200, 1400, 1480, 800), '#5a3424', { w: 5, pattern: () => patDots('rgba(0,0,0,0.18)', 40, 5, -200, 1400, 1300, 2200) });
    aripan(540, 1640, 300, u); diya(540, 1640, 90, u, 99, 1); });
};
SC.surya = (u, T) => {
  camPath(u / T, [540, 980, 1.0], [540, 900, 1.12]);
  const dawn = ease((u - 1) / 5);
  layer(0.2, () => { skyGrad([[0, '#141a46'], [0.55, lerp3('#1d2456', '#c2507a', dawn)], [0.68, lerp3('#2a2a60', '#f39a4a', dawn)], [1, '#3a2a60']]); paperOver(0.35); stars(140, 3, 1200, u); });
  layer(0.45, () => { sun(540, lerp(1500, 860, easeOut(u / 6)), 165, u); });
  layer(0.7, () => {
    const hx = lerp(-700, 320, easeOut((u - 3.0) / 5));
    const cols = [C.white, C.yellow, C.red, C.green, C.blue, C.orange, C.pink];
    if (u > 3) for (let i = 6; i >= 0; i--) horse(hx + (i % 4) * 120 - Math.floor(i / 4) * 60, 1250 - Math.floor(i / 4) * 70, 46, u, cols[i], i * 1.3);
  });
  layer(1.0, () => { waterBand(1260, H, u, C.indigo, { a: 0.6 }); mFish(250 + u * 25, 1550, 34, 0.1, C.orange, C.yellow, u); mFish(820 - u * 20, 1700, 30, Math.PI + 0.1, C.green, C.yellow, u); });
};
function lerp3(a, b, k) { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16); const c = [16, 8, 0].map(s => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, k))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
SC.vedic = (u, T) => {
  camPath(u / T, [560, 980, 1.06], [520, 1000, 1.0]);
  layer(0.2, () => { skyGrad([[0, '#f6c9a0'], [0.5, '#f9dfb0'], [0.68, '#f5b678'], [1, '#e8a060']]); paperOver(0.55); sun(790, 760, 120, u);
    g.font = '64px Tiro'; g.fillStyle = 'rgba(90,40,15,0.22)'; g.textAlign = 'center'; g.fillText('ॐ सूर्याय नमः', 540, 520); });
  layer(0.5, () => { bird(260 + u * 30, 420, 34, u, C.green); bird(380 + u * 26, 380, 26, u + 1, C.blue); tree(130, 1270, 92, u, { seed: 5 }); });
  layer(0.8, () => {
    const rs = [[300, 1500, 0], [520, 1530, 1], [740, 1500, 2]];
    inWater(() => rs.forEach(([x, y, k]) => {
      const f = figure(x, y, 70, { kind: 'rishi', beard: true, tilak: true, dhoti: C.saffron, dhoti2: 'rgba(200,35,29,0.45)', uttariya: C.saffron, pose: 'pour', seed: k, bangles: false, alta: false }, u);
      lota(f.hand[0] + 10, f.hand[1] - 6, 46, -1.2); stream(f.hand[0] + 30, f.hand[1] - 18, f.hand[0] + 120, 1300, u + k * 0.3, 26);
    }), 1290, u, C.blue);
  });
};
SC.sita = (u, T) => {
  camPath(u / T, [520, 960, 1.0], [600, 920, 1.1]);
  layer(0.2, () => { skyGrad([[0, '#f7d8a8'], [0.55, '#fbe6c0'], [0.7, '#f4b27a'], [1, '#e89a6a']]); paperOver(0.5); sun(830, 800, 110, u); });
  layer(0.5, () => { shape(() => { g.moveTo(780, 1320); g.quadraticCurveTo(880, 1150, 1000, 1320); g.closePath(); }, '#8a6a5a', { w: 4, pattern: () => patDots('rgba(0,0,0,0.25)', 22, 3, 760, 1150, 1020, 1330) }); temple(890, 1210, 9, u); });
  layer(0.8, () => { inWater(() => { const f = figure(560, 1560, 74, { kind: 'woman', crown: true, sari: C.yellow, sari2: C.red, border: C.red, blouse: C.green, pose: 'arghya', seed: 2 }, u); soop(f.mid[0], f.mid[1] - 14, 190, u, { rot: -0.1 }); }, 1330, u, C.blue); });
  layer(1.1, () => { shape(() => { g.moveTo(-100, 1500); g.quadraticCurveTo(250, 1420, 420, 1560); g.lineTo(420, 2100); g.lineTo(-100, 2100); g.closePath(); }, '#c99a5a', { w: 5, pattern: () => patDots('rgba(90,50,20,0.35)', 26, 4, -100, 1400, 440, 2100) });
    figure(190, 1760, 58, { kind: 'man', crown: true, skin: C.skinBlue, dhoti: C.yellow, border: C.red, uttariya: C.orange, pose: 'namaste', seed: 5, bangles: false, alta: false, mustache: false }, u); });
};
SC.karna = (u, T) => {
  camPath(u / T, [470, 980, 1.08], [700, 1000, 1.08]);
  layer(0.2, () => { skyGrad([[0, '#f0a868'], [0.45, '#f9d290'], [0.66, '#f6a860'], [1, '#d8784a']]); paperOver(0.5); sun(470, 690, 200, u); lightBeams(470, 690, u, 0.18, 11, 1.4, 1500); });
  layer(0.8, () => {
    inWater(() => {
      const f = figure(470, 1600, 84, { kind: 'man', crown: true, kundal: true, kavach: true, dhoti: C.red, border: C.gold, uttariya: C.yellow, pose: 'pour', seed: 1, mustache: true, bangles: false, alta: false }, u);
      lota(f.hand[0] + 22, f.hand[1] - 10, 74, -1.15); stream(f.hand[0] + 52, f.hand[1] - 30, f.hand[0] + 170, 1350, u, 34);
    }, 1360, u, C.blue);
    sparkles(300, 600, 400, 700, u, 30, 3);
  });
  layer(1.0, () => { const a = ease((u - cue('draupadi', 4.5) + 0.4) / 1.0); if (a > 0) { g.save(); g.globalAlpha = a;
    shape(() => { g.rect(820, 1450, 600, 600); }, '#b88a5a', { w: 5, pattern: () => { for (let yy = 1450; yy < 2050; yy += 60) { g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(820, yy); g.lineTo(1500, yy); g.stroke(); } } });
    figure(1000, 1460, 56, { kind: 'woman', crown: true, sari: C.red, sari2: C.yellow, border: C.gold, blouse: C.indigo, pose: 'namaste', seed: 4, dir: -1 }, u); g.restore(); } });
};
SC.shashthi = (u, T) => {
  camPath(u / T, [540, 1000, 1.0], [540, 940, 1.1]);
  const appear = ease((u - cue('shashthi', 2.6) + 0.3) / 1.4), alive = ease((u - cue('alive', 5.6)) / 1.2);
  layer(0.3, () => {
    skyGrad([[0, '#6a1820'], [1, '#3a0c12']]); paperOver(0.45);
    for (let i = 0; i < 3; i++) { const x = 180 + i * 360; shape(() => { g.moveTo(x - 150, 1300); g.lineTo(x - 150, 650); g.quadraticCurveTo(x - 150, 470, x, 420); g.quadraticCurveTo(x + 150, 470, x + 150, 650); g.lineTo(x + 150, 1300); g.closePath(); }, '#2a0a10', { w: 6, inkCol: C.gold }); }
    for (let i = 0; i < 4; i++) shape(() => g.rect(-20 + i * 360, 380, 40, 960), C.maroon, { w: 4, pattern: () => patDots(C.gold, 16, 3, -40 + i * 360, 380, 40 + i * 360, 1340) });
    shape(() => g.rect(-300, 1300, 1680, 900), '#8a2a20', { w: 5, pattern: () => { patScales(C.gold, 60, 3, -300, 1300, 1400, 2200); } });
  });
  layer(0.75, () => {
    if (appear > 0) { lightBeams(540, 760, u, 0.3 * appear, 16, 6.2, 1100); g.save(); g.globalAlpha = appear; g.translate(540, 1130); g.scale(0.85 + 0.15 * appear, 0.85 + 0.15 * appear); g.translate(-540, -1130);
      lotus(540, 1150, 70); figure(500, 1130, 60, { kind: 'goddess', halo: true, crown: true, sari: C.red, sari2: C.gold, border: C.gold, blouse: C.yellow, pose: 'bless', seed: 7 }, u); g.restore(); }
    figure(230, 1620, 60, { kind: 'man', crown: true, mustache: true, dhoti: C.yellow, border: C.red, uttariya: C.maroon, pose: 'namaste', seed: 3, bangles: false, alta: false }, u);
    const q = figure(800, 1640, 62, { kind: 'woman', crown: true, sari: C.pink, sari2: C.gold, border: C.gold, blouse: C.green, pose: 'hold', seed: 6, dir: -1 }, u);
    // the child: pale and still, then glowing and alive
    const bx = q.mid[0] - 10, by = q.mid[1] + 6;
    if (alive > 0) { g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(bx, by, 0, bx, by, 160); gr.addColorStop(0, `rgba(255,220,140,${0.7 * alive})`); gr.addColorStop(1, 'rgba(255,200,100,0)'); g.fillStyle = gr; g.fillRect(bx - 160, by - 160, 320, 320); g.restore(); }
    shape(() => g.ellipse(bx, by, 62, 30, -0.15, 0, TAU), C.cream, { w: 4, pattern: () => patDots(C.gold, 14, 2.5, bx - 70, by - 40, bx + 70, by + 40) });
    const hy = by - 14 + Math.sin(u * 3) * 2 * alive;
    shape(() => g.arc(bx - 52, hy, 22, 0, TAU), lerp3('#c8b8a8', '#f0b07a', alive), { w: 3.5 });
    g.beginPath(); g.arc(bx - 60, hy - 8, 10, Math.PI, 0); g.fillStyle = C.ink; g.fill();
    g.beginPath(); if (alive > 0.5) g.arc(bx - 46, hy - 2, 3.2, 0, TAU); else g.rect(bx - 50, hy - 3, 8, 2); g.fillStyle = C.ink; g.fill();
    g.beginPath(); g.arc(bx - 38, hy + 8, 3, 0, TAU); g.fillStyle = C.red; g.fill();
  });
};
SC.deo = (u, T) => {
  camPath(u / T, [540, 860, 1.12], [540, 980, 1.0]);
  layer(0.2, () => { skyGrad([[0, '#f8c890'], [0.5, '#fde2b0'], [1, '#f0a868']]); paperOver(0.5); sun(540, 420, 120, u); });
  layer(0.55, () => { temple(540, 1330, 68, u); for (const x of [130, 950]) tree(x, 1330, 60, u, { seed: x }); });
  layer(0.85, () => {
    waterBand(1420, H, u, C.blue, { a: 0.7 });
    shape(() => g.rect(-200, 1330, 1480, 90), '#c9a06a', { w: 5, pattern: () => { for (let x = -200; x < 1300; x += 60) { g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(x, 1330); g.lineTo(x, 1420); g.stroke(); } } });
    for (let i = 0; i < 6; i++) { const x = ((u * 60 + i * 210) % 1500) - 250; const f = figure(x, 1395, 24, { kind: 'woman', sari: [C.yellow, C.red, C.pink, C.orange, C.green, C.red][i], sari2: C.gold, blouse: C.indigo, pose: 'carry', ghunghat: true, seed: i }, u + i);
      g.save(); g.translate(f.hand[0] - 4, f.hand[1] + 12); daura(0, 0, 60, u); g.restore(); }
    for (let i = 0; i < 9; i++) diya(80 + i * 115, 1500 + (i % 2) * 40, 26, u, i, 1);
  });
};
SC.today = (u, T) => {
  camPath(u / T, [540, 940, 1.14], [540, 980, 1.0]);
  layer(0.2, () => { skyGrad([[0, '#5a2a6a'], [0.4, '#c8506a'], [0.62, '#f7a050'], [1, '#e07040']]); paperOver(0.4); sun(540, 930, 140, u); });
  layer(0.6, () => { waterBand(1060, H, u, '#3a3a8a', { a: 0.55 });
    for (let i = 0; i < 5; i++) { const x = 70 + i * 225, s = 54, y = 1400 + (i % 2) * 40; inWater(() => { const f = figure(x, y, s, { kind: 'woman', ghunghat: true, sari: [C.yellow, C.red, C.orange, C.pink, C.yellow][i], sari2: C.gold, blouse: C.green, pose: 'arghya', seed: i }, u); soop(f.mid[0], f.mid[1] - 10, 132, u, { seed: i }); }, y - 3.7 * s, u, '#3a3a8a'); }
  });
  layer(1.0, () => { const r = R(4); for (let i = 0; i < 14; i++) { const x = ((r() * 1200 + u * 18) % 1300) - 100, y = 1420 + r() * 420; diya(x, y, 34 + (y - 1420) * 0.05, u, i, 1); } });
};
// ---- the four days
SC.day1 = (u, T) => {
  camPath(u / T, [540, 960, 1.06], [540, 1000, 1.0]);
  layer(0.2, () => { skyGrad([[0, '#9ad0ee'], [0.55, '#fde7b8'], [1, '#f6c27a']]); paperOver(0.5); sun(820, 620, 95, u); });
  layer(0.7, () => { const dip = Math.sin(clamp((u - 0.6) / 2.2) * Math.PI); waterBand(1120, H, u, C.blue, { a: 0.7 });
    inWater(() => { figure(540, 1420 + dip * 240, 64, { kind: 'woman', ghunghat: true, sari: C.yellow, sari2: C.red, border: C.red, blouse: C.red, pose: 'namaste', seed: 1 }, u); }, 1200, u, C.blue);
    ripplesAt(540, 1205, 150, u); if (dip > 0.2) sparkles(380, 900, 320, 300, u, 18, 2); });

// ------------------------------------------------------------------ transitions, grain, frame
const GRAIN = Array.from({ length: 4 }, (_, k) => { const c2 = document.createElement('canvas'); c2.width = 540; c2.height = 960; const x = c2.getContext('2d'), im = x.createImageData(540, 960), r = R(k + 11); for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - 0.5) * 90; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); return c2; });
function inkWipe(p, seed, cx, cy) {

function drawShot(i, t) {
