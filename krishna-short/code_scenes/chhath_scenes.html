<!doctype html>
<html><head><meta charset="utf-8"><title>Chhath scenes</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Every picture in the Chhath status is drawn here with the Canvas 2D API: no photos, no AI images.
// render(name, t, T) draws scene `name` at time t (s) of a shot lasting T s and returns the frame as a data URL.
const W = 1080, H = 1920, c = document.getElementById('c'), g = c.getContext('2d');
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const popIn = t => { t = clamp(t); return t <= 0 ? 0 : 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2); };  // ease-out-back
function R(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const nz = (t, k = 0) => Math.sin(t * 1.7 + k) * 0.5 + Math.sin(t * 3.1 + k * 2.3) * 0.3 + Math.sin(t * 5.3 + k * 1.7) * 0.2;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function vgrad(y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; }
function rgrad(x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; }
function rect(x, y, w, h, f) { g.fillStyle = f; g.fillRect(x, y, w, h); }
function circle(x, y, r, f) { g.fillStyle = f; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ell(x, y, rx, ry, f, rot = 0) { g.fillStyle = f; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function glow(x, y, r, col, a = 1) {
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = rgrad(x, y, 0, r, [[0, rgba(col, a)], [0.35, rgba(col, a * 0.35)], [1, rgba(col, 0)]]);
  g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore();
}

// ------------------------------------------------------------------ sky, sun, water, land
const PAL = {
  sunset:  { sky: [[0, '#2b1747'], [0.38, '#7b2d5b'], [0.72, '#e4603a'], [1, '#ffb54d']], water: ['#8a3f4e', '#2a1230'], sun: [255, 186, 86], core: '#fff3c8', land: '#3a1530' },
  dusk:    { sky: [[0, '#1d1e4a'], [0.45, '#6a3a6e'], [0.82, '#e07a4a'], [1, '#f6b26b']], water: ['#6a3d5e', '#1d1430'], sun: [255, 168, 80], core: '#ffe2a8', land: '#251330' },
  sunrise: { sky: [[0, '#3a4a8c'], [0.42, '#b9789f'], [0.78, '#ffb684'], [1, '#ffe8b4']], water: ['#d8a090', '#4a3d70'], sun: [255, 214, 150], core: '#fffbe8', land: '#5b3f66' },
  golden:  { sky: [[0, '#5d7fb8'], [0.5, '#f0b878'], [1, '#ffd89a']], water: ['#c99a6a', '#5a4a5a'], sun: [255, 220, 150], core: '#fffbe8', land: '#3d5a2a' },
  night:   { sky: [[0, '#04061a'], [0.6, '#12123a'], [1, '#2a1838']], water: ['#1c1532', '#05040e'], sun: null, land: '#0c0a1a' },
};
function sky(p, hy) { g.fillStyle = vgrad(0, hy, PAL[p].sky); g.fillRect(0, 0, W, hy + 2); }
function sun(x, y, r, p) {
  const P = PAL[p]; glow(x, y, r * 7, P.sun, 0.45); glow(x, y, r * 2.4, P.sun, 0.75);
  g.fillStyle = rgrad(x, y, 0, r, [[0, P.core], [0.75, rgba(P.sun, 1)], [1, rgba(P.sun, 0.95)]]);
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
function stars(t, n, seed, y1) {
  const r = R(seed);
  for (let i = 0; i < n; i++) { const x = r() * W, y = r() * y1, a = 0.35 + 0.5 * (0.5 + 0.5 * Math.sin(t * (1 + r() * 2) + i)); circle(x, y, 0.8 + r() * 1.6, `rgba(255,245,220,${a})`); }
}
function water(p, hy, t, sx, o = {}) {
  const P = PAL[p];
  g.fillStyle = vgrad(hy, H, [[0, P.water[0]], [1, P.water[1]]]); g.fillRect(0, hy, W, H - hy);
  if (sx != null && P.sun) {
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 150; i++) {
      const k = i / 150, yy = hy + Math.pow(k, 1.5) * (H - hy);
      const w = (24 + k * 300) * (0.45 + 0.55 * Math.abs(Math.sin(t * 1.8 + i * 1.37))) * (o.refW || 1);
      g.fillStyle = rgba(P.sun, (1 - k) * 0.5 * (o.refA || 1));
      g.fillRect(sx - w / 2 + Math.sin(t * 1.3 + i * 0.7) * k * 50, yy, w, 2 + k * 7);
    }
    g.restore();
  }
  const r = R(o.seed || 11);
  for (let i = 0; i < (o.ripples || 230); i++) {
    const k = r(), yy = hy + Math.pow(k, 1.7) * (H - hy), len = (18 + k * 200) * (0.5 + r());
    const x0 = ((r() * (W + 300) + t * (12 + k * 40)) % (W + 300)) - 150;
    g.strokeStyle = `rgba(255,235,210,${0.04 + 0.12 * (1 - k)})`; g.lineWidth = 1 + k * 2.6;
    g.beginPath(); g.moveTo(x0, yy); g.lineTo(x0 + len, yy); g.stroke();
  }
}
function treeline(hy, col, seed, amp = 40, step = 50) {
  const r = R(seed); g.fillStyle = col; g.beginPath(); g.moveTo(-20, hy + 4); g.lineTo(-20, hy);
  let x = -20;
  while (x < W + 40) { const w = step * (0.6 + r()), h = amp * (0.35 + r()); g.quadraticCurveTo(x + w / 2, hy - h * 1.8, x + w, hy); x += w; }
  g.lineTo(W + 40, hy + 4); g.closePath(); g.fill();
}
function palm(x, y, s, col, t) {
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 5 * s; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 18 * s, y - 120 * s, x + 6 * s, y - 230 * s); g.stroke();
  const tx = x + 6 * s, ty = y - 230 * s;
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + (i - 3.5) * 0.42 + Math.sin(t * 1.2 + i) * 0.05, L = 95 * s;
    g.beginPath(); g.moveTo(tx, ty);
    g.quadraticCurveTo(tx + Math.cos(a) * L * 0.6, ty + Math.sin(a) * L * 0.6 - 20 * s, tx + Math.cos(a) * L, ty + Math.sin(a) * L + 30 * s);
    g.lineWidth = 7 * s; g.stroke();
  }
}
function bananaPlant(x, y, s, col, t, seed = 1) {
  const r = R(seed); g.fillStyle = col; g.strokeStyle = col;
  g.beginPath(); g.moveTo(x - 9 * s, y); g.lineTo(x - 6 * s, y - 120 * s); g.lineTo(x + 6 * s, y - 120 * s); g.lineTo(x + 9 * s, y); g.fill();
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.48 + Math.sin(t * 1.1 + i + seed) * 0.04, L = (90 + r() * 50) * s;
    g.save(); g.translate(x, y - 115 * s); g.rotate(a + Math.PI / 2);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(22 * s, -L * 0.5, 4 * s, -L); g.quadraticCurveTo(-18 * s, -L * 0.5, 0, 0); g.fill();
    g.restore();
  }
}
function sugarcane(x, y, h, s, lean = 0, col = '#5a7a2a', node = '#3a4a1a') {
  g.save(); g.translate(x, y); g.rotate(lean);
  g.fillStyle = col; g.fillRect(-4 * s, -h, 8 * s, h);
  g.fillStyle = node; for (let k = 20 * s; k < h; k += 28 * s) g.fillRect(-5 * s, -k, 10 * s, 3 * s);
  g.strokeStyle = '#6f9a35'; g.lineWidth = 4 * s; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const a = (i - 2) * 0.55; g.beginPath(); g.moveTo(0, -h);
    g.quadraticCurveTo(Math.sin(a) * 40 * s, -h - 50 * s, Math.sin(a) * 80 * s, -h - 20 * s + Math.abs(a) * 40 * s); g.stroke();
  }
  g.restore();
}
function birds(t, n, seed, x0, y0, spread, speed, col = 'rgba(30,14,34,0.85)') {
  const r = R(seed); g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = 3;
  for (let i = 0; i < n; i++) {
    const s = 9 + r() * 10; let x = x0 + r() * spread + t * speed * (0.8 + r() * 0.4);
    const y = y0 + r() * spread * 0.35 + Math.sin(t * 1.3 + i) * 8;
    x = ((x % (W + 200)) + W + 200) % (W + 200) - 100;
    const f = Math.sin(t * 8 + i * 2.1);
    g.beginPath(); g.moveTo(x - s, y - f * s * 0.6); g.quadraticCurveTo(x - s * 0.4, y - s * 0.25, x, y);
    g.quadraticCurveTo(x + s * 0.4, y - s * 0.25, x + s, y - f * s * 0.6); g.stroke();
  }
}
function boat(x, y, s, col, t) {
  y += Math.sin(t * 1.4 + x * 0.01) * 3 * s; g.fillStyle = col;
  g.beginPath(); g.moveTo(x - 70 * s, y - 6 * s); g.quadraticCurveTo(x, y + 22 * s, x + 70 * s, y - 6 * s);
  g.lineTo(x + 56 * s, y + 6 * s); g.quadraticCurveTo(x, y + 26 * s, x - 56 * s, y + 6 * s); g.closePath(); g.fill();
  g.fillRect(x + 8 * s, y - 40 * s, 9 * s, 36 * s); circle(x + 12 * s, y - 48 * s, 8 * s, col);
  g.strokeStyle = col; g.lineWidth = 3 * s; g.beginPath(); g.moveTo(x + 40 * s, y - 60 * s); g.lineTo(x - 18 * s, y + 26 * s); g.stroke();
}
function mist(y, h, t, a = 0.25, col = [255, 230, 240]) {
  const r = R(5);
  for (let i = 0; i < 9; i++) {
    const x = ((r() * W + t * (8 + r() * 10)) % (W + 600)) - 300, yy = y + r() * h;
    g.fillStyle = rgrad(x, yy, 0, 260, [[0, rgba(col, a)], [1, rgba(col, 0)]]);
    g.save(); g.translate(x, yy); g.scale(2.4, 0.35); g.translate(-x, -yy); g.fillRect(x - 260, yy - 260, 520, 520); g.restore();
  }
}
function steps(y0, y1, n, c1, c2) {
  for (let i = 0; i < n; i++) {
    const ya = lerp(y0, y1, i / n), yb = lerp(y0, y1, (i + 1) / n);
    rect(0, ya, W, yb - ya + 1, i % 2 ? c1 : c2); rect(0, ya, W, 3, 'rgba(255,240,220,0.10)');
  }
}

// ------------------------------------------------------------------ diya, rangoli, smoke, lights
function diya(x, y, s, t, seed = 0, lit = 1) {
  ell(x, y + 2 * s, 24 * s, 9 * s, '#6e2c12');
  g.fillStyle = '#9c4520'; g.beginPath(); g.ellipse(x, y, 23 * s, 12 * s, 0, 0, Math.PI); g.fill();
  ell(x, y, 23 * s, 6 * s, '#c25e2c'); ell(x, y, 18 * s, 4 * s, '#4a1d0c');
  g.fillStyle = '#c25e2c'; g.beginPath(); g.moveTo(x + 15 * s, y - 3 * s); g.quadraticCurveTo(x + 31 * s, y - 7 * s, x + 29 * s, y - 1 * s);
  g.lineTo(x + 16 * s, y + 4 * s); g.fill();
  if (lit <= 0.01) return;
  const fx = x + 25 * s, fy = y - 4 * s, fl = 1 + 0.14 * nz(t * 6, seed), sw = nz(t * 4, seed + 3) * 2.2 * s;
  glow(fx, fy - 12 * s, 95 * s * lit, [255, 160, 50], 0.5 * lit);
  g.save(); g.globalAlpha = lit;
  g.fillStyle = rgrad(fx, fy - 7 * s, 1, 20 * s * fl, [[0, '#fffbe6'], [0.35, '#ffd65e'], [0.8, '#ff7b1c'], [1, 'rgba(255,90,0,0)']]);
  g.beginPath(); g.moveTo(fx - 6 * s, fy); g.quadraticCurveTo(fx - 8 * s, fy - 12 * s * fl, fx + sw, fy - 27 * s * fl);
  g.quadraticCurveTo(fx + 8 * s, fy - 12 * s * fl, fx + 6 * s, fy); g.quadraticCurveTo(fx, fy + 4 * s, fx - 6 * s, fy); g.fill();
  g.restore();
}
function smoke(x, y, s, t, a) {
  if (a <= 0) return;
  g.strokeStyle = `rgba(200,200,215,${a})`; g.lineWidth = 3 * s; g.lineCap = 'round';
  for (let k = 0; k < 2; k++) {
    g.beginPath(); g.moveTo(x, y);
    for (let i = 1; i <= 14; i++) g.lineTo(x + Math.sin(t * 2 + i * 0.6 + k * 2) * i * 1.6 * s, y - i * 9 * s);
    g.stroke();
  }
}
function rangoli(cx, cy, r, squash = 0.42, a = 1) {
  g.save(); g.globalAlpha = a; g.translate(cx, cy); g.scale(1, squash);
  const cols = ['#e8364f', '#ffb000', '#1fa37a', '#2f5bd3', '#ff6fb0', '#fff3d6'];
  for (let ring = 5; ring >= 0; ring--) {
    const rr = r * (0.22 + ring * 0.16), n = 8 + ring * 4; g.fillStyle = cols[ring % cols.length];
    for (let i = 0; i < n; i++) { g.save(); g.rotate(i / n * TAU + ring * 0.2); g.beginPath(); g.ellipse(rr * 0.78, 0, rr * 0.26, rr * 0.10, 0, 0, TAU); g.fill(); g.restore(); }
  }
  circle(0, 0, r * 0.13, '#ffd35a'); g.restore();
}
function lightString(x1, y1, x2, y2, sag, n, t, seed = 0) {
  g.strokeStyle = 'rgba(40,30,30,0.9)'; g.lineWidth = 2;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag;
  g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(mx, my, x2, y2); g.stroke();
  const cols = [[255, 210, 90], [255, 90, 90], [120, 220, 255], [140, 255, 140], [255, 140, 230]];
  for (let i = 0; i <= n; i++) {
    const u = i / n, x = (1 - u) ** 2 * x1 + 2 * u * (1 - u) * mx + u * u * x2, y = (1 - u) ** 2 * y1 + 2 * u * (1 - u) * my + u * u * y2;
    const col = cols[(i + seed) % cols.length], on = 0.55 + 0.45 * Math.sin(t * 4 + i * 1.9 + seed);
    circle(x, y + 4, 4, rgba(col, on)); glow(x, y + 4, 22, col, 0.35 * on);
  }
}
function marigoldGarland(x1, y1, x2, y2, sag, t) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag + Math.sin(t) * 4;
  for (let i = 0; i <= 30; i++) {
    const u = i / 30, x = (1 - u) ** 2 * x1 + 2 * u * (1 - u) * mx + u * u * x2, y = (1 - u) ** 2 * y1 + 2 * u * (1 - u) * my + u * u * y2;
    circle(x, y, 11, i % 3 ? '#ff9a1a' : '#ffd21a'); circle(x - 3, y - 3, 4, 'rgba(255,240,180,0.6)');
  }
}

// ------------------------------------------------------------------ fruits and the soop
function banana(x, y, s, rot) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = '#f7d43f'; g.beginPath(); g.moveTo(-s, 0); g.quadraticCurveTo(0, s * 0.75, s, 0); g.quadraticCurveTo(0, s * 0.38, -s, 0); g.fill();
  g.strokeStyle = '#b8860b'; g.lineWidth = Math.max(1, s * 0.05); g.stroke(); circle(s * 0.97, 0, s * 0.06, '#4a3410');
  g.restore();
}
function bananaBunch(x, y, s) { for (let i = 0; i < 5; i++) banana(x - s * 0.3 + i * s * 0.15, y - i * s * 0.07, s * 0.6, -0.55 + i * 0.22); }
function coconut(x, y, r) {
  g.fillStyle = rgrad(x - r * 0.3, y - r * 0.3, r * 0.1, r, [[0, '#a96d3b'], [1, '#55301a']]); g.beginPath(); g.ellipse(x, y, r, r * 0.9, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(210,160,100,0.35)'; g.lineWidth = Math.max(1, r * 0.05);
  for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(x - r * 0.8, y - r * 0.5 + i * r * 0.2); g.quadraticCurveTo(x, y - r * 0.75 + i * r * 0.25, x + r * 0.8, y - r * 0.5 + i * r * 0.2); g.stroke(); }
}
function fruitBall(x, y, r, c1, c2, stem = true) {
  g.fillStyle = rgrad(x - r * 0.35, y - r * 0.35, r * 0.1, r, [[0, c1], [1, c2]]); g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  if (stem) { g.strokeStyle = '#4a3410'; g.lineWidth = Math.max(1, r * 0.12); g.beginPath(); g.moveTo(x, y - r * 0.85); g.lineTo(x + r * 0.15, y - r * 1.2); g.stroke(); ell(x + r * 0.35, y - r * 1.05, r * 0.3, r * 0.13, '#3f8a2a', -0.5); }
}
function thekua(x, y, r) {
  circle(x, y, r, '#b8702a'); circle(x, y, r * 0.82, '#cf8a3a');
  g.strokeStyle = '#8a4a14'; g.lineWidth = Math.max(1, r * 0.07);
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; g.beginPath(); g.moveTo(x + Math.cos(a) * r * 0.2, y + Math.sin(a) * r * 0.2); g.lineTo(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7); g.stroke(); }
}
function soop(x, y, w, t, o = {}) {
  // bamboo winnowing basket seen from the front, offerings on top; o.pop(k) -> scale of offering k (0..1)
  const h = w * 0.55, pop = o.pop || (() => 1);
  g.save(); g.translate(x, y);
  const items = [
    k => sugarcane(-w * 0.40, h * 0.05, w * 0.9 * k, w / 260, -0.18),
    k => sugarcane(w * 0.40, h * 0.05, w * 0.9 * k, w / 260, 0.18),
    k => bananaBunch(-w * 0.20, -h * 0.02, w * 0.26 * k),
    k => bananaBunch(w * 0.10, -h * 0.06, w * 0.24 * k),
    k => coconut(-w * 0.02, -h * 0.10, w * 0.10 * k),
    k => coconut(w * 0.27, -h * 0.02, w * 0.09 * k),
    k => fruitBall(-w * 0.30, h * 0.02, w * 0.06 * k, '#ff6b5a', '#b0151c'),
    k => fruitBall(w * 0.18, h * 0.04, w * 0.055 * k, '#ff6b5a', '#b0151c'),
    k => fruitBall(-w * 0.12, h * 0.05, w * 0.055 * k, '#ffc04a', '#e06a00'),
    k => fruitBall(w * 0.34, h * 0.06, w * 0.05 * k, '#ffc04a', '#e06a00'),
    k => thekua(-w * 0.24, h * 0.10, w * 0.055 * k),
    k => thekua(w * 0.04, h * 0.11, w * 0.055 * k),
  ];
  items.forEach((f, i) => { const k = pop(i); if (k > 0.01) f(k); });
  if (o.diya !== false) diya(-w * 0.05, h * 0.10, w / 330, t, 7);
  // basket
  g.fillStyle = vgrad(-h * 0.1, h * 0.8, [[0, '#e8b85a'], [1, '#b97f2c']]);
  g.beginPath(); g.moveTo(-w / 2, 0); g.quadraticCurveTo(-w * 0.52, h * 0.72, 0, h * 0.78); g.quadraticCurveTo(w * 0.52, h * 0.72, w / 2, 0);
  g.quadraticCurveTo(0, h * 0.2, -w / 2, 0); g.fill();
  g.save(); g.clip();
  g.strokeStyle = 'rgba(120,70,20,0.45)'; g.lineWidth = Math.max(1, w * 0.008);
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(i * w * 0.045, 0); g.lineTo(i * w * 0.03, h); g.stroke(); }
  for (let j = 1; j < 9; j++) { g.beginPath(); g.moveTo(-w / 2, j * h * 0.09 + h * 0.08); g.quadraticCurveTo(0, j * h * 0.11 + h * 0.15, w / 2, j * h * 0.09 + h * 0.08); g.stroke(); }
  g.restore();
  g.strokeStyle = '#9a6418'; g.lineWidth = Math.max(2, w * 0.03); g.beginPath(); g.moveTo(-w / 2, 0); g.quadraticCurveTo(0, h * 0.2, w / 2, 0); g.stroke();
  // red sindoor dots on the rim
  for (let i = -3; i <= 3; i++) circle(i * w * 0.12, h * 0.1 + Math.abs(i) * -h * 0.012, Math.max(1.5, w * 0.012), '#d81b1b');
  g.restore();
}

// ------------------------------------------------------------------ characters
const SKIN = '#b8774a', SKIN_D = '#8a5332';
const SARIS = [
  { sari: '#ffcc1a', border: '#d6001c', blouse: '#d6001c' }, { sari: '#ff7a00', border: '#ffd700', blouse: '#8b0000' },
  { sari: '#e8364f', border: '#ffd700', blouse: '#1e7b4a' }, { sari: '#ff4f9a', border: '#ffd34d', blouse: '#5a1a8a' },
  { sari: '#f2b705', border: '#c1121f', blouse: '#2a6f97' }, { sari: '#c1121f', border: '#ffcc33', blouse: '#ffcc33' },
];
function arm(x1, y1, x2, y2, x3, y3, w) {
  g.strokeStyle = SKIN; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.stroke();
