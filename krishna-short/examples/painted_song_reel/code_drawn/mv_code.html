<!doctype html>
<html><head><meta charset="utf-8"><title>Sochenge - code-drawn music video</title>
<style>
@font-face { font-family: NotoDevaBold; src: url('../../../code_scenes/fonts/NotoSansDevanagari_700Bold.ttf'); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script src="chars.js"></script>
<script src="scenes.js"></script>
<script>
'use strict';
// MV time 0 = reel 4.50 s = song 51.937 s; one shot per bar (or two), cut on the downbeat. END = song 114.2 s.
const END = 62.263;
const SHOTS = [
  { sc: 'hill',     t0: 0,      t1: 3.952,  out: 'whipup' },
  { sc: 'sky',      t0: 3.952,  t1: 5.902,  out: 'zoom' },
  { sc: 'swing',    t0: 5.902,  t1: 7.783,  out: 'whip' },
  { sc: 'window',   t0: 7.783,  t1: 11.591, out: 'zoom' },
  { sc: 'hill',     t0: 11.591, t1: 13.518, out: 'cut', v: { close: true } },
  { sc: 'petals',   t0: 13.518, t1: 15.399, out: 'flash' },
  { sc: 'bed',      t0: 15.399, t1: 19.23,  out: 'fade' },
  { sc: 'eye',      t0: 19.23,  t1: 23.038, out: 'dip' },
  { sc: 'dream',    t0: 23.038, t1: 26.87,  out: 'fade' },
  { sc: 'box',      t0: 26.87,  t1: 30.678, out: 'whip', strips: [
      { text: 'ख़्वाबों में छुपाया तुमको', at: 27.0, x: 600, y: 230, rot: -0.05, size: 64 },
      { text: 'यादों में बसाया तुमको', at: 27.95, x: 1330, y: 880, rot: 0.04, size: 64 }] },
  { sc: 'dream',    t0: 30.678, t1: 32.582, out: 'whip', v: { close: true }, toff: 1.5 },
  { sc: 'swing',    t0: 32.582, t1: 34.486, out: 'whip', toff: 2.2 },
  { sc: 'box',      t0: 34.486, t1: 36.39,  out: 'whip', v: { lift: true } },
  { sc: 'window',   t0: 36.39,  t1: 38.317, out: 'zoom', v: { out: true } },
  { sc: 'bazaar',   t0: 38.317, t1: 42.125, out: 'whipup' },
  { sc: 'rooftops', t0: 42.125, t1: 45.933, out: 'cut' },
  { sc: 'rooftops', t0: 45.933, t1: 47.861, out: 'whip', v: { wave: true } },
  { sc: 'bazaar',   t0: 47.861, t1: 49.765, out: 'flash', v: { found: true } },
  { sc: 'bed',      t0: 49.765, t1: 51.692, out: 'whipup', v: { calm: true } },
  { sc: 'sky',      t0: 51.692, t1: 53.596, out: 'zoom', v: { formed: true } },
  { sc: 'sunset',   t0: 53.596, t1: END },
];
const TR = { zoom: 0.42, whip: 0.30, whipup: 0.32, flash: 0.30, fade: 0.45, dip: 0.55 };
const main = document.getElementById('cv'), M = main.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const CA = mk(), CB = mk(), CC = mk();
let GRAIN = null;

function renderShot(i, t, cv) {
  const s = SHOTS[i], ctx = cv.getContext('2d'); setCtx(ctx);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const lt = clamp(t, s.t0, s.t1 - 1e-3) - s.t0 + (s.toff || 0);
  SC[s.sc](lt, s.t1 - s.t0 + (s.toff || 0), s.v || {});
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const st of s.strips || []) { const k = (t - st.at) / 0.18; if (k > 0) lyricStrip(st.text, st.x, st.y, st.rot, st.size, st.text.length, clamp(k * 1.5), 0.82 + 0.18 * easeOut(k) + 0.05 * Math.sin(clamp(k) * Math.PI)); }
}
function drawScaled(src, z, blur = 0, a = 1, dx = 0, dy = 0) {
  M.save(); M.globalAlpha = a; if (blur > 0.3) M.filter = `blur(${blur}px)`;
  M.translate(W / 2 + dx, H / 2 + dy); M.scale(z, z); M.drawImage(src, -W / 2, -H / 2); M.restore();
}
function frameAt(t) {
  M.setTransform(1, 0, 0, 1, 0, 0); M.globalAlpha = 1; M.filter = 'none'; M.fillStyle = '#000'; M.fillRect(0, 0, W, H);
  let i = SHOTS.findIndex(s => t >= s.t0 && t < s.t1); if (i < 0) i = SHOTS.length - 1;
  let tr = null;
  const nx = SHOTS[i + 1], D1 = TR[SHOTS[i].out];
  if (nx && D1 && t > SHOTS[i].t1 - D1 / 2) tr = [i, i + 1, SHOTS[i].t1, D1, SHOTS[i].out];
  const pv = SHOTS[i - 1], D0 = pv && TR[pv.out];
  if (!tr && pv && D0 && t < SHOTS[i].t0 + D0 / 2) tr = [i - 1, i, SHOTS[i].t0, D0, pv.out];
  if (!tr) { renderShot(i, t, CA); M.drawImage(CA, 0, 0); }
  else {
    const [a, b, Tc, D, kind] = tr, q = clamp((t - (Tc - D / 2)) / D);
    renderShot(a, Math.min(t, Tc - 1e-3), CA); renderShot(b, Math.max(t, Tc), CB);
    if (kind === 'fade') { M.drawImage(CA, 0, 0); M.globalAlpha = ease(q); M.drawImage(CB, 0, 0); M.globalAlpha = 1; }
    else if (kind === 'flash') { M.drawImage(CA, 0, 0); M.globalAlpha = ease(q); M.drawImage(CB, 0, 0); M.globalAlpha = 0.9 * (1 - Math.abs(q - 0.5) * 2) ** 1.5; M.fillStyle = '#fffaf0'; M.fillRect(0, 0, W, H); M.globalAlpha = 1; }
    else if (kind === 'dip') { if (q < 0.5) drawScaled(CA, 1 + 0.15 * q, 0, 1 - ease(q * 2)); else drawScaled(CB, 1.08 - 0.08 * (q - 0.5) * 2, 0, ease((q - 0.5) * 2)); }
    else if (kind === 'zoom') {
      const w = ease((q - 0.38) / 0.24);
      if (w < 1) drawScaled(CA, 1 + 1.3 * easeIn(clamp(q / 0.62)), 14 * easeIn(clamp(q / 0.62)), 1);
      if (w > 0) drawScaled(CB, 1 + 1.3 * (1 - easeOut(clamp((q - 0.38) / 0.62))), 14 * (1 - easeOut(clamp((q - 0.38) / 0.62))), w);
    } else { // whips: both shots on one strip sliding past, smeared along the motion
      const [dx, dy] = { whip: [-1, 0], whipup: [0, 1] }[kind], L = dx ? W : H, off = L * ease(q);
      const C = CC.getContext('2d'); C.setTransform(1, 0, 0, 1, 0, 0); C.globalAlpha = 1; C.filter = 'none';
      C.drawImage(CA, dx * off, dy * off); C.drawImage(CB, dx * (off - L), dy * (off - L));
      const v = Math.sin(Math.PI * q) * 70; M.drawImage(CC, 0, 0);
      for (let k = 1; k <= 6; k++) { M.globalAlpha = 1 / (k + 1); M.drawImage(CC, dx * v * k / 6, dy * v * k / 6); }
      M.globalAlpha = 1;
    }
  }
  post(t);
  return main.toDataURL('image/jpeg', 0.93);
}
function post(t) {
  M.setTransform(1, 0, 0, 1, 0, 0); M.filter = 'none';
  M.fillStyle = radgrad(W / 2, H / 2, H * 0.45, H * 1.05, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(20,8,10,0.42)']]); M.fillRect(0, 0, W, H);
  if (!GRAIN) { GRAIN = []; for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = 960; c.height = 540; const x = c.getContext('2d'), im = x.createImageData(960, 540), r = R(k + 1); for (let p = 0; p < im.data.length; p += 4) { const v = 128 + (r() - 0.5) * 60; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; } x.putImageData(im, 0, 0); GRAIN.push(c); } }
  M.globalCompositeOperation = 'overlay'; M.globalAlpha = 0.12; M.drawImage(GRAIN[Math.floor(t * 30) % 6], 0, 0, W, H); M.globalAlpha = 1; M.globalCompositeOperation = 'source-over';
  const fi = clamp(t / 0.15), fo = clamp((END - t) / 0.5); const k = Math.min(fi, fo);
  if (k < 1) { M.fillStyle = `rgba(0,0,0,${1 - k})`; M.fillRect(0, 0, W, H); }
}
window.frame = t => frameAt(t);
window.shot = (i, lt) => { renderShot(i, SHOTS[i].t0 + lt, CA); M.drawImage(CA, 0, 0); post(SHOTS[i].t0 + lt); return main.toDataURL('image/jpeg', 0.9); };
window.END = END;
document.fonts.load('700 60px NotoDevaBold', 'ख़्वाबों').then(() => { window.ready = true; });
</script></body></html>
